<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - IPTV Player</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
    
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .admin-sidebar { width: 250px; background: #1a1a2e; border-right: 1px solid #2a2a3e; padding: 20px; }
    .admin-sidebar h1 { font-size: 1.3rem; color: #667eea; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    .admin-nav { list-style: none; }
    .admin-nav li { margin-bottom: 5px; }
    .admin-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #888; text-decoration: none; border-radius: 8px; transition: all 0.2s; }
    .admin-nav a:hover { background: #2a2a3e; color: #fff; }
    .admin-nav a.active { background: #667eea; color: #fff; }
    .admin-nav .divider { height: 1px; background: #2a2a3e; margin: 15px 0; }
    
    /* Main Content */
    .admin-main { flex: 1; padding: 30px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .admin-header h2 { font-size: 1.5rem; color: #fff; }
    
    /* Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #1a1a2e; border-radius: 12px; padding: 20px; }
    .stat-card .icon { font-size: 2rem; margin-bottom: 10px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #667eea; }
    .stat-card .label { color: #888; font-size: 0.9rem; margin-top: 5px; }
    
    /* Table */
    .table-container { background: #1a1a2e; border-radius: 12px; overflow: hidden; }
    .table-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #2a2a3e; }
    .table-header h3 { font-size: 1.1rem; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #2a2a3e; }
    th { background: #252538; color: #888; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; }
    tr:hover { background: #252538; }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
    .badge-admin { background: rgba(102, 126, 234, 0.2); color: #667eea; }
    .badge-user { background: rgba(72, 187, 120, 0.2); color: #48bb78; }
    .badge-active { background: rgba(72, 187, 120, 0.2); color: #48bb78; }
    .badge-inactive { background: rgba(255, 100, 100, 0.2); color: #ff6464; }
    .badge-configured { background: rgba(72, 187, 120, 0.2); color: #48bb78; }
    .badge-pending { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
    
    .actions { display: flex; gap: 8px; }
    .actions button { background: #2a2a3e; border: none; color: #888; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .actions button:hover { background: #3a3a4e; color: #fff; }
    .actions button.danger:hover { background: #e53e3e; color: #fff; }
    
    /* Buttons */
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
    .btn-secondary { background: #2a2a3e; color: #fff; }
    .btn-secondary:hover { background: #3a3a4e; }
    .btn-danger { background: #e53e3e; color: #fff; }
    .btn-danger:hover { background: #c53030; }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #1e1e2e; border-radius: 16px; padding: 30px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal h2 { color: #667eea; margin-bottom: 20px; font-size: 1.3rem; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; justify-content: center; }
    
    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #888; font-size: 0.9rem; }
    .form-group input, .form-group select { width: 100%; padding: 12px 16px; background: #2a2a3e; border: 2px solid #3a3a4e; border-radius: 8px; color: #fff; font-size: 1rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .form-group small { color: #666; font-size: 0.8rem; margin-top: 5px; display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .error-msg { background: rgba(255,100,100,0.2); border: 1px solid #ff6464; color: #ff6464; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
    .success-msg { background: rgba(72, 187, 120, 0.2); border: 1px solid #48bb78; color: #48bb78; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
    
    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: #888; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Access Denied */
    .access-denied { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .access-denied .icon { font-size: 4rem; margin-bottom: 20px; }
    .access-denied h2 { color: #ff6464; margin-bottom: 10px; }
    .access-denied p { color: #888; margin-bottom: 20px; }
    
    /* Checkbox */
    .checkbox-group { display: flex; align-items: center; gap: 10px; }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    
    /* Settings */
    .settings-panel { max-width: 760px; }

    /* Logs */
    .logs-server { color: #888; font-weight: 400; font-size: 1rem; }
    .logs-head-actions { display: flex; align-items: center; gap: 16px; }
    .logs-follow { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 0.85rem; cursor: pointer; }
    .logs-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .logs-filters select, .logs-filters input { padding: 9px 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a2e; color: #eee; font-size: 0.85rem; }
    .logs-filters input { flex: 1; min-width: 220px; }
    .logs-table { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; }
    .logs-count { padding: 10px 14px; color: #888; border-bottom: 1px solid #2a2a3e; font-family: inherit; }
    .log-row { display: grid; grid-template-columns: 74px 52px 90px 1fr; gap: 10px; padding: 6px 14px; border-bottom: 1px solid #222236; cursor: pointer; align-items: start; }
    .log-row:hover { background: #222238; }
    .log-row.warn { background: rgba(255, 193, 7, 0.05); }
    .log-row.error { background: rgba(255, 100, 100, 0.08); }
    .log-time { color: #777; }
    .log-level { text-transform: uppercase; font-size: 0.7rem; color: #888; }
    .log-level.warn { color: #ffc107; }
    .log-level.error { color: #ff6464; }
    .log-cat { color: #9aa8ff; overflow: hidden; text-overflow: ellipsis; }
    .log-msg { color: #ddd; word-break: break-word; }
    .log-fields { display: block; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-data { margin: 6px 0 0; padding: 8px 10px; background: #12121f; border-radius: 6px; color: #aaa; white-space: pre-wrap; word-break: break-all; }
    .logs-more { padding: 14px; text-align: center; }

    /* Real-Debrid */
    .debrid-account { color: #888; font-weight: 400; font-size: 1rem; }
    .debrid-row { display: grid; grid-template-columns: 28px 1fr 90px 130px 110px 80px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #222236; font-size: 0.85rem; }
    .debrid-row.head { color: #888; font-size: 0.75rem; text-transform: uppercase; }
    .debrid-row:not(.head):hover { background: #222238; }
    .debrid-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .debrid-name { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .debrid-muted { color: #888; }
    .debrid-status.downloaded { color: #4caf50; }
    .debrid-status.bad { color: #ff6464; }
    .debrid-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #2a2a3e; color: #888; font-size: 0.85rem; }
    .debrid-pages { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px; color: #888; font-size: 0.85rem; }
    .btn-small { padding: 5px 10px; font-size: 0.78rem; }
    @media (max-width: 720px) {
      .debrid-row { grid-template-columns: 24px 1fr 80px; }
      .debrid-row > :nth-child(4), .debrid-row > :nth-child(5) { display: none; }
    }
    @media (max-width: 720px) {
      .log-row { grid-template-columns: 64px 1fr; }
      .log-level, .log-cat { display: none; }
    }
    .settings-panel + .settings-panel { margin-top: 20px; }
    .settings-body { padding: 20px; }
    .settings-body code { background: #2a2a3e; padding: 1px 6px; border-radius: 4px; color: #ccc; }
    .settings-status { margin-bottom: 20px; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    .settings-status.ok { background: rgba(72, 187, 120, 0.15); color: #48bb78; }
    .settings-status.bad { background: rgba(255, 100, 100, 0.15); color: #ff6464; }
    .settings-body small a { color: #9aa8ff; }
    .settings-intro { display: block; margin-bottom: 14px; color: #888; font-size: 0.8rem; }
    .module-option { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2a2a3e; cursor: pointer; }
    .module-option:last-of-type { margin-bottom: 16px; }
    .module-option input { margin-top: 3px; width: 16px; height: 16px; accent-color: #667eea; }
    .module-option span { display: flex; flex-direction: column; gap: 2px; }
    .module-option strong { color: #eee; font-weight: 500; }
    .module-option small { color: #888; font-size: 0.8rem; }
    .settings-foot { display: block; margin-top: 12px; color: #666; font-size: 0.8rem; }
    
    /* Channel groups */
    .groups-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .groups-toolbar .meta { color: #888; font-size: 0.85rem; }
    .groups-toolbar .links { display: flex; gap: 8px; }
    .groups-toolbar button { background: #2a2a3e; border: none; color: #ccc; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .groups-toolbar button:hover { background: #3a3a4e; color: #fff; }
    .groups-toolbar button:disabled { opacity: 0.5; cursor: wait; }
    .groups-list { max-height: 50vh; overflow-y: auto; border: 1px solid #2a2a3e; border-radius: 8px; }
    .groups-list label { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #2a2a3e; cursor: pointer; }
    .groups-list label:last-child { border-bottom: none; }
    .groups-list label:hover { background: #252538; }
    .groups-list input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .groups-list .title { flex: 1; }
    .groups-list .count { color: #888; font-size: 0.85rem; }
    .groups-empty { color: #888; padding: 20px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_URL = window.API_URL || (
      window.location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(window.location.hostname)
        ? 'http://localhost:3001/api'
        : '/api'
    );
    
    const api = {
      token: localStorage.getItem('authToken'),
      async fetch(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
        const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
        return response.json();
      }
    };

    // Logs of this server: one day at a time, newest first, with search
    function LogsView() {
      const [days, setDays] = useState([]);
      const [day, setDay] = useState('');
      const [level, setLevel] = useState('');
      const [category, setCategory] = useState('');
      const [query, setQuery] = useState('');
      const [search, setSearch] = useState('');
      const [result, setResult] = useState(null);
      const [entries, setEntries] = useState([]);
      const [open, setOpen] = useState(null);
      const [follow, setFollow] = useState(false);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');

      // The search box is applied a moment after typing stops
      useEffect(() => {
        const timer = setTimeout(() => setSearch(query.trim()), 400);
        return () => clearTimeout(timer);
      }, [query]);

      const params = (extra = {}) => new URLSearchParams(Object.entries({
        day, level, category, q: search, ...extra
      }).filter(([, v]) => v)).toString();

      const load = async (older = false) => {
        setBusy(true);
        setError('');
        try {
          const before = older && entries.length ? entries[entries.length - 1].t : '';
          const data = await api.fetch(`/admin/logs?${params({ before })}`);
          if (!data.success) throw new Error(data.error || 'Could not read the logs');
          setDays(data.days);
          if (!day && data.day) setDay(data.day);
          setResult(data);
          setEntries(older ? [...entries, ...data.entries] : data.entries);
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      useEffect(() => { load(); }, [day, level, category, search]);

      // Following: the newest entries are read again every few seconds
      useEffect(() => {
        if (!follow) return;
        const timer = setInterval(() => load(), 5000);
        return () => clearInterval(timer);
      }, [follow, day, level, category, search]);

      const download = async () => {
        const response = await fetch(`${API_URL}/admin/logs/download?day=${day}`, { headers: { Authorization: `Bearer ${api.token}` } });
        if (!response.ok) return setError('Could not download the file');
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url;
        link.download = `${result.server}-${day}.jsonl`;
        link.click();
        URL.revokeObjectURL(url);
      };

      const time = (t) => new Date(t).toLocaleTimeString(undefined, { hour12: false });
      const fields = (data) => Object.entries(data || {}).map(([k, v]) => `${k}=${v}`).join('  ');

      return (
        <main className="admin-main">
          <div className="admin-header">
            <h2>Logs{result && <span className="logs-server"> · {result.server}</span>}</h2>
            <div className="logs-head-actions">
              <label className="logs-follow">
                <input type="checkbox" checked={follow} onChange={e => setFollow(e.target.checked)} /> Follow new entries
              </label>
              <button className="btn btn-secondary" disabled={!day} onClick={download}>Download day</button>
            </div>
          </div>

          <div className="logs-filters">
            <select value={day} onChange={e => setDay(e.target.value)}>
              {days.length === 0 && <option value="">No logs yet</option>}
              {days.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            <select value={level} onChange={e => setLevel(e.target.value)}>
              <option value="">All levels</option>
              <option value="warn">Warnings and errors</option>
              <option value="error">Errors only</option>
            </select>
            <select value={category} onChange={e => setCategory(e.target.value)}>
              <option value="">All categories</option>
              {(result ? result.categories : []).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <input
              type="search"
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder="Search: user, channel, error..."
              spellCheck="false"
            />
          </div>

          {error && <div className="error-msg">{error}</div>}

          <div className="table-container logs-table">
            <div className="logs-count">
              {result ? `${result.total} ${result.total === 1 ? 'entry' : 'entries'}${result.total > entries.length ? `, showing the newest ${entries.length}` : ''}` : 'Loading...'}
              {busy && ' · reading...'}
            </div>
            {entries.map((entry, i) => {
              const key = `${entry.t}-${i}`;
              return (
                <div key={key} className={`log-row ${entry.level}`} onClick={() => setOpen(open === key ? null : key)}>
                  <span className="log-time">{time(entry.t)}</span>
                  <span className={`log-level ${entry.level}`}>{entry.level}</span>
                  <span className="log-cat">{entry.cat}</span>
                  <span className="log-msg">
                    {entry.msg}
                    {Object.keys(entry.data || {}).length > 0 && (
                      open === key
                        ? <pre className="log-data">{JSON.stringify(entry.data, null, 2)}</pre>
                        : <span className="log-fields">{fields(entry.data)}</span>
                    )}
                  </span>
                </div>
              );
            })}
            {result && entries.length === 0 && <div className="groups-empty">Nothing matches.</div>}
            {result && result.more && entries.length < result.total && (
              <div className="logs-more">
                <button className="btn btn-secondary" disabled={busy} onClick={() => load(true)}>Load older</button>
              </div>
            )}
          </div>
        </main>
      );
    }

    // The torrents on the Real-Debrid account, to remove old ones
    function DebridView() {
      const [page, setPage] = useState(1);
      const [data, setData] = useState(null);
      const [selected, setSelected] = useState([]);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const [note, setNote] = useState('');
      const LIMIT = 50;

      const load = async (which = page) => {
        setBusy(true);
        setError('');
        try {
          const result = await api.fetch(`/admin/debrid?page=${which}&limit=${LIMIT}`);
          if (!result.success) throw new Error(result.error || 'Could not read Real-Debrid');
          setData(result);
          setSelected([]);
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      useEffect(() => { load(page); }, [page]);

      const remove = async (ids) => {
        if (!ids.length || !confirm(ids.length === 1 ? 'Remove this torrent from Real-Debrid?' : `Remove ${ids.length} torrents from Real-Debrid?`)) return;
        setBusy(true);
        setNote('');
        try {
          const result = await api.fetch('/admin/debrid/delete', { method: 'POST', body: JSON.stringify({ ids }) });
          setNote(`${result.removed} removed from Real-Debrid.`);
          if (!result.success) setError(result.error || 'Some could not be removed');
          const lastOnPage = data && data.torrents.length === result.removed && page > 1;
          if (lastOnPage) setPage(page - 1); else await load(page);
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const toggle = (id) => setSelected(selected.includes(id) ? selected.filter(x => x !== id) : [...selected, id]);
      const all = data && data.connected && data.torrents.length > 0 && selected.length === data.torrents.length;
      const size = (bytes) => (bytes >= 1e9 ? `${(bytes / 1e9).toFixed(2)} GB` : `${Math.round((bytes || 0) / 1e6)} MB`);
      const date = (value) => (value ? new Date(value).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '');
      const status = (t) => (t.status === 'downloaded' ? 'Ready'
        : /error|dead|virus/.test(t.status) ? `Failed (${t.status})`
        : t.status === 'downloading' ? `Downloading ${t.progress}%`
        : t.status.replace(/_/g, ' '));
      const pages = data && data.total ? Math.max(1, Math.ceil(data.total / LIMIT)) : 1;
      const until = data && data.account && data.account.expiration
        ? new Date(data.account.expiration).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';

      return (
        <main className="admin-main">
          <div className="admin-header">
            <h2>
              Real-Debrid
              {data && data.account && (
                <span className="debrid-account"> · {data.account.username}{data.account.premium ? `, premium${until ? ` until ${until}` : ''}` : ', not premium'}</span>
              )}
            </h2>
            <button className="btn btn-secondary" disabled={busy} onClick={() => load(page)}>Refresh</button>
          </div>

          {error && <div className="error-msg">{error}</div>}
          {note && <div className="success-msg">{note}</div>}
          {data && !data.connected && <div className="error-msg">No Real-Debrid token saved. Add it in Settings.</div>}

          {data && data.connected && (
            <div className="table-container">
              <div className="debrid-actions">
                <span>{data.total} {data.total === 1 ? 'torrent' : 'torrents'} on the account{busy && ' · reading...'}</span>
                {selected.length > 0 && (
                  <button className="btn btn-danger btn-small" disabled={busy} onClick={() => remove(selected)}>
                    Remove {selected.length} selected
                  </button>
                )}
              </div>
              <div className="debrid-row head">
                <input type="checkbox" checked={!!all} onChange={() => setSelected(all ? [] : data.torrents.map(t => t.id))} title="Select all on this page" />
                <span>Name</span>
                <span>Size</span>
                <span>State</span>
                <span>Added</span>
                <span></span>
              </div>
              {data.torrents.map(t => (
                <div key={t.id} className="debrid-row">
                  <input type="checkbox" checked={selected.includes(t.id)} onChange={() => toggle(t.id)} />
                  <span className="debrid-name" title={t.name}>{t.name || t.id}</span>
                  <span className="debrid-muted">{size(t.size)}</span>
                  <span className={`debrid-status ${t.status === 'downloaded' ? 'downloaded' : /error|dead|virus/.test(t.status) ? 'bad' : ''}`}>{status(t)}</span>
                  <span className="debrid-muted">{date(t.added)}</span>
                  <button className="btn btn-secondary btn-small" disabled={busy} onClick={() => remove([t.id])}>Remove</button>
                </div>
              ))}
              {data.torrents.length === 0 && <div className="groups-empty">No torrents on the account.</div>}
              {pages > 1 && (
                <div className="debrid-pages">
                  <button className="btn btn-secondary btn-small" disabled={busy || page <= 1} onClick={() => setPage(page - 1)}>Previous</button>
                  <span>Page {page} of {pages}</span>
                  <button className="btn btn-secondary btn-small" disabled={busy || page >= pages} onClick={() => setPage(page + 1)}>Next</button>
                </div>
              )}
            </div>
          )}
        </main>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [view, setView] = useState('users'); // 'users' | 'settings' | 'logs' | 'debrid'
      const [settings, setSettings] = useState(null);
      const [storageRoot, setStorageRoot] = useState('');
      const [settingsBusy, setSettingsBusy] = useState(false);
      const [settingsError, setSettingsError] = useState('');
      const [settingsNote, setSettingsNote] = useState('');
      const [modules, setModules] = useState(null);
      const [liveConversion, setLiveConversion] = useState(false);
      const [modulesBusy, setModulesBusy] = useState(false);
      const [modulesError, setModulesError] = useState('');
      const [modulesNote, setModulesNote] = useState('');
      const [castBase, setCastBase] = useState('');
      const [castBusy, setCastBusy] = useState(false);
      const [castError, setCastError] = useState('');
      const [castNote, setCastNote] = useState('');
      const [tmdbKey, setTmdbKey] = useState('');
      const [tmdbBusy, setTmdbBusy] = useState(false);
      const [tmdbError, setTmdbError] = useState('');
      const [tmdbNote, setTmdbNote] = useState('');
      const [prowlarrUrl, setProwlarrUrl] = useState('');
      const [prowlarrKey, setProwlarrKey] = useState('');
      const [prowlarrBusy, setProwlarrBusy] = useState(false);
      const [prowlarrError, setProwlarrError] = useState('');
      const [prowlarrNote, setProwlarrNote] = useState('');
      const [rdToken, setRdToken] = useState('');
      const [rdBusy, setRdBusy] = useState(false);
      const [rdError, setRdError] = useState('');
      const [rdNote, setRdNote] = useState('');
      const [osKey, setOsKey] = useState('');
      const [osUser, setOsUser] = useState('');
      const [osPassword, setOsPassword] = useState('');
      const [osBusy, setOsBusy] = useState(false);
      const [osError, setOsError] = useState('');
      const [osNote, setOsNote] = useState('');
      const [loading, setLoading] = useState(true);
      const [users, setUsers] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      
      // Form state
      const [formData, setFormData] = useState({
        username: '',
        password: '',
        role: 'user',
        portalUrl: '',
        macAddress: '',
        isActive: true
      });

      // Channel groups modal
      const [groupsUser, setGroupsUser] = useState(null);
      const [groups, setGroups] = useState([]);
      const [groupsUpdatedAt, setGroupsUpdatedAt] = useState(null);
      const [groupsBusy, setGroupsBusy] = useState(false);
      const [groupsError, setGroupsError] = useState('');
      const [sections, setSections] = useState([]);

      useEffect(() => {
        checkAuth();
      }, []);

      const checkAuth = async () => {
        if (!api.token) {
          setLoading(false);
          return;
        }
        
        const data = await api.fetch('/auth/me');
        if (data.success && data.user.role === 'admin') {
          setUser(data.user);
          loadUsers();
        }
        setLoading(false);
      };

      const loadUsers = async () => {
        const data = await api.fetch('/admin/users');
        if (data.success) {
          setUsers(data.users);
        }
      };

      const openCreateModal = () => {
        setEditingUser(null);
        setFormData({ username: '', password: '', role: 'user', portalUrl: '', macAddress: '', isActive: true });
        setError('');
        setShowModal(true);
      };

      const openEditModal = async (userId) => {
        const data = await api.fetch(`/admin/users/${userId}`);
        if (data.success) {
          setEditingUser(data.user);
          setFormData({
            username: data.user.username,
            password: '',
            role: data.user.role,
            portalUrl: data.user.portalUrl || '',
            macAddress: data.user.macAddress || '',
            isActive: data.user.isActive
          });
          setError('');
          setShowModal(true);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        
        try {
          let data;
          if (editingUser) {
            const updateData = { ...formData };
            if (!updateData.password) delete updateData.password;
            data = await api.fetch(`/admin/users/${editingUser.id}`, {
              method: 'PUT',
              body: JSON.stringify(updateData)
            });
          } else {
            data = await api.fetch('/admin/users', {
              method: 'POST',
              body: JSON.stringify(formData)
            });
          }
          
          if (data.success) {
            setShowModal(false);
            setSuccess(editingUser ? 'User updated successfully!' : 'User created successfully!');
            loadUsers();
            setTimeout(() => setSuccess(''), 3000);
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('An error occurred');
        }
      };

      const handleDelete = async (userId, username) => {
        if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;
        
        const data = await api.fetch(`/admin/users/${userId}`, { method: 'DELETE' });
        if (data.success) {
          setSuccess('User deleted successfully!');
          loadUsers();
          setTimeout(() => setSuccess(''), 3000);
        } else {
          alert(data.error);
        }
      };

      const handleToggleActive = async (userId, currentStatus) => {
        const data = await api.fetch(`/admin/users/${userId}`, {
          method: 'PUT',
          body: JSON.stringify({ isActive: !currentStatus })
        });
        if (data.success) {
          loadUsers();
        } else {
          alert(data.error);
        }
      };

      const sortGroups = (list) => [...list].sort((a, b) => {
        const an = a.number ?? Number.MAX_SAFE_INTEGER;
        const bn = b.number ?? Number.MAX_SAFE_INTEGER;
        if (an !== bn) return an - bn;
        return a.title.localeCompare(b.title);
      });

      const applyGroupsResponse = (data) => {
        setGroups(sortGroups(data.groups));
        setGroupsUpdatedAt(data.updatedAt);
        setSections(data.sections || []);
      };

      const openGroupsModal = async (u) => {
        setGroupsUser(u);
        setGroups([]);
        setGroupsUpdatedAt(null);
        setGroupsError('');
        setGroupsBusy(true);
        
        try {
          const data = await api.fetch(`/admin/users/${u.id}/groups`);
          if (data.success) applyGroupsResponse(data);
          else setGroupsError(data.error);
        } catch (err) {
          setGroupsError('An error occurred');
        } finally {
          setGroupsBusy(false);
        }
      };

      const refreshGroups = async () => {
        setGroupsError('');
        setGroupsBusy(true);
        
        try {
          const data = await api.fetch(`/admin/users/${groupsUser.id}/groups/refresh`, { method: 'POST' });
          if (data.success) {
            // Keep unsaved ticks; groups that are new stay unticked
            const ticked = new Set(groups.filter(g => g.enabled).map(g => g.id));
            const known = new Set(groups.map(g => g.id));
            applyGroupsResponse({
              ...data,
              sections,
              groups: data.groups.map(g => known.has(g.id) ? { ...g, enabled: ticked.has(g.id) } : g)
            });
          } else {
            setGroupsError(data.error);
          }
        } catch (err) {
          setGroupsError('An error occurred');
        } finally {
          setGroupsBusy(false);
        }
      };

      const setAllGroups = (enabled) => setGroups(groups.map(g => ({ ...g, enabled })));

      const toggleGroup = (id) => setGroups(groups.map(g => g.id === id ? { ...g, enabled: !g.enabled } : g));

      const saveGroups = async () => {
        setGroupsError('');
        setGroupsBusy(true);
        
        try {
          const data = await api.fetch(`/admin/users/${groupsUser.id}/groups`, {
            method: 'PUT',
            body: JSON.stringify({
              enabledGenres: groups.filter(g => g.enabled).map(g => g.id),
              enabledSections: sections
            })
          });
          
          if (data.success) {
            setSuccess(`Channel groups updated for ${groupsUser.username}!`);
            setGroupsUser(null);
            setTimeout(() => setSuccess(''), 3000);
          } else {
            setGroupsError(data.error);
          }
        } catch (err) {
          setGroupsError('An error occurred');
        } finally {
          setGroupsBusy(false);
        }
      };

      const formatSize = (bytes) => bytes >= 1e12 ? `${(bytes / 1e12).toFixed(2)} TB` : `${(bytes / 1e9).toFixed(1)} GB`;

      const loadSettings = async () => {
        setSettingsError('');
        setSettingsNote('');
        const data = await api.fetch('/admin/settings');
        if (data.success) {
          setSettings(data);
          setStorageRoot(data.folders.root);
          setCastBase(data.settings.castBaseUrl || '');
          setModules(data.settings.modules);
          setLiveConversion(!!data.settings.liveConversion);
          setProwlarrUrl(data.settings.prowlarrUrl || '');
          setOsUser(data.settings.openSubtitlesUser || '');
        } else {
          setSettingsError(data.error || 'Could not load the settings');
        }
      };

      const saveSettings = async (e) => {
        e.preventDefault();
        setSettingsBusy(true);
        setSettingsError('');
        setSettingsNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ storageRoot })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setStorageRoot(data.folders.root);
          setSettingsNote('Saved. New recordings will be stored here.');
        } catch (err) {
          setSettingsError(err.message);
        } finally {
          setSettingsBusy(false);
        }
      };

      const saveModules = async (e) => {
        e.preventDefault();
        setModulesBusy(true);
        setModulesError('');
        setModulesNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ modules, liveConversion })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setModules(data.settings.modules);
          setLiveConversion(!!data.settings.liveConversion);
          setModulesNote('Saved. Users see the change the next time they open or reload the app.');
        } catch (err) {
          setModulesError(err.message);
        } finally {
          setModulesBusy(false);
        }
      };

      const MODULE_LIST = [
        { id: 'live', label: 'Live TV', hint: 'TV channels' },
        { id: 'recordings', label: 'Recordings', hint: 'Programmes already aired, from the guide or from a channel' },
        { id: 'library', label: 'Library', hint: 'Recordings kept on this server and converted to MP4, and the Recorded gallery. Needs ffmpeg and disk space' },
        { id: 'vod', label: 'Video club', hint: 'Also enabled per user' },
        { id: 'series', label: 'Series', hint: 'Also enabled per user' },
        { id: 'discover', label: 'Discover', hint: 'Films and series from TMDB, to find something to watch, with torrent sources from Prowlarr played through Real-Debrid, and subtitles from OpenSubtitles. Needs the TMDB key, Prowlarr and Real-Debrid below' }
      ];

      const saveCastBase = async (e) => {
        e.preventDefault();
        setCastBusy(true);
        setCastError('');
        setCastNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ castBaseUrl: castBase })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setCastBase(data.settings.castBaseUrl || '');
          setCastNote(data.settings.castBaseUrl ? 'Saved. The Chromecast will fetch videos from this address.' : 'Saved. The Chromecast will use the address the app is opened at.');
        } catch (err) {
          setCastError(err.message);
        } finally {
          setCastBusy(false);
        }
      };

      // An empty key removes the one saved
      const saveTmdbKey = async (key) => {
        setTmdbBusy(true);
        setTmdbError('');
        setTmdbNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ tmdbKey: key })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setTmdbKey('');
          setTmdbNote(key ? 'Key accepted by TMDB and saved.' : 'Key removed.');
        } catch (err) {
          setTmdbError(err.message);
        } finally {
          setTmdbBusy(false);
        }
      };

      // Both empty removes the connection; an empty key keeps the one saved
      const saveProwlarr = async (url, key) => {
        setProwlarrBusy(true);
        setProwlarrError('');
        setProwlarrNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify(url ? { prowlarrUrl: url, ...(key ? { prowlarrKey: key } : {}) } : { prowlarrUrl: '', prowlarrKey: '' })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setProwlarrUrl(data.settings.prowlarrUrl || '');
          setProwlarrKey('');
          setProwlarrNote(url ? `Connected to Prowlarr ${data.prowlarrVersion} and saved.` : 'Prowlarr connection removed.');
        } catch (err) {
          setProwlarrError(err.message);
        } finally {
          setProwlarrBusy(false);
        }
      };

      // An empty token removes the one saved
      const saveRdToken = async (token) => {
        setRdBusy(true);
        setRdError('');
        setRdNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ realDebridToken: token })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setRdToken('');
          setRdNote(token ? 'Token accepted by Real-Debrid and saved.' : 'Token removed.');
        } catch (err) {
          setRdError(err.message);
        } finally {
          setRdBusy(false);
        }
      };

      // remove: forget the key and the account
      const saveOpenSubtitles = async (remove = false) => {
        setOsBusy(true);
        setOsError('');
        setOsNote('');
        try {
          const data = await api.fetch('/admin/settings', {
            method: 'PUT',
            body: JSON.stringify({ openSubtitles: remove ? { remove: true } : { key: osKey.trim(), user: osUser.trim(), password: osPassword } })
          });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setOsKey('');
          setOsPassword('');
          setOsUser(data.settings.openSubtitlesUser || '');
          setOsNote(remove ? 'OpenSubtitles removed.' : 'Accepted by OpenSubtitles and saved.');
        } catch (err) {
          setOsError(err.message);
        } finally {
          setOsBusy(false);
        }
      };

      const osAccount = (s) => {
        if (!s.openSubtitlesKeySet) return 'No OpenSubtitles key saved.';
        const account = s.openSubtitlesAccount;
        if (!account || !account.user) return 'An OpenSubtitles key is saved, without an account (fewer downloads a day).';
        return `OpenSubtitles key and account ${account.user} saved${account.allowedDownloads ? ` · ${account.allowedDownloads} downloads a day` : ''}${account.vip ? ' · VIP' : ''}.`;
      };

      const saveDebridProxy = async (on) => {
        setRdBusy(true);
        setRdError('');
        setRdNote('');
        try {
          const data = await api.fetch('/admin/settings', { method: 'PUT', body: JSON.stringify({ debridProxy: on }) });
          if (!data.success) throw new Error(data.error);
          setSettings(data);
          setRdNote(on ? 'Real-Debrid videos now come through this server.' : 'Real-Debrid videos now go straight to the viewer.');
        } catch (err) {
          setRdError(err.message);
        } finally {
          setRdBusy(false);
        }
      };

      const rdAccount = (user) => {
        if (!user) return 'A Real-Debrid token is saved.';
        const until = user.expiration ? new Date(user.expiration).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        return user.premium
          ? `Real-Debrid account ${user.username}, premium${until ? ` until ${until}` : ''}.`
          : `Real-Debrid account ${user.username} is not premium: sources will not play.`;
      };

      const openView = (next) => (e) => {
        e.preventDefault();
        setView(next);
        if (next === 'settings') loadSettings();
      };

      if (loading) {
        return <div className="loading"><div className="spinner"></div>Loading...</div>;
      }

      if (!user) {
        return (
          <div className="access-denied">
            <div className="icon">🔒</div>
            <h2>Access Denied</h2>
            <p>You must be logged in as an administrator to access this page.</p>
            <a href="/" className="btn btn-primary">Go to Login</a>
          </div>
        );
      }

      const activeUsers = users.filter(u => u.isActive).length;
      const configuredUsers = users.filter(u => u.hasPortalConfig).length;

      return (
        <div className="admin-layout">
          <aside className="admin-sidebar">
            <h1>⚙️ Admin Panel</h1>
            <ul className="admin-nav">
              <li><a href="#" className={view === 'users' ? 'active' : ''} onClick={openView('users')}>👥 Users</a></li>
              <li><a href="#" className={view === 'settings' ? 'active' : ''} onClick={openView('settings')}>⚙️ Settings</a></li>
              <li><a href="#" className={view === 'logs' ? 'active' : ''} onClick={openView('logs')}>📜 Logs</a></li>
              <li><a href="#" className={view === 'debrid' ? 'active' : ''} onClick={openView('debrid')}>⚡ Real-Debrid</a></li>
              <li><a href="/">📺 Back to Player</a></li>
              <div className="divider"></div>
              <li><a href="#" onClick={() => { localStorage.removeItem('authToken'); window.location.href = '/'; }}>🚪 Logout</a></li>
            </ul>
          </aside>
          
          {view === 'logs' && <LogsView />}
          {view === 'debrid' && <DebridView />}

          {view === 'settings' && (
            <main className="admin-main">
              <div className="admin-header">
                <h2>Settings</h2>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>🧩 Parts of the app on this server</h3>
                </div>
                <form onSubmit={saveModules} className="settings-body">
                  <small className="settings-intro">
                    Each server keeps its own choice, so a light copy can offer only some parts (for example without the library).
                  </small>
                  {modules && MODULE_LIST.map(module => (
                    <label key={module.id} className="module-option">
                      <input
                        type="checkbox"
                        checked={modules[module.id]}
                        onChange={e => setModules({ ...modules, [module.id]: e.target.checked })}
                      />
                      <span>
                        <strong>{module.label}</strong>
                        <small>
                          {module.hint}
                          {module.id === 'library' && settings && (settings.ffmpeg ? ' · ffmpeg found on this server' : ' · ffmpeg is not installed on this server')}
                        </small>
                      </span>
                    </label>
                  ))}

                  {modules && (
                    <label className="module-option">
                      <input
                        type="checkbox"
                        checked={liveConversion}
                        disabled={!modules.live}
                        onChange={e => setLiveConversion(e.target.checked)}
                      />
                      <span>
                        <strong>Convert channels the browser cannot play</strong>
                        <small>
                          Live TV channels with sound or picture the browser does not support (AC3, MPEG-2, HEVC...) are
                          converted with ffmpeg on this server. Heavy on the processor: keep it off on a Raspberry Pi
                          {settings && (settings.ffmpeg ? ' · ffmpeg found on this server' : ' · ffmpeg is not installed on this server')}
                        </small>
                      </span>
                    </label>
                  )}

                  {modulesError && <div className="error-msg">{modulesError}</div>}
                  {modulesNote && <div className="success-msg">{modulesNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={modulesBusy || !modules}>
                    {modulesBusy ? 'Saving...' : 'Save'}
                  </button>
                </form>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>💾 Storage</h3>
                </div>
                <form onSubmit={saveSettings} className="settings-body">
                  <div className="form-group">
                    <label>Storage folder for the library</label>
                    <input
                      type="text"
                      value={storageRoot}
                      onChange={e => setStorageRoot(e.target.value)}
                      placeholder="/mnt/hdd/iptv"
                      spellCheck="false"
                    />
                    <small>
                      Full path of a folder that already exists, for example on the external disk.
                      The app creates three folders inside it: <code>downloads</code> (recordings waiting to be trimmed),
                      {' '}<code>library</code> (finished MP4 files) and <code>tmp</code> (conversions in progress).
                      Leave empty to use the default ({settings?.defaultStorageRoot || 'next to the app data'}).
                    </small>
                  </div>

                  {settings && (
                    <div className={`settings-status ${settings.storage.ok ? 'ok' : 'bad'}`}>
                      {settings.storage.ok
                        ? `In use: ${settings.folders.root} · ${formatSize(settings.storage.freeBytes)} free of ${formatSize(settings.storage.totalBytes)}`
                        : `Current folder not usable: ${settings.storage.error}`}
                    </div>
                  )}

                  {settingsError && <div className="error-msg">{settingsError}</div>}
                  {settingsNote && <div className="success-msg">{settingsNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={settingsBusy}>
                    {settingsBusy ? 'Checking...' : 'Save'}
                  </button>
                  <small className="settings-foot">
                    Recordings already made keep their files where they are; only new ones use the new folder.
                  </small>
                </form>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>📺 Chromecast</h3>
                </div>
                <form onSubmit={saveCastBase} className="settings-body">
                  <div className="form-group">
                    <label>Address of this server on the home network</label>
                    <input
                      type="text"
                      value={castBase}
                      onChange={e => setCastBase(e.target.value)}
                      placeholder="http://192.168.1.159"
                      spellCheck="false"
                    />
                    <small>
                      A Chromecast fetches the video by itself. With this address it gets it straight from the server
                      at home; left empty, it uses the address the app is opened at, and the video travels through the internet.
                      Use the IP address, not a name: a Chromecast does not know local names.
                    </small>
                  </div>

                  {castError && <div className="error-msg">{castError}</div>}
                  {castNote && <div className="success-msg">{castNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={castBusy}>
                    {castBusy ? 'Saving...' : 'Save'}
                  </button>
                </form>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>🎞️ Film and episode details</h3>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); if (tmdbKey.trim()) saveTmdbKey(tmdbKey.trim()); }} className="settings-body">
                  <div className="form-group">
                    <label>TMDB key</label>
                    <input
                      type="password"
                      value={tmdbKey}
                      onChange={e => setTmdbKey(e.target.value)}
                      placeholder={settings?.settings?.tmdbKeySet ? 'Saved. Type a new one to replace it' : 'API key or read access token'}
                      autoComplete="off"
                      spellCheck="false"
                    />
                    <small>
                      In the Library, a recording can be linked to its film or episode by pasting its IMDb or TMDB link.
                      With a key from <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer">themoviedb.org</a> (free
                      with an account) the app shows the synopsis, series, season and episode, in Portuguese and English.
                      Without it, only IMDb links work and show just the English title, picture and year.
                    </small>
                  </div>

                  {settings && (
                    <div className={`settings-status ${settings.settings.tmdbKeySet ? 'ok' : 'bad'}`}>
                      {settings.settings.tmdbKeySet ? 'A TMDB key is saved.' : 'No TMDB key saved.'}
                    </div>
                  )}

                  {tmdbError && <div className="error-msg">{tmdbError}</div>}
                  {tmdbNote && <div className="success-msg">{tmdbNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={tmdbBusy || !tmdbKey.trim()}>
                    {tmdbBusy ? 'Checking...' : 'Save key'}
                  </button>
                  {settings?.settings?.tmdbKeySet && (
                    <button type="button" className="btn btn-secondary" style={{ marginLeft: 8 }} disabled={tmdbBusy} onClick={() => confirm('Remove the TMDB key?') && saveTmdbKey('')}>
                      Remove key
                    </button>
                  )}
                </form>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>🔎 Sources for Discover (Prowlarr)</h3>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); if (prowlarrUrl.trim()) saveProwlarr(prowlarrUrl.trim(), prowlarrKey.trim()); }} className="settings-body">
                  <div className="form-group">
                    <label>Prowlarr address</label>
                    <input
                      type="text"
                      value={prowlarrUrl}
                      onChange={e => setProwlarrUrl(e.target.value)}
                      placeholder="http://localhost:9696"
                      autoComplete="off"
                      spellCheck="false"
                    />
                    <small>
                      Address of Prowlarr as seen from this server: <code>http://localhost:9696</code> when it runs on the same machine.
                    </small>
                  </div>
                  <div className="form-group">
                    <label>Prowlarr API key</label>
                    <input
                      type="password"
                      value={prowlarrKey}
                      onChange={e => setProwlarrKey(e.target.value)}
                      placeholder={settings?.settings?.prowlarrKeySet ? 'Saved. Type a new one to replace it' : 'In Prowlarr: Settings → General → API Key'}
                      autoComplete="off"
                      spellCheck="false"
                    />
                    <small>
                      Discover asks this Prowlarr for torrents of the film or episode chosen, from the indexers set up there.
                      The key stays on this server.
                    </small>
                  </div>

                  {settings && (
                    <div className={`settings-status ${settings.settings.prowlarrUrl && settings.settings.prowlarrKeySet ? 'ok' : 'bad'}`}>
                      {settings.settings.prowlarrUrl && settings.settings.prowlarrKeySet ? `Prowlarr at ${settings.settings.prowlarrUrl} is saved.` : 'No Prowlarr saved.'}
                    </div>
                  )}

                  {prowlarrError && <div className="error-msg">{prowlarrError}</div>}
                  {prowlarrNote && <div className="success-msg">{prowlarrNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={prowlarrBusy || !prowlarrUrl.trim() || (!prowlarrKey.trim() && !settings?.settings?.prowlarrKeySet)}>
                    {prowlarrBusy ? 'Connecting...' : 'Save'}
                  </button>
                  {settings?.settings?.prowlarrUrl && (
                    <button type="button" className="btn btn-secondary" style={{ marginLeft: 8 }} disabled={prowlarrBusy} onClick={() => confirm('Remove the Prowlarr connection?') && saveProwlarr('', '')}>
                      Remove
                    </button>
                  )}
                </form>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>⚡ Playing Discover sources (Real-Debrid)</h3>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); if (rdToken.trim()) saveRdToken(rdToken.trim()); }} className="settings-body">
                  <div className="form-group">
                    <label>Real-Debrid API token</label>
                    <input
                      type="password"
                      value={rdToken}
                      onChange={e => setRdToken(e.target.value)}
                      placeholder={settings?.settings?.realDebridTokenSet ? 'Saved. Type a new one to replace it' : 'From real-debrid.com/apitoken'}
                      autoComplete="off"
                      spellCheck="false"
                    />
                    <small>
                      A source chosen in Discover is handed to Real-Debrid, which downloads it on its servers (at once, when it
                      already has it) and gives a link to play it. Get the token at{' '}
                      <a href="https://real-debrid.com/apitoken" target="_blank" rel="noopener noreferrer">real-debrid.com/apitoken</a>.
                      It stays on this server.
                    </small>
                  </div>

                  {settings && (
                    <div className={`settings-status ${settings.settings.realDebridTokenSet && (!settings.settings.realDebridUser || settings.settings.realDebridUser.premium) ? 'ok' : 'bad'}`}>
                      {settings.settings.realDebridTokenSet ? rdAccount(settings.settings.realDebridUser) : 'No Real-Debrid token saved.'}
                    </div>
                  )}

                  {settings && settings.settings.realDebridTokenSet && (
                    <div className="form-group">
                      <label className="checkbox-group">
                        <input
                          type="checkbox"
                          checked={!!settings.settings.debridProxy}
                          disabled={rdBusy}
                          onChange={e => saveDebridProxy(e.target.checked)}
                        />
                        Play through this server
                      </label>
                      <small>
                        Real-Debrid allows one IP at a time. With this on, videos come from Real-Debrid to this server and from
                        here to the viewer, so Real-Debrid always sees this server's IP, at home or away. Away from home, the
                        video then uses this server's upload speed.
                      </small>
                    </div>
                  )}

                  {rdError && <div className="error-msg">{rdError}</div>}
                  {rdNote && <div className="success-msg">{rdNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={rdBusy || !rdToken.trim()}>
                    {rdBusy ? 'Checking...' : 'Save token'}
                  </button>
                  {settings?.settings?.realDebridTokenSet && (
                    <button type="button" className="btn btn-secondary" style={{ marginLeft: 8 }} disabled={rdBusy} onClick={() => confirm('Remove the Real-Debrid token?') && saveRdToken('')}>
                      Remove token
                    </button>
                  )}
                </form>
              </div>

              <div className="table-container settings-panel">
                <div className="table-header">
                  <h3>💬 Subtitles for Discover (OpenSubtitles)</h3>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); saveOpenSubtitles(); }} className="settings-body">
                  <div className="form-group">
                    <label>OpenSubtitles API key</label>
                    <input
                      type="password"
                      value={osKey}
                      onChange={e => setOsKey(e.target.value)}
                      placeholder={settings?.settings?.openSubtitlesKeySet ? 'Saved. Type a new one to replace it' : 'opensubtitles.com → Consumers → New consumer'}
                      autoComplete="off"
                      spellCheck="false"
                    />
                    <small>
                      The player of a Discover title finds subtitles in Portuguese and English, those made for the file
                      playing first. Get a key at{' '}
                      <a href="https://www.opensubtitles.com/en/consumers" target="_blank" rel="noopener noreferrer">opensubtitles.com/consumers</a>.
                    </small>
                  </div>
                  <div className="form-group">
                    <label>OpenSubtitles user (optional)</label>
                    <input
                      type="text"
                      value={osUser}
                      onChange={e => setOsUser(e.target.value)}
                      placeholder="Your opensubtitles.com user name"
                      autoComplete="off"
                      spellCheck="false"
                    />
                  </div>
                  <div className="form-group">
                    <label>OpenSubtitles password</label>
                    <input
                      type="password"
                      value={osPassword}
                      onChange={e => setOsPassword(e.target.value)}
                      placeholder={settings?.settings?.openSubtitlesPasswordSet ? 'Saved. Type a new one to replace it' : 'Only with the user above'}
                      autoComplete="new-password"
                    />
                    <small>
                      Without an account OpenSubtitles allows a few downloads a day; with a free account, 20; VIP, more.
                      Each subtitle is downloaded once and kept on this server. The key and password stay on this server.
                    </small>
                  </div>

                  {settings && (
                    <div className={`settings-status ${settings.settings.openSubtitlesKeySet ? 'ok' : 'bad'}`}>
                      {osAccount(settings.settings)}
                    </div>
                  )}

                  {osError && <div className="error-msg">{osError}</div>}
                  {osNote && <div className="success-msg">{osNote}</div>}

                  <button type="submit" className="btn btn-primary" disabled={osBusy || (!osKey.trim() && !settings?.settings?.openSubtitlesKeySet)}>
                    {osBusy ? 'Checking...' : 'Save'}
                  </button>
                  {settings?.settings?.openSubtitlesKeySet && (
                    <button type="button" className="btn btn-secondary" style={{ marginLeft: 8 }} disabled={osBusy} onClick={() => confirm('Remove the OpenSubtitles key and account?') && saveOpenSubtitles(true)}>
                      Remove
                    </button>
                  )}
                </form>
              </div>
            </main>
          )}

          {view === 'users' && (
          <main className="admin-main">
            <div className="admin-header">
              <h2>User Management</h2>
              <button className="btn btn-primary" onClick={openCreateModal}>➕ Add User</button>
            </div>
            
            {success && <div className="success-msg">{success}</div>}
            
            <div className="stats-grid">
              <div className="stat-card">
                <div className="icon">👥</div>
                <div className="value">{users.length}</div>
                <div className="label">Total Users</div>
              </div>
              <div className="stat-card">
                <div className="icon">✅</div>
                <div className="value">{activeUsers}</div>
                <div className="label">Active Users</div>
              </div>
              <div className="stat-card">
                <div className="icon">📺</div>
                <div className="value">{configuredUsers}</div>
                <div className="label">Configured</div>
              </div>
              <div className="stat-card">
                <div className="icon">🔑</div>
                <div className="value">{users.filter(u => u.role === 'admin').length}</div>
                <div className="label">Admins</div>
              </div>
            </div>
            
            <div className="table-container">
              <div className="table-header">
                <h3>All Users</h3>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>IPTV Config</th>
                    <th>Last Login</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {users.map(u => (
                    <tr key={u.id}>
                      <td><strong>{u.username}</strong></td>
                      <td><span className={`badge badge-${u.role}`}>{u.role}</span></td>
                      <td>
                        <span className={`badge ${u.isActive ? 'badge-active' : 'badge-inactive'}`}>
                          {u.isActive ? 'Active' : 'Inactive'}
                        </span>
                      </td>
                      <td>
                        <span className={`badge ${u.hasPortalConfig ? 'badge-configured' : 'badge-pending'}`}>
                          {u.hasPortalConfig ? 'Configured' : 'Pending'}
                        </span>
                      </td>
                      <td style={{color: '#888', fontSize: '0.85rem'}}>
                        {u.lastLogin ? new Date(u.lastLogin).toLocaleDateString() : 'Never'}
                      </td>
                      <td>
                        <div className="actions">
                          <button onClick={() => openEditModal(u.id)}>✏️ Edit</button>
                          <button onClick={() => openGroupsModal(u)}>📂 Groups</button>
                          <button onClick={() => handleToggleActive(u.id, u.isActive)}>
                            {u.isActive ? '🚫 Disable' : '✅ Enable'}
                          </button>
                          <button className="danger" onClick={() => handleDelete(u.id, u.username)}>🗑️</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </main>
          )}
          
          {groupsUser && (
            <div className="modal-overlay" onClick={() => setGroupsUser(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>📂 Sections &amp; Channel Groups — {groupsUser.username}</h2>
                
                {groupsError && <div className="error-msg">{groupsError}</div>}
                
                <div className="groups-list" style={{marginBottom: '15px'}}>
                  {[['vod', '🎬 Video Club'], ['series', '📽️ Series']].map(([id, label]) => (
                    <label key={id}>
                      <input
                        type="checkbox"
                        checked={groupsUser.role === 'admin' || sections.includes(id)}
                        disabled={groupsUser.role === 'admin'}
                        onChange={() => setSections(sections.includes(id) ? sections.filter(s => s !== id) : [...sections, id])}
                      />
                      <span className="title">{label}</span>
                      <span className="count">{groupsUser.role === 'admin' ? 'always on for admins' : 'section'}</span>
                    </label>
                  ))}
                </div>
                
                <div className="groups-toolbar">
                  <span className="meta">
                    {groupsUpdatedAt
                      ? `List updated ${new Date(groupsUpdatedAt).toLocaleString()} · ${groups.filter(g => g.enabled).length}/${groups.length} shown`
                      : 'No channel list stored yet'}
                  </span>
                  <div className="links">
                    <button type="button" onClick={() => setAllGroups(true)} disabled={groupsBusy || groups.length === 0}>All</button>
                    <button type="button" onClick={() => setAllGroups(false)} disabled={groupsBusy || groups.length === 0}>None</button>
                    <button type="button" onClick={refreshGroups} disabled={groupsBusy || !groupsUser.hasPortalConfig}>
                      {groupsBusy ? '⏳' : '🔄'} Refresh
                    </button>
                  </div>
                </div>
                
                {groups.length > 0 ? (
                  <div className="groups-list">
                    {groups.map(g => (
                      <label key={g.id}>
                        <input type="checkbox" checked={g.enabled} onChange={() => toggleGroup(g.id)} />
                        <span className="title">{g.title}</span>
                        <span className="count">{g.count} channels</span>
                      </label>
                    ))}
                  </div>
                ) : (
                  <div className="groups-empty">
                    {groupsBusy
                      ? 'Loading...'
                      : groupsUser.hasPortalConfig
                        ? 'The list is stored when the user signs in. Press Refresh to read it from the portal now.'
                        : 'This user has no portal URL / MAC address configured yet.'}
                  </div>
                )}
                
                <div className="modal-actions">
                  <button type="button" className="btn btn-secondary" onClick={() => setGroupsUser(null)}>Cancel</button>
                  <button type="button" className="btn btn-primary" onClick={saveGroups} disabled={groupsBusy}>Save</button>
                </div>
              </div>
            </div>
          )}
          
          {showModal && (
            <div className="modal-overlay" onClick={() => setShowModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>{editingUser ? '✏️ Edit User' : '➕ Create User'}</h2>
                
                {error && <div className="error-msg">{error}</div>}
                
                <form onSubmit={handleSubmit}>
                  <div className="form-group">
                    <label>Username</label>
                    <input
                      type="text"
                      value={formData.username}
                      onChange={e => setFormData({...formData, username: e.target.value})}
                      required
                      placeholder="Enter username"
                    />
                  </div>
                  
                  <div className="form-group">
                    <label>{editingUser ? 'New Password (leave empty to keep current)' : 'Password'}</label>
                    <input
                      type="password"
                      value={formData.password}
                      onChange={e => setFormData({...formData, password: e.target.value})}
                      required={!editingUser}
                      minLength={6}
                      placeholder={editingUser ? 'Leave empty to keep current' : 'Min 6 characters'}
                    />
                  </div>
                  
                  <div className="form-row">
                    <div className="form-group">
                      <label>Role</label>
                      <select
                        value={formData.role}
                        onChange={e => setFormData({...formData, role: e.target.value})}
                      >
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                      </select>
                    </div>
                    
                    <div className="form-group">
                      <label>Status</label>
                      <select
                        value={formData.isActive ? 'active' : 'inactive'}
                        onChange={e => setFormData({...formData, isActive: e.target.value === 'active'})}
                      >
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                      </select>
                    </div>
                  </div>
                  
                  <div className="form-group">
                    <label>Portal URL</label>
                    <input
                      type="text"
                      value={formData.portalUrl}
                      onChange={e => setFormData({...formData, portalUrl: e.target.value})}
                      placeholder="http://example.com"
                    />
                    <small>IPTV portal base URL</small>
                  </div>
                  
                  <div className="form-group">
                    <label>MAC Address</label>
                    <input
                      type="text"
                      value={formData.macAddress}
                      onChange={e => setFormData({...formData, macAddress: e.target.value})}
                      placeholder="00:1A:79:XX:XX:XX"
                    />
                    <small>Device MAC address for IPTV authentication</small>
                  </div>
                  
                  <div className="modal-actions">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>
                      Cancel
                    </button>
                    <button type="submit" className="btn btn-primary">
                      {editingUser ? 'Save Changes' : 'Create User'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
