<html lang="en">

<body class="theme-midnight">
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    
    // Backend origin used for stream proxy (API_URL comes from api.js)
    const BACKEND_ORIGIN = new URL(API_URL, window.location.href).origin;

    // ── Phone or desktop version ─────────────────────────────────────────────
    // Phones are sent to the mobile version (?view=mobile) when the app opens.
    // Choosing a version by hand (?view=mobile / ?view=desktop) is remembered.
    const MOBILE_VIEW = (() => {
      const requested = new URLSearchParams(window.location.search).get('view');
      const chosen = requested === 'mobile' || requested === 'desktop' ? requested : null;

      let remembered = null;
      try {
        if (chosen) localStorage.setItem('view', chosen);
        remembered = localStorage.getItem('view');
      } catch (_) {}

      const smallestSide = Math.min(window.screen.width, window.screen.height);
      const isPhone = /iPhone|iPod|Android.*Mobile|Mobile.*Firefox|Windows Phone/i.test(navigator.userAgent)
        || (window.matchMedia('(pointer: coarse)').matches && smallestSide <= 500);

      // (the TV app always has the full version)
      const mobile = typeof window.AndroidTV === 'undefined'
        && (chosen || remembered || (isPhone ? 'mobile' : 'desktop')) === 'mobile';

      if (mobile && chosen !== 'mobile') {
        window.location.replace(`${window.location.pathname}?view=mobile`);
      }

      return mobile;
    })();

    if (MOBILE_VIEW) document.documentElement.classList.add('mobile-view');

    // ── Android TV app ───────────────────────────────────────────────────────
    // Inside the Android TV app (android-tv/), window.AndroidTV is the app's
    // bridge: videos play in its own player (ExoPlayer, which plays the formats
    // and the sound the TV can, MKV, AC3 and HEVC included) and the remote moves
    // the focus around this page.
    const TV_APP = typeof window.AndroidTV !== 'undefined';
    if (TV_APP) document.documentElement.classList.add('tv-app');

    // The TV app's player. play(media, handlers) shows it (in place of what it
    // was playing, if anything) with
    //   media    { url, hls, live, title, subtitle, startAt, next,
    //              alternate: { url, hls, label, back, onError },
    //              subtitles (true when there are subtitles to search),
    //              subtitleTrack: { url, language, name } }
    //   handlers { onPosition(position, duration, closing), onPlaying,
    //              onEnded(error), onZap(step), onNext, onClose, subtitles }
    // (subtitles: the provider of useRecordingPlayer items). Each play is a
    // session: the events of one already replaced are only used for its last
    // position.
    const nativePlayer = (() => {
      const sessions = new Map();
      let last = 0;
      let returnTo = null; // the control the video was started from, focused again after it

      const reply = (method, session, value) => {
        try { window.AndroidTV[method](session, JSON.stringify(value)); } catch (_) {}
      };

      const subtitleLabel = (entry) => [
        SUBTITLE_LANGUAGES[entry.language] || entry.language,
        entry.hashMatch ? '· in sync' : '',
        entry.hearingImpaired ? '· SDH' : '',
        entry.machine ? '· machine translated' : ''
      ].filter(Boolean).join(' ');

      window.__tvPlayerEvent = async (event) => {
        const handlers = sessions.get(event.session);
        if (!handlers) return;
        switch (event.type) {
          case 'position':
            if (handlers.onPosition && event.position > 0) handlers.onPosition(event.position, event.duration, false);
            break;
          case 'closed':
            sessions.delete(event.session);
            if (handlers.onPosition && event.position > 0) handlers.onPosition(event.position, event.duration, true);
            if (event.replaced) break;
            if (handlers.onClose) handlers.onClose();
            if (returnTo && returnTo.isConnected) returnTo.focus({ preventScroll: true });
            else if (window.__tvFocusFirst) window.__tvFocusFirst();
            break;
          case 'playing':
            if (handlers.onPlaying) handlers.onPlaying();
            break;
          case 'ended':
            if (handlers.onEnded) handlers.onEnded(event.error || '');
            break;
          case 'zap':
            if (handlers.onZap) handlers.onZap(event.step);
            break;
          case 'next':
            if (handlers.onNext) handlers.onNext();
            break;
          case 'subtitleSearch': {
            const provider = handlers.subtitles;
            try {
              const data = await provider.search();
              if (!data.success) throw new Error(data.error || 'Could not look for subtitles');
              reply('subtitleList', event.session, {
                entries: data.subtitles.map(entry => ({ id: String(entry.id), language: entry.language, label: subtitleLabel(entry), release: entry.release }))
              });
            } catch (err) {
              reply('subtitleList', event.session, { error: err.message });
            }
            break;
          }
          case 'subtitle': {
            const provider = handlers.subtitles;
            if (!event.id) {
              provider.remember(null);
              reply('setSubtitle', event.session, null);
              break;
            }
            try {
              const url = await provider.fetch(event.id);
              provider.remember({ id: event.id, language: event.language });
              reply('setSubtitle', event.session, { url, language: event.language, name: SUBTITLE_LANGUAGES[event.language] || event.language || 'Subtitles' });
            } catch (err) {
              reply('setSubtitle', event.session, { error: err.message });
            }
            break;
          }
        }
      };

      const absolute = (url) => new URL(url, window.location.href).href;

      return {
        play(media, handlers) {
          const session = ++last;
          if (!sessions.size) returnTo = document.activeElement !== document.body ? document.activeElement : null;
          sessions.set(session, handlers || {});
          window.AndroidTV.play(JSON.stringify({
            ...media,
            session,
            url: absolute(media.url),
            alternate: media.alternate && { ...media.alternate, url: absolute(media.alternate.url) },
            subtitleTrack: media.subtitleTrack && { ...media.subtitleTrack, url: absolute(media.subtitleTrack.url) }
          }));
          return session;
        },
        notice(text) {
          window.AndroidTV.notice(String(text || ''));
        },
        stop() {
          window.AndroidTV.stop();
        }
      };
    })();

    // ── Remote control (TV app) ──────────────────────────────────────────────
    // The arrows move the focus to the nearest control that way, OK presses it
    // and Back (window.__tvBack, called by the app) closes what is open, then
    // goes to the home page. Cards that are not buttons are made focusable as
    // they appear; a window that opens takes the focus, and gives it back when
    // it closes.
    if (TV_APP) {
      const CLICKABLE = '.nav-item, .vod-card, .continue-card, .guide-result, .guide-track-note.retry, .guide-prog, .rec-episode, .library-row, .home-channel, .home-card, .home-poster, .group-item, .channel-item';
      const FOCUSABLE = `button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea, [tabindex]:not([tabindex="-1"]), ${CLICKABLE}`;
      const TYPING = /^(text|search|password|email|number|url|tel)$/;

      // The window on top (the last one opened), or the page
      const layer = () => {
        const open = document.querySelectorAll('.modal-overlay, .vod-player');
        return open.length ? open[open.length - 1] : document.body;
      };

      // On screen across (it may be scrolled away up or down) and not clipped
      // away by a panel slid aside. The containers are looked at once per key
      // (there may be a thousand channels in them).
      const shown = (el, boxes = new Map()) => {
        const r = el.getBoundingClientRect();
        if (!r.width || !r.height || r.right <= 0 || r.left >= window.innerWidth) return false;
        for (let parent = el.parentElement; parent && parent !== document.body; parent = parent.parentElement) {
          let box = boxes.get(parent);
          if (box === undefined) {
            const style = getComputedStyle(parent);
            box = style.visibility === 'hidden' ? 'hidden'
              : style.overflowX !== 'visible' ? parent.getBoundingClientRect()
              : null;
            boxes.set(parent, box);
          }
          if (box === 'hidden') return false;
          if (box && (r.right <= box.left + 1 || r.left >= box.right - 1)) return false;
        }
        return true;
      };

      const candidates = (scope) => {
        const boxes = new Map();
        return Array.from(scope.querySelectorAll(FOCUSABLE)).filter(el => shown(el, boxes));
      };

      const focusTrail = [];
      let focusedAt = null; // where the focused control was when focused
      document.addEventListener('focusin', (e) => {
        focusedAt = e.target.getBoundingClientRect();
        focusTrail.push(e.target);
        if (focusTrail.length > 50) focusTrail.shift();
      });

      const focusOn = (el) => {
        el.focus({ preventScroll: true });
        el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      };

      // Where the focus was last in this window (back from one opened over
      // it), or its first control, the content before the side menu
      const enter = (scope, returning) => {
        if (returning) {
          for (let i = focusTrail.length - 1; i >= 0; i--) {
            const el = focusTrail[i];
            if (el.isConnected && scope.contains(el) && shown(el)) return focusOn(el);
          }
        }
        // (not a text field: on a TV that opens the keyboard at once)
        const all = candidates(scope);
        const typing = (el) => (el.tagName === 'INPUT' && TYPING.test(el.type)) || el.tagName === 'TEXTAREA';
        const first = all.find(el => !el.closest('.nav-rail') && !typing(el)) || all.find(el => !el.closest('.nav-rail')) || all[0];
        if (first) focusOn(first);
      };

      // Gap along the way asked and offset across it, the offset counting more
      const distance = (a, b, way) => {
        const across = (lo1, hi1, lo2, hi2) => Math.max(0, lo2 - hi1, lo1 - hi2);
        switch (way) {
          case 'ArrowRight': return b.left < a.right - 2 && b.left <= a.left ? null : [Math.max(0, b.left - a.right), across(a.top, a.bottom, b.top, b.bottom)];
          case 'ArrowLeft': return b.right > a.left + 2 && b.right >= a.right ? null : [Math.max(0, a.left - b.right), across(a.top, a.bottom, b.top, b.bottom)];
          case 'ArrowDown': return b.top < a.bottom - 2 && b.top <= a.top ? null : [Math.max(0, b.top - a.bottom), across(a.left, a.right, b.left, b.right)];
          default: return b.bottom > a.top + 2 && b.bottom >= a.bottom ? null : [Math.max(0, a.top - b.bottom), across(a.left, a.right, b.left, b.right)];
        }
      };

      // The control nearest to a place (the side menu last)
      const nearest = (rect) => {
        const centre = (r) => [r.left + r.width / 2, r.top + r.height / 2];
        const [x, y] = centre(rect);
        let best = null;
        let bestScore = Infinity;
        for (const one of candidates(layer())) {
          const [cx, cy] = centre(one.getBoundingClientRect());
          const score = Math.hypot(cx - x, cy - y) + (one.closest('.nav-rail') ? 400 : 0);
          if (score < bestScore) { bestScore = score; best = one; }
        }
        if (best) focusOn(best);
      };

      const move = (way) => {
        const scope = layer();
        const current = document.activeElement;
        if (!current || current === document.body || !scope.contains(current)) return enter(scope);
        if (!shown(current)) return nearest(focusedAt || current.getBoundingClientRect());

        const a = current.getBoundingClientRect();
        let best = null;
        let bestScore = Infinity;
        for (const el of candidates(scope)) {
          if (el === current || el.contains(current) || current.contains(el)) continue;
          const d = distance(a, el.getBoundingClientRect(), way);
          if (!d) continue;
          const score = d[0] + d[1] * 3 + (d[1] > 0 ? 40 : 0);
          if (score < bestScore) { bestScore = score; best = el; }
        }
        if (best) focusOn(best);
      };

      // After OK or Back the focused control may have gone or slid away (a
      // panel of channels over the groups): the nearest one to where it was
      const settle = () => {
        const el = document.activeElement;
        const was = el && el !== document.body ? el.getBoundingClientRect() : null;
        setTimeout(() => {
          const now = document.activeElement;
          if (now && now !== document.body && shown(now) && layer().contains(now)) return;
          if (was) nearest(was);
          else enter(layer());
        }, 450);
      };

      document.addEventListener('keydown', (e) => {
        const el = document.activeElement;
        const typing = el && ((el.tagName === 'INPUT' && TYPING.test(el.type)) || el.tagName === 'TEXTAREA');
        const ranged = el && el.tagName === 'INPUT' && el.type === 'range';

        if (e.key.startsWith('Arrow')) {
          // The caret (or the slider) moves left and right in its field
          if ((typing || ranged) && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
          if (el && el.tagName === 'SELECT') return;
          e.preventDefault();
          e.stopPropagation();
          move(e.key);
        } else if (e.key === 'Enter' && !typing) {
          settle();
          if (el && el.matches && el.matches(CLICKABLE)) {
            e.preventDefault();
            e.stopPropagation();
            el.click();
          }
        }
      }, true);

      window.__tvFocusFirst = () => enter(layer());

      window.__tvBack = () => {
        const el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) { el.blur(); return true; }
        settle();

        // A panel slid over another one (channels over the groups) goes back
        const panelBack = document.querySelector('.back-arrow-btn');
        if (layer() === document.body && panelBack && shown(panelBack)) {
          panelBack.click();
          return true;
        }

        const scope = layer();
        if (scope !== document.body) {
          const close = scope.querySelector('.cast-close, .vod-back, button[title="Close"], button[title^="Close "], button[title="Stop and close"]');
          if (close && shown(close)) close.click();
          else if (scope.classList.contains('modal-overlay')) scope.click();
          return true;
        }

        const navs = document.querySelectorAll('.nav-item');
        const active = document.querySelector('.nav-item.active');
        if (navs.length && active && active !== navs[0]) {
          navs[0].click();
          return true;
        }
        return false;
      };

      // Cards made focusable, and a new window given the focus
      let scheduled = false;
      let lastLayer = null;
      new MutationObserver(() => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          document.querySelectorAll(CLICKABLE).forEach(el => { if (!el.hasAttribute('tabindex')) el.tabIndex = 0; });
          const scope = layer();
          if (scope !== lastLayer) {
            const closed = lastLayer && !lastLayer.isConnected;
            lastLayer = scope;
            if (!scope.contains(document.activeElement)) enter(scope, closed);
          } else if (!document.activeElement || document.activeElement === document.body) {
            enter(scope);
          }
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ICONS (stroke icons, 24x24)
    // ═══════════════════════════════════════════════════════════════════════

    const ICONS = {
      tv: <React.Fragment><rect x="2" y="7" width="20" height="15" rx="2.5" /><polyline points="17 2 12 7 7 2" /></React.Fragment>,
      film: <React.Fragment><rect x="2" y="2" width="20" height="20" rx="3" /><line x1="7" y1="2" x2="7" y2="22" /><line x1="17" y1="2" x2="17" y2="22" /><line x1="2" y1="12" x2="22" y2="12" /><line x1="2" y1="7" x2="7" y2="7" /><line x1="2" y1="17" x2="7" y2="17" /><line x1="17" y1="17" x2="22" y2="17" /><line x1="17" y1="7" x2="22" y2="7" /></React.Fragment>,
      layers: <React.Fragment><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></React.Fragment>,
      calendar: <React.Fragment><rect x="3" y="4" width="18" height="18" rx="3" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></React.Fragment>,
      search: <React.Fragment><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></React.Fragment>,
      sliders: <React.Fragment><line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" /><line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" /><line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" /><line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="17" y1="16" x2="23" y2="16" /></React.Fragment>,
      droplet: <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />,
      lock: <React.Fragment><rect x="3" y="11" width="18" height="11" rx="2.5" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></React.Fragment>,
      shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
      logout: <React.Fragment><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></React.Fragment>,
      play: <polygon points="6 3 20 12 6 21 6 3" />,
      pause: <React.Fragment><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></React.Fragment>,
      next: <React.Fragment><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" y1="5" x2="19" y2="19" /></React.Fragment>,
      volume: <React.Fragment><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" /></React.Fragment>,
      mute: <React.Fragment><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></React.Fragment>,
      maximize: <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />,
      minimize: <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />,
      pip: <React.Fragment><rect x="2" y="4" width="20" height="16" rx="2.5" /><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none" /></React.Fragment>,
      x: <React.Fragment><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></React.Fragment>,
      back: <React.Fragment><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></React.Fragment>,
      left: <polyline points="15 18 9 12 15 6" />,
      right: <polyline points="9 18 15 12 9 6" />,
      download: <React.Fragment><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></React.Fragment>,
      info: <React.Fragment><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></React.Fragment>,
      refresh: <React.Fragment><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></React.Fragment>,
      rewind: <React.Fragment><polygon points="11 19 2 12 11 5 11 19" /><polygon points="22 19 13 12 22 5 22 19" /></React.Fragment>,
      cc: <React.Fragment><rect x="2" y="5" width="20" height="14" rx="3" /><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6" /></React.Fragment>,
      box: <React.Fragment><polyline points="21 8 21 21 3 21 3 8" /><rect x="1" y="3" width="22" height="5" rx="1" /><line x1="10" y1="12" x2="14" y2="12" /></React.Fragment>,
      scissors: <React.Fragment><circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><line x1="20" y1="4" x2="8.12" y2="15.88" /><line x1="14.47" y1="14.48" x2="20" y2="20" /><line x1="8.12" y1="8.12" x2="12" y2="12" /></React.Fragment>,
      trash: <React.Fragment><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></React.Fragment>,
      menu: <React.Fragment><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="18" x2="21" y2="18" /></React.Fragment>,
      down: <polyline points="6 9 12 15 18 9" />,
      star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
      home: <React.Fragment><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z" /></React.Fragment>,
      compass: <React.Fragment><circle cx="12" cy="12" r="10" /><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></React.Fragment>,
      grid: <React.Fragment><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></React.Fragment>,
      cast: <React.Fragment><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" /><line x1="2" y1="20" x2="2.01" y2="20" /></React.Fragment>,
      link: <React.Fragment><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></React.Fragment>,
      external: <React.Fragment><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></React.Fragment>
    };

    // Language of the app's texts and of film and episode details read from
    // outside ('en' or 'pt'); details fall back to the other language when missing
    const APP_LANGUAGE = 'en';

    function metadataText(metadata) {
      const text = (metadata && metadata.text) || {};
      const chosen = text[APP_LANGUAGE] || {};
      const other = text[APP_LANGUAGE === 'pt' ? 'en' : 'pt'] || {};
      const pick = (field) => (chosen[field] && chosen[field].length ? chosen[field] : other[field]);
      return {
        title: pick('title') || '',
        showTitle: pick('showTitle') || '',
        overview: pick('overview') || '',
        genres: pick('genres') || [],
        poster: pick('poster') || (metadata && metadata.poster) || '',
        cast: pick('cast') || ''
      };
    }

    // "Dinoster · S1 E24 · In the Clutches of Bex Hunter" or "Film (2024)"
    function metadataLine(metadata) {
      const text = metadataText(metadata);
      if (metadata.kind === 'episode') {
        const number = metadata.season ? `S${metadata.season} E${metadata.episode}` : '';
        return [text.showTitle, number, text.title].filter(Boolean).join(' · ');
      }
      return `${text.title}${metadata.year ? ` (${metadata.year})` : ''}`;
    }

    function Icon({ name, size = 20, filled = false }) {
      return (
        <svg
          className="icon"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill={filled ? 'currentColor' : 'none'}
          stroke="currentColor"
          strokeWidth={filled ? 0 : 2}
          strokeLinecap="round"
          strokeLinejoin="round"
          aria-hidden="true"
        >
          {ICONS[name]}
        </svg>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // FAVOURITES (channels, video club, series, Discover), kept on the server
    // ═══════════════════════════════════════════════════════════════════════

    // One list shared by every section; a star changes it everywhere at once
    const favoriteStore = { list: [], loaded: false, loading: null, listeners: new Set() };

    function setFavorites(list) {
      favoriteStore.list = list;
      favoriteStore.loaded = true;
      favoriteStore.listeners.forEach(listener => listener(list));
    }

    function loadFavorites() {
      if (!favoriteStore.loading) {
        favoriteStore.loading = api.dashboard()
          .then(data => { if (data.success) setFavorites(data.favorites); })
          .catch(() => {})
          .finally(() => { favoriteStore.loading = null; });
      }
      return favoriteStore.loading;
    }

    function useFavorites() {
      const [list, setList] = useState(favoriteStore.list);
      useEffect(() => {
        favoriteStore.listeners.add(setList);
        if (!favoriteStore.loaded) loadFavorites();
        return () => favoriteStore.listeners.delete(setList);
      }, []);

      const has = (key) => list.some(favorite => favorite.key === key);

      // favorite: { type, id, name, image, data }; shown at once, then as the server keeps it
      const toggle = async (favorite) => {
        const key = `${favorite.type}:${favorite.id}`;
        const was = favoriteStore.list.some(f => f.key === key);
        setFavorites(was ? favoriteStore.list.filter(f => f.key !== key) : [{ ...favorite, key }, ...favoriteStore.list]);
        try {
          const data = was ? await api.removeFavorite(key) : await api.addFavorite(favorite);
          if (data.success) setFavorites(data.favorites);
        } catch (_) {}
      };

      return { list, has, toggle };
    }

    function FavoriteButton({ favorite, size = 18 }) {
      const { has, toggle } = useFavorites();
      const on = has(`${favorite.type}:${favorite.id}`);
      return (
        <button
          className={`fav-btn ${on ? 'on' : ''}`}
          title={on ? 'Remove from favourites' : 'Add to favourites'}
          onClick={(e) => { e.stopPropagation(); toggle(favorite); }}
        >
          <Icon name="star" size={size} filled={on} />
        </button>
      );
    }

    // What is kept of a video club or series title to open it again (short texts)
    const favoriteItem = (item) => Object.fromEntries(Object.entries(item)
      .filter(([, value]) => value === null || ['string', 'number', 'boolean'].includes(typeof value))
      .map(([name, value]) => [name, typeof value === 'string' ? value.slice(0, name === 'description' ? 500 : 300) : value]));

    // ═══════════════════════════════════════════════════════════════════════
    // PLAYER CONTROLS - transparent overlay shared by TV, recordings and films
    // ═══════════════════════════════════════════════════════════════════════
    //   live      no progress bar, shows a LIVE badge
    //   seek      { position, duration, onSeek } when the caller owns seeking
    //             (recordings); otherwise the video element's own timeline is used
    //   children  extra buttons shown after the play button

    //   captions  { on, onToggle } when the title has subtitles to show

    // programme (live only): { start, stop } in seconds, shown as a bar of how
    // much of the programme on air has gone by
    function PlayerControls({ videoRef, title, subtitle, meta, live, seek, captions, programme, onClose, children }) {
      const [playing, setPlaying] = useState(false);
      const [time, setTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(1);
      const [muted, setMuted] = useState(false);
      const [fullscreen, setFullscreen] = useState(false);
      const [idle, setIdle] = useState(false);
      const [draft, setDraft] = useState(null);
      const shellRef = useRef(null);
      const idleTimer = useRef(null);

      const position = seek ? seek.position : time;
      const total = seek ? seek.duration : duration;

      // The programme bar moves on by itself
      const [now, setNow] = useState(() => Date.now() / 1000);
      useEffect(() => {
        if (!programme) return;
        setNow(Date.now() / 1000);
        const timer = setInterval(() => setNow(Date.now() / 1000), 15000);
        return () => clearInterval(timer);
      }, [programme && programme.start, programme && programme.stop]);
      const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const programmeDone = programme && programme.stop > programme.start
        ? Math.min(100, Math.max(0, ((now - programme.start) / (programme.stop - programme.start)) * 100))
        : 0;

      const formatTime = (seconds) => {
        const s = Math.max(0, Math.floor(seconds || 0));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const pad = (n) => String(n).padStart(2, '0');
        return h > 0 ? `${h}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`;
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const sync = () => { setPlaying(!video.paused); setVolume(video.volume); setMuted(video.muted); };
        const onTime = () => {
          setTime(Math.floor(video.currentTime));
          setDuration(isFinite(video.duration) ? video.duration : 0);
        };
        const stateEvents = ['play', 'pause', 'playing', 'volumechange'];
        const timeEvents = ['timeupdate', 'durationchange', 'loadedmetadata'];

        stateEvents.forEach(e => video.addEventListener(e, sync));
        timeEvents.forEach(e => video.addEventListener(e, onTime));
        sync();

        return () => {
          stateEvents.forEach(e => video.removeEventListener(e, sync));
          timeEvents.forEach(e => video.removeEventListener(e, onTime));
        };
      }, []);

      const container = () => shellRef.current && shellRef.current.parentElement;

      const togglePlay = () => {
        const video = videoRef.current;
        if (!video) return;
        // Remembered so automatic buffering never resumes a stream the viewer paused
        video._userPaused = !video.paused;
        if (video.paused) video.play().catch(() => {}); else video.pause();
      };

      const toggleMute = () => {
        const video = videoRef.current;
        if (video) video.muted = !video.muted;
      };

      const changeVolume = (value) => {
        const video = videoRef.current;
        if (!video) return;
        video.volume = value;
        video.muted = value === 0;
      };

      const toggleFullscreen = () => {
        const el = container();
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el?.requestFullscreen) el.requestFullscreen();
        // iPhone only puts the video element itself in fullscreen
        else videoRef.current?.webkitEnterFullscreen?.();
      };

      const togglePip = () => {
        const video = videoRef.current;
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else video?.requestPictureInPicture?.().catch(() => {});
      };

      const seekTo = (target) => {
        if (seek) seek.onSeek(target);
        else if (videoRef.current) videoRef.current.currentTime = Math.min(Math.max(0, target), total || target);
      };

      const commitDraft = () => {
        if (draft === null) return;
        seekTo(draft);
        setDraft(null);
      };

      // Controls fade out while playing with no pointer activity
      useEffect(() => {
        const el = container();
        if (!el) return;

        const wake = () => {
          setIdle(false);
          clearTimeout(idleTimer.current);
          idleTimer.current = setTimeout(() => setIdle(true), 3000);
        };
        const onFullscreen = () => setFullscreen(!!document.fullscreenElement);

        el.addEventListener('mousemove', wake);
        el.addEventListener('touchstart', wake);
        document.addEventListener('fullscreenchange', onFullscreen);
        wake();

        return () => {
          clearTimeout(idleTimer.current);
          el.removeEventListener('mousemove', wake);
          el.removeEventListener('touchstart', wake);
          document.removeEventListener('fullscreenchange', onFullscreen);
        };
      }, []);

      // Keyboard: space/k play, f fullscreen, m mute, arrows skip
      useEffect(() => {
        const onKey = (e) => {
          if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
          if (document.querySelector('.modal-overlay')) return;

          if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
          else if (e.key === 'f') toggleFullscreen();
          else if (e.key === 'm') toggleMute();
          else if (e.key === 'c' && captions) captions.onToggle();
          else if (!live && e.key === 'ArrowLeft') seekTo(position - 10);
          else if (!live && e.key === 'ArrowRight') seekTo(position + 10);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      const shown = draft ?? position;
      const level = muted ? 0 : volume;

      return (
        <div ref={shellRef} className={`pc ${idle && playing ? 'idle' : ''}`}>
          <div className="pc-surface" onClick={togglePlay} onDoubleClick={toggleFullscreen}></div>

          <div className="pc-top">
            {document.pictureInPictureEnabled && (
              <button className="pc-round" title="Picture in picture" onClick={togglePip}><Icon name="pip" /></button>
            )}
            <button className="pc-round" title="Fullscreen (f)" onClick={toggleFullscreen}>
              <Icon name={fullscreen ? 'minimize' : 'maximize'} />
            </button>
            {onClose && <button className="pc-round" title="Close" onClick={onClose}><Icon name="x" /></button>}
          </div>

          <div className="pc-bottom">
            <div className="pc-title">{title}</div>
            {subtitle && <div className="pc-subtitle">{subtitle}</div>}
            {meta && <div className="pc-meta">{meta}</div>}

            {live && programme && (
              <div className="pc-programme">
                <span>{clock(programme.start)}</span>
                <div className="pc-programme-bar"><span style={{ width: `${programmeDone}%` }}></span></div>
                <span>{clock(programme.stop)}</span>
              </div>
            )}

            {!live && total > 0 && (
              <input
                type="range"
                className="pc-seek"
                min="0"
                max={Math.floor(total)}
                step="1"
                value={Math.min(shown, total)}
                style={{ '--progress': `${Math.min(100, (shown / total) * 100)}%` }}
                onChange={(e) => setDraft(Number(e.target.value))}
                onMouseUp={commitDraft}
                onTouchEnd={commitDraft}
                onKeyUp={commitDraft}
              />
            )}

            <div className="pc-row">
              <button className="pc-play" title={playing ? 'Pause (space)' : 'Play (space)'} onClick={togglePlay}>
                <Icon name={playing ? 'pause' : 'play'} size={22} filled />
              </button>
              {!live && !seek && (
                <React.Fragment>
                  <button className="pc-pill" onClick={() => seekTo(position - 10)}>−10 s</button>
                  <button className="pc-pill" onClick={() => seekTo(position + 30)}>+30 s</button>
                </React.Fragment>
              )}
              {children}

              <div className="pc-spacer"></div>

              {captions && (
                <button
                  className={`pc-icon ${captions.on ? 'on' : ''}`}
                  title={captions.on ? 'Hide subtitles (c)' : 'Show subtitles (c)'}
                  onClick={captions.onToggle}
                >
                  <Icon name="cc" size={22} />
                </button>
              )}
              <button className="pc-icon" title="Mute (m)" onClick={toggleMute}>
                <Icon name={level === 0 ? 'mute' : 'volume'} size={22} />
              </button>
              <input
                type="range"
                className="pc-volume"
                min="0"
                max="1"
                step="0.05"
                value={level}
                style={{ '--progress': `${level * 100}%` }}
                onChange={(e) => changeVolume(Number(e.target.value))}
              />
              <span className="pc-time">
                {live ? <span className="pc-live">LIVE</span> : `${formatTime(shown)} / ${formatTime(total)}`}
              </span>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VIDEO CLUB & SERIES BROWSER
    // ═══════════════════════════════════════════════════════════════════════

    const POSTER_FALLBACK = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect fill="%231a1f2e" width="200" height="300"/><text x="100" y="160" text-anchor="middle" fill="%235b7cff" font-size="48">🎬</text></svg>';

    function VodCard({ item, onOpen }) {
      return (
        <div className="vod-card" onClick={() => onOpen(item)} title={item.name}>
          <img
            src={item.poster || POSTER_FALLBACK}
            alt=""
            loading="lazy"
            onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }}
          />
          <div className="vod-card-info">
            <div className="vod-card-name">{item.name}</div>
            <div className="vod-card-meta">
              {[item.year, item.rating ? `★ ${item.rating}` : ''].filter(Boolean).join(' · ')}
            </div>
          </div>
        </div>
      );
    }

    function VodRow({ title, row, onOpen, onSeeAll }) {
      const scroller = useRef(null);
      const scrollBy = (direction) => {
        const el = scroller.current;
        if (el) el.scrollBy({ left: direction * el.clientWidth * 0.85, behavior: 'smooth' });
      };

      if (row && row.items.length === 0) return null;

      return (
        <div className="vod-row">
          <div className="vod-row-header">
            <h3>{title}</h3>
            {row && <button onClick={onSeeAll}>See all{row.total ? ` (${row.total})` : ''}</button>}
          </div>
          <div className="vod-row-body">
            <button className="vod-row-arrow left" onClick={() => scrollBy(-1)}><Icon name="left" /></button>
            <div className="vod-row-scroller" ref={scroller}>
              {row
                ? row.items.map(item => <VodCard key={item.id} item={item} onOpen={onOpen} />)
                : Array.from({ length: 8 }, (_, i) => <div key={i} className="vod-card skeleton"></div>)}
            </div>
            <button className="vod-row-arrow right" onClick={() => scrollBy(1)}><Icon name="right" /></button>
          </div>
        </div>
      );
    }

    // Titles in progress, kept in this browser: newest first
    const CONTINUE_KEY = 'vod:continue';
    const readContinue = () => {
      try { return JSON.parse(localStorage.getItem(CONTINUE_KEY)) || []; } catch (_) { return []; }
    };
    const writeContinue = (list) => {
      try { localStorage.setItem(CONTINUE_KEY, JSON.stringify(list.slice(0, 30))); } catch (_) {}
    };

    // The portal serves TMDB-style poster paths; ask for a larger rendition for the hero
    const largePoster = (url) => (url || '').replace(/\/t\/p\/[^/]+\//, '/t/p/w780/');

    // type: 'vod' (video club) or 'series'
    // intent: { play: continue entry } or { open: item } from the dashboard, handled once
    function VodBrowser({ type, intent, onIntentDone }) {
      const isSeries = type === 'series';
      const sectionTitle = isSeries ? 'Series' : 'Video Club';

      const [categories, setCategories] = useState([]);
      const [rows, setRows] = useState({});          // category id -> { items, total }
      const [error, setError] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [grid, setGrid] = useState(null);        // { title, category?, search?, items, total, page, pageSize, loading }
      const [detail, setDetail] = useState(null);
      const [seasons, setSeasons] = useState(null);
      const [seasonIndex, setSeasonIndex] = useState(0);
      const [detailError, setDetailError] = useState('');
      const [busy, setBusy] = useState(false);
      const [playing, setPlaying] = useState(null);  // { title, subtitle, streamUrl, key, entry, next }
      const [playerError, setPlayerError] = useState('');
      const [heroIndex, setHeroIndex] = useState(0);
      const [continueList, setContinueList] = useState(() => readContinue().filter(e => e.type === type));
      const [hasCaptions, setHasCaptions] = useState(false);
      const [captionsOn, setCaptionsOn] = useState(() => {
        try { return localStorage.getItem('vod:captions') !== 'off'; } catch (_) { return true; }
      });
      const textTrackRef = useRef(null);
      const recoveryRef = useRef({ attempts: 0, resumeAt: null, stallTimer: null, lastGood: 0 });
      const videoRef = useRef(null);
      const gridRequest = useRef(0);
      const lastSaved = useRef(0);

      const pad2 = (n) => String(n).padStart(2, '0');

      // Home: categories, then one row per category, loaded one after the other
      useEffect(() => {
        let cancelled = false;

        (async () => {
          try {
            const data = await api.vodCategories(type);
            if (!data.success) throw new Error(data.error || 'Failed to load categories');
            if (cancelled) return;

            const all = [{ id: '*', title: 'Recently added' }, ...data.categories];
            setCategories(all);

            for (const category of all) {
              const list = await api.vodList(type, { category: category.id, page: 1 });
              if (cancelled) return;
              setRows(prev => ({
                ...prev,
                [category.id]: list.success ? { items: list.items, total: list.total } : { items: [], total: 0 }
              }));
            }
          } catch (err) {
            if (!cancelled) setError(err.message || 'Failed to load');
          }
        })();

        return () => { cancelled = true; };
      }, [type]);

      const loadGridPage = async (spec, page, previous) => {
        const requestId = ++gridRequest.current;
        setGrid({ ...spec, items: previous, page: page - 1, loading: true, error: '' });

        let data;
        try {
          data = await api.vodList(type, { category: spec.category, search: spec.search, page });
        } catch (err) {
          data = { success: false, error: 'Failed to load titles' };
        }
        if (gridRequest.current !== requestId) return;

        if (!data.success) {
          setGrid({ ...spec, items: previous, page: page - 1, loading: false, error: data.error });
          return;
        }

        setGrid({
          ...spec,
          items: previous.concat(data.items),
          total: data.total,
          pageSize: data.pageSize,
          page,
          loading: false,
          error: ''
        });
      };

      const openGrid = (spec) => loadGridPage({ ...spec, total: 0, pageSize: 14 }, 1, []);

      const closeGrid = () => {
        gridRequest.current++;
        setGrid(null);
        setSearchTerm('');
      };

      const gridHasMore = grid && !grid.loading && grid.page * grid.pageSize < grid.total;

      const handleGridScroll = (e) => {
        const el = e.currentTarget;
        if (gridHasMore && el.scrollTop + el.clientHeight > el.scrollHeight - 600) {
          loadGridPage(grid, grid.page + 1, grid.items);
        }
      };

      // Search by name, as the user types
      useEffect(() => {
        const term = searchTerm.trim();

        if (term.length < 2) {
          if (grid && grid.search) { gridRequest.current++; setGrid(null); }
          return;
        }

        const timer = setTimeout(() => openGrid({ title: `Results for "${term}"`, search: term }), 400);
        return () => clearTimeout(timer);
      }, [searchTerm]);

      const openDetail = async (item) => {
        setDetail(item);
        setDetailError('');
        setSeasons(null);
        setSeasonIndex(0);

        if (!isSeries) return;

        try {
          const data = await api.vodSeasons(item.id);
          if (!data.success) throw new Error(data.error || 'Failed to load seasons');
          setSeasons(data.seasons);
        } catch (err) {
          setSeasons([]);
          setDetailError(err.message);
        }
      };

      const positionKey = (item, season, episode) =>
        `vodpos:${type}:${item.id}:${season ? `${season.id}:${episode}` : ''}`;

      const savedPosition = (item, season, episode) => {
        try { return Number(localStorage.getItem(positionKey(item, season, episode))) || 0; } catch (_) { return 0; }
      };

      const requestTitle = async (item, season, episode) => {
        const fileTitle = season
          ? `${item.name} - ${season.name} E${pad2(episode)}`
          : `${item.name}${item.year && !item.name.includes(item.year) ? ` (${item.year})` : ''}`;

        const data = await api.vodStream(type, {
          cmd: season ? season.cmd : item.cmd,
          episode: season ? episode : undefined,
          title: fileTitle
        });
        if (!data.success) throw new Error(data.error || 'This title is not available');

        const following = season ? season.episodes[season.episodes.indexOf(episode) + 1] : undefined;

        return {
          title: item.name,
          subtitle: season
            ? `${season.name} • Episode ${episode}`
            : [item.year, item.minutes ? `${Math.floor(item.minutes / 60)}h ${pad2(item.minutes % 60)}m` : ''].filter(Boolean).join(' • '),
          streamUrl: data.streamUrl,
          key: positionKey(item, season, episode),
          entry: {
            type,
            item: { id: item.id, name: item.name, poster: item.poster, year: item.year, minutes: item.minutes, cmd: item.cmd },
            season: season ? { id: season.id, name: season.name, cmd: season.cmd, episodes: season.episodes } : null,
            episode: season ? episode : null
          },
          next: following !== undefined ? { item, season, episode: following } : null
        };
      };

      // In the TV app the title plays in the app's own player
      const playNatively = (title) => {
        let saved = 0;
        try { saved = Number(localStorage.getItem(title.key)) || 0; } catch (_) {}
        nativePlayer.play({
          url: `${BACKEND_ORIGIN}${title.streamUrl}`,
          title: title.title,
          subtitle: title.subtitle,
          startAt: saved > 30 ? saved : 0,
          next: title.next ? 'Next episode' : ''
        }, {
          onPosition: (position, duration) => rememberPosition(title, position, duration),
          onNext: () => title.next && playTitle(title.next.item, title.next.season, title.next.episode),
          onClose: () => setContinueList(readContinue().filter(e => e.type === type))
        });
      };

      const playTitle = async (item, season, episode) => {
        if (busy) return;
        setBusy(true);
        setDetailError('');
        try {
          setPlayerError('');
          lastSaved.current = 0;
          const title = await requestTitle(item, season, episode);
          if (TV_APP) playNatively(title);
          else setPlaying(title);
        } catch (err) {
          if (detail) setDetailError(err.message); else setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      // Opened from the dashboard: play where it was left, or show the title
      useEffect(() => {
        if (!intent) return;
        if (intent.play) playTitle(intent.play.item, intent.play.season, intent.play.episode);
        else if (intent.open) openDetail(intent.open);
        if (onIntentDone) onIntentDone();
      }, [intent]);

      const downloadTitle = async (item, season, episode) => {
        if (busy) return;
        setBusy(true);
        setDetailError('');
        try {
          const title = await requestTitle(item, season, episode);
          const link = document.createElement('a');
          link.href = `${BACKEND_ORIGIN}${title.streamUrl}?download=1`;
          link.download = '';
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (err) {
          setDetailError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const closePlayer = () => {
        const video = videoRef.current;
        if (video) {
          video.pause();
          video.removeAttribute('src');
          video.load();
        }
        if (document.fullscreenElement) document.exitFullscreen();
        setPlaying(null);
        setContinueList(readContinue().filter(e => e.type === type));
      };

      // A dropped connection must not end the film: load it again at the same point
      const MAX_RECOVERIES = 4;

      const recoverPlayback = (reason) => {
        const video = videoRef.current;
        const recovery = recoveryRef.current;
        if (!video || !playing) return;

        clearTimeout(recovery.stallTimer);

        // A minute of good playback since the last problem: start counting again
        if (Date.now() - recovery.lastGood > 60000) recovery.attempts = 0;

        if (recovery.attempts >= MAX_RECOVERIES) {
          setPlayerError(reason === 'decode'
            ? 'This title cannot be played by this browser. Close the player and download it instead.'
            : 'The connection to this title was lost. Close the player and try again.');
          return;
        }

        recovery.attempts++;
        recovery.lastGood = Date.now();
        recovery.resumeAt = video.currentTime;
        setPlayerError(`Reconnecting... (${recovery.attempts}/${MAX_RECOVERIES})`);

        setTimeout(() => {
          if (videoRef.current !== video) return;
          video.load();
          video.play().catch(() => {});
        }, recovery.attempts * 800);
      };

      const handleVideoError = (e) => {
        const code = e.currentTarget.error ? e.currentTarget.error.code : 0;
        recoverPlayback(code === 3 || code === 4 ? 'decode' : 'network');
      };

      // Stuck waiting for data for a while counts as a lost connection too
      const handleWaiting = () => {
        const recovery = recoveryRef.current;
        clearTimeout(recovery.stallTimer);
        recovery.stallTimer = setTimeout(() => {
          const video = videoRef.current;
          if (video && !video.paused && video.readyState < 3) recoverPlayback('stalled');
        }, 12000);
      };

      const handlePlaying = () => {
        clearTimeout(recoveryRef.current.stallTimer);
        setPlayerError('');
      };

      useEffect(() => {
        recoveryRef.current.attempts = 0;
        recoveryRef.current.resumeAt = null;
        return () => clearTimeout(recoveryRef.current.stallTimer);
      }, [playing && playing.streamUrl]);

      // Leaving the section with a film open must end its download too: a video
      // element that is merely removed from the page keeps its connection
      React.useLayoutEffect(() => () => {
        const video = videoRef.current;
        if (video) {
          video.pause();
          video.removeAttribute('src');
          video.load();
        }
      }, []);

      // Continue where the viewer left off
      const handleLoadedMetadata = (e) => {
        const video = e.currentTarget;

        if (recoveryRef.current.resumeAt !== null) {
          video.currentTime = recoveryRef.current.resumeAt;
          recoveryRef.current.resumeAt = null;
          return;
        }

        let saved = 0;
        try { saved = Number(localStorage.getItem(playing.key)) || 0; } catch (_) {}
        if (saved > 30 && (!isFinite(video.duration) || saved < video.duration - 60)) {
          video.currentTime = saved;
        }
      };

      // Remember the position, and keep the "Continue Watching" list up to date
      const rememberPosition = (title, seconds, length) => {
        const position = Math.floor(seconds);
        const duration = isFinite(length) ? Math.floor(length) : 0;
        const finished = duration > 0 && position > duration - 90;
        const others = readContinue().filter(entry => entry.key !== title.key);

        try {
          if (finished) localStorage.removeItem(title.key);
          else localStorage.setItem(title.key, String(position));
        } catch (_) {}

        writeContinue(finished || position < 30
          ? others
          : [{ ...title.entry, key: title.key, position, duration, updatedAt: Date.now() }, ...others]);
      };

      const handleTimeUpdate = (e) => {
        const video = e.currentTarget;
        if (Math.abs(video.currentTime - lastSaved.current) < 5) return;
        lastSaved.current = video.currentTime;
        rememberPosition(playing, video.currentTime, video.duration);
      };

      // Subtitles embedded in the file are found by the server as the film is
      // read; ask for the new lines every few seconds and hand them to the video
      useEffect(() => {
        setHasCaptions(false);
        textTrackRef.current = null;
        if (!playing) return;

        const video = videoRef.current;
        if (!video) return;

        let cancelled = false;
        let timer = null;
        let received = 0;

        const poll = async () => {
          let again = 3000;

          try {
            const response = await fetch(`${BACKEND_ORIGIN}${playing.streamUrl}/cues?after=${received}`);
            const data = await response.json();
            if (cancelled) return;

            if (!data.success || data.status === 'none') return;

            if (data.status === 'ready') {
              if (!textTrackRef.current) {
                textTrackRef.current = video.addTextTrack('subtitles', 'Subtitles', data.language === 'por' ? 'pt' : (data.language || 'und'));
                textTrackRef.current.mode = captionsOn ? 'showing' : 'hidden';
                setHasCaptions(true);
              }

              data.cues.forEach(line => {
                const cue = new VTTCue(line.start, line.end, line.text);
                // Bottom edge at 84% of the picture: clear of the control bar
                cue.snapToLines = false;
                cue.line = 84;
                cue.lineAlign = 'end';
                textTrackRef.current.addCue(cue);
              });
              received += data.cues.length;

              if (data.complete && data.cues.length === 0) return;
            } else {
              again = 1500; // still looking for the track
            }
          } catch (err) {
            if (cancelled) return;
          }

          timer = setTimeout(poll, again);
        };

        poll();
        return () => { cancelled = true; clearTimeout(timer); };
      }, [playing && playing.streamUrl]);

      const toggleCaptions = () => {
        const next = !captionsOn;
        setCaptionsOn(next);
        if (textTrackRef.current) textTrackRef.current.mode = next ? 'showing' : 'hidden';
        try { localStorage.setItem('vod:captions', next ? 'on' : 'off'); } catch (_) {}
      };

      const forgetContinue = (entry) => {
        writeContinue(readContinue().filter(e => e.key !== entry.key));
        try { localStorage.removeItem(entry.key); } catch (_) {}
        setContinueList(list => list.filter(e => e.key !== entry.key));
      };

      // Escape closes the innermost layer
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'Escape' || document.fullscreenElement) return;
          if (playing) closePlayer();
          else if (detail) setDetail(null);
          else if (grid) closeGrid();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [playing, detail, grid]);

      const heroRow = categories.slice(1).map(c => rows[c.id]).find(r => r && r.items.length) || rows['*'];
      const heroItems = heroRow ? heroRow.items.slice(0, 6) : [];
      const hero = heroItems[heroIndex % Math.max(heroItems.length, 1)];
      const season = seasons && seasons[seasonIndex];

      // The hero rotates through the first titles while nothing else is open
      useEffect(() => {
        if (heroItems.length < 2 || grid || detail || playing) return;
        const timer = setInterval(() => setHeroIndex(i => (i + 1) % heroItems.length), 9000);
        return () => clearInterval(timer);
      }, [heroItems.length, !!grid, !!detail, !!playing]);

      const meta = (item) => [
        item.year,
        item.minutes ? `${Math.floor(item.minutes / 60)}h ${pad2(item.minutes % 60)}m` : '',
        item.rating ? `★ ${item.rating}` : '',
        item.hd ? 'HD' : ''
      ].filter(Boolean);

      const genreLine = (item) => (item.genres || '').split(',').map(g => g.trim()).filter(Boolean).slice(0, 3).join(' • ');

      return (
        <div className="vod-browser">
          <div className={`vod-topbar ${grid ? 'solid' : ''}`}>
            {grid && <button className="vod-back" onClick={closeGrid} title="Back"><Icon name="back" /></button>}
            <h2>{grid ? grid.title : sectionTitle}</h2>
            <div className="search-container vod-search">
              <span className="search-icon"><Icon name="search" size={16} /></span>
              <input
                type="text"
                className="search-input"
                placeholder={isSeries ? 'Search series by name...' : 'Search films by name...'}
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>
          </div>

          {grid ? (
            <div className="vod-scroll with-topbar" onScroll={handleGridScroll}>
              {grid.total > 0 && <div className="vod-grid-count">{grid.total} titles</div>}
              <div className="vod-grid">
                {grid.items.map(item => <VodCard key={item.id} item={item} onOpen={openDetail} />)}
                {grid.loading && Array.from({ length: 7 }, (_, i) => <div key={`s${i}`} className="vod-card skeleton"></div>)}
              </div>
              {grid.error && <div className="vod-message"><div className="error-msg">{grid.error}</div></div>}
              {!grid.loading && grid.items.length === 0 && !grid.error && (
                <div className="vod-message">No titles found.</div>
              )}
              {gridHasMore && (
                <div className="vod-more">
                  <button className="btn btn-secondary" onClick={() => loadGridPage(grid, grid.page + 1, grid.items)}>Load more</button>
                </div>
              )}
            </div>
          ) : (
            <div className="vod-scroll">
              {hero ? (
                <div className="vod-hero">
                  {heroItems.map((item, i) => (
                    <div
                      key={item.id}
                      className={`vod-hero-backdrop ${item.id === hero.id ? 'active' : ''}`}
                      style={{ backgroundImage: `url("${largePoster(item.poster)}")` }}
                    ></div>
                  ))}
                  <div className="vod-hero-text">
                    <h1>{hero.name}</h1>
                    <div className="vod-hero-genres">{[genreLine(hero), ...meta(hero).slice(0, 3)].filter(Boolean).join('  •  ')}</div>
                    <p>{hero.description}</p>
                    <div className="vod-actions">
                      {!isSeries && (
                        <button className="vod-play" disabled={busy} onClick={() => playTitle(hero)}>
                          <Icon name="play" size={16} filled /> Play
                        </button>
                      )}
                      <button className={isSeries ? 'vod-play' : 'vod-secondary'} onClick={() => openDetail(hero)}>View Details</button>
                    </div>
                  </div>
                  {heroItems.length > 1 && (
                    <div className="vod-hero-dots">
                      {heroItems.map((item, i) => (
                        <button
                          key={item.id}
                          className={item.id === hero.id ? 'active' : ''}
                          title={item.name}
                          onClick={() => setHeroIndex(i)}
                        ></button>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <div className="vod-hero placeholder"></div>
              )}

              {error && <div className="vod-message"><div className="error-msg">{error}</div></div>}

              {continueList.length > 0 && (
                <div className="vod-row">
                  <div className="vod-row-header"><h3>Continue Watching</h3></div>
                  <div className="vod-row-body">
                    <div className="vod-row-scroller">
                      {continueList.map(entry => {
                        const left = entry.duration ? Math.max(1, Math.round((entry.duration - entry.position) / 60)) : null;
                        return (
                          <div
                            key={entry.key}
                            className="continue-card"
                            title={entry.item.name}
                            onClick={() => playTitle(entry.item, entry.season, entry.episode)}
                          >
                            <img
                              src={largePoster(entry.item.poster) || POSTER_FALLBACK}
                              alt=""
                              loading="lazy"
                              onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }}
                            />
                            {left !== null && <span className="continue-badge">{left}m left</span>}
                            <button
                              className="continue-remove"
                              title="Remove from Continue Watching"
                              onClick={(e) => { e.stopPropagation(); forgetContinue(entry); }}
                            >
                              <Icon name="x" size={14} />
                            </button>
                            <div className="continue-info">
                              <div className="continue-name">{entry.item.name}</div>
                              {entry.season && <div className="continue-sub">{entry.season.name} • Episode {entry.episode}</div>}
                              <div className="continue-progress">
                                <span style={{ width: `${entry.duration ? Math.min(100, (entry.position / entry.duration) * 100) : 0}%` }}></span>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {categories.map(category => (
                <VodRow
                  key={category.id}
                  title={category.title}
                  row={rows[category.id]}
                  onOpen={openDetail}
                  onSeeAll={() => openGrid({ title: category.title, category: category.id })}
                />
              ))}
            </div>
          )}

          {detail && !playing && (
            <div className="modal-overlay" onClick={() => setDetail(null)}>
              <div className="modal vod-detail" onClick={e => e.stopPropagation()}>
                <div className="vod-detail-backdrop" style={{ backgroundImage: `url("${largePoster(detail.poster)}")` }}></div>
                <button className="vod-close" onClick={() => setDetail(null)} title="Close"><Icon name="x" size={18} /></button>
                <div className="vod-detail-top">
                  <img src={detail.poster || POSTER_FALLBACK} alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }} />
                  <div className="vod-detail-text">
                    <div className="vod-title-row">
                      <h2>{detail.name}</h2>
                      <FavoriteButton favorite={{ type, id: detail.id, name: detail.name, image: detail.poster, data: { item: favoriteItem(detail) } }} />
                    </div>
                    <div className="vod-meta">{meta(detail).map(m => <span key={m}>{m}</span>)}</div>
                    {detail.genres && <div className="vod-genres">{genreLine(detail)}</div>}
                    <p>{detail.description}</p>
                    {detail.director && <div className="vod-credits"><strong>Director</strong> {detail.director}</div>}
                    {detail.actors && detail.actors !== 'N/A' && <div className="vod-credits"><strong>Cast</strong> {detail.actors}</div>}

                    {!isSeries && (
                      <div className="vod-actions">
                        <button className="vod-play" disabled={busy} onClick={() => playTitle(detail)}>
                          <Icon name="play" size={16} filled /> {savedPosition(detail) > 30 ? 'Resume' : 'Play'}
                        </button>
                        <button className="vod-secondary" disabled={busy} onClick={() => downloadTitle(detail)}>
                          <Icon name="download" size={16} /> Download
                        </button>
                      </div>
                    )}
                  </div>
                </div>

                {detailError && <div className="error-msg">{detailError}</div>}

                {isSeries && (
                  <div className="vod-episodes">
                    {seasons === null && <div className="vod-message">Loading seasons...</div>}
                    {seasons && seasons.length === 0 && !detailError && <div className="vod-message">No episodes available.</div>}
                    {seasons && seasons.length > 0 && (
                      <React.Fragment>
                        <div className="vod-seasons">
                          {seasons.map((s, i) => (
                            <button
                              key={s.id}
                              className={`theme-option ${i === seasonIndex ? 'active' : ''}`}
                              onClick={() => setSeasonIndex(i)}
                            >
                              {s.name}
                            </button>
                          ))}
                        </div>
                        <div className="vod-episode-list">
                          {season.episodes.map(episode => (
                            <div key={episode} className="archive-row">
                              <span className="archive-time">E{pad2(episode)}</span>
                              <span className="archive-name">
                                Episode {episode}
                                {savedPosition(detail, season, episode) > 30 && <em className="vod-resume"> · in progress</em>}
                              </span>
                              <span className="archive-actions">
                                <button title="Play" disabled={busy} onClick={() => playTitle(detail, season, episode)}><Icon name="play" size={14} filled /></button>
                                <button title="Download" disabled={busy} onClick={() => downloadTitle(detail, season, episode)}><Icon name="download" size={14} /></button>
                              </span>
                            </div>
                          ))}
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {playing && (
            <div className="vod-player">
              <video
                key={playing.streamUrl}
                ref={videoRef}
                src={`${BACKEND_ORIGIN}${playing.streamUrl}`}
                autoPlay
                playsInline
                onLoadedMetadata={handleLoadedMetadata}
                onTimeUpdate={handleTimeUpdate}
                onError={handleVideoError}
                onWaiting={handleWaiting}
                onPlaying={handlePlaying}
              />
              {playerError && <div className="player-notice">{playerError}</div>}
              <PlayerControls
                key={playing.streamUrl}
                videoRef={videoRef}
                title={playing.title}
                subtitle={playing.subtitle}
                captions={hasCaptions ? { on: captionsOn, onToggle: toggleCaptions } : null}
                onClose={closePlayer}
              >
                {playing.next && (
                  <button
                    className="pc-pill"
                    disabled={busy}
                    onClick={() => playTitle(playing.next.item, playing.next.season, playing.next.episode)}
                  >
                    <Icon name="next" size={14} /> Next episode
                  </button>
                )}
              </PlayerControls>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // DOWNLOAD MARGIN - extra minutes before and after a recorded programme
    // ═══════════════════════════════════════════════════════════════════════
    // Broadcasts rarely start and end on the minute the guide says. The choice
    // is remembered in this browser and applies to every programme download.

    const MARGIN_MINUTES = [0, 5, 10, 15, 20, 30, 45, 60];

    const readDownloadMargin = () => {
      try {
        const stored = JSON.parse(localStorage.getItem('download:margin')) || {};
        return { before: Number(stored.before) || 0, after: Number(stored.after) || 0 };
      } catch (_) {
        return { before: 0, after: 0 };
      }
    };

    // Extra fields for an archive request so the download includes the margin
    const withDownloadMargin = (program) => {
      const margin = readDownloadMargin();
      if (!margin.before && !margin.after) return {};
      return {
        start: program.start - margin.before * 60,
        duration: (program.stop - program.start) + (margin.before + margin.after) * 60
      };
    };

    function DownloadMargin() {
      const [margin, setMargin] = useState(readDownloadMargin);

      const change = (side, minutes) => {
        const next = { ...margin, [side]: Number(minutes) };
        setMargin(next);
        try { localStorage.setItem('download:margin', JSON.stringify(next)); } catch (_) {}
      };

      const picker = (side) => (
        <select value={margin[side]} onChange={(e) => change(side, e.target.value)}>
          {MARGIN_MINUTES.map(m => <option key={m} value={m}>{m === 0 ? 'none' : `${m} min`}</option>)}
        </select>
      );

      return (
        <div className="dl-margin">
          <span>Download margin</span>
          <label>before {picker('before')}</label>
          <label>after {picker('after')}</label>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RECORDINGS GUIDE - programme timeline per channel
    // ═══════════════════════════════════════════════════════════════════════

    const GUIDE_PPM = 4;               // pixels per minute
    const GUIDE_DAY_WIDTH = 1440 * GUIDE_PPM;
    const GUIDE_CHANNEL_WIDTH = 210;
    const CHANNEL_LOGO_FALLBACK = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>';

    function GuideBrowser({ channels, genres, onPlay, onDownload, onSave, onWatchLive }) {
      const pad2 = (n) => String(n).padStart(2, '0');
      const localDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const clockTime = (ts) => { const d = new Date(ts * 1000); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

      const [date, setDate] = useState(localDate(new Date()));
      const [genre, setGenre] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [epg, setEpg] = useState({});            // `${date}:${channelId}` -> { programs } | { error }
      const [selected, setSelected] = useState(null); // { channel, program }
      const [now, setNow] = useState(Date.now());
      const [busy, setBusy] = useState(false);
      const [actionError, setActionError] = useState('');
      const [actionNote, setActionNote] = useState('');
      const scrollRef = useRef(null);
      const queueRef = useRef([]);
      const runningRef = useRef(0);
      const requestedRef = useRef(new Set());

      // Search: filter the channel rows, or look for programmes in the recordings
      const [searchMode, setSearchMode] = useState('channels');
      const [programQuery, setProgramQuery] = useState('');
      const [search, setSearch] = useState(null);     // { query, results, done, total, running, error }
      const searchRun = useRef(0);

      const archiveChannels = channels.filter(c => c.archive);
      const maxHours = archiveChannels.reduce((max, c) => Math.max(max, c.archiveHours || 0), 24);

      // Days kept by the provider, newest first
      const days = Array.from({ length: Math.ceil(maxHours / 24) + 1 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const label = i === 0 ? 'Today' : i === 1 ? 'Yesterday'
          : d.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit' });
        return { date: localDate(d), label };
      });

      const term = searchMode === 'channels' ? searchTerm.trim().toLowerCase() : '';
      const rows = archiveChannels
        .filter(c => genre === 'all' || c.tv_genre_id === genre)
        .filter(c => !term || c.name.toLowerCase().includes(term) || String(c.number).includes(term))
        .sort((a, b) => a.number - b.number);
      const rowsKey = rows.map(c => c.id).join(',');

      const dayStart = Math.floor(new Date(`${date}T00:00:00`).getTime() / 1000);
      const nowSeconds = Math.floor(now / 1000);
      const isToday = date === localDate(new Date(now));
      const nowMinutes = (nowSeconds - dayStart) / 60;

      // Guides are loaded only for the rows on screen, two channels at a time
      const pump = () => {
        while (runningRef.current < 2 && queueRef.current.length) {
          const job = queueRef.current.shift();
          runningRef.current++;
          api.iptvGetEpg(job.channelId, job.date)
            .then(data => setEpg(prev => ({
              ...prev,
              [job.key]: data.success ? { programs: data.programs } : { error: data.error || 'Guide not available' }
            })))
            .catch(() => setEpg(prev => ({ ...prev, [job.key]: { error: 'Guide not available' } })))
            .finally(() => { runningRef.current--; pump(); });
        }
      };

      const retryEpg = (channelId, day) => {
        const key = `${day}:${channelId}`;
        requestedRef.current.delete(key);
        setEpg(prev => { const next = { ...prev }; delete next[key]; return next; });
        requestEpg(channelId, day);
      };

      const requestEpg = (channelId, day) => {
        const key = `${day}:${channelId}`;
        if (requestedRef.current.has(key)) return;
        requestedRef.current.add(key);
        // Rows that just came into view go first
        queueRef.current.unshift({ key, channelId, date: day });
        pump();
      };

      useEffect(() => {
        const root = scrollRef.current;
        if (!root) return;

        // Drop what was queued for another day or filter
        queueRef.current.forEach(job => requestedRef.current.delete(job.key));
        queueRef.current = [];

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) requestEpg(entry.target.dataset.channelId, date);
          });
        }, { root, rootMargin: '300px 0px' });

        root.querySelectorAll('.guide-row').forEach(row => observer.observe(row));
        return () => observer.disconnect();
      }, [date, rowsKey]);

      // Keep the "now" marker moving
      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 60000);
        return () => clearInterval(timer);
      }, []);

      const scrollToMinute = (minute) => {
        const root = scrollRef.current;
        if (root) root.scrollLeft = Math.max(0, minute * GUIDE_PPM - 120);
      };

      // Open on the current time
      useEffect(() => {
        const d = new Date();
        scrollToMinute(d.getHours() * 60 + d.getMinutes() - 60);
      }, []);

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setSelected(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Programme search goes day by day (newest first) and a few channels at a
      // time, so results show up while the older days are still being read
      const startProgramSearch = async () => {
        const query = programQuery.trim();
        if (query.length < 2) return;

        const runId = ++searchRun.current;
        const scope = archiveChannels
          .filter(c => genre === 'all' || c.tv_genre_id === genre)
          .sort((a, b) => a.number - b.number);

        const steps = [];
        days.forEach(day => {
          for (let i = 0; i < scope.length; i += 10) {
            steps.push({ date: day.date, ids: scope.slice(i, i + 10).map(c => c.id) });
          }
        });

        setSearch({ query, results: [], done: 0, total: steps.length, channels: scope.length, running: steps.length > 0, error: '' });

        for (const step of steps) {
          if (searchRun.current !== runId) return;

          // A part can fail for a moment (server restarting, portal busy): try it
          // again before counting it as not searched
          let data;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              data = await api.iptvSearchEpg(query, step.date, step.ids);
            } catch (err) {
              data = { success: false };
            }
            if (data.success || searchRun.current !== runId) break;
            await new Promise(resolve => setTimeout(resolve, attempt * 2000));
          }
          if (searchRun.current !== runId) return;

          setSearch(prev => prev && ({
            ...prev,
            done: prev.done + 1,
