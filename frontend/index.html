<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <link rel="stylesheet" href="themes.css">
</head>
<body class="theme-midnight">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_URL = '/api';
    const GROUP_INFO = { 
      4: { name: 'Generalistas', icon: '📺' }, 
      6: { name: 'Infantil', icon: '🧒' }, 
      8: { name: 'Documentários', icon: '🎬' }, 
      9: { name: 'Filmes', icon: '🎥' }, 
      11: { name: 'Séries', icon: '📽️' }, 
      13: { name: 'Desporto', icon: '⚽' }, 
      14: { name: 'Notícias', icon: '📰' }, 
      15: { name: 'Música', icon: '🎵' }, 
      18: { name: 'Entretenimento', icon: '🎭' }, 
      19: { name: 'Internacionais', icon: '🌍' }, 
      20: { name: 'Adultos', icon: '🔞' }, 
      42: { name: 'Religiosos', icon: '⛪' }, 
      43: { name: 'Regionais', icon: '🏘️' }, 
      59: { name: 'Brasil', icon: '🇧🇷' }, 
      67: { name: 'Espanha', icon: '🇪🇸' }, 
      69: { name: 'França', icon: '🇫🇷' }, 
      70: { name: 'UK', icon: '🇬🇧' }, 
      71: { name: 'Outros', icon: '📡' } 
    };
    
    const api = {
      token: localStorage.getItem('authToken'),
      setToken(token) { 
        this.token = token; 
        token ? localStorage.setItem('authToken', token) : localStorage.removeItem('authToken'); 
      },
      async fetch(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
        const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
        const data = await response.json();
        if (response.status === 401) { this.setToken(null); window.location.reload(); }
        return data;
      }
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [screen, setScreen] = useState('login');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loadingProgress, setLoadingProgress] = useState('');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [showChangePassword, setShowChangePassword] = useState(false);
      const [showPreferences, setShowPreferences] = useState(false);
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [iptvSessionId, setIptvSessionId] = useState('');
      const [channels, setChannels] = useState([]);
      const [groups, setGroups] = useState([]);
      const [selectedGroup, setSelectedGroup] = useState(null);
      const [showChannels, setShowChannels] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [currentChannel, setCurrentChannel] = useState(null);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [currentTheme, setCurrentTheme] = useState(localStorage.getItem('theme') || 'midnight');
      const videoRef = useRef(null);
      const playerRef = useRef(null);

      // Silent logging - no sensitive data exposed to browser console
      const log = {
        info: () => {}, // Silent in production
        error: (msg) => console.error('Error:', msg), // Only show user-friendly errors
        player: () => {} // Silent - player events handled internally
      };

      // Apply theme on mount and when changed
      useEffect(() => {
        document.body.className = `theme-${currentTheme}`;
        localStorage.setItem('theme', currentTheme);
      }, [currentTheme]);

      useEffect(() => { checkAuth(); }, []);

      const checkAuth = async () => {
        if (!api.token) { setAuthChecked(true); return; }
        try {
          const data = await api.fetch('/auth/me');
          if (data.success) { 
            setUser(data.user); 
            setIsAuthenticated(true); 
            data.user.hasPortalConfig ? connectToIPTV() : setScreen('noconfig'); 
          }
        } catch (error) { 
          api.setToken(null); 
        }
        setAuthChecked(true);
      };

      const handleLogin = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setIsLoggingIn(true);
        
        try {
          const data = await api.fetch('/auth/login', { 
            method: 'POST', 
            body: JSON.stringify({ username, password }) 
          });
          
          if (!data.success) throw new Error(data.error || 'Login failed');
          
          api.setToken(data.token); 
          setUser(data.user); 
          setIsAuthenticated(true);
          
          data.user.hasPortalConfig ? connectToIPTV() : setScreen('noconfig');
        } catch (err) { 
          log.error(err.message);
          setError(err.message); 
        } finally { 
          setIsLoggingIn(false); 
        }
      };

      const handleLogout = () => {
        api.setToken(null); 
        setUser(null); 
        setIsAuthenticated(false); 
        setIptvSessionId(''); 
        setChannels([]); 
        setGroups([]); 
        setCurrentChannel(null); 
        setScreen('login'); 
        setShowUserMenu(false);
      };

      const handleChangePassword = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setSuccess('');
        if (newPassword !== confirmPassword) { 
          setError('Passwords do not match'); 
          return; 
        }
        try {
          const data = await api.fetch('/auth/change-password', { 
            method: 'POST', 
            body: JSON.stringify({ currentPassword, newPassword }) 
          });
          if (!data.success) throw new Error(data.error);
          setSuccess('Password changed!'); 
          setCurrentPassword(''); 
          setNewPassword(''); 
          setConfirmPassword('');
          setTimeout(() => { 
            setShowChangePassword(false); 
            setSuccess(''); 
          }, 2000);
        } catch (err) { 
          setError(err.message); 
        }
      };

      const connectToIPTV = async () => {
        setScreen('loading'); 
        setLoadingProgress('Connecting to IPTV...');
        
        try {
          const connectData = await api.fetch('/iptv/connect', { method: 'POST' });
          if (!connectData.success) throw new Error(connectData.error || 'IPTV connection failed');
          
          setIptvSessionId(connectData.sessionId);
          
          setLoadingProgress('Loading channels...');
          
          const chData = await api.fetch('/iptv/channels', { 
            method: 'POST', 
            body: JSON.stringify({ sessionId: connectData.sessionId }) 
          });
          
          if (!chData.success) throw new Error(chData.error || 'Failed to load channels');
          
          setChannels(chData.channels);
          
          // Process groups
          const groupMap = {};
          chData.channels.forEach(ch => { 
            const gid = ch.tv_genre_id || 0; 
            if (!groupMap[gid]) { 
              const info = GROUP_INFO[gid] || { name: `Group ${gid}`, icon: '📁' }; 
              groupMap[gid] = { id: gid, name: info.name, icon: info.icon, count: 0 }; 
            } 
            groupMap[gid].count++; 
          });
          
          setGroups(Object.values(groupMap).sort((a, b) => b.count - a.count));
          setScreen('main');
        } catch (err) { 
          log.error(err.message);
          setError(err.message); 
          setScreen('noconfig'); 
        }
      };

      const handleSelectGroup = (groupId) => { 
        setSelectedGroup(groupId); 
        setShowChannels(true); 
        setSearchTerm(''); 
      };
      
      const handleBackToGroups = () => setShowChannels(false);

      const getGroupChannels = () => {
        if (selectedGroup === null) return [];
        let filtered = channels.filter(ch => ch.tv_genre_id === selectedGroup);
        if (searchTerm) { 
          const term = searchTerm.toLowerCase(); 
          filtered = filtered.filter(ch => 
            ch.name.toLowerCase().includes(term) || 
            ch.number.toString().includes(term)
          ); 
        }
        return filtered.sort((a, b) => a.number - b.number);
      };

      const getFilteredGroups = () => { 
        if (!searchTerm) return groups; 
        const term = searchTerm.toLowerCase(); 
        return groups.filter(g => g.name.toLowerCase().includes(term)); 
      };

      const playChannel = async (channel) => {
        setCurrentChannel(channel);
        
        try {
          const data = await api.fetch('/iptv/stream', { 
            method: 'POST', 
            body: JSON.stringify({ 
              sessionId: iptvSessionId, 
              channelId: channel.id, 
              cmd: channel.cmd, 
              channelName: channel.name 
            }) 
          });
          
          if (data.success && data.streamUrl) { 
            loadStream(data.streamUrl); 
          } else { 
            log.error('Failed to get stream');
          }
        } catch (err) { 
          log.error(err.message);
        }
      };

      const loadStream = (streamUrl) => {
        const video = videoRef.current; 
        if (!video) return;
        
        // Cleanup previous player
        if (playerRef.current) { 
          playerRef.current.destroy?.(); 
          playerRef.current = null; 
        }
        
        video.removeAttribute('src');
        video.load();
        
        const absoluteUrl = streamUrl.startsWith('/') 
          ? window.location.origin + streamUrl 
          : streamUrl;
        
        // Check mpegts.js support
        if (!mpegts || !mpegts.isSupported()) {
          log.error('Video playback not supported in this browser');
          return;
        }
        
        // Create player
        const player = mpegts.createPlayer({ 
          type: 'flv', 
          isLive: true, 
          url: absoluteUrl
        }, { 
          enableWorker: false,
          enableStashBuffer: true,
          stashInitialSize: 384 * 1024,
          isLive: true,
          lazyLoad: false,
          autoCleanupSourceBuffer: true
        });
        
        player.attachMediaElement(video); 
        player.load();
        
        // Auto-play after buffer
        setTimeout(() => {
          if (video.readyState >= 1) {
            video.play().catch(() => {
              // Auto-play blocked - user needs to interact
            });
          }
        }, 3000);
        
        // Error handling only
        player.on(mpegts.Events.ERROR, (type, detail) => {
          log.error('Playback error');
        });
        
        video.oncanplay = () => {
          video.play().catch(() => {});
        };
        
        video.onerror = () => {
          log.error('Video playback failed');
        };
        
        playerRef.current = player;
      };

      const toggleFullscreen = () => { 
        isFullscreen ? document.exitFullscreen() : document.querySelector('.player-section')?.requestFullscreen(); 
        setIsFullscreen(!isFullscreen); 
      };

      useEffect(() => () => playerRef.current?.destroy?.(), []);
      
      useEffect(() => { 
        const handler = () => setIsFullscreen(!!document.fullscreenElement); 
        document.addEventListener('fullscreenchange', handler); 
        return () => document.removeEventListener('fullscreenchange', handler); 
      }, []);
      
      useEffect(() => { 
        const handler = (e) => { 
          if (!e.target.closest('.user-menu')) setShowUserMenu(false); 
        }; 
        document.addEventListener('click', handler); 
        return () => document.removeEventListener('click', handler); 
      }, []);

      if (!authChecked) return (
        <div className="loading-screen">
          <div className="spinner"></div>
          <div className="loading-text">Loading...</div>
        </div>
      );

      if (!isAuthenticated) return (
        <div className="login-screen">
          <div className="login-card">
            <h1>📺 IPTV Player</h1>
            <p className="subtitle">Sign in to continue</p>

            {error && <div className="error-msg">{error}</div>}
            
            <form onSubmit={handleLogin}>
              <div className="form-group">
                <label>Username</label>
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder="Enter username"
                  required
                  autoFocus
                />
              </div>
              
              <div className="form-group">
                <label>Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="Enter password"
                  required
                />
              </div>
              
              <button type="submit" className="btn" disabled={isLoggingIn}>
                {isLoggingIn ? 'Signing in...' : 'Sign In'}
              </button>
            </form>
          </div>
        </div>
      );

      if (screen === 'noconfig') return (
        <div className="no-config-screen">
          <div className="no-config-card">
            <div className="icon">⚙️</div>
            <h2>Configuration Required</h2>
            <p>Your account is not yet configured for IPTV access.<br/>Contact the administrator to set up your portal URL and MAC address.</p>
            <button className="btn btn-secondary" onClick={handleLogout}>Sign Out</button>
          </div>
        </div>
      );

      if (screen === 'loading') return (
        <div className="loading-screen">
          <div className="spinner"></div>
          <div className="loading-text">Loading IPTV</div>
          <div className="loading-progress">{loadingProgress}</div>
        </div>
      );

      const groupChannels = getGroupChannels();
      const filteredGroups = getFilteredGroups();
      const selectedGroupInfo = groups.find(g => g.id === selectedGroup);

      return (
        <div className="app-layout">
          {/* Navigation Rail (preparado para Movies/Series/EPG) */}
          <div className="nav-rail">
            <div className="nav-item active" title="TV Channels">
              📺
            </div>
            <div className="nav-item" title="Movies (Coming Soon)" style={{opacity: 0.3, cursor: 'not-allowed'}}>
              🎬
            </div>
            <div className="nav-item" title="Series (Coming Soon)" style={{opacity: 0.3, cursor: 'not-allowed'}}>
              📽️
            </div>
            <div className="nav-divider"></div>
            <div className="nav-item" title="EPG Guide (Coming Soon)" style={{opacity: 0.3, cursor: 'not-allowed'}}>
              📅
            </div>
          </div>

          <div className="sidebar">
            <div className="sidebar-header">
              <div className="sidebar-header-top">
                <h2>TV Channels</h2>
                <div className="user-menu">
                  <button 
                    className="user-btn" 
                    onClick={() => setShowUserMenu(!showUserMenu)}
                  >
                    👤 {user?.username} <span>▼</span>
                  </button>
                  {showUserMenu && (
                    <div className="user-dropdown">
                      <div 
                        className="user-dropdown-item" 
                        onClick={() => { 
                          setShowPreferences(true); 
                          setShowUserMenu(false); 
                        }}
                      >
                        🎨 Preferences
                      </div>
                      <div 
                        className="user-dropdown-item" 
                        onClick={() => { 
                          setShowChangePassword(true); 
                          setShowUserMenu(false); 
                        }}
                      >
                        🔐 Change Password
                      </div>
                      {user?.role === 'admin' && (
                        <div 
                          className="user-dropdown-item" 
                          onClick={() => window.open('/admin.html', '_blank')}
                        >
                          ⚙️ Admin Panel
                        </div>
                      )}
                      <div 
                        className="user-dropdown-item danger" 
                        onClick={handleLogout}
                      >
                        🚪 Sign Out
                      </div>
                    </div>
                  )}
                </div>
              </div>
              <div className="search-container">
                <span className="search-icon">🔍</span>
                <input
                  type="text"
                  className="search-input"
                  placeholder={showChannels ? "Search channels..." : "Search groups..."}
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>
            </div>
            
            <div className="slide-container">
              <div className={`slide-wrapper ${showChannels ? 'show-channels' : ''}`}>
                {/* Groups Panel */}
                <div className="slide-panel">
                  <div className="groups-panel">
                    {filteredGroups.map(group => (
                      <div 
                        key={group.id} 
                        className="group-item" 
                        onClick={() => handleSelectGroup(group.id)}
                      >
                        <div className="group-info">
                          <div className="group-icon">{group.icon}</div>
                          <span className="name">{group.name}</span>
                        </div>
                        <span className="count">{group.count}</span>
                      </div>
                    ))}
                  </div>
                </div>
                
                {/* Channels Panel */}
                <div className="slide-panel">
                  <div className="channels-panel">
                    <button className="back-button" onClick={handleBackToGroups}>
                      ← Back to Groups
                    </button>
                    {selectedGroupInfo && (
                      <div className="channels-panel-header">
                        <h3>{selectedGroupInfo.icon} {selectedGroupInfo.name}</h3>
                        <span>{groupChannels.length} channels</span>
                      </div>
                    )}
                    <div className="channels-list">
                      {groupChannels.map(channel => (
                        <div 
                          key={channel.id} 
                          className={`channel-item ${currentChannel?.id === channel.id ? 'playing' : ''}`}
                          onClick={() => playChannel(channel)}
                        >
                          <img
                            src={channel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                            alt=""
                            className="channel-logo"
                            onError={(e) => e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                          />
                          <div className="channel-info">
                            <div className="channel-name">{channel.name}</div>
                            <div className="channel-number">Ch. {channel.number}</div>
                          </div>
                          {currentChannel?.id === channel.id && (
                            <div className="playing-indicator"></div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div className="main-content">
            <div className={`player-section ${isFullscreen ? 'fullscreen' : ''}`}>
              {currentChannel ? (
                <>
                  <div className="video-container">
                    <video ref={videoRef} controls />
                  </div>
                  <div className="now-playing-bar">
                    <div className="now-playing-info">
                      <img
                        src={currentChannel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                        alt=""
                        className="channel-logo"
                      />
                      <div>
                        <h3>{currentChannel.name}</h3>
                        <span>Channel {currentChannel.number}</span>
                      </div>
                    </div>
                    <div className="player-controls">
                      <button onClick={toggleFullscreen}>
                        {isFullscreen ? '⬜ Exit Fullscreen' : '⬜ Fullscreen'}
                      </button>
                    </div>
                  </div>
                </>
              ) : (
                <div className="no-channel-message">
                  <div className="icon">📺</div>
                  <h3>Select a Channel</h3>
                  <p>Choose a group and channel from the menu</p>
                </div>
              )}
            </div>
          </div>
          
          {/* Preferences Modal */}
          {showPreferences && (
            <div className="modal-overlay" onClick={() => setShowPreferences(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>🎨 Preferences</h2>
                
                <div className="form-group">
                  <label>Theme</label>
                  <p style={{fontSize: '0.8125rem', color: 'var(--text-tertiary)', marginBottom: 'var(--space-md)'}}>
                    Choose your preferred color theme
                  </p>
                  
                  <div className="theme-selector">
                    <button 
                      className={`theme-option ${currentTheme === 'midnight' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('midnight')}
                      type="button"
                    >
                      🌙 Midnight
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'carbon' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('carbon')}
                      type="button"
                    >
                      🖤 Carbon
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'ocean' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('ocean')}
                      type="button"
                    >
                      🌊 Ocean
                    </button>
                  </div>
                </div>

                <button 
                  type="button" 
                  className="btn btn-secondary" 
                  onClick={() => setShowPreferences(false)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {showChangePassword && (
            <div className="modal-overlay" onClick={() => setShowChangePassword(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>🔐 Change Password</h2>
                {error && <div className="error-msg">{error}</div>}
                {success && <div className="success-msg">{success}</div>}
                <form onSubmit={handleChangePassword}>
                  <div className="form-group">
                    <label>Current Password</label>
                    <input
                      type="password"
                      value={currentPassword}
                      onChange={(e) => setCurrentPassword(e.target.value)}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>New Password</label>
                    <input
                      type="password"
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      required
                      minLength={6}
                    />
                  </div>
                  <div className="form-group">
                    <label>Confirm New Password</label>
                    <input
                      type="password"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      required
                    />
                  </div>
                  <button type="submit" className="btn">Change Password</button>
                  <button 
                    type="button" 
                    className="btn btn-secondary" 
                    onClick={() => setShowChangePassword(false)}
                  >
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
