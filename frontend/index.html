          if (type === mpegts.ErrorTypes.NETWORK_ERROR) {
            setPlayerNotice('Archive stream interrupted. Move the position to continue.');
          }
        });

        player.attachMediaElement(video);
        player.load();
        video.play().catch(() => {});

        playerRef.current = player;
      };

      const seekArchive = (position) => {
        if (!archivePlayback) return;
        const target = Math.min(Math.max(0, position), Math.max(0, archivePlayback.duration - 5));
        loadArchiveStream(archivePlayback.streamUrl, target);
      };

      // The provider allows one stream per account: leaving live TV stops it
      const switchSection = (next) => {
        if (next === section) return;
        
        cancelLiveRetry();
        setPlayerNotice('');
        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }
        setCurrentChannel(null);
        setArchivePlayback(null);
        setArchiveChannel(null);
        if (next === 'guide') setGuideOpened(true);
        setSection(next);
      };

      // ── Recordings guide actions ──────────────────────────────────────────
      
      const guideWindow = (date, program) => ({
        date,
        programId: program.id,
        title: `${program.name} ${date} ${clockTime(program.start).replace(':', '.')}`
      });

      // Plays in the TV player; the guide stays mounted to come back to
      const playGuideProgram = async (channel, date, program) => {
        const data = await requestArchive(channel, guideWindow(date, program));
        
        cancelLiveRetry();
        setPlayerNotice('');
        setSection('tv');
        setCurrentChannel(channel);
        setArchivePlayback({
          channel,
          title: `${program.name} · ${clockTime(program.start)}`,
          start: data.start,
          duration: data.duration,
          streamUrl: data.streamUrl,
          fromGuide: true
        });
        
        // The video element exists only after the TV player has rendered
        for (let i = 0; i < 20 && !videoRef.current; i++) {
          await new Promise(resolve => setTimeout(resolve, 50));
        }
        loadArchiveStream(data.streamUrl, 0);
      };

      const downloadGuideProgram = async (channel, date, program) => {
        const data = await requestArchive(channel, guideWindow(date, program));
        startDownload(data.streamUrl);
      };

      const watchLiveFromGuide = (channel) => {
        setSection('tv');
        playChannel(channel);
      };

      const toggleFullscreen = () => { 
        if (isFullscreen) {
          document.exitFullscreen();
        } else {
          document.querySelector('.player-section')?.requestFullscreen();
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════════════════════════════════════
      
      if (!authChecked) {
        return (
          <div className="loading-screen">
            <div className="spinner"></div>
            <div className="loading-text">Loading...</div>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <div className="login-screen">
            <div className="login-card">
              <div className="login-logo"><Icon name="tv" size={26} /></div>
              <h1>IPTV Player</h1>
              <p className="subtitle">Sign in to continue</p>

              {error && <div className="error-msg">{error}</div>}
              
              <form onSubmit={handleLogin}>
                <div className="form-group">
                  <label>Username</label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Enter username"
                    required
                    autoFocus
                  />
                </div>
                
                <div className="form-group">
                  <label>Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Enter password"
                    required
                  />
                </div>
                
                <button type="submit" className="btn" disabled={isLoggingIn}>
                  {isLoggingIn ? 'Signing in...' : 'Sign In'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (screen === 'noconfig') {
        return (
          <div className="no-config-screen">
            <div className="no-config-card">
              <div className="icon"><Icon name="sliders" size={40} /></div>
              <h2>Configuration Required</h2>
              <p>Your account is not yet configured for IPTV access.<br/>Contact the administrator to set up your portal URL and MAC address.</p>
              <button className="btn btn-secondary" onClick={handleLogout}>Sign Out</button>
            </div>
          </div>
        );
      }

      if (screen === 'loading') {
        return (
          <div className="loading-screen">
            <div className="spinner"></div>
            <div className="loading-text">Loading IPTV</div>
            <div className="loading-progress">{loadingProgress}</div>
          </div>
        );
      }

      const genreChannels = getGenreChannels();
      const filteredGenres = getFilteredGenres();
      const selectedGenreInfo = genres.find(g => g.id === selectedGenre);

      return (
        <div className="app-layout">
          {/* Navigation Rail */}
          <div className="nav-rail">
            <div className={`nav-item ${section === 'tv' ? 'active' : ''}`} title="TV Channels" onClick={() => switchSection('tv')}><Icon name="tv" /></div>
            <div className={`nav-item ${section === 'guide' ? 'active' : ''}`} title="Recordings" onClick={() => switchSection('guide')}><Icon name="calendar" /></div>
            {user?.sections?.vod && (
              <div className={`nav-item ${section === 'vod' ? 'active' : ''}`} title="Video Club" onClick={() => switchSection('vod')}><Icon name="film" /></div>
            )}
            {user?.sections?.series && (
              <div className={`nav-item ${section === 'series' ? 'active' : ''}`} title="Series" onClick={() => switchSection('series')}><Icon name="layers" /></div>
            )}
            <div className="nav-spacer"></div>
            <div className="nav-item" title="Preferences" onClick={() => setShowPreferences(true)}><Icon name="droplet" /></div>
            <div className="nav-item" title="Change Password" onClick={() => setShowChangePassword(true)}><Icon name="lock" /></div>
            {user?.role === 'admin' && (
              <div className="nav-item" title="Admin Panel" onClick={() => window.open('/admin.html', '_blank')}><Icon name="sliders" /></div>
            )}
            <div className="nav-item nav-item-danger" title="Sign Out" onClick={handleLogout}><Icon name="logout" /></div>
          </div>

          {(section === 'vod' || section === 'series') && <VodBrowser key={section} type={section} />}

          {guideOpened && (
            <div className="section-host" style={{ display: section === 'guide' ? 'flex' : 'none' }}>
              <GuideBrowser
                channels={channels}
                genres={genres}
                onPlay={playGuideProgram}
                onDownload={downloadGuideProgram}
                onWatchLive={watchLiveFromGuide}
              />
            </div>
          )}

          {section === 'tv' && (
          <React.Fragment>
          {/* Sidebar */}
          <div className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
            <div className="sidebar-header">
              <div className="sidebar-header-top">
                <div style={{display: 'flex', alignItems: 'center', gap: 'var(--space-sm)'}}>
                  <button 
                    className="collapse-btn"
                    onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                    title={sidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                  >
                    <Icon name={sidebarCollapsed ? 'menu' : 'left'} size={18} />
                  </button>
                  <h2>TV Channels</h2>
                </div>
                <button
                  className="collapse-btn"
                  onClick={handleRefreshChannels}
                  disabled={isRefreshing}
                  title={listUpdatedAt
                    ? `Refresh channel list (last updated ${new Date(listUpdatedAt).toLocaleString()})`
                    : 'Refresh channel list'}
                >
                  <span className={isRefreshing ? 'spin' : ''}><Icon name="refresh" size={16} /></span>
                </button>
              </div>
              <div className="search-container">
                <span className="search-icon"><Icon name="search" size={16} /></span>
                <input
                  type="text"
                  className="search-input"
                  placeholder={showChannels ? "Search channels..." : "Search genres..."}
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>
            </div>
            
            <div className="slide-container">
              <div className={`slide-wrapper ${showChannels ? 'show-channels' : ''}`}>
                {/* Genres Panel */}
                <div className="slide-panel">
                  <div className="groups-panel">
                    {listError && <div className="error-msg">{listError}</div>}
                    {genres.length === 0 && (
                      <div className="groups-empty">
                        <p>No channel groups are enabled for your account.</p>
                        <p>
                          {user?.role === 'admin'
                            ? 'Open the Admin Panel (⚙️) and choose which groups to show.'
                            : 'Contact the administrator to enable them.'}
                        </p>
                      </div>
                    )}
                    {filteredGenres.map(genre => (
                      <div 
                        key={genre.id} 
                        className="group-item" 
                        onClick={() => handleSelectGenre(genre.id)}
                      >
                        <div className="group-info">
                          <div className="group-icon">{genre.icon}</div>
                          <span className="name">{genre.name}</span>
                        </div>
                        <span className="count">{genre.count}</span>
                      </div>
                    ))}
                  </div>
                </div>
                
                {/* Channels Panel */}
                <div className="slide-panel">
                  <div className="channels-panel">
                    {selectedGenreInfo && (
                      <div className="channels-panel-header">
                        <button 
                          className="back-arrow-btn" 
                          onClick={handleBackToGenres}
                          title="Back to genres"
                        >
                          <Icon name="back" size={18} />
                        </button>
                        <div className="channel-header-info">
                          <h3>{selectedGenreInfo.icon} {selectedGenreInfo.name}</h3>
                          <span>{genreChannels.length} channels</span>
                        </div>
                      </div>
                    )}
                    <div className="channels-list">
                      {genreChannels.map(channel => (
                        <div 
                          key={channel.id} 
                          className={`channel-item ${currentChannel?.id === channel.id ? 'playing' : ''}`}
                          onClick={() => playChannel(channel)}
                        >
                          <img
                            src={channel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                            alt=""
                            className="channel-logo"
                            onError={(e) => e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                          />
                          <div className="channel-info">
                            <div className="channel-name">{channel.name}</div>
                            <div className="channel-number">Ch. {channel.number}</div>
                          </div>
                          {currentChannel?.id === channel.id && (
                            <div className="playing-indicator"></div>
                          )}
                          {channel.archive && (
                            <button
                              className="archive-btn"
                              title={`Archive (last ${Math.round(channel.archiveHours / 24)} days)`}
                              onClick={(e) => { e.stopPropagation(); openArchive(channel); }}
                            >
                              <Icon name="rewind" size={14} />
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          {/* Main Content */}
          <div className="main-content">
            {sidebarCollapsed && (
              <button 
                className="floating-sidebar-toggle"
                onClick={() => setSidebarCollapsed(false)}
                title="Show sidebar"
              >
                <Icon name="menu" />
              </button>
            )}
            
            <div className={`player-section ${isFullscreen ? 'fullscreen' : ''}`}>
              {currentChannel ? (
                <>
                  <div className="video-container">
                    <video ref={videoRef} />
                  </div>
                  {playerNotice && <div className="player-notice">{playerNotice}</div>}
                  <PlayerControls
                    key={archivePlayback ? archivePlayback.streamUrl : `live-${currentChannel.id}`}
                    videoRef={videoRef}
                    live={!archivePlayback}
                    title={archivePlayback ? archivePlayback.title : currentChannel.name}
                    subtitle={archivePlayback ? `${currentChannel.name} • Recording` : `Channel ${currentChannel.number}`}
                    seek={archivePlayback ? { position: archivePos, duration: archivePlayback.duration, onSeek: seekArchive } : null}
                  >
                    {archivePlayback ? (
                      <React.Fragment>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos - 300)}>−5 min</button>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos - 30)}>−30 s</button>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos + 30)}>+30 s</button>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos + 300)}>+5 min</button>
                        <button className="pc-icon" title="Download" onClick={() => startDownload(archivePlayback.streamUrl)}><Icon name="download" /></button>
                        <button className="pc-pill" onClick={() => playChannel(archivePlayback.channel)}><span className="live-dot"></span> Live</button>
                        {archivePlayback.fromGuide && (
                          <button className="pc-pill" onClick={() => switchSection('guide')}><Icon name="calendar" size={14} /> Recordings</button>
                        )}
                      </React.Fragment>
                    ) : (
                      currentChannel.archive && (
                        <button className="pc-pill" onClick={() => openArchive(currentChannel)}><Icon name="rewind" size={14} /> Archive</button>
                      )
                    )}
                  </PlayerControls>
                </>
              ) : (
                <div className="no-channel-message">
                  <div className="icon"><Icon name="tv" size={44} /></div>
                  <h3>Select a Channel</h3>
                  <p>Choose a genre and channel from the menu</p>
                </div>
              )}
            </div>
          </div>
          
          </React.Fragment>
          )}

          {/* Archive Modal */}
          {archiveChannel && (
            <div className="modal-overlay" onClick={() => setArchiveChannel(null)}>
              <div className="modal archive-modal" onClick={e => e.stopPropagation()}>
                <h2>{archiveChannel.name}</h2>
                
                <div className="archive-days">
                  {getArchiveDays(archiveChannel).map(day => (
                    <button
                      key={day.date}
                      type="button"
                      className={`theme-option ${archiveDate === day.date ? 'active' : ''}`}
                      onClick={() => loadArchiveDay(archiveChannel, day.date)}
                    >
                      {day.label}
                    </button>
                  ))}
                </div>
                
                {archiveError && <div className="error-msg">{archiveError}</div>}
                
                <div className="archive-programs">
                  {archiveLoading && <div className="archive-empty">Loading programme guide...</div>}
                  {!archiveLoading && archivePrograms.length === 0 && !archiveError && (
                    <div className="archive-empty">No programme guide for this day.</div>
                  )}
                  {archivePrograms.map(program => {
                    const started = program.start <= Date.now() / 1000;
                    const available = program.archive && started;
                    const infoOpen = archiveInfoId === program.id;
                    return (
                      <React.Fragment key={program.id}>
                        <div className={`archive-row ${available ? '' : 'unavailable'} ${infoOpen ? 'open' : ''}`}>
                          <span className="archive-time">{clockTime(program.start)} – {clockTime(program.stop)}</span>
                          <span className="archive-name">{program.name}</span>
                          <span className="archive-actions">
                            <button
                              type="button"
                              title="Programme info"
                              className={infoOpen ? 'active' : ''}
                              onClick={() => setArchiveInfoId(infoOpen ? null : program.id)}
                            >
                              <Icon name="info" size={14} />
                            </button>
                            {available && <button type="button" title="Play" onClick={() => playArchiveProgram(program)}><Icon name="play" size={14} filled /></button>}
                            {available && <button type="button" title="Download" onClick={() => downloadArchiveProgram(program)}><Icon name="download" size={14} /></button>}
                          </span>
                        </div>
                        {infoOpen && (
                          <div className="archive-info">
                            <div className="archive-info-meta">
                              {Math.round((program.stop - program.start) / 60)} min
                              {!program.archive && ' · not in the archive'}
                              {program.archive && !started && ' · not aired yet'}
                            </div>
                            {program.descr || 'No description available.'}
                          </div>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>
                
                <div className="archive-interval">
                  <label>Download an interval of this day</label>
                  <div className="archive-interval-row">
                    <input type="time" value={intervalFrom} onChange={(e) => setIntervalFrom(e.target.value)} />
                    <span>to</span>
                    <input type="time" value={intervalTo} onChange={(e) => setIntervalTo(e.target.value)} />
                    <button type="button" className="btn btn-secondary" onClick={downloadArchiveInterval}><Icon name="download" size={16} /> Download</button>
                  </div>
                </div>

                <button
                  type="button"
                  className="btn btn-secondary"
                  onClick={() => setArchiveChannel(null)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Preferences Modal */}
          {showPreferences && (
            <div className="modal-overlay" onClick={() => setShowPreferences(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>Preferences</h2>
                
                <div className="form-group">
                  <label>Theme</label>
                  <p style={{fontSize: '0.8125rem', color: 'var(--text-tertiary)', marginBottom: 'var(--space-md)'}}>
                    Choose your preferred color theme
                  </p>
                  
                  <div className="theme-selector">
                    <button 
                      className={`theme-option ${currentTheme === 'midnight' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('midnight')}
                      type="button"
                    >
                      Midnight
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'carbon' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('carbon')}
                      type="button"
                    >
                      Carbon
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'ocean' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('ocean')}
                      type="button"
                    >
                      Ocean
                    </button>
                  </div>
                </div>

                <button 
                  type="button" 
                  className="btn btn-secondary" 
                  onClick={() => setShowPreferences(false)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {showChangePassword && (
            <div className="modal-overlay" onClick={() => setShowChangePassword(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>Change Password</h2>
                {error && <div className="error-msg">{error}</div>}
                {success && <div className="success-msg">{success}</div>}
                <form onSubmit={handleChangePassword}>
                  <div className="form-group">
                    <label>Current Password</label>
                    <input
                      type="password"
                      value={currentPassword}
                      onChange={(e) => setCurrentPassword(e.target.value)}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>New Password</label>
                    <input
                      type="password"
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      required
                      minLength={6}
                    />
                  </div>
                  <div className="form-group">
                    <label>Confirm New Password</label>
                    <input
                      type="password"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      required
                    />
                  </div>
                  <button type="submit" className="btn">Change Password</button>
                  <button 
                    type="button" 
                    className="btn btn-secondary" 
                    onClick={() => setShowChangePassword(false)}
                  >
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
