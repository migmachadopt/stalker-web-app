              <button key={step} type="button" className={Math.abs(step) === 1 ? 'fine' : ''} onClick={() => move(value + step)}>
                {text}
              </button>
            ))}
          </div>
        </div>
      );

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal cut-editor" onClick={e => e.stopPropagation()}>
            <button className="vod-close" onClick={onClose} title="Close"><Icon name="x" size={18} /></button>
            <h2>{job.title}</h2>
            <p className="cut-hint">
              Move each marker until its picture is the first and the last frame you want to keep.
              The arrow keys move the selected marker one frame at a time (hold Shift for one second).
            </p>

    function LibraryBrowser() {
      const [data, setData] = useState(null);       // { recordings, ffmpeg, freeBytes }
      const [error, setError] = useState('');
      const [editing, setEditing] = useState(null);
      const [playing, setPlaying] = useState(null); // { title, subtitle, url }
      const videoRef = useRef(null);

      const refresh = async () => {
        try {
          const result = await api.recordings();
          if (!result.success) throw new Error(result.error || 'Could not load the library');
          setData(result);
          setError('');
        } catch (err) {
          setError(err.message);
        }
      };

      // Progress is followed while the library is open
      useEffect(() => {
        refresh();
        const timer = setInterval(refresh, 3000);
        return () => clearInterval(timer);
      }, []);

      const act = async (action, confirmText) => {
        if (confirmText && !confirm(confirmText)) return;
        try {
          const result = await action();
          if (result && result.success === false) throw new Error(result.error);
        } catch (err) {
          setError(err.message || 'Action failed');
        }
        refresh();
      };

      const media = async (job) => {
        const ticket = await api.recordingTicket(job.id);
        if (!ticket.success) throw new Error(ticket.error || 'Recording not available');
        return `${BACKEND_ORIGIN}${ticket.url}`;
      };

      const play = (job) => act(async () => {
        setPlaying({ title: job.title, subtitle: job.channelName, url: await media(job) });
      });

      const download = (job) => act(async () => {
        const link = document.createElement('a');
        link.href = `${await media(job)}?download=1`;
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      const closePlayer = () => {
        const video = videoRef.current;
        if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
        if (document.fullscreenElement) document.exitFullscreen();
        setPlaying(null);
      };

      const recordings = data ? data.recordings : [];
      const groups = [
        { title: 'Downloading to the server', states: ['downloading', 'queued'] },
        { title: 'Waiting for you to mark start and end', states: ['ready'] },
        { title: 'Converting to MP4', states: ['converting', 'waiting'] },
        { title: 'Finished', states: ['done'] },
        { title: 'Failed', states: ['failed'] }
      ].map(group => ({
        ...group,
        // The one being worked on first, then the ones waiting their turn
        items: recordings
          .filter(job => group.states.includes(job.state))
          .sort((a, b) => group.states.indexOf(a.state) - group.states.indexOf(b.state))
      })).filter(group => group.items.length);

      const describe = (job) => {
        switch (job.state) {
          case 'queued': return 'Waiting for its turn to download';
          case 'downloading': return `Downloading ${job.progress}%${job.sourceBytes ? ` of ${formatBytes(job.sourceBytes)}` : ''}`;
          case 'ready': return `${formatLength(job.duration)} downloaded${job.sourceBytes ? ` · ${formatBytes(job.sourceBytes)}` : ''}`;
          case 'waiting': return `Waiting for its turn to convert · ${formatLength(job.cutEnd - job.cutStart)}`;
          case 'converting': return `Converting ${job.progress}% · ${formatLength(job.cutEnd - job.cutStart)}`;
          case 'done': return `${formatLength(job.outputDuration)} · ${formatBytes(job.outputBytes)} · MP4`;
          default: return job.error || 'Failed';
        }
      };

      return (
        <div className="vod-browser guide">
          <div className="vod-topbar">
            <h2>Library</h2>
            {data && data.freeBytes !== null && (
              <span className="library-free">{formatBytes(data.freeBytes)} free on the server</span>
            )}
          </div>

          <div className="library-scroll">
            {error && <div className="vod-message"><div className="error-msg">{error}</div></div>}
            {data && data.storageError && (
              <div className="vod-message"><div className="error-msg">
                The storage folder is not available: {data.storageError}
              </div></div>
            )}
            {data && !data.ffmpeg && (
              <div className="vod-message"><div className="error-msg">
                ffmpeg is not installed on the server, so recordings cannot be previewed or converted.
              </div></div>
            )}

            {data && recordings.length === 0 && (
              <div className="vod-message">
                Nothing here yet. In Recordings, open a programme and choose "Save to library" to keep it as an MP4.
              </div>
            )}

            {groups.map(group => (
              <div key={group.title} className="library-group">
                <h3>{group.title}</h3>
                {group.items.map(job => (
                  <div key={job.id} className={`library-item ${job.state}`}>
                    <img
                      src={job.channelLogo || CHANNEL_LOGO_FALLBACK}
                      alt=""
                      onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }}
                    />
                    <div className="library-text">
                      <div className="library-title">{job.title}</div>
                      <div className="library-sub">{job.channelName} · {describe(job)}</div>
                      {job.state === 'ready' && job.error && <div className="library-error">{job.error}</div>}
                      {(job.state === 'downloading' || job.state === 'converting') && (
                        <div className="library-progress"><span style={{ width: `${job.progress}%` }}></span></div>
                      )}
                    </div>
                    <div className="library-actions">
                      {job.state === 'ready' && (
                        <button className="vod-play" onClick={() => setEditing(job)}><Icon name="scissors" size={15} /> Mark start and end</button>
                      )}
                      {job.state === 'done' && (
                        <React.Fragment>
                          <button className="vod-play" onClick={() => play(job)}><Icon name="play" size={15} filled /> Play</button>
                          <button className="library-icon" title="Download the MP4" onClick={() => download(job)}><Icon name="download" size={16} /></button>
                        </React.Fragment>
                      )}
                      {job.state === 'failed' && (
                        <button className="vod-secondary" onClick={() => act(() => api.recordingRetry(job.id))}>Try again</button>
                      )}
                      {(job.state === 'converting' || job.state === 'waiting') && (
                        <button className="vod-secondary" onClick={() => act(() => api.recordingCancel(job.id))}>Stop</button>
                      )}
                      <button
                        className="library-icon"
                        title={job.state === 'downloading' || job.state === 'queued' ? 'Cancel' : 'Delete'}
                        onClick={() => act(() => api.recordingRemove(job.id), `Delete "${job.title}" from the library?`)}
                      >
                        <Icon name="trash" size={16} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>

          {editing && (
            <CutEditor
              job={editing}
              onClose={() => setEditing(null)}
              onQueued={() => { setEditing(null); refresh(); }}
            />
          )}

          {playing && (
            <div className="vod-player">
              <video key={playing.url} ref={videoRef} src={playing.url} autoPlay playsInline />
              <PlayerControls
                key={playing.url}
                videoRef={videoRef}
                title={playing.title}
                subtitle={playing.subtitle}
                onClose={closePlayer}
              />
            </div>
          )}
        </div>
      );
    }

      const handleLogout = async () => {

              playerRef.current.destroy?.();
            } catch (err) {

            }

        } catch (error) {

        // Reset ALL state

        setListUpdatedAt(null);
        setHiddenGroups(0);
        setSelectedGenre(null);
        setShowChannels(false);
        setSearchTerm('');

      // ═══════════════════════════════════════════════════════════════════════
      // IPTV FUNCTIONS

      const connectToIPTV = async () => {

          await loadChannelList(false);
          
          // Start watchdog
          startWatchdog(sessionId);
          
          setScreen('main');
        } catch (err) { 
          setError(err.message); 
          setScreen('noconfig'); 
        }
      };

      const loadChannelList = async (refresh) => {
        const chData = await api.iptvGetChannels(refresh);
        
        if (!chData.success) {
          throw new Error(chData.error || 'Failed to load channels');
        }
        
        setChannels(chData.channels);
        setGenres(
          chData.genres
            .map(g => ({
              id: g.id,
              name: g.title,
              icon: utils?.getIconForGenre?.(g.title) || '📁',
              number: g.number ?? Number.MAX_SAFE_INTEGER,
              count: g.count
            }))
            .sort((a, b) => {
              if (a.number !== b.number) return a.number - b.number;
              return a.name.localeCompare(b.name);
            })
        );
        setListUpdatedAt(chData.updatedAt);
        setHiddenGroups(chData.hiddenGroups || 0);
      };

      const handleRefreshChannels = async () => {
        if (isRefreshing) return;
        
        setIsRefreshing(true);
        setListError('');
        
        try {
          await loadChannelList(true);
          
          // The selected group may have been removed or hidden meanwhile
          setShowChannels(false);
          setSearchTerm('');
        } catch (err) {
          setListError(err.message);
        } finally {
          setIsRefreshing(false);
        }
      };

      const startWatchdog = (sessionId) => {
        if (watchdogIntervalRef.current) {
          clearInterval(watchdogIntervalRef.current);
        }
        
        watchdogIntervalRef.current = setInterval(() => {
          api.iptvWatchdog().catch(() => {
            // Silent fail - watchdog is best-effort
          });
        }, 60000); // 60 seconds
      };

      const handleSelectGenre = (genreId) => { 
        setSelectedGenre(genreId); 
        setShowChannels(true); 
        setSearchTerm(''); 
      };
      
      const handleBackToGenres = () => {
        setShowChannels(false);
        setSearchTerm('');
      };

      const getGenreChannels = () => {
        if (selectedGenre === null) return [];
        
        let filtered = channels.filter(ch => ch.tv_genre_id === selectedGenre);
        
        if (searchTerm) { 
          const term = searchTerm.toLowerCase(); 
          filtered = filtered.filter(ch => 
            ch.name.toLowerCase().includes(term) || 
            ch.number.toString().includes(term)
          ); 
        }
        
        return filtered.sort((a, b) => a.number - b.number);
      };

      const getFilteredGenres = () => { 
        if (!searchTerm) return genres; 
        
        const term = searchTerm.toLowerCase(); 
        return genres.filter(g => g.name.toLowerCase().includes(term)); 
      };

      // ═══════════════════════════════════════════════════════════════════════
      // PLAYER FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const MAX_LIVE_RETRIES = 5;
      const LIVE_BUFFER_SECONDS = 4;

      const cancelLiveRetry = () => {
        clearTimeout(liveRetryRef.current.timer);
        liveRetryRef.current.timer = null;
      };

      // A live stream that drops is requested again, like a set-top box does
      const scheduleLiveRetry = (channel) => {
        const retry = liveRetryRef.current;
        cancelLiveRetry();
        
        // It had been playing fine for a while: this is a new incident
        if (retry.startedAt && Date.now() - retry.startedAt > 60000) retry.count = 0;
        retry.startedAt = 0;
        
        if (retry.count >= MAX_LIVE_RETRIES) {
          setPlayerNotice('Stream unavailable. Select the channel again to retry.');
          return;
        }
        
        retry.count++;
        setPlayerNotice(`Reconnecting... (${retry.count}/${MAX_LIVE_RETRIES})`);
        retry.timer = setTimeout(() => playChannel(channel, true), Math.min(retry.count * 1000, 5000));
      };

      const playChannel = async (channel, isRetry = false) => {
        cancelLiveRetry();
        if (!isRetry) {
          liveRetryRef.current.count = 0;
          setPlayerNotice('');
        }
        
        setCurrentChannel(channel);
        setArchivePlayback(null);
        
        try {
          const data = await api.iptvGetStream(channel.id);
          
          if (data.success && data.streamUrl) {
            loadStream(data.streamUrl, data.streamType, channel);
          } else {
            scheduleLiveRetry(channel);
          }
        } catch (err) { 
          scheduleLiveRetry(channel);
        }
      };

      const loadStream = (streamUrl, streamType, channel) => {
        const video = videoRef.current;
        if (!video) return;

        // Cleanup previous player
        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }

        video.removeAttribute('src');
        video.load();
        video.ontimeupdate = null;
        video.onplaying = () => {
          setPlayerNotice('');
          liveRetryRef.current.startedAt = Date.now();
        };
        video.onerror = () => {
          cancelLiveRetry();
          setPlayerNotice('This channel cannot be decoded by this browser.');
        };

        const absoluteUrl = streamUrl.startsWith('/')
          ? `${BACKEND_ORIGIN}${streamUrl}`
          : streamUrl;

        video._userPaused = false;
        video.onwaiting = null;
        video.oncanplay = () => { video.play().catch(() => {}); };

        if (streamType === 'HLS') {
          // HLS stream: native on Safari, HLS.js on Chrome/Firefox
          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = absoluteUrl;
            video.play().catch(() => {});
          } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            const hls = new Hls({ liveSyncDurationCount: 3, enableWorker: false });
            hls.loadSource(absoluteUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
            playerRef.current = hls;
          }
        } else {
          // MPEG-TS, FLV, or raw HTTP stream via mpegts.js
          if (!mpegts || !mpegts.isSupported()) {
            // Fallback to native video
            video.src = absoluteUrl;
            video.play().catch(() => {});
            return;
          }

          mpegts.LoggingControl.applyConfig({ enableAll: false });

          const player = mpegts.createPlayer({
            type: 'mpegts',
            isLive: true,
            url: absoluteUrl
          }, {
            enableWorker: false,
            enableStashBuffer: true,
            stashInitialSize: 384 * 1024,
            isLive: true,
            lazyLoad: false,
            autoCleanupSourceBuffer: true,
            enableLogging: false
          });

          // Upstream closed or failed: ask for the stream again
          const onDrop = () => {
            if (playerRef.current !== player) return;
            scheduleLiveRetry(channel);
          };
          player.on(mpegts.Events.LOADING_COMPLETE, onDrop);
          player.on(mpegts.Events.ERROR, (type) => {
            if (type === mpegts.ErrorTypes.NETWORK_ERROR) onDrop();
          });

          player.attachMediaElement(video);
          player.load();

          playerRef.current = player;

          // A live stream arrives in real time, so the only way to have a buffer
          // is to wait for one: hold playback until a few seconds are queued, and
          // do the same again whenever playback catches up with the buffer.
          const bufferedAhead = () => video.buffered.length
            ? video.buffered.end(video.buffered.length - 1) - video.currentTime
            : 0;

          const playWhenBuffered = () => {
            clearInterval(liveBufferTimer.current);
            const began = Date.now();
            liveBufferTimer.current = setInterval(() => {
              if (playerRef.current !== player) { clearInterval(liveBufferTimer.current); return; }
              if (bufferedAhead() >= LIVE_BUFFER_SECONDS || Date.now() - began > 12000) {
                clearInterval(liveBufferTimer.current);
                if (!video._userPaused) video.play().catch(() => {});
              }
            }, 200);
          };

          video.oncanplay = null;
          video.onwaiting = () => {
            if (playerRef.current !== player || video._userPaused || video.seeking) return;
            video.pause();
            playWhenBuffered();
          };
          playWhenBuffered();
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // ARCHIVE (CATCH-UP) FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const pad2 = (n) => String(n).padStart(2, '0');
      const localDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const clockTime = (ts) => { const d = new Date(ts * 1000); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const formatPosition = (seconds) => {
        const s = Math.max(0, Math.floor(seconds));
        const h = Math.floor(s / 3600);
        return `${h > 0 ? h + ':' : ''}${h > 0 ? pad2(Math.floor((s % 3600) / 60)) : Math.floor(s / 60)}:${pad2(s % 60)}`;
      };

      // Days the channel keeps in its archive, newest first
      const getArchiveDays = (channel) => {
        const count = Math.max(1, Math.ceil((channel.archiveHours || 24) / 24)) + 1;
        return Array.from({ length: count }, (_, i) => {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const label = i === 0 ? 'Today' : i === 1 ? 'Yesterday'
            : d.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit' });
          return { date: localDate(d), label };
        });
      };

      const loadArchiveDay = async (channel, date) => {
        setArchiveDate(date);
        setArchiveInfoId(null);
        setArchiveNote('');
        setArchivePrograms([]);
        setArchiveError('');
        setArchiveLoading(true);
        
        try {
          const data = await api.iptvGetEpg(channel.id, date);
          if (!data.success) throw new Error(data.error || 'Failed to load programme guide');
          setArchivePrograms(data.programs);
        } catch (err) {
          setArchiveError(err.message);
        } finally {
          setArchiveLoading(false);
        }
      };

      const openArchive = (channel) => {
        setArchiveChannel(channel);
        loadArchiveDay(channel, localDate(new Date()));
      };

      const requestArchive = async (channel, window) => {
        const data = await api.iptvGetArchiveStream(channel.id, { date: archiveDate, ...window });
        if (!data.success) throw new Error(data.error || 'Archive not available');
        return data;
      };

      const programWindow = (program) => ({
        programId: program.id,
        title: `${program.name} ${archiveDate} ${clockTime(program.start).replace(':', '.')}`
      });

      const startDownload = (streamUrl) => {
        const link = document.createElement('a');
        link.href = `${BACKEND_ORIGIN}${streamUrl}?download=1`;
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      const playArchiveProgram = async (program) => {
        const channel = archiveChannel;
        setArchiveError('');
        setCurrentChannel(channel);
        
        try {
          const data = await requestArchive(channel, programWindow(program));
          setArchivePlayback({
            channel,
            title: `${program.name} · ${clockTime(program.start)}`,
            start: data.start,
            duration: data.duration,
            streamUrl: data.streamUrl
          });
          setArchiveChannel(null);
          loadArchiveStream(data.streamUrl, 0);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      const saveArchiveProgram = async (program) => {
        setArchiveError('');
        setArchiveNote('');
        try {
          const data = await api.recordingAdd(archiveChannel.id, {
            date: archiveDate,
            ...programWindow(program),
            ...withDownloadMargin(program)
          });
          if (!data.success) throw new Error(data.error || 'Could not save to the library');
          setArchiveNote(`"${program.name}" added to the library.`);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      const downloadArchiveProgram = async (program) => {
        setArchiveError('');
        try {
          const data = await requestArchive(archiveChannel, { ...programWindow(program), ...withDownloadMargin(program) });
          startDownload(data.streamUrl);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      // Download any time interval of the selected day (may run past midnight)
      const downloadArchiveInterval = async () => {
        setArchiveError('');
        
        const from = new Date(`${archiveDate}T${intervalFrom}:00`);
        const to = new Date(`${archiveDate}T${intervalTo}:00`);
        if (isNaN(from) || isNaN(to)) { setArchiveError('Choose a start and end time'); return; }
        if (to <= from) to.setDate(to.getDate() + 1);
        
        const start = Math.floor(from.getTime() / 1000);
        const duration = Math.floor(to.getTime() / 1000) - start;
        
        // The server needs one archived programme of this day to issue the link
        const seed = archivePrograms.find(p => p.archive && p.start <= start && p.stop > start)
          || archivePrograms.find(p => p.archive);
        if (!seed) { setArchiveError('No archived programmes on this day'); return; }
        
        try {
          const data = await requestArchive(archiveChannel, {
            programId: seed.id,
            start,
            duration,
            title: `${archiveDate} ${intervalFrom.replace(':', '.')}-${intervalTo.replace(':', '.')}`
          });
          startDownload(data.streamUrl);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      // Archive files are finite: load lazily and seek by reopening at a position
      const loadArchiveStream = (streamUrl, position) => {
        const video = videoRef.current;
        if (!video) return;

        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }

        video.removeAttribute('src');
        video.load();

        cancelLiveRetry();
        clearInterval(liveBufferTimer.current);
        setPlayerNotice('');
        video._userPaused = false;
        video.onwaiting = null;
        video.onplaying = () => setPlayerNotice('');
        video.onerror = () => setPlayerNotice('This recording cannot be decoded by this browser. You can still download it.');

        archiveBaseRef.current = position;
        setArchivePos(position);

        const url = `${BACKEND_ORIGIN}${streamUrl}?start=${Math.floor(position)}`;

        video.oncanplay = () => { video.play().catch(() => {}); };
        video.ontimeupdate = () => {
          const current = Math.floor(archiveBaseRef.current + video.currentTime);
          setArchivePos(prev => (prev === current ? prev : current));
        };

        if (!mpegts || !mpegts.isSupported()) {
          video.src = url;
          video.play().catch(() => {});
          return;
        }

        const player = mpegts.createPlayer({
          type: 'mpegts',
          isLive: false,
          url
        }, {
          enableWorker: false,
          lazyLoad: true,
          lazyLoadMaxDuration: 120,
          lazyLoadRecoverDuration: 30,
          seekType: 'range',
          autoCleanupSourceBuffer: true,
          enableLogging: false
        });

        player.on(mpegts.Events.ERROR, (type) => {
          if (playerRef.current !== player) return;
          if (type === mpegts.ErrorTypes.NETWORK_ERROR) {
            setPlayerNotice('Archive stream interrupted. Move the position to continue.');
          }
        });

        player.attachMediaElement(video);
        player.load();
        video.play().catch(() => {});

        playerRef.current = player;
      };

      const seekArchive = (position) => {
        if (!archivePlayback) return;
        const target = Math.min(Math.max(0, position), Math.max(0, archivePlayback.duration - 5));
        loadArchiveStream(archivePlayback.streamUrl, target);
      };

      // Show what is on air under the channel name, and follow programme changes
      const liveChannelId = currentChannel && !archivePlayback ? currentChannel.id : null;
      
      useEffect(() => {
        setOnAir(null);
        if (liveChannelId === null) return;
        
        let cancelled = false;
        let timer = null;
        
        const load = async () => {
          let wait = 5 * 60 * 1000;
          
          try {
            const data = await api.iptvGetNow(liveChannelId);
            if (cancelled) return;
            
            const now = Date.now() / 1000;
            // Day-long entries are placeholders some channels carry instead of a real guide
            const programs = (data.success ? data.programs : []).filter(p => p.stop - p.start <= 12 * 3600);
            const current = programs.find(p => p.start <= now && p.stop > now) || null;
            const next = programs.find(p => p.start > now) || null;
            setOnAir(current || next ? { current, next } : null);
            
            // Look again shortly after the current programme ends
            if (current) wait = Math.min(Math.max((current.stop - now) * 1000 + 5000, 30000), wait);
          } catch (err) {
            if (cancelled) return;
          }
          
          timer = setTimeout(load, wait);
        };
        
        load();
        return () => { cancelled = true; clearTimeout(timer); };
      }, [liveChannelId]);

      // The provider allows one stream per account: leaving live TV stops it
      const switchSection = (next) => {
        if (next === section) return;
        
        cancelLiveRetry();
        setPlayerNotice('');
        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }
        setCurrentChannel(null);
        setArchivePlayback(null);
        setArchiveChannel(null);
        if (next === 'guide') setGuideOpened(true);
        setSection(next);
      };

      // ── Recordings guide actions ──────────────────────────────────────────
      
      const guideWindow = (date, program) => ({
        date,
        programId: program.id,
        title: `${program.name} ${date} ${clockTime(program.start).replace(':', '.')}`
      });

      // Plays in the TV player; the guide stays mounted to come back to
      const playGuideProgram = async (channel, date, program) => {
        const data = await requestArchive(channel, guideWindow(date, program));
        
        cancelLiveRetry();
        setPlayerNotice('');
        setSection('tv');
        setCurrentChannel(channel);
        setArchivePlayback({
          channel,
          title: `${program.name} · ${clockTime(program.start)}`,
          start: data.start,
          duration: data.duration,
          streamUrl: data.streamUrl,
          fromGuide: true
        });
        
        // The video element exists only after the TV player has rendered
        for (let i = 0; i < 20 && !videoRef.current; i++) {
          await new Promise(resolve => setTimeout(resolve, 50));
        }
        loadArchiveStream(data.streamUrl, 0);
      };

      // Keep a programme on the server to trim and convert to MP4 (see Library)
      const saveGuideProgram = async (channel, date, program) => {
        const data = await api.recordingAdd(channel.id, { ...guideWindow(date, program), ...withDownloadMargin(program) });
        if (!data.success) throw new Error(data.error || 'Could not save to the library');
      };

      const downloadGuideProgram = async (channel, date, program) => {
        const data = await requestArchive(channel, { ...guideWindow(date, program), ...withDownloadMargin(program) });
        startDownload(data.streamUrl);
      };

      const watchLiveFromGuide = (channel) => {
        setSection('tv');
        playChannel(channel);
      };

      const toggleFullscreen = () => { 
        if (isFullscreen) {
          document.exitFullscreen();
        } else {
          document.querySelector('.player-section')?.requestFullscreen();
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════════════════════════════════════
      
      if (!authChecked) {
        return (
          <div className="loading-screen">
            <div className="spinner"></div>
            <div className="loading-text">Loading...</div>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <div className="login-screen">
            <div className="login-card">
              <div className="login-logo"><Icon name="tv" size={26} /></div>
              <h1>IPTV Player</h1>
              <p className="subtitle">Sign in to continue</p>

              {error && <div className="error-msg">{error}</div>}
              
              <form onSubmit={handleLogin}>
                <div className="form-group">
                  <label>Username</label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Enter username"
                    required
                    autoFocus
                  />
                </div>
                
                <div className="form-group">
                  <label>Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Enter password"
                    required
                  />
                </div>
                
                <button type="submit" className="btn" disabled={isLoggingIn}>
                  {isLoggingIn ? 'Signing in...' : 'Sign In'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (screen === 'noconfig') {
        return (
          <div className="no-config-screen">
            <div className="no-config-card">
              <div className="icon"><Icon name="sliders" size={40} /></div>
              <h2>Configuration Required</h2>
              <p>Your account is not yet configured for IPTV access.<br/>Contact the administrator to set up your portal URL and MAC address.</p>
              <button className="btn btn-secondary" onClick={handleLogout}>Sign Out</button>
            </div>
          </div>
        );
      }

      if (screen === 'loading') {
        return (
          <div className="loading-screen">
            <div className="spinner"></div>
            <div className="loading-text">Loading IPTV</div>
            <div className="loading-progress">{loadingProgress}</div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════════════
      // MOBILE VERSION - one flat list of the channels made for phones
      // ═══════════════════════════════════════════════════════════════════════
      
      if (MOBILE_VIEW) {
        // The provider's "Mobile" group; any other enabled channel only if there is none
        const mobileGroupIds = new Set(genres.filter(g => /mobile/i.test(g.name)).map(g => g.id));
        const base = mobileGroupIds.size ? channels.filter(ch => mobileGroupIds.has(ch.tv_genre_id)) : channels;
        const term = mobileSearch.trim().toLowerCase();
        const list = base
          .filter(ch => !term || ch.name.toLowerCase().includes(term) || String(ch.number).includes(term))
          .sort((a, b) => a.number - b.number);
        const themes = ['midnight', 'carbon', 'ocean'];

        return (
          <div className="m-app">
            <div className={`m-player player-section ${isFullscreen ? 'fullscreen' : ''}`}>
              {currentChannel ? (
                <React.Fragment>
                  <div className="video-container">
                    <video ref={videoRef} playsInline />
                  </div>
                  {playerNotice && <div className="player-notice">{playerNotice}</div>}
                  <PlayerControls
                    key={`live-${currentChannel.id}`}
                    videoRef={videoRef}
                    live
                    title={currentChannel.name.replace(/\s*MOBILE\s*$/i, '')}
                    subtitle={onAir?.current
                      ? `${onAir.current.name} • ${clockTime(onAir.current.start)} – ${clockTime(onAir.current.stop)}`
                      : null}
                  />
                </React.Fragment>
              ) : (
                <div className="no-channel-message">
                  <div className="icon"><Icon name="tv" size={36} /></div>
                  <p>Choose a channel</p>
                </div>
              )}
            </div>

            <div className="m-bar">
              <div className="search-container">
                <span className="search-icon"><Icon name="search" size={16} /></span>
                <input
                  type="search"
                  className="search-input"
                  placeholder="Search channels..."
                  value={mobileSearch}
                  onChange={(e) => setMobileSearch(e.target.value)}
                />
              </div>
              <button
                className="m-icon"
                title={`Theme: ${currentTheme}`}
                onClick={() => setCurrentTheme(themes[(themes.indexOf(currentTheme) + 1) % themes.length])}
              >
                <Icon name="droplet" size={18} />
              </button>
              <button
                className="m-icon"
                title="Refresh channel list"
                disabled={isRefreshing}
                onClick={handleRefreshChannels}
              >
                <span className={isRefreshing ? 'spin' : ''}><Icon name="refresh" size={18} /></span>
              </button>
              <button className="m-icon" title="Sign out" onClick={handleLogout}>
                <Icon name="logout" size={18} />
              </button>
            </div>

            {listError && <div className="m-note"><div className="error-msg">{listError}</div></div>}

            <div className="m-list">
              {list.map(channel => (
                <div
                  key={channel.id}
                  className={`m-channel ${currentChannel?.id === channel.id ? 'playing' : ''}`}
                  onClick={() => playChannel(channel)}
                >
                  <img
                    src={channel.logo || CHANNEL_LOGO_FALLBACK}
                    alt=""
                    loading="lazy"
                    onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }}
                  />
                  <span className="m-channel-name">{channel.name.replace(/\s*MOBILE\s*$/i, '')}</span>
                  {currentChannel?.id === channel.id && <span className="live-dot"></span>}
                </div>
              ))}

              {list.length === 0 && (
                <div className="m-note">
                  {channels.length === 0
                    ? 'No channels are enabled for your account. Ask the administrator to enable the Mobile group.'
                    : 'No channels match your search.'}
                </div>
              )}

              <a className="m-desktop-link" href="?view=desktop">Open the full version</a>
            </div>
          </div>
        );
      }

      const genreChannels = getGenreChannels();
      const filteredGenres = getFilteredGenres();
      const selectedGenreInfo = genres.find(g => g.id === selectedGenre);

      return (
        <div className="app-layout">
          {/* Navigation Rail */}
          <div className="nav-rail">
            <div className={`nav-item ${section === 'tv' ? 'active' : ''}`} title="TV Channels" onClick={() => switchSection('tv')}><Icon name="tv" /></div>
            <div className={`nav-item ${section === 'guide' ? 'active' : ''}`} title="Recordings" onClick={() => switchSection('guide')}><Icon name="calendar" /></div>
            <div className={`nav-item ${section === 'library' ? 'active' : ''}`} title="Library" onClick={() => switchSection('library')}><Icon name="box" /></div>
            {user?.sections?.vod && (
              <div className={`nav-item ${section === 'vod' ? 'active' : ''}`} title="Video Club" onClick={() => switchSection('vod')}><Icon name="film" /></div>
            )}
            {user?.sections?.series && (
              <div className={`nav-item ${section === 'series' ? 'active' : ''}`} title="Series" onClick={() => switchSection('series')}><Icon name="layers" /></div>
            )}
            <div className="nav-spacer"></div>
            <div className="nav-item" title="Preferences" onClick={() => setShowPreferences(true)}><Icon name="droplet" /></div>
            <div className="nav-item" title="Change Password" onClick={() => setShowChangePassword(true)}><Icon name="lock" /></div>
            {user?.role === 'admin' && (
              <div className="nav-item" title="Admin Panel" onClick={() => window.open('/admin.html', '_blank')}><Icon name="sliders" /></div>
            )}
            <div className="nav-item nav-item-danger" title="Sign Out" onClick={handleLogout}><Icon name="logout" /></div>
          </div>

          {(section === 'vod' || section === 'series') && <VodBrowser key={section} type={section} />}

          {section === 'library' && <LibraryBrowser />}

          {guideOpened && (
            <div className="section-host" style={{ display: section === 'guide' ? 'flex' : 'none' }}>
              <GuideBrowser
                channels={channels}
                genres={genres}
                onPlay={playGuideProgram}
                onDownload={downloadGuideProgram}
                onSave={saveGuideProgram}
                onWatchLive={watchLiveFromGuide}
              />
            </div>
          )}

          {section === 'tv' && (
          <React.Fragment>
          {/* Sidebar */}
          <div className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
            <div className="sidebar-header">
              <div className="sidebar-header-top">
                <div style={{display: 'flex', alignItems: 'center', gap: 'var(--space-sm)'}}>
                  <button 
                    className="collapse-btn"
                    onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                    title={sidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                  >
                    <Icon name={sidebarCollapsed ? 'menu' : 'left'} size={18} />
                  </button>
                  <h2>TV Channels</h2>
                </div>
                <button
                  className="collapse-btn"
                  onClick={handleRefreshChannels}
                  disabled={isRefreshing}
                  title={listUpdatedAt
                    ? `Refresh channel list (last updated ${new Date(listUpdatedAt).toLocaleString()})`
                    : 'Refresh channel list'}
                >
                  <span className={isRefreshing ? 'spin' : ''}><Icon name="refresh" size={16} /></span>
                </button>
              </div>
              <div className="search-container">
                <span className="search-icon"><Icon name="search" size={16} /></span>
                <input
                  type="text"
                  className="search-input"
                  placeholder={showChannels ? "Search channels..." : "Search genres..."}
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>
            </div>
            
            <div className="slide-container">
              <div className={`slide-wrapper ${showChannels ? 'show-channels' : ''}`}>
                {/* Genres Panel */}
                <div className="slide-panel">
                  <div className="groups-panel">
                    {listError && <div className="error-msg">{listError}</div>}
                    {genres.length === 0 && (
                      <div className="groups-empty">
                        <p>No channel groups are enabled for your account.</p>
                        <p>
                          {user?.role === 'admin'
                            ? 'Open the Admin Panel (⚙️) and choose which groups to show.'
                            : 'Contact the administrator to enable them.'}
                        </p>
                      </div>
                    )}
                    {filteredGenres.map(genre => (
                      <div 
                        key={genre.id} 
                        className="group-item" 
                        onClick={() => handleSelectGenre(genre.id)}
                      >
                        <div className="group-info">
                          <div className="group-icon">{genre.icon}</div>
                          <span className="name">{genre.name}</span>
                        </div>
                        <span className="count">{genre.count}</span>
                      </div>
                    ))}
                  </div>
                </div>
                
                {/* Channels Panel */}
                <div className="slide-panel">
                  <div className="channels-panel">
                    {selectedGenreInfo && (
                      <div className="channels-panel-header">
                        <button 
                          className="back-arrow-btn" 
                          onClick={handleBackToGenres}
                          title="Back to genres"
                        >
                          <Icon name="back" size={18} />
                        </button>
                        <div className="channel-header-info">
                          <h3>{selectedGenreInfo.icon} {selectedGenreInfo.name}</h3>
                          <span>{genreChannels.length} channels</span>
                        </div>
                      </div>
                    )}
                    <div className="channels-list">
                      {genreChannels.map(channel => (
                        <div 
                          key={channel.id} 
                          className={`channel-item ${currentChannel?.id === channel.id ? 'playing' : ''}`}
                          onClick={() => playChannel(channel)}
                        >
                          <img
                            src={channel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                            alt=""
                            className="channel-logo"
                            onError={(e) => e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                          />
                          <div className="channel-info">
                            <div className="channel-name">{channel.name}</div>
                            <div className="channel-number">Ch. {channel.number}</div>
                          </div>
                          {currentChannel?.id === channel.id && (
                            <div className="playing-indicator"></div>
                          )}
                          {channel.archive && (
                            <button
                              className="archive-btn"
                              title={`Archive (last ${Math.round(channel.archiveHours / 24)} days)`}
                              onClick={(e) => { e.stopPropagation(); openArchive(channel); }}
                            >
                              <Icon name="rewind" size={14} />
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          {/* Main Content */}
          <div className="main-content">
            {sidebarCollapsed && (
              <button 
                className="floating-sidebar-toggle"
                onClick={() => setSidebarCollapsed(false)}
                title="Show sidebar"
              >
                <Icon name="menu" />
              </button>
            )}
            
            <div className={`player-section ${isFullscreen ? 'fullscreen' : ''}`}>
              {currentChannel ? (
                <>
                  <div className="video-container">
                    <video ref={videoRef} playsInline />
                  </div>
                  {playerNotice && <div className="player-notice">{playerNotice}</div>}
                  <PlayerControls
                    key={archivePlayback ? archivePlayback.streamUrl : `live-${currentChannel.id}`}
                    videoRef={videoRef}
                    live={!archivePlayback}
                    title={archivePlayback ? archivePlayback.title : currentChannel.name}
                    subtitle={archivePlayback
                      ? `${currentChannel.name} • Recording`
                      : onAir?.current
                        ? `${onAir.current.name} • ${clockTime(onAir.current.start)} – ${clockTime(onAir.current.stop)}`
                        : `Channel ${currentChannel.number}`}
                    meta={!archivePlayback && onAir
                      ? [
                          onAir.current ? `Channel ${currentChannel.number}` : '',
                          onAir.next ? `Next: ${onAir.next.name} at ${clockTime(onAir.next.start)}` : ''
                        ].filter(Boolean).join('  •  ')
                      : null}
                    seek={archivePlayback ? { position: archivePos, duration: archivePlayback.duration, onSeek: seekArchive } : null}
                  >
                    {archivePlayback ? (
                      <React.Fragment>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos - 300)}>−5 min</button>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos - 30)}>−30 s</button>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos + 30)}>+30 s</button>
                        <button className="pc-pill" onClick={() => seekArchive(archivePos + 300)}>+5 min</button>
                        <button className="pc-icon" title="Download" onClick={() => startDownload(archivePlayback.streamUrl)}><Icon name="download" /></button>
                        <button className="pc-pill" onClick={() => playChannel(archivePlayback.channel)}><span className="live-dot"></span> Live</button>
                        {archivePlayback.fromGuide && (
                          <button className="pc-pill" onClick={() => switchSection('guide')}><Icon name="calendar" size={14} /> Recordings</button>
                        )}
                      </React.Fragment>
                    ) : (
                      currentChannel.archive && (
                        <button className="pc-pill" onClick={() => openArchive(currentChannel)}><Icon name="rewind" size={14} /> Archive</button>
                      )
                    )}
                  </PlayerControls>
                </>
              ) : (
                <div className="no-channel-message">
                  <div className="icon"><Icon name="tv" size={44} /></div>
                  <h3>Select a Channel</h3>
                  <p>Choose a genre and channel from the menu</p>
                </div>
              )}
            </div>
          </div>
          
          </React.Fragment>
          )}

          {/* Archive Modal */}
          {archiveChannel && (
            <div className="modal-overlay" onClick={() => setArchiveChannel(null)}>
              <div className="modal archive-modal" onClick={e => e.stopPropagation()}>
                <h2>{archiveChannel.name}</h2>
                
                <div className="archive-days">
                  {getArchiveDays(archiveChannel).map(day => (
                    <button
                      key={day.date}
                      type="button"
                      className={`theme-option ${archiveDate === day.date ? 'active' : ''}`}
                      onClick={() => loadArchiveDay(archiveChannel, day.date)}
                    >
                      {day.label}
                    </button>
                  ))}
                </div>
                
                {archiveError && <div className="error-msg">{archiveError}</div>}
                {archiveNote && <div className="success-msg">{archiveNote}</div>}
                
                <div className="archive-programs">
                  {archiveLoading && <div className="archive-empty">Loading programme guide...</div>}
                  {!archiveLoading && archivePrograms.length === 0 && !archiveError && (
                    <div className="archive-empty">No programme guide for this day.</div>
                  )}
                  {archivePrograms.map(program => {
                    const started = program.start <= Date.now() / 1000;
                    const available = program.archive && started;
                    const infoOpen = archiveInfoId === program.id;
                    return (
                      <React.Fragment key={program.id}>
                        <div className={`archive-row ${available ? '' : 'unavailable'} ${infoOpen ? 'open' : ''}`}>
                          <span className="archive-time">{clockTime(program.start)} – {clockTime(program.stop)}</span>
                          <span className="archive-name">{program.name}</span>
                          <span className="archive-actions">
                            <button
                              type="button"
                              title="Programme info"
                              className={infoOpen ? 'active' : ''}
                              onClick={() => setArchiveInfoId(infoOpen ? null : program.id)}
                            >
                              <Icon name="info" size={14} />
                            </button>
                            {available && <button type="button" title="Play" onClick={() => playArchiveProgram(program)}><Icon name="play" size={14} filled /></button>}
                            {available && <button type="button" title="Download" onClick={() => downloadArchiveProgram(program)}><Icon name="download" size={14} /></button>}
                            {available && <button type="button" title="Save to library (trim and convert to MP4)" onClick={() => saveArchiveProgram(program)}><Icon name="box" size={14} /></button>}
                          </span>
                        </div>
                        {infoOpen && (
                          <div className="archive-info">
                            <div className="archive-info-meta">
                              {Math.round((program.stop - program.start) / 60)} min
                              {!program.archive && ' · not in the archive'}
                              {program.archive && !started && ' · not aired yet'}
                            </div>
                            {program.descr || 'No description available.'}
                          </div>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>
                
                <DownloadMargin />

                <div className="archive-interval">
                  <label>Download an interval of this day</label>
                  <div className="archive-interval-row">
                    <input type="time" value={intervalFrom} onChange={(e) => setIntervalFrom(e.target.value)} />
                    <span>to</span>
                    <input type="time" value={intervalTo} onChange={(e) => setIntervalTo(e.target.value)} />
                    <button type="button" className="btn btn-secondary" onClick={downloadArchiveInterval}><Icon name="download" size={16} /> Download</button>
                  </div>
                </div>

                <button
                  type="button"
                  className="btn btn-secondary"
                  onClick={() => setArchiveChannel(null)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Preferences Modal */}
          {showPreferences && (
            <div className="modal-overlay" onClick={() => setShowPreferences(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>Preferences</h2>
                
                <div className="form-group">
                  <label>Theme</label>
                  <p style={{fontSize: '0.8125rem', color: 'var(--text-tertiary)', marginBottom: 'var(--space-md)'}}>
                    Choose your preferred color theme
                  </p>
                  
                  <div className="theme-selector">
                    <button 
                      className={`theme-option ${currentTheme === 'midnight' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('midnight')}
                      type="button"
                    >
                      Midnight
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'carbon' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('carbon')}
                      type="button"
                    >
                      Carbon
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'ocean' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('ocean')}
                      type="button"
                    >
                      Ocean
                    </button>
                  </div>
                </div>

                <a className="prefs-link" href="?view=mobile">Open the mobile version</a>

                <button 
                  type="button" 
                  className="btn btn-secondary" 
                  onClick={() => setShowPreferences(false)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {showChangePassword && (
            <div className="modal-overlay" onClick={() => setShowChangePassword(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>Change Password</h2>
                {error && <div className="error-msg">{error}</div>}
                {success && <div className="success-msg">{success}</div>}
                <form onSubmit={handleChangePassword}>
                  <div className="form-group">
                    <label>Current Password</label>
                    <input
                      type="password"
                      value={currentPassword}
                      onChange={(e) => setCurrentPassword(e.target.value)}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>New Password</label>
                    <input
                      type="password"
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      required
                      minLength={6}
                    />
                  </div>
                  <div className="form-group">
                    <label>Confirm New Password</label>
                    <input
                      type="password"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      required
                    />
                  </div>
                  <button type="submit" className="btn">Change Password</button>
                  <button 
                    type="button" 
                    className="btn btn-secondary" 
                    onClick={() => setShowChangePassword(false)}
                  >
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
