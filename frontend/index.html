<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link rel="stylesheet" href="themes.css">
  
  <!-- API Module -->
  <script src="js/api.js"></script>
  <!-- Utils Module -->
  <script src="js/utils.js"></script>
</head>
<body class="theme-midnight">
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Backend origin used for stream proxy (API_URL comes from api.js)
    const BACKEND_ORIGIN = new URL(API_URL, window.location.href).origin;

    // ═══════════════════════════════════════════════════════════════════════
    // VIDEO CLUB & SERIES BROWSER
    // ═══════════════════════════════════════════════════════════════════════

    const POSTER_FALLBACK = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect fill="%231a1f2e" width="200" height="300"/><text x="100" y="160" text-anchor="middle" fill="%235b7cff" font-size="48">🎬</text></svg>';

    function VodCard({ item, onOpen }) {
      return (
        <div className="vod-card" onClick={() => onOpen(item)} title={item.name}>
          <img
            src={item.poster || POSTER_FALLBACK}
            alt=""
            loading="lazy"
            onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }}
          />
          <div className="vod-card-info">
            <div className="vod-card-name">{item.name}</div>
            <div className="vod-card-meta">
              {[item.year, item.rating ? `★ ${item.rating}` : ''].filter(Boolean).join(' · ')}
            </div>
          </div>
        </div>
      );
    }

    function VodRow({ title, row, onOpen, onSeeAll }) {
      const scroller = useRef(null);
      const scrollBy = (direction) => {
        const el = scroller.current;
        if (el) el.scrollBy({ left: direction * el.clientWidth * 0.85, behavior: 'smooth' });
      };

      if (row && row.items.length === 0) return null;

      return (
        <div className="vod-row">
          <div className="vod-row-header">
            <h3>{title}</h3>
            {row && <button onClick={onSeeAll}>See all{row.total ? ` (${row.total})` : ''} ›</button>}
          </div>
          <div className="vod-row-body">
            <button className="vod-row-arrow left" onClick={() => scrollBy(-1)}>‹</button>
            <div className="vod-row-scroller" ref={scroller}>
              {row
                ? row.items.map(item => <VodCard key={item.id} item={item} onOpen={onOpen} />)
                : Array.from({ length: 8 }, (_, i) => <div key={i} className="vod-card skeleton"></div>)}
            </div>
            <button className="vod-row-arrow right" onClick={() => scrollBy(1)}>›</button>
          </div>
        </div>
      );
    }

    // type: 'vod' (video club) or 'series'
    function VodBrowser({ type }) {
      const isSeries = type === 'series';
      const sectionTitle = isSeries ? 'Series' : 'Video Club';

      const [categories, setCategories] = useState([]);
      const [rows, setRows] = useState({});          // category id -> { items, total }
      const [error, setError] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [grid, setGrid] = useState(null);        // { title, category?, search?, items, total, page, pageSize, loading }
      const [detail, setDetail] = useState(null);
      const [seasons, setSeasons] = useState(null);
      const [seasonIndex, setSeasonIndex] = useState(0);
      const [detailError, setDetailError] = useState('');
      const [busy, setBusy] = useState(false);
      const [playing, setPlaying] = useState(null);  // { title, streamUrl, key }
      const [playerError, setPlayerError] = useState('');
      const videoRef = useRef(null);
      const gridRequest = useRef(0);
      const lastSaved = useRef(0);

      const pad2 = (n) => String(n).padStart(2, '0');

      // Home: categories, then one row per category, loaded one after the other
      useEffect(() => {
        let cancelled = false;

        (async () => {
          try {
            const data = await api.vodCategories(type);
            if (!data.success) throw new Error(data.error || 'Failed to load categories');
            if (cancelled) return;

            const all = [{ id: '*', title: 'Recently added' }, ...data.categories];
            setCategories(all);

            for (const category of all) {
              const list = await api.vodList(type, { category: category.id, page: 1 });
              if (cancelled) return;
              setRows(prev => ({
                ...prev,
                [category.id]: list.success ? { items: list.items, total: list.total } : { items: [], total: 0 }
              }));
            }
          } catch (err) {
            if (!cancelled) setError(err.message || 'Failed to load');
          }
        })();

        return () => { cancelled = true; };
      }, [type]);

      const loadGridPage = async (spec, page, previous) => {
        const requestId = ++gridRequest.current;
        setGrid({ ...spec, items: previous, page: page - 1, loading: true, error: '' });

        let data;
        try {
          data = await api.vodList(type, { category: spec.category, search: spec.search, page });
        } catch (err) {
          data = { success: false, error: 'Failed to load titles' };
        }
        if (gridRequest.current !== requestId) return;

        if (!data.success) {
          setGrid({ ...spec, items: previous, page: page - 1, loading: false, error: data.error });
          return;
        }

        setGrid({
          ...spec,
          items: previous.concat(data.items),
          total: data.total,
          pageSize: data.pageSize,
          page,
          loading: false,
          error: ''
        });
      };

      const openGrid = (spec) => loadGridPage({ ...spec, total: 0, pageSize: 14 }, 1, []);

      const closeGrid = () => {
        gridRequest.current++;
        setGrid(null);
        setSearchTerm('');
      };

      const gridHasMore = grid && !grid.loading && grid.page * grid.pageSize < grid.total;

      const handleGridScroll = (e) => {
        const el = e.currentTarget;
        if (gridHasMore && el.scrollTop + el.clientHeight > el.scrollHeight - 600) {
          loadGridPage(grid, grid.page + 1, grid.items);
        }
      };

      // Search by name, as the user types
      useEffect(() => {
        const term = searchTerm.trim();

        if (term.length < 2) {
          if (grid && grid.search) { gridRequest.current++; setGrid(null); }
          return;
        }

        const timer = setTimeout(() => openGrid({ title: `Results for "${term}"`, search: term }), 400);
        return () => clearTimeout(timer);
      }, [searchTerm]);

      const openDetail = async (item) => {
        setDetail(item);
        setDetailError('');
        setSeasons(null);
        setSeasonIndex(0);

        if (!isSeries) return;

        try {
          const data = await api.vodSeasons(item.id);
          if (!data.success) throw new Error(data.error || 'Failed to load seasons');
          setSeasons(data.seasons);
        } catch (err) {
          setSeasons([]);
          setDetailError(err.message);
        }
      };

      const positionKey = (item, season, episode) =>
        `vodpos:${type}:${item.id}:${season ? `${season.id}:${episode}` : ''}`;

      const savedPosition = (item, season, episode) => {
        try { return Number(localStorage.getItem(positionKey(item, season, episode))) || 0; } catch (_) { return 0; }
      };

      const requestTitle = async (item, season, episode) => {
        const title = season
          ? `${item.name} - ${season.name} E${pad2(episode)}`
          : `${item.name}${item.year && !item.name.includes(item.year) ? ` (${item.year})` : ''}`;

        const data = await api.vodStream(type, {
          cmd: season ? season.cmd : item.cmd,
          episode: season ? episode : undefined,
          title
        });
        if (!data.success) throw new Error(data.error || 'This title is not available');

        return { title, streamUrl: data.streamUrl, key: positionKey(item, season, episode) };
      };

      const playTitle = async (item, season, episode) => {
        if (busy) return;
        setBusy(true);
        setDetailError('');
        try {
          setPlayerError('');
          setPlaying(await requestTitle(item, season, episode));
        } catch (err) {
          setDetailError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const downloadTitle = async (item, season, episode) => {
        if (busy) return;
        setBusy(true);
        setDetailError('');
        try {
          const title = await requestTitle(item, season, episode);
          const link = document.createElement('a');
          link.href = `${BACKEND_ORIGIN}${title.streamUrl}?download=1`;
          link.download = '';
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (err) {
          setDetailError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const closePlayer = () => {
        const video = videoRef.current;
        if (video) {
          video.pause();
          video.removeAttribute('src');
          video.load();
        }
        setPlaying(null);
      };

      // Continue where the viewer left off
      const handleLoadedMetadata = (e) => {
        const video = e.currentTarget;
        let saved = 0;
        try { saved = Number(localStorage.getItem(playing.key)) || 0; } catch (_) {}
        if (saved > 30 && (!isFinite(video.duration) || saved < video.duration - 60)) {
          video.currentTime = saved;
        }
      };

      const handleTimeUpdate = (e) => {
        const video = e.currentTarget;
        if (Math.abs(video.currentTime - lastSaved.current) < 5) return;
        lastSaved.current = video.currentTime;
        try { localStorage.setItem(playing.key, String(Math.floor(video.currentTime))); } catch (_) {}
      };

      // Escape closes the innermost layer
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'Escape') return;
          if (playing) closePlayer();
          else if (detail) setDetail(null);
          else if (grid) closeGrid();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [playing, detail, grid]);

      const heroRow = categories.slice(1).map(c => rows[c.id]).find(r => r && r.items.length) || rows['*'];
      const hero = heroRow && heroRow.items[0];
      const season = seasons && seasons[seasonIndex];

      const meta = (item) => [
        item.year,
        item.minutes ? `${Math.floor(item.minutes / 60)}h ${pad2(item.minutes % 60)}m` : '',
        item.rating ? `★ ${item.rating}` : '',
        item.hd ? 'HD' : ''
      ].filter(Boolean);

      return (
        <div className="vod-browser">
          <div className="vod-topbar">
            {grid && <button className="vod-back" onClick={closeGrid} title="Back">←</button>}
            <h2>{grid ? grid.title : sectionTitle}</h2>
            <div className="search-container vod-search">
              <span className="search-icon">🔍</span>
              <input
                type="text"
                className="search-input"
                placeholder={isSeries ? 'Search series by name...' : 'Search films by name...'}
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>
          </div>

          {error && <div className="vod-message"><div className="error-msg">{error}</div></div>}

          {grid ? (
            <div className="vod-scroll" onScroll={handleGridScroll}>
              {grid.total > 0 && <div className="vod-grid-count">{grid.total} titles</div>}
              <div className="vod-grid">
                {grid.items.map(item => <VodCard key={item.id} item={item} onOpen={openDetail} />)}
                {grid.loading && Array.from({ length: 7 }, (_, i) => <div key={`s${i}`} className="vod-card skeleton"></div>)}
              </div>
              {grid.error && <div className="vod-message"><div className="error-msg">{grid.error}</div></div>}
              {!grid.loading && grid.items.length === 0 && !grid.error && (
                <div className="vod-message">No titles found.</div>
              )}
              {gridHasMore && (
                <div className="vod-more">
                  <button className="btn btn-secondary" onClick={() => loadGridPage(grid, grid.page + 1, grid.items)}>Load more</button>
                </div>
              )}
            </div>
          ) : (
            <div className="vod-scroll">
              {hero && (
                <div className="vod-hero">
                  <div className="vod-hero-backdrop" style={{ backgroundImage: `url("${hero.poster}")` }}></div>
                  <img className="vod-hero-poster" src={hero.poster || POSTER_FALLBACK} alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }} />
                  <div className="vod-hero-text">
                    <h1>{hero.name}</h1>
                    <div className="vod-meta">{meta(hero).map(m => <span key={m}>{m}</span>)}</div>
                    <p>{hero.description}</p>
                    <div className="vod-actions">
                      {!isSeries && <button className="vod-play" disabled={busy} onClick={() => playTitle(hero)}>▶ Play</button>}
                      <button className="vod-secondary" onClick={() => openDetail(hero)}>{isSeries ? '▶ Episodes' : 'ⓘ More info'}</button>
                    </div>
                  </div>
                </div>
              )}
              {categories.map(category => (
                <VodRow
                  key={category.id}
                  title={category.title}
                  row={rows[category.id]}
                  onOpen={openDetail}
                  onSeeAll={() => openGrid({ title: category.title, category: category.id })}
                />
              ))}
            </div>
          )}

          {detail && !playing && (
            <div className="modal-overlay" onClick={() => setDetail(null)}>
              <div className="modal vod-detail" onClick={e => e.stopPropagation()}>
                <button className="vod-close" onClick={() => setDetail(null)} title="Close">×</button>
                <div className="vod-detail-top">
                  <img src={detail.poster || POSTER_FALLBACK} alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }} />
                  <div className="vod-detail-text">
                    <h2>{detail.name}</h2>
                    <div className="vod-meta">{meta(detail).map(m => <span key={m}>{m}</span>)}</div>
                    {detail.genres && <div className="vod-genres">{detail.genres}</div>}
                    <p>{detail.description}</p>
                    {detail.director && <div className="vod-credits"><strong>Director:</strong> {detail.director}</div>}
                    {detail.actors && <div className="vod-credits"><strong>Cast:</strong> {detail.actors}</div>}

                    {!isSeries && (
                      <div className="vod-actions">
                        <button className="vod-play" disabled={busy} onClick={() => playTitle(detail)}>
                          {savedPosition(detail) > 30 ? '▶ Resume' : '▶ Play'}
                        </button>
                        <button className="vod-secondary" disabled={busy} onClick={() => downloadTitle(detail)}>⬇ Download</button>
                      </div>
                    )}
                  </div>
                </div>

                {detailError && <div className="error-msg">{detailError}</div>}

                {isSeries && (
                  <div className="vod-episodes">
                    {seasons === null && <div className="vod-message">Loading seasons...</div>}
                    {seasons && seasons.length === 0 && !detailError && <div className="vod-message">No episodes available.</div>}
                    {seasons && seasons.length > 0 && (
                      <React.Fragment>
                        <div className="vod-seasons">
                          {seasons.map((s, i) => (
                            <button
                              key={s.id}
                              className={`theme-option ${i === seasonIndex ? 'active' : ''}`}
                              onClick={() => setSeasonIndex(i)}
                            >
                              {s.name}
                            </button>
                          ))}
                        </div>
                        <div className="vod-episode-list">
                          {season.episodes.map(episode => (
                            <div key={episode} className="archive-row">
                              <span className="archive-time">E{pad2(episode)}</span>
                              <span className="archive-name">
                                Episode {episode}
                                {savedPosition(detail, season, episode) > 30 && <em className="vod-resume"> · in progress</em>}
                              </span>
                              <span className="archive-actions">
                                <button title="Play" disabled={busy} onClick={() => playTitle(detail, season, episode)}>▶</button>
                                <button title="Download" disabled={busy} onClick={() => downloadTitle(detail, season, episode)}>⬇</button>
                              </span>
                            </div>
                          ))}
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {playing && (
            <div className="vod-player">
              <div className="vod-player-bar">
                <button className="vod-back" onClick={closePlayer} title="Back">←</button>
                <span>{playing.title}</span>
              </div>
              <video
                ref={videoRef}
                src={`${BACKEND_ORIGIN}${playing.streamUrl}`}
                controls
                autoPlay
                onLoadedMetadata={handleLoadedMetadata}
                onTimeUpdate={handleTimeUpdate}
                onError={() => setPlayerError('This title cannot be played by this browser. Go back and download it instead.')}
              />
              {playerError && <div className="player-notice">{playerError}</div>}
            </div>
          )}
        </div>
      );
    }

    function App() {
      // Auth state
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      
      // UI state
      const [screen, setScreen] = useState('login');
      const [section, setSection] = useState('tv'); // 'tv' | 'vod' | 'series'
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loadingProgress, setLoadingProgress] = useState('');
      
      // Login form
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      
      // IPTV state
      const [iptvSessionId, setIptvSessionId] = useState('');
      const [channels, setChannels] = useState([]);
      const [genres, setGenres] = useState([]);
      const [listUpdatedAt, setListUpdatedAt] = useState(null);
      const [hiddenGroups, setHiddenGroups] = useState(0);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [listError, setListError] = useState('');
      const [selectedGenre, setSelectedGenre] = useState(null);
      const [showChannels, setShowChannels] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      
      // Player state
      const [currentChannel, setCurrentChannel] = useState(null);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const videoRef = useRef(null);
      const playerRef = useRef(null);
      const watchdogIntervalRef = useRef(null);
      
      // Archive (catch-up) browser
      const [archiveChannel, setArchiveChannel] = useState(null);
      const [archiveDate, setArchiveDate] = useState('');
      const [archivePrograms, setArchivePrograms] = useState([]);
      const [archiveLoading, setArchiveLoading] = useState(false);
      const [archiveError, setArchiveError] = useState('');
      const [intervalFrom, setIntervalFrom] = useState('20:00');
      const [intervalTo, setIntervalTo] = useState('21:00');
      
      // Archive playback: { channel, title, start, duration, streamUrl }
      const [archivePlayback, setArchivePlayback] = useState(null);
      const [archivePos, setArchivePos] = useState(0);
      const [seekDraft, setSeekDraft] = useState(null);
      const archiveBaseRef = useRef(0);
      
      // Live playback recovery
      const [playerNotice, setPlayerNotice] = useState('');
      const liveRetryRef = useRef({ count: 0, timer: null, startedAt: 0 });
      
      // Modals
      const [showChangePassword, setShowChangePassword] = useState(false);
      const [showPreferences, setShowPreferences] = useState(false);
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      
      // Theme
      const [currentTheme, setCurrentTheme] = useState(localStorage.getItem('theme') || 'midnight');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      // Apply theme
      useEffect(() => {
        document.body.className = `theme-${currentTheme}`;
        localStorage.setItem('theme', currentTheme);
      }, [currentTheme]);

      // Disable mpegts.js logging
      useEffect(() => {
        if (typeof mpegts !== 'undefined' && mpegts.LoggingControl) {
          mpegts.LoggingControl.applyConfig({
            enableAll: false,
            enableDebug: false,
            enableVerbose: false,
            enableInfo: false,
            enableWarn: false,
            enableError: false
          });
        }
      }, []);

      // Check auth on mount
      useEffect(() => { 
        checkAuth(); 
      }, []);

      // Cleanup on unmount
      useEffect(() => {
        return () => {
          if (playerRef.current) {
            playerRef.current.destroy?.();
          }
          if (watchdogIntervalRef.current) {
            clearInterval(watchdogIntervalRef.current);
          }
        };
      }, []);
      
      // Fullscreen detection
      useEffect(() => { 
        const handler = () => setIsFullscreen(!!document.fullscreenElement); 
        document.addEventListener('fullscreenchange', handler); 
        return () => document.removeEventListener('fullscreenchange', handler); 
      }, []);

      // ═══════════════════════════════════════════════════════════════════════
      // AUTH FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const checkAuth = async () => {
        if (!api.token) { 
          setAuthChecked(true); 
          return; 
        }
        
        try {
          const data = await api.getMe();
          
          if (data.success && data.user) { 
            setUser(data.user); 
            setIsAuthenticated(true);
            
            // 🐛 FIX: Check explicitly for true boolean
            if (data.user.hasPortalConfig === true) {
              await connectToIPTV();
            } else {
              setScreen('noconfig');
            }
          }
        } catch (error) { 
          api.setToken(null); 
        }
        setAuthChecked(true);
      };

      const handleLogin = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setIsLoggingIn(true);
        
        try {
          const data = await api.login(username, password);
          
          if (!data.success) {
            throw new Error(data.error || 'Login failed');
          }
          
          api.setToken(data.token); 
          setUser(data.user); 
          setIsAuthenticated(true);
          
          // 🐛 FIX: Check explicitly for true boolean
          if (data.user.hasPortalConfig === true) {
            await connectToIPTV();
          } else {
            setScreen('noconfig');
          }
        } catch (err) { 
          setError(err.message); 
        } finally { 
          setIsLoggingIn(false); 
        }
      };

      const handleLogout = async () => {
        try {
          // Cleanup
          if (iptvSessionId) {
            try {
              await api.iptvDisconnect();
            } catch (err) {
              // Silent fail
            }
          }
          
          if (watchdogIntervalRef.current) {
            clearInterval(watchdogIntervalRef.current);
            watchdogIntervalRef.current = null;
          }
          
          cancelLiveRetry();
          setPlayerNotice('');
          
          if (playerRef.current) {
            try {
              playerRef.current.destroy?.();
            } catch (err) {
              // Silent fail
            }
            playerRef.current = null;
          }
        } catch (error) {
          // Silent fail on cleanup
        }
        
        // Reset ALL state
        api.setToken(null); 
        setUser(null); 
        setIsAuthenticated(false); 
        setIptvSessionId(''); 
        setChannels([]); 
        setGenres([]);
        setListUpdatedAt(null);
        setHiddenGroups(0);
        setSelectedGenre(null);
        setShowChannels(false);
        setSearchTerm('');
        setCurrentChannel(null); 
        setArchiveChannel(null);
        setArchivePlayback(null);
        setSection('tv');
        setScreen('login');
        setError('');
        setSuccess('');
      };

      const handleChangePassword = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setSuccess('');
        
        if (newPassword !== confirmPassword) { 
          setError('Passwords do not match'); 
          return; 
        }
        
        try {
          const data = await api.changePassword(currentPassword, newPassword);
          if (!data.success) throw new Error(data.error);
          
          setSuccess('Password changed!'); 
          setCurrentPassword(''); 
          setNewPassword(''); 
          setConfirmPassword('');
          
          setTimeout(() => { 
            setShowChangePassword(false); 
            setSuccess(''); 
          }, 2000);
        } catch (err) { 
          setError(err.message); 
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // IPTV FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const connectToIPTV = async () => {
        setScreen('loading'); 
        setLoadingProgress('Connecting to IPTV...');
        
        try {
          // Connect
          const connectData = await api.iptvConnect();
          if (!connectData.success) {
            throw new Error(connectData.error || 'IPTV connection failed');
          }
          
          const sessionId = connectData.sessionId;
          setIptvSessionId(sessionId);
          
          // Load channel list (stored on the server, re-read from the portal once a day)
          setLoadingProgress('Loading channels...');
          await loadChannelList(false);
          
          // Start watchdog
          startWatchdog(sessionId);
          
          setScreen('main');
        } catch (err) { 
          setError(err.message); 
          setScreen('noconfig'); 
        }
      };

      const loadChannelList = async (refresh) => {
        const chData = await api.iptvGetChannels(refresh);
        
        if (!chData.success) {
          throw new Error(chData.error || 'Failed to load channels');
        }
        
        setChannels(chData.channels);
        setGenres(
          chData.genres
            .map(g => ({
              id: g.id,
              name: g.title,
              icon: utils?.getIconForGenre?.(g.title) || '📁',
              number: g.number ?? Number.MAX_SAFE_INTEGER,
              count: g.count
            }))
            .sort((a, b) => {
              if (a.number !== b.number) return a.number - b.number;
              return a.name.localeCompare(b.name);
            })
        );
        setListUpdatedAt(chData.updatedAt);
        setHiddenGroups(chData.hiddenGroups || 0);
      };

      const handleRefreshChannels = async () => {
        if (isRefreshing) return;
        
        setIsRefreshing(true);
        setListError('');
        
        try {
          await loadChannelList(true);
          
          // The selected group may have been removed or hidden meanwhile
          setShowChannels(false);
          setSearchTerm('');
        } catch (err) {
          setListError(err.message);
        } finally {
          setIsRefreshing(false);
        }
      };

      const startWatchdog = (sessionId) => {
        if (watchdogIntervalRef.current) {
          clearInterval(watchdogIntervalRef.current);
        }
        
        watchdogIntervalRef.current = setInterval(() => {
          api.iptvWatchdog().catch(() => {
            // Silent fail - watchdog is best-effort
          });
        }, 60000); // 60 seconds
      };

      const handleSelectGenre = (genreId) => { 
        setSelectedGenre(genreId); 
        setShowChannels(true); 
        setSearchTerm(''); 
      };
      
      const handleBackToGenres = () => {
        setShowChannels(false);
        setSearchTerm('');
      };

      const getGenreChannels = () => {
        if (selectedGenre === null) return [];
        
        let filtered = channels.filter(ch => ch.tv_genre_id === selectedGenre);
        
        if (searchTerm) { 
          const term = searchTerm.toLowerCase(); 
          filtered = filtered.filter(ch => 
            ch.name.toLowerCase().includes(term) || 
            ch.number.toString().includes(term)
          ); 
        }
        
        return filtered.sort((a, b) => a.number - b.number);
      };

      const getFilteredGenres = () => { 
        if (!searchTerm) return genres; 
        
        const term = searchTerm.toLowerCase(); 
        return genres.filter(g => g.name.toLowerCase().includes(term)); 
      };

      // ═══════════════════════════════════════════════════════════════════════
      // PLAYER FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const MAX_LIVE_RETRIES = 5;

      const cancelLiveRetry = () => {
        clearTimeout(liveRetryRef.current.timer);
        liveRetryRef.current.timer = null;
      };

      // A live stream that drops is requested again, like a set-top box does
      const scheduleLiveRetry = (channel) => {
        const retry = liveRetryRef.current;
        cancelLiveRetry();
        
        // It had been playing fine for a while: this is a new incident
        if (retry.startedAt && Date.now() - retry.startedAt > 60000) retry.count = 0;
        retry.startedAt = 0;
        
        if (retry.count >= MAX_LIVE_RETRIES) {
          setPlayerNotice('Stream unavailable. Select the channel again to retry.');
          return;
        }
        
        retry.count++;
        setPlayerNotice(`Reconnecting... (${retry.count}/${MAX_LIVE_RETRIES})`);
        retry.timer = setTimeout(() => playChannel(channel, true), Math.min(retry.count * 1000, 5000));
      };

      const playChannel = async (channel, isRetry = false) => {
        cancelLiveRetry();
        if (!isRetry) {
          liveRetryRef.current.count = 0;
          setPlayerNotice('');
        }
        
        setCurrentChannel(channel);
        setArchivePlayback(null);
        
        try {
          const data = await api.iptvGetStream(channel.id);
          
          if (data.success && data.streamUrl) {
            loadStream(data.streamUrl, data.streamType, channel);
          } else {
            scheduleLiveRetry(channel);
          }
        } catch (err) { 
          scheduleLiveRetry(channel);
        }
      };

      const loadStream = (streamUrl, streamType, channel) => {
        const video = videoRef.current;
        if (!video) return;

        // Cleanup previous player
        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }

        video.removeAttribute('src');
        video.load();
        video.ontimeupdate = null;
        video.onplaying = () => {
          setPlayerNotice('');
          liveRetryRef.current.startedAt = Date.now();
        };
        video.onerror = () => {
          cancelLiveRetry();
          setPlayerNotice('This channel cannot be decoded by this browser.');
        };

        const absoluteUrl = streamUrl.startsWith('/')
          ? `${BACKEND_ORIGIN}${streamUrl}`
          : streamUrl;

        video.oncanplay = () => { video.play().catch(() => {}); };

        if (streamType === 'HLS') {
          // HLS stream: native on Safari, HLS.js on Chrome/Firefox
          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = absoluteUrl;
            video.play().catch(() => {});
          } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            const hls = new Hls({ liveSyncDurationCount: 3, enableWorker: false });
            hls.loadSource(absoluteUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
            playerRef.current = hls;
          }
        } else {
          // MPEG-TS, FLV, or raw HTTP stream via mpegts.js
          if (!mpegts || !mpegts.isSupported()) {
            // Fallback to native video
            video.src = absoluteUrl;
            video.play().catch(() => {});
            return;
          }

          mpegts.LoggingControl.applyConfig({ enableAll: false });

          const player = mpegts.createPlayer({
            type: 'mpegts',
            isLive: true,
            url: absoluteUrl
          }, {
            enableWorker: false,
            enableStashBuffer: true,
            stashInitialSize: 384 * 1024,
            isLive: true,
            lazyLoad: false,
            autoCleanupSourceBuffer: true,
            enableLogging: false
          });

          // Upstream closed or failed: ask for the stream again
          const onDrop = () => {
            if (playerRef.current !== player) return;
            scheduleLiveRetry(channel);
          };
          player.on(mpegts.Events.LOADING_COMPLETE, onDrop);
          player.on(mpegts.Events.ERROR, (type) => {
            if (type === mpegts.ErrorTypes.NETWORK_ERROR) onDrop();
          });

          player.attachMediaElement(video);
          player.load();
          video.play().catch(() => {});

          playerRef.current = player;
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // ARCHIVE (CATCH-UP) FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const pad2 = (n) => String(n).padStart(2, '0');
      const localDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const clockTime = (ts) => { const d = new Date(ts * 1000); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const formatPosition = (seconds) => {
        const s = Math.max(0, Math.floor(seconds));
        const h = Math.floor(s / 3600);
        return `${h > 0 ? h + ':' : ''}${h > 0 ? pad2(Math.floor((s % 3600) / 60)) : Math.floor(s / 60)}:${pad2(s % 60)}`;
      };

      // Days the channel keeps in its archive, newest first
      const getArchiveDays = (channel) => {
        const count = Math.max(1, Math.ceil((channel.archiveHours || 24) / 24)) + 1;
        return Array.from({ length: count }, (_, i) => {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const label = i === 0 ? 'Today' : i === 1 ? 'Yesterday'
            : d.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit' });
          return { date: localDate(d), label };
        });
      };

      const loadArchiveDay = async (channel, date) => {
        setArchiveDate(date);
        setArchivePrograms([]);
        setArchiveError('');
        setArchiveLoading(true);
        
        try {
          const data = await api.iptvGetEpg(channel.id, date);
          if (!data.success) throw new Error(data.error || 'Failed to load programme guide');
          setArchivePrograms(data.programs);
        } catch (err) {
          setArchiveError(err.message);
        } finally {
          setArchiveLoading(false);
        }
      };

      const openArchive = (channel) => {
        setArchiveChannel(channel);
        loadArchiveDay(channel, localDate(new Date()));
      };

      const requestArchive = async (channel, window) => {
        const data = await api.iptvGetArchiveStream(channel.id, { date: archiveDate, ...window });
        if (!data.success) throw new Error(data.error || 'Archive not available');
        return data;
      };

      const programWindow = (program) => ({
        programId: program.id,
        title: `${program.name} ${archiveDate} ${clockTime(program.start).replace(':', '.')}`
      });

      const startDownload = (streamUrl) => {
        const link = document.createElement('a');
        link.href = `${BACKEND_ORIGIN}${streamUrl}?download=1`;
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      const playArchiveProgram = async (program) => {
        const channel = archiveChannel;
        setArchiveError('');
        setCurrentChannel(channel);
        
        try {
          const data = await requestArchive(channel, programWindow(program));
          setArchivePlayback({
            channel,
            title: `${program.name} · ${clockTime(program.start)}`,
            start: data.start,
            duration: data.duration,
            streamUrl: data.streamUrl
          });
          setArchiveChannel(null);
          loadArchiveStream(data.streamUrl, 0);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      const downloadArchiveProgram = async (program) => {
        setArchiveError('');
        try {
          const data = await requestArchive(archiveChannel, programWindow(program));
          startDownload(data.streamUrl);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      // Download any time interval of the selected day (may run past midnight)
      const downloadArchiveInterval = async () => {
        setArchiveError('');
        
        const from = new Date(`${archiveDate}T${intervalFrom}:00`);
        const to = new Date(`${archiveDate}T${intervalTo}:00`);
        if (isNaN(from) || isNaN(to)) { setArchiveError('Choose a start and end time'); return; }
        if (to <= from) to.setDate(to.getDate() + 1);
        
        const start = Math.floor(from.getTime() / 1000);
        const duration = Math.floor(to.getTime() / 1000) - start;
        
        // The server needs one archived programme of this day to issue the link
        const seed = archivePrograms.find(p => p.archive && p.start <= start && p.stop > start)
          || archivePrograms.find(p => p.archive);
        if (!seed) { setArchiveError('No archived programmes on this day'); return; }
        
        try {
          const data = await requestArchive(archiveChannel, {
            programId: seed.id,
            start,
            duration,
            title: `${archiveDate} ${intervalFrom.replace(':', '.')}-${intervalTo.replace(':', '.')}`
          });
          startDownload(data.streamUrl);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      // Archive files are finite: load lazily and seek by reopening at a position
      const loadArchiveStream = (streamUrl, position) => {
        const video = videoRef.current;
        if (!video) return;

        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }

        video.removeAttribute('src');
        video.load();

        cancelLiveRetry();
        setPlayerNotice('');
        video.onplaying = () => setPlayerNotice('');
        video.onerror = () => setPlayerNotice('This recording cannot be decoded by this browser. You can still download it.');

        archiveBaseRef.current = position;
        setArchivePos(position);

        const url = `${BACKEND_ORIGIN}${streamUrl}?start=${Math.floor(position)}`;

        video.oncanplay = () => { video.play().catch(() => {}); };
        video.ontimeupdate = () => {
          const current = Math.floor(archiveBaseRef.current + video.currentTime);
          setArchivePos(prev => (prev === current ? prev : current));
        };

        if (!mpegts || !mpegts.isSupported()) {
          video.src = url;
          video.play().catch(() => {});
          return;
        }

        const player = mpegts.createPlayer({
          type: 'mpegts',
          isLive: false,
          url
        }, {
          enableWorker: false,
          lazyLoad: true,
          lazyLoadMaxDuration: 120,
          lazyLoadRecoverDuration: 30,
          seekType: 'range',
          autoCleanupSourceBuffer: true,
          enableLogging: false
        });

        player.on(mpegts.Events.ERROR, (type) => {
          if (playerRef.current !== player) return;
          if (type === mpegts.ErrorTypes.NETWORK_ERROR) {
            setPlayerNotice('Archive stream interrupted. Move the position to continue.');
          }
        });

        player.attachMediaElement(video);
        player.load();
        video.play().catch(() => {});

        playerRef.current = player;
      };

      const seekArchive = (position) => {
        if (!archivePlayback) return;
        const target = Math.min(Math.max(0, position), Math.max(0, archivePlayback.duration - 5));
        loadArchiveStream(archivePlayback.streamUrl, target);
      };

      const commitSeekDraft = () => {
        if (seekDraft === null) return;
        seekArchive(seekDraft);
        setSeekDraft(null);
      };

      // The provider allows one stream per account: leaving live TV stops it
      const switchSection = (next) => {
        if (next === section) return;
        
        cancelLiveRetry();
        setPlayerNotice('');
        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }
        setCurrentChannel(null);
        setArchivePlayback(null);
        setArchiveChannel(null);
        setSection(next);
      };

      const toggleFullscreen = () => { 
        if (isFullscreen) {
          document.exitFullscreen();
        } else {
          document.querySelector('.player-section')?.requestFullscreen();
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════════════════════════════════════
      
      if (!authChecked) {
        return (
          <div className="loading-screen">
            <div className="spinner"></div>
            <div className="loading-text">Loading...</div>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <div className="login-screen">
            <div className="login-card">
              <h1>📺 IPTV Player</h1>
              <p className="subtitle">Sign in to continue</p>

              {error && <div className="error-msg">{error}</div>}
              
              <form onSubmit={handleLogin}>
                <div className="form-group">
                  <label>Username</label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Enter username"
                    required
                    autoFocus
                  />
                </div>
                
                <div className="form-group">
                  <label>Password</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Enter password"
                    required
                  />
                </div>
                
                <button type="submit" className="btn" disabled={isLoggingIn}>
                  {isLoggingIn ? 'Signing in...' : 'Sign In'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (screen === 'noconfig') {
        return (
          <div className="no-config-screen">
            <div className="no-config-card">
              <div className="icon">⚙️</div>
              <h2>Configuration Required</h2>
              <p>Your account is not yet configured for IPTV access.<br/>Contact the administrator to set up your portal URL and MAC address.</p>
              <button className="btn btn-secondary" onClick={handleLogout}>Sign Out</button>
            </div>
          </div>
        );
      }

      if (screen === 'loading') {
        return (
          <div className="loading-screen">
            <div className="spinner"></div>
            <div className="loading-text">Loading IPTV</div>
            <div className="loading-progress">{loadingProgress}</div>
          </div>
        );
      }

      const genreChannels = getGenreChannels();
      const filteredGenres = getFilteredGenres();
      const selectedGenreInfo = genres.find(g => g.id === selectedGenre);

      return (
        <div className="app-layout">
          {/* Navigation Rail */}
          <div className="nav-rail">
            <div className={`nav-item ${section === 'tv' ? 'active' : ''}`} title="TV Channels" onClick={() => switchSection('tv')}>📺</div>
            {user?.sections?.vod && (
              <div className={`nav-item ${section === 'vod' ? 'active' : ''}`} title="Video Club" onClick={() => switchSection('vod')}>🎬</div>
            )}
            {user?.sections?.series && (
              <div className={`nav-item ${section === 'series' ? 'active' : ''}`} title="Series" onClick={() => switchSection('series')}>📽️</div>
            )}
            <div className="nav-divider"></div>
            <div className="nav-item" title="EPG Guide (Coming Soon)" style={{opacity: 0.3, cursor: 'not-allowed'}}>📅</div>
            <div className="nav-divider"></div>
            <div className="nav-item" title="Preferences" onClick={() => setShowPreferences(true)}>🎨</div>
            <div className="nav-item" title="Change Password" onClick={() => setShowChangePassword(true)}>🔐</div>
            {user?.role === 'admin' && (
              <div className="nav-item" title="Admin Panel" onClick={() => window.open('/admin.html', '_blank')}>⚙️</div>
            )}
            <div className="nav-spacer"></div>
            <div className="nav-item nav-item-danger" title="Sign Out" onClick={handleLogout}>🚪</div>
          </div>

          {section !== 'tv' && <VodBrowser key={section} type={section} />}

          {section === 'tv' && (
          <React.Fragment>
          {/* Sidebar */}
          <div className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
            <div className="sidebar-header">
              <div className="sidebar-header-top">
                <div style={{display: 'flex', alignItems: 'center', gap: 'var(--space-sm)'}}>
                  <button 
                    className="collapse-btn"
                    onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                    title={sidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
                  >
                    {sidebarCollapsed ? '☰' : '×'}
                  </button>
                  <h2>TV Channels</h2>
                </div>
                <button
                  className="collapse-btn"
                  onClick={handleRefreshChannels}
                  disabled={isRefreshing}
                  title={listUpdatedAt
                    ? `Refresh channel list (last updated ${new Date(listUpdatedAt).toLocaleString()})`
                    : 'Refresh channel list'}
                >
                  {isRefreshing ? '⏳' : '🔄'}
                </button>
              </div>
              <div className="search-container">
                <span className="search-icon">🔍</span>
                <input
                  type="text"
                  className="search-input"
                  placeholder={showChannels ? "Search channels..." : "Search genres..."}
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>
            </div>
            
            <div className="slide-container">
              <div className={`slide-wrapper ${showChannels ? 'show-channels' : ''}`}>
                {/* Genres Panel */}
                <div className="slide-panel">
                  <div className="groups-panel">
                    {listError && <div className="error-msg">{listError}</div>}
                    {genres.length === 0 && (
                      <div className="groups-empty">
                        <p>No channel groups are enabled for your account.</p>
                        <p>
                          {user?.role === 'admin'
                            ? 'Open the Admin Panel (⚙️) and choose which groups to show.'
                            : 'Contact the administrator to enable them.'}
                        </p>
                      </div>
                    )}
                    {filteredGenres.map(genre => (
                      <div 
                        key={genre.id} 
                        className="group-item" 
                        onClick={() => handleSelectGenre(genre.id)}
                      >
                        <div className="group-info">
                          <div className="group-icon">{genre.icon}</div>
                          <span className="name">{genre.name}</span>
                        </div>
                        <span className="count">{genre.count}</span>
                      </div>
                    ))}
                  </div>
                </div>
                
                {/* Channels Panel */}
                <div className="slide-panel">
                  <div className="channels-panel">
                    {selectedGenreInfo && (
                      <div className="channels-panel-header">
                        <button 
                          className="back-arrow-btn" 
                          onClick={handleBackToGenres}
                          title="Back to genres"
                        >
                          ←
                        </button>
                        <div className="channel-header-info">
                          <h3>{selectedGenreInfo.icon} {selectedGenreInfo.name}</h3>
                          <span>{genreChannels.length} channels</span>
                        </div>
                      </div>
                    )}
                    <div className="channels-list">
                      {genreChannels.map(channel => (
                        <div 
                          key={channel.id} 
                          className={`channel-item ${currentChannel?.id === channel.id ? 'playing' : ''}`}
                          onClick={() => playChannel(channel)}
                        >
                          <img
                            src={channel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                            alt=""
                            className="channel-logo"
                            onError={(e) => e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                          />
                          <div className="channel-info">
                            <div className="channel-name">{channel.name}</div>
                            <div className="channel-number">Ch. {channel.number}</div>
                          </div>
                          {currentChannel?.id === channel.id && (
                            <div className="playing-indicator"></div>
                          )}
                          {channel.archive && (
                            <button
                              className="archive-btn"
                              title={`Archive (last ${Math.round(channel.archiveHours / 24)} days)`}
                              onClick={(e) => { e.stopPropagation(); openArchive(channel); }}
                            >
                              ⏪
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          {/* Main Content */}
          <div className="main-content">
            {sidebarCollapsed && (
              <button 
                className="floating-sidebar-toggle"
                onClick={() => setSidebarCollapsed(false)}
                title="Show sidebar"
              >
                ☰
              </button>
            )}
            
            <div className={`player-section ${isFullscreen ? 'fullscreen' : ''}`}>
              {currentChannel ? (
                <>
                  <div className="video-container">
                    <video ref={videoRef} controls />
                  </div>
                  {playerNotice && <div className="player-notice">{playerNotice}</div>}
                  {archivePlayback && (
                    <div className="archive-bar">
                      <div className="archive-bar-title">
                        <span className="archive-badge">ARCHIVE</span>
                        {archivePlayback.title}
                      </div>
                      <div className="archive-bar-seek">
                        <span>{formatPosition(seekDraft ?? archivePos)}</span>
                        <input
                          type="range"
                          min="0"
                          max={archivePlayback.duration}
                          step="1"
                          value={seekDraft ?? archivePos}
                          onChange={(e) => setSeekDraft(Number(e.target.value))}
                          onMouseUp={commitSeekDraft}
                          onTouchEnd={commitSeekDraft}
                          onKeyUp={commitSeekDraft}
                        />
                        <span>{formatPosition(archivePlayback.duration)}</span>
                      </div>
                      <div className="archive-bar-buttons">
                        <button onClick={() => seekArchive(archivePos - 300)}>−5 min</button>
                        <button onClick={() => seekArchive(archivePos - 30)}>−30 s</button>
                        <button onClick={() => seekArchive(archivePos + 30)}>+30 s</button>
                        <button onClick={() => seekArchive(archivePos + 300)}>+5 min</button>
                        <button onClick={() => startDownload(archivePlayback.streamUrl)}>⬇ Download</button>
                        <button onClick={() => playChannel(archivePlayback.channel)}>🔴 Live</button>
                      </div>
                    </div>
                  )}
                  <div className="now-playing-bar">
                    <div className="now-playing-info">
                      <img
                        src={currentChannel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'}
                        alt=""
                        className="channel-logo"
                      />
                      <div>
                        <h3>{currentChannel.name}</h3>
                        <span>Channel {currentChannel.number}</span>
                      </div>
                    </div>
                    <div className="player-controls">
                      {currentChannel.archive && (
                        <button onClick={() => openArchive(currentChannel)}>⏪ Archive</button>
                      )}
                      <button onClick={toggleFullscreen}>
                        {isFullscreen ? '⬜ Exit Fullscreen' : '⬜ Fullscreen'}
                      </button>
                    </div>
                  </div>
                </>
              ) : (
                <div className="no-channel-message">
                  <div className="icon">📺</div>
                  <h3>Select a Channel</h3>
                  <p>Choose a genre and channel from the menu</p>
                </div>
              )}
            </div>
          </div>
          
          </React.Fragment>
          )}

          {/* Archive Modal */}
          {archiveChannel && (
            <div className="modal-overlay" onClick={() => setArchiveChannel(null)}>
              <div className="modal archive-modal" onClick={e => e.stopPropagation()}>
                <h2>⏪ {archiveChannel.name}</h2>
                
                <div className="archive-days">
                  {getArchiveDays(archiveChannel).map(day => (
                    <button
                      key={day.date}
                      type="button"
                      className={`theme-option ${archiveDate === day.date ? 'active' : ''}`}
                      onClick={() => loadArchiveDay(archiveChannel, day.date)}
                    >
                      {day.label}
                    </button>
                  ))}
                </div>
                
                {archiveError && <div className="error-msg">{archiveError}</div>}
                
                <div className="archive-programs">
                  {archiveLoading && <div className="archive-empty">Loading programme guide...</div>}
                  {!archiveLoading && archivePrograms.length === 0 && !archiveError && (
                    <div className="archive-empty">No programme guide for this day.</div>
                  )}
                  {archivePrograms.map(program => {
                    const started = program.start <= Date.now() / 1000;
                    const available = program.archive && started;
                    return (
                      <div key={program.id} className={`archive-row ${available ? '' : 'unavailable'}`} title={program.descr}>
                        <span className="archive-time">{clockTime(program.start)} – {clockTime(program.stop)}</span>
                        <span className="archive-name">{program.name}</span>
                        {available && (
                          <span className="archive-actions">
                            <button type="button" title="Play" onClick={() => playArchiveProgram(program)}>▶</button>
                            <button type="button" title="Download" onClick={() => downloadArchiveProgram(program)}>⬇</button>
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
                
                <div className="archive-interval">
                  <label>Download an interval of this day</label>
                  <div className="archive-interval-row">
                    <input type="time" value={intervalFrom} onChange={(e) => setIntervalFrom(e.target.value)} />
                    <span>to</span>
                    <input type="time" value={intervalTo} onChange={(e) => setIntervalTo(e.target.value)} />
                    <button type="button" className="btn btn-secondary" onClick={downloadArchiveInterval}>⬇ Download</button>
                  </div>
                </div>

                <button
                  type="button"
                  className="btn btn-secondary"
                  onClick={() => setArchiveChannel(null)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Preferences Modal */}
          {showPreferences && (
            <div className="modal-overlay" onClick={() => setShowPreferences(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>🎨 Preferences</h2>
                
                <div className="form-group">
                  <label>Theme</label>
                  <p style={{fontSize: '0.8125rem', color: 'var(--text-tertiary)', marginBottom: 'var(--space-md)'}}>
                    Choose your preferred color theme
                  </p>
                  
                  <div className="theme-selector">
                    <button 
                      className={`theme-option ${currentTheme === 'midnight' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('midnight')}
                      type="button"
                    >
                      🌙 Midnight
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'carbon' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('carbon')}
                      type="button"
                    >
                      🖤 Carbon
                    </button>
                    <button 
                      className={`theme-option ${currentTheme === 'ocean' ? 'active' : ''}`}
                      onClick={() => setCurrentTheme('ocean')}
                      type="button"
                    >
                      🌊 Ocean
                    </button>
                  </div>
                </div>

                <button 
                  type="button" 
                  className="btn btn-secondary" 
                  onClick={() => setShowPreferences(false)}
                  style={{marginTop: 'var(--space-md)'}}
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {showChangePassword && (
            <div className="modal-overlay" onClick={() => setShowChangePassword(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>🔐 Change Password</h2>
                {error && <div className="error-msg">{error}</div>}
                {success && <div className="success-msg">{success}</div>}
                <form onSubmit={handleChangePassword}>
                  <div className="form-group">
                    <label>Current Password</label>
                    <input
                      type="password"
                      value={currentPassword}
                      onChange={(e) => setCurrentPassword(e.target.value)}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>New Password</label>
                    <input
                      type="password"
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      required
                      minLength={6}
                    />
                  </div>
                  <div className="form-group">
                    <label>Confirm New Password</label>
                    <input
                      type="password"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      required
                    />
                  </div>
                  <button type="submit" className="btn">Change Password</button>
                  <button 
                    type="button" 
                    className="btn btn-secondary" 
                    onClick={() => setShowChangePassword(false)}
                  >
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
