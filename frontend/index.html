            skipped: (prev.skipped || 0) + (data.success ? 0 : 1),
            results: data.success
              ? prev.results.concat(data.results.map(r => ({ ...r, date: step.date })))
              : prev.results
          }));
        }

        setSearch(prev => prev && ({ ...prev, running: false }));
      };

      const stopProgramSearch = () => {
        searchRun.current++;
        setSearch(prev => prev && ({ ...prev, running: false, stopped: true }));
      };

      const closeProgramSearch = () => {
        searchRun.current++;
        setSearch(null);
      };

      // Stop a running search when the guide goes away
      useEffect(() => () => { searchRun.current++; }, []);

      const channelById = {};
      archiveChannels.forEach(c => { channelById[c.id] = c; });

      // Newest first, one entry per broadcast, grouped by the day it aired
      const searchGroups = (() => {
        if (!search) return [];
        const seen = new Set();
        const groups = [];
        search.results
          .filter(r => channelById[r.channelId])
          .sort((a, b) => b.start - a.start)
          .forEach(result => {
            const id = `${result.channelId}:${result.start}`;
            if (seen.has(id)) return;
            seen.add(id);

            const aired = localDate(new Date(result.start * 1000));
            let group = groups[groups.length - 1];
            if (!group || group.aired !== aired) {
              const known = days.find(d => d.date === aired);
              group = {
                aired,
                label: known ? known.label : new Date(result.start * 1000).toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit' }),
                items: []
              };
              groups.push(group);
            }
            group.items.push(result);
          });
        return groups;
      })();
      const searchCount = searchGroups.reduce((n, group) => n + group.items.length, 0);

      const programState = (program) => {
        if (program.stop <= nowSeconds) return program.archive ? 'available' : 'unavailable';
        if (program.start <= nowSeconds) return 'live';
        return 'future';
      };

      // `day` is the guide day the programme was listed under (needed to play it)
      const openProgram = (channel, program, day = date) => {
        setActionError('');
        setActionNote('');
        setSelected({ channel, program, date: day });
      };

      const run = async (action) => {
        if (busy) return;
        setBusy(true);
        setActionError('');
        try {
          await action();
        } catch (err) {
          setActionError(err.message || 'Not available');
        } finally {
          setBusy(false);
        }
      };

      const selectedState = selected && programState(selected.program);
      const canPlaySelected = selected && selected.program.archive && selected.program.start <= nowSeconds;

      return (
        <div className="vod-browser guide">
          <div className="vod-topbar">
            <h2>Recordings</h2>
            <select className="guide-select" value={genre} onChange={(e) => setGenre(e.target.value)}>
              <option value="all">All groups</option>
              {genres.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
            <div className="guide-mode">
              <button
                className={searchMode === 'channels' ? 'active' : ''}
                onClick={() => setSearchMode('channels')}
              >
                Channels
              </button>
              <button
                className={searchMode === 'programmes' ? 'active' : ''}
                onClick={() => setSearchMode('programmes')}
              >
                Programmes
              </button>
            </div>
            <div className="search-container vod-search">
              <span className="search-icon"><Icon name="search" size={16} /></span>
              {searchMode === 'channels' ? (
                <input
                  type="text"
                  className="search-input"
                  placeholder="Filter channels..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              ) : (
                <input
                  type="text"
                  className="search-input"
                  placeholder={`Search programmes in ${genre === 'all' ? 'all groups' : (genres.find(g => g.id === genre)?.name || 'this group')}, then Enter`}
                  value={programQuery}
                  onChange={(e) => setProgramQuery(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') startProgramSearch(); }}
                />
              )}
            </div>
          </div>

          <div className="guide-days" style={{ display: search ? 'none' : undefined }}>
            {days.map(day => (
              <button
                key={day.date}
                className={`theme-option ${date === day.date ? 'active' : ''}`}
                onClick={() => setDate(day.date)}
              >
                {day.label}
              </button>
            ))}
            <span className="guide-legend">
              <i className="available"></i> recorded
              <i className="live"></i> on now
              <i className="future"></i> upcoming
            </span>
            {isToday && <button className="guide-now-btn" onClick={() => scrollToMinute(nowMinutes - 60)}>Now</button>}
          </div>

          {search ? (
            <div className="guide-results">
              <div className="guide-results-bar">
                <button className="vod-back" onClick={closeProgramSearch} title="Back to the timeline"><Icon name="back" /></button>
                <div className="guide-results-status">
                  <strong>{searchCount} {searchCount === 1 ? 'recording' : 'recordings'} for "{search.query}"</strong>
                  <span>
                    {search.running
                      ? `Searching ${search.channels} channels... ${Math.round((search.done / search.total) * 100)}%`
                      : search.stopped
                        ? `Stopped at ${Math.round((search.done / search.total) * 100)}% of ${search.channels} channels, ${days.length} days`
                        : `Searched ${search.channels} channels, ${days.length} days`}
                  </span>
                </div>
                {search.running && <button className="pc-pill" onClick={stopProgramSearch}>Stop</button>}
              </div>
              {search.running && (
                <div className="guide-progress"><span style={{ width: `${(search.done / search.total) * 100}%` }}></span></div>
              )}
              {search.skipped > 0 && (
                <div className="guide-results-note">
                  {search.skipped} of {search.total} parts could not be searched; results may be incomplete. Search again to retry them.
                </div>
              )}

              <div className="guide-results-list">
                {searchGroups.map(group => (
                  <React.Fragment key={group.aired}>
                    <div className="guide-results-day">{group.label}</div>
                    {group.items.map(result => {
                      const channel = channelById[result.channelId];
                      return (
                        <div
                          key={`${result.channelId}:${result.start}`}
                          className="guide-result"
                          onClick={() => openProgram(channel, result, result.date)}
                        >
                          <span className="guide-result-time">{clockTime(result.start)} – {clockTime(result.stop)}</span>
                          <img
                            src={channel.logo || CHANNEL_LOGO_FALLBACK}
                            alt=""
                            loading="lazy"
                            onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }}
                          />
                          <span className="guide-result-text">
                            <span className="guide-result-name">{result.name}</span>
                            <span className="guide-result-sub">{channel.name}{result.descr ? ` · ${result.descr}` : ''}</span>
                          </span>
                          <Icon name="play" size={14} filled />
                        </div>
                      );
                    })}
                  </React.Fragment>
                ))}
                {!search.running && searchCount === 0 && (
                  <div className="vod-message">No recordings match "{search.query}".</div>
                )}
              </div>
            </div>
          ) : rows.length === 0 ? (
            <div className="vod-message">
              {archiveChannels.length === 0
                ? 'None of your channels keeps recordings.'
                : 'No channels match this filter.'}
            </div>
          ) : (
            <div className="guide-scroll" ref={scrollRef}>
              <div className="guide-inner" style={{ width: GUIDE_CHANNEL_WIDTH + GUIDE_DAY_WIDTH }}>
                <div className="guide-header">
                  <div className="guide-corner">{days.find(d => d.date === date)?.label}</div>
                  {Array.from({ length: 24 }, (_, hour) => (
                    <div key={hour} className="guide-hour" style={{ width: 60 * GUIDE_PPM }}>{pad2(hour)}:00</div>
                  ))}
                </div>

                {isToday && nowMinutes >= 0 && nowMinutes <= 1440 && (
                  <div className="guide-now" style={{ left: GUIDE_CHANNEL_WIDTH + nowMinutes * GUIDE_PPM }}></div>
                )}

                {rows.map(channel => {
                  const state = epg[`${date}:${channel.id}`];
                  return (
                    <div key={channel.id} className="guide-row" data-channel-id={channel.id}>
                      <div className="guide-channel" title={`${channel.name} · keeps ${Math.round(channel.archiveHours / 24)} days`}>
                        <img
                          src={channel.logo || CHANNEL_LOGO_FALLBACK}
                          alt=""
                          loading="lazy"
                          onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }}
                        />
                        <div>
                          <div className="guide-channel-name">{channel.name}</div>
                          <div className="guide-channel-number">Ch. {channel.number}</div>
                        </div>
                      </div>
                      <div className="guide-track" style={{ width: GUIDE_DAY_WIDTH }}>
                        {!state && <div className="guide-track-note">Loading guide...</div>}
                        {state?.error && (
                          <div className="guide-track-note retry" onClick={() => retryEpg(channel.id, date)}>
                            {state.error} · click to retry
                          </div>
                        )}
                        {state?.programs && state.programs.length === 0 && (
                          <div className="guide-track-note">No programme guide for this day</div>
                        )}
                        {state?.programs && state.programs.map(program => {
                          const startMinute = Math.max(0, (program.start - dayStart) / 60);
                          const endMinute = Math.min(1440, (program.stop - dayStart) / 60);
                          if (endMinute <= startMinute) return null;
                          return (
                            <div
                              key={program.id}
                              className={`guide-prog ${programState(program)}`}
                              style={{ left: startMinute * GUIDE_PPM, width: (endMinute - startMinute) * GUIDE_PPM - 2 }}
                              title={`${clockTime(program.start)} – ${clockTime(program.stop)}  ${program.name}`}
                              onClick={() => openProgram(channel, program)}
                            >
                              <div className="guide-prog-name">{program.name}</div>
                              <div className="guide-prog-time">{clockTime(program.start)} – {clockTime(program.stop)}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {selected && (
            <div className="modal-overlay" onClick={() => setSelected(null)}>
              <div className="modal vod-detail guide-detail" onClick={e => e.stopPropagation()}>
                <button className="vod-close" onClick={() => setSelected(null)} title="Close"><Icon name="x" size={18} /></button>
                <div className="vod-detail-top">
                  <img
                    className="guide-detail-logo"
                    src={selected.channel.logo || CHANNEL_LOGO_FALLBACK}
                    alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }}
                  />
                  <div className="vod-detail-text">
                    <h2>{selected.program.name}</h2>
                    <div className="vod-meta">
                      <span>{selected.channel.name}</span>
                      <span>{(days.find(d => d.date === selected.date)?.label || selected.date)}</span>
                      <span>{clockTime(selected.program.start)} – {clockTime(selected.program.stop)}</span>
                      <span>{Math.round((selected.program.stop - selected.program.start) / 60)} min</span>
                    </div>
                    <p>{selected.program.descr || 'No description available.'}</p>

                    <div className="vod-actions">
                      {canPlaySelected && (
                        <button className="vod-play" disabled={busy} onClick={() => run(async () => { await onPlay(selected.channel, selected.date, selected.program); setSelected(null); })}>
                          <Icon name="play" size={16} filled /> {selectedState === 'live' ? 'Play from start' : 'Play'}
                        </button>
                      )}
                      {canPlaySelected && (
                        <button className="vod-secondary" disabled={busy} onClick={() => run(() => onDownload(selected.channel, selected.date, selected.program))}>
                          <Icon name="download" size={16} /> Download
                        </button>
                      )}
                      {canPlaySelected && selectedState !== 'live' && onSave && (
                        <button
                          className="vod-secondary"
                          disabled={busy}
                          title="Download to the server, mark start and end, and convert to MP4"
                          onClick={() => run(async () => {
                            await onSave(selected.channel, selected.date, selected.program);
                            setActionNote('Added to the library. Open Library in the menu to follow it.');
                          })}
                        >
                          <Icon name="box" size={16} /> Save to library
                        </button>
                      )}
                      {selectedState === 'live' && onWatchLive && (
                        <button className="vod-secondary" onClick={() => onWatchLive(selected.channel)}><span className="live-dot"></span> Watch live</button>
                      )}
                    </div>
                    {canPlaySelected && <DownloadMargin />}
                    {!canPlaySelected && selectedState !== 'live' && (
                      <div className="vod-credits">
                        {selectedState === 'future' ? 'This programme has not aired yet.' : 'This programme is not in the archive.'}
                      </div>
                    )}
                  </div>
                </div>
                {actionError && <div className="error-msg">{actionError}</div>}
                {actionNote && <div className="success-msg">{actionNote}</div>}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LIBRARY - recordings saved on the server, trimmed and converted to MP4
    // ═══════════════════════════════════════════════════════════════════════

    const formatBytes = (bytes) => {
      if (!bytes) return '';
      return bytes >= 1e9 ? `${(bytes / 1e9).toFixed(2)} GB` : `${Math.round(bytes / 1e6)} MB`;
    };

    const formatLength = (seconds) => {
      const s = Math.max(0, Math.round(seconds || 0));
      const h = Math.floor(s / 3600);
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
    };

    // Mark where the programme starts and ends, frame by frame
    function CutEditor({ job, onClose, onQueued }) {
      const fps = job.fps || 25;
      const lastFrame = Math.max(1, Math.floor(job.duration * fps) - 1);
      const toFrame = (seconds) => Math.round(seconds * fps);

      // Both markers are frame numbers: the first and the last frame to keep
      const [start, setStart] = useState(Math.min(toFrame(job.cutStart || 0), lastFrame - 1));
      const [end, setEnd] = useState(Math.min(Math.max(toFrame(job.cutEnd || job.duration) - 1, 1), lastFrame));
      const [active, setActive] = useState('start'); // marker moved by the arrow keys
      const [frames, setFrames] = useState({ start: null, end: null });
      const [missing, setMissing] = useState({ start: false, end: false });
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState(job.error || '');

      // The picture under each marker, fetched a moment after it stops moving
      const useFrame = (side, frame) => {
        useEffect(() => {
          let cancelled = false;
          const timer = setTimeout(async () => {
            try {
              const url = await api.recordingFrame(job.id, frame);
              if (cancelled) { URL.revokeObjectURL(url); return; }
              setMissing(prev => ({ ...prev, [side]: false }));
              setFrames(prev => {
                if (prev[side]) URL.revokeObjectURL(prev[side]);
                return { ...prev, [side]: url };
              });
            } catch (err) {
              if (!cancelled) setMissing(prev => ({ ...prev, [side]: true }));
            }
          }, 120);
          return () => { cancelled = true; clearTimeout(timer); };
        }, [frame]);
      };

      useFrame('start', start);
      useFrame('end', end);

      const second = Math.round(fps);
      const clamp = (value) => Math.min(Math.max(0, Math.round(value)), lastFrame);
      const moveStart = (value) => setStart(Math.min(clamp(value), end - second));
      const moveEnd = (value) => setEnd(Math.max(clamp(value), start + second));

      // Arrow keys step the selected marker: one frame, or one second with Shift
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          const step = (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? second : 1);
          if (active === 'start') moveStart(start + step); else moveEnd(end + step);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      // m:ss plus the frame within that second
      const timecode = (frame) => {
        const whole = Math.floor(frame / fps);
        return `${formatLength(whole)}.${String(Math.round(frame - whole * fps)).padStart(2, '0')}`;
      };

      const submit = async () => {
        setBusy(true);
        setError('');
        try {
          const data = await api.recordingCut(job.id, start, end);
          if (!data.success) throw new Error(data.error || 'Could not queue the conversion');
          onQueued();
        } catch (err) {
          setError(err.message);
          setBusy(false);
        }
      };

      const steps = [
        [-60 * second, '−1 min'], [-10 * second, '−10 s'], [-second, '−1 s'], [-1, '−1 frame'],
        [1, '+1 frame'], [second, '+1 s'], [10 * second, '+10 s'], [60 * second, '+1 min']
      ];

      const marker = (side, label, value, move) => (
        <div className={`cut-side ${active === side ? 'active' : ''}`} onMouseDown={() => setActive(side)}>
          <div className="cut-frame">
            {frames[side] && <img src={frames[side]} alt="" />}
            {!frames[side] && <div className="cut-frame-wait">{missing[side] ? 'No picture at this point' : 'Loading frame...'}</div>}
            <span className="cut-label">{label} · {timecode(value)}</span>
          </div>
          <input
            type="range"
            className="pc-seek cut-slider"
            min="0"
            max={lastFrame}
            step="1"
            value={value}
            style={{ '--progress': `${(value / lastFrame) * 100}%` }}
            onChange={(e) => move(Number(e.target.value))}
            onKeyDown={(e) => { if (e.key.startsWith('Arrow')) e.preventDefault(); }}
          />
          <div className="cut-steps">
            {steps.map(([step, text]) => (
              <button key={step} type="button" className={Math.abs(step) === 1 ? 'fine' : ''} onClick={() => move(value + step)}>
                {text}
              </button>
            ))}
          </div>
        </div>
      );

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal cut-editor" onClick={e => e.stopPropagation()}>
            <button className="vod-close" onClick={onClose} title="Close"><Icon name="x" size={18} /></button>
            <h2>{job.title}</h2>
            <p className="cut-hint">
              Move each marker until its picture is the first and the last frame you want to keep.
              The arrow keys move the selected marker one frame at a time (hold Shift for one second).
            </p>

            <div className="cut-sides">
              {marker('start', 'First frame', start, moveStart)}
              {marker('end', 'Last frame', end, moveEnd)}
            </div>

            {error && <div className="error-msg">{error}</div>}

            <div className="cut-footer">
              <span>Result: {timecode(end - start + 1)} of {formatLength(job.duration)} · {Math.round(fps * 100) / 100} frames per second</span>
              <button className="vod-secondary" onClick={onClose}>Cancel</button>
              <button className="vod-play" disabled={busy} onClick={submit}>
                <Icon name="scissors" size={16} /> Convert to MP4
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Playing on a Chromecast. The Chromecast fetches the video itself, so it
    // needs an address it can reach and a format it plays (MP4).
    //   available  the browser can cast (Chrome, on https)
    //   device     name of the Chromecast connected, or ''
    //   loaded     a video is on the Chromecast; then title, paused, time, duration
    function useCast() {
      const [available, setAvailable] = useState(!!window.castApiAvailable);
      const [, redraw] = useState(0);
      const remote = useRef(null); // { player, controller }

      useEffect(() => {
        if (available) return;
        const onApi = () => setAvailable(!!window.castApiAvailable);
        window.addEventListener('castapi', onApi);
        return () => window.removeEventListener('castapi', onApi);
      }, [available]);

      useEffect(() => {
        if (!available) return;

        cast.framework.CastContext.getInstance().setOptions({
          receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
        });

        const player = new cast.framework.RemotePlayer();
        const controller = new cast.framework.RemotePlayerController(player);
        const onChange = () => redraw(n => n + 1);
        controller.addEventListener(cast.framework.RemotePlayerEventType.ANY_CHANGE, onChange);
        remote.current = { player, controller };
        onChange();

        return () => {
          controller.removeEventListener(cast.framework.RemotePlayerEventType.ANY_CHANGE, onChange);
          remote.current = null;
        };
      }, [available]);

      const player = remote.current && remote.current.player;
      const controller = remote.current && remote.current.controller;
      const connected = !!(player && player.isConnected);
      const session = connected ? cast.framework.CastContext.getInstance().getCurrentSession() : null;

      return {
        available,
        device: session ? session.getCastDevice().friendlyName : '',
        loaded: connected && player.isMediaLoaded,
        title: (connected && player.title) || '',
        paused: connected && player.isPaused,
        time: connected ? player.currentTime : 0,
        duration: connected ? player.duration : 0,

        // Asks which Chromecast to use (if none is connected) and plays there.
        // Resolves to false when the viewer closes the list of devices.
        // subtitles: { url, language, name } shown on the TV (a WebVTT address it can reach)
        async start({ url, contentType, title, subtitle, image, startAt, subtitles }) {
          const context = cast.framework.CastContext.getInstance();

          if (!context.getCurrentSession()) {
            try {
              await context.requestSession();
            } catch (code) {
              if (code === 'cancel') return false;
              throw new Error(`Could not connect to the Chromecast (${code})`);
            }
          }

          const info = new chrome.cast.media.MediaInfo(url, contentType || 'video/mp4');
          info.metadata = new chrome.cast.media.GenericMediaMetadata();
          info.metadata.title = title;
          info.metadata.subtitle = subtitle || '';
          if (image) info.metadata.images = [new chrome.cast.Image(image)];
          if (subtitles) {
            const track = new chrome.cast.media.Track(1, chrome.cast.media.TrackType.TEXT);
            track.trackContentId = subtitles.url;
            track.trackContentType = 'text/vtt';
            track.subtype = chrome.cast.media.TextTrackType.SUBTITLES;
            track.name = subtitles.name;
            track.language = subtitles.language;
            info.tracks = [track];
          }

          const request = new chrome.cast.media.LoadRequest(info);
          request.currentTime = Math.max(0, Math.floor(startAt || 0));
          request.autoplay = true;
          if (subtitles) request.activeTrackIds = [1];

          const error = await context.getCurrentSession().loadMedia(request);
          if (error) throw new Error(`The Chromecast could not play this video (${error})`);
          return true;
        },

        toggle() { if (controller) controller.playOrPause(); },

        seek(seconds) {
          if (!controller) return;
          player.currentTime = Math.max(0, Math.min(seconds, player.duration || seconds));
          controller.seek();
        },

        stop() {
          if (available) cast.framework.CastContext.getInstance().endCurrentSession(true);
        }
      };
    }

    // Details of a recording in the library: the film or episode it is, read
    // from IMDb or TMDB through the link the user pastes
    function LibraryDetails({ job, onChanged }) {
      const metadata = job.metadata;
      const [changing, setChanging] = useState(!metadata);
      const [link, setLink] = useState('');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => { if (!metadata) setChanging(true); }, [metadata]);

      const save = async (e) => {
        e.preventDefault();
        if (!link.trim()) return;
        setBusy(true);
        setError('');
        try {
          const result = await api.recordingLink(job.id, link.trim());
          if (!result.success) throw new Error(result.error || 'Could not read this link');
          setLink('');
          setChanging(false);
          onChanged();
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const unlink = async () => {
        if (!confirm('Remove the link to this film or episode?')) return;
        const result = await api.recordingUnlink(job.id);
        if (!result.success) setError(result.error || 'Could not remove the link');
        onChanged();
      };

      const form = (
        <form className="library-link-form" onSubmit={save}>
          <div className="library-link-hint">
            {metadata
              ? 'Paste another link to replace the details.'
              : 'Is this a film or a series episode? Paste its link on IMDb or TMDB to see its details here. For a series, use the link of the exact episode.'}
          </div>
          <div className="library-link-row">
            <input
              type="url"
              value={link}
              onChange={(e) => setLink(e.target.value)}
              placeholder="https://www.imdb.com/title/tt…"
              spellCheck="false"
              disabled={busy}
            />
            <button type="submit" className="vod-play" disabled={busy || !link.trim()}>
              <Icon name="link" size={15} /> {busy ? 'Reading…' : 'Link'}
            </button>
            {metadata && <button type="button" className="vod-secondary" onClick={() => { setChanging(false); setError(''); }}>Cancel</button>}
          </div>
          {error && <div className="library-error">{error}</div>}
        </form>
      );

      if (!metadata) return <div className="library-details">{form}</div>;

      const text = metadataText(metadata);
      const picture = metadata.kind === 'episode' && metadata.image ? metadata.image : text.poster;
      const facts = [
        metadata.kind === 'episode' ? 'Episode' : 'Film',
        metadata.date ? new Date(`${metadata.date}T12:00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : metadata.year,
        metadata.runtime ? `${metadata.runtime} min` : '',
        metadata.rating ? `★ ${metadata.rating}` : ''
      ].filter(Boolean);

      return (
        <div className="library-details">
          <div className="library-meta">
            {picture && (
              <img
                className={picture === metadata.image ? 'still' : 'poster'}
                src={picture}
                alt=""
                onError={(e) => { e.target.style.display = 'none'; }}
              />
            )}
            <div className="library-meta-text">
              <div className="library-meta-facts">{facts.join(' · ')}</div>
              {metadata.kind === 'episode' ? (
                <React.Fragment>
                  <h4>{text.showTitle || text.title}</h4>
                  <div className="library-meta-episode">
                    {[metadata.season ? `Season ${metadata.season}, episode ${metadata.episode}` : '', text.showTitle ? text.title : ''].filter(Boolean).join(' · ')}
                  </div>
                </React.Fragment>
              ) : (
                <h4>{text.title}</h4>
              )}
              {text.genres.length > 0 && <div className="library-meta-genres">{text.genres.join(', ')}</div>}
              {text.cast && <div className="library-meta-genres">{text.cast}</div>}
              <p>
                {text.overview || (metadata.source === 'imdb'
                  ? 'IMDb only gives the title, picture and year. With a TMDB key in the admin Settings, the synopsis, series, season and episode are shown too.'
                  : 'No synopsis available.')}
              </p>
              {!changing && (
                <div className="library-meta-actions">
                  <a className="vod-secondary" href={metadata.link} target="_blank" rel="noopener noreferrer">
                    <Icon name="external" size={14} /> {/imdb\.com/.test(metadata.link) ? 'Open on IMDb' : 'Open on TMDB'}
                  </a>
                  <button className="vod-secondary" onClick={() => setChanging(true)}><Icon name="link" size={14} /> Change link</button>
                  <button className="vod-secondary" onClick={unlink}>Remove link</button>
                </div>
              )}
              {!changing && error && <div className="library-error">{error}</div>}
            </div>
          </div>
          {changing && form}
        </div>
      );
    }

    // Plays a finished recording, here or on a Chromecast, and remembers where
    // the viewer stopped. Used by the Library and by the Recorded gallery.
    //   play(job, castBase)  castBase: the server's address on the home network, if set
    //   download(job)
    //   view                 the player, to put in the page (null when closed)
    //
    // Also plays other videos through open(item): item.hls marks an HLS
    // address, item.alternate ({ label, item }) another version of the same
    // video (used too when this one fails to play), item.startAt where to
    // start, item.onPosition(seconds, duration) hears where the viewer is, and
    // item.subtitles offers subtitles to choose: { search() -> { subtitles },
    // fetch(id) -> address, remembered, remember(entry) }
    // An item of useRecordingPlayer in the TV app's player, with the subtitle
    // chosen for it before already on
    async function playItemNatively(item, startAt) {
      let subtitleTrack = null;
      const remembered = item.subtitles && item.subtitles.remembered;
      if (remembered) {
        try {
          subtitleTrack = { url: await item.subtitles.fetch(remembered.id), language: remembered.language, name: SUBTITLE_LANGUAGES[remembered.language] || remembered.language || 'Subtitles' };
        } catch (_) {}
      }
      const other = item.alternate;
      nativePlayer.play({
        url: item.url,
        hls: !!item.hls,
        title: item.title,
        subtitle: item.subtitle,
        startAt: startAt || 0,
        alternate: other && { url: other.item.url, hls: !!other.item.hls, label: other.label, back: other.back, onError: !!other.onError },
        subtitles: !!item.subtitles,
        subtitleTrack
      }, {
        onPosition: (position, duration, closing) => {
          saveRecordingPosition(item.id, position, duration);
          if (item.onPosition) item.onPosition(position, duration, closing);
        },
        subtitles: item.subtitles
      });
    }

    function useRecordingPlayer() {
      const [playing, setPlaying] = useState(null); // { id, title, subtitle, url, castUrl, castType, hls, alternate, image, casting }
      const videoRef = useRef(null);
      const lastSaved = useRef(0);

      // Where the browser left off when the Chromecast took over, and back
      const resumeAt = useRef(0);
      const castTime = useRef(0);
      const castApi = useCast();
      if (castApi.loaded) castTime.current = castApi.time;

      // Positions of recordings kept on the server, before one is played
      useEffect(() => { loadServerPositions(); }, []);

      const media = async (job) => {
        const ticket = await api.recordingTicket(job.id);
        if (!ticket.success) throw new Error(ticket.error || 'Recording not available');
        return `${BACKEND_ORIGIN}${ticket.url}`;
      };

      const play = async (job, castBase) => {
        const url = await media(job);
        const item = {
          id: job.id,
          ...recordingHeading(job),
          url,
          // The Chromecast may be given the server's address on the home network
          castUrl: castBase ? `${castBase}${new URL(url).pathname}` : url,
          onPosition: (position, duration, closing) => reportRecordingPosition(job.id, position, duration, closing),
          image: job.metadata ? metadataText(job.metadata).poster : ''
        };
        await open(item);
      };

      // Already connected to a Chromecast: it plays there straight away
      const open = async (item) => {
        if (TV_APP) await playItemNatively(item, startPosition(item));
        else if (castApi.device) await sendToCast(item, startPosition(item));
        else setPlaying(item);
      };

      // The other version of the video, from where this one is
      const switchVersion = () => {
        if (!playing || !playing.alternate) return;
        const video = videoRef.current;
        resumeAt.current = video && video.currentTime > 0 ? video.currentTime : resumeAt.current;
        setPlaying({ ...playing.alternate.item, alternate: { label: playing.alternate.back, back: playing.alternate.label, item: { ...playing, alternate: undefined } } });
      };

      // HLS through hls.js (Safari plays it by itself)
      useEffect(() => {
        const video = videoRef.current;
        if (!playing || !playing.hls || playing.casting || !video) return;
        if (video.canPlayType('application/vnd.apple.mpegurl') || typeof Hls === 'undefined' || !Hls.isSupported()) {
          video.src = playing.url;
          return;
        }
        const hls = new Hls({ enableWorker: true });
        hls.loadSource(playing.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        });
        return () => hls.destroy();
      }, [playing && playing.url, playing && playing.casting]);

      // While the Chromecast has the video, the one in the browser is put away
      const sendToCast = async (item, startAt) => {
        resumeAt.current = startAt;
        setPlaying({ ...item, casting: true });
        let started = false;
        try {
          started = await castApi.start({ url: item.castUrl || item.url, contentType: item.castType, subtitles: track && { url: track.url, language: track.language, name: track.name }, title: item.title, subtitle: item.subtitle, image: item.image, startAt });
        } finally {
          if (!started) setPlaying({ ...item, casting: false });
        }
      };

      // The Chromecast stopped (here, or from the TV): continue in the browser
      const wasCasting = useRef(false);
      useEffect(() => {
        if (wasCasting.current && !castApi.loaded) {
          setPlaying(current => {
            if (current) resumeAt.current = castTime.current;
            return current && { ...current, casting: false };
          });
        }
        wasCasting.current = castApi.loaded;
      }, [castApi.loaded]);

      // The position on the Chromecast is remembered too
      useEffect(() => {
        if (castApi.loaded && playing) {
          saveRecordingPosition(playing.id, castApi.time, castApi.duration);
          reportPosition(castApi.time, castApi.duration);
        }
      }, [castApi.loaded && Math.floor(castApi.time / 5)]);

      const castPlaying = async () => {
        try {
          await sendToCast(playing, videoRef.current ? videoRef.current.currentTime : 0);
        } catch (err) {
          alert(err.message);
        }
      };

      const download = async (job) => {
        const link = document.createElement('a');
        link.href = `${await media(job)}?download=1`;
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      // Subtitles of item.subtitles: the list (asked for when the menu first
      // opens) and the one shown, as a WebVTT kept in the browser
      const [subs, setSubs] = useState(null);   // { open, loading, list, error, busy, chosen }
      const [track, setTrack] = useState(null); // { src, url, language, name }

      const chooseSubtitle = async (entry) => {
        const provider = playing && playing.subtitles;
        if (!provider) return;
        if (!entry) {
          setTrack(null);
          provider.remember(null);
          setSubs(current => ({ ...(current || {}), chosen: null, open: false }));
          return;
        }
        setSubs(current => ({ ...(current || {}), busy: entry.id, error: '' }));
        try {
          const url = await provider.fetch(entry.id);
          const response = await fetch(url);
          if (!response.ok) throw new Error('This subtitle is not available');
          const src = URL.createObjectURL(new Blob([await response.text()], { type: 'text/vtt' }));
          setTrack({ src, url, language: entry.language, name: SUBTITLE_LANGUAGES[entry.language] || entry.language || 'Subtitles' });
          provider.remember({ id: entry.id, language: entry.language });
          setSubs(current => ({ ...(current || {}), busy: null, chosen: entry.id, open: false }));
        } catch (err) {
          setSubs(current => ({ ...(current || {}), busy: null, error: err.message }));
        }
      };

      const toggleSubtitles = async () => {
        if (subs && subs.open) return setSubs({ ...subs, open: false });
        setSubs(current => ({ ...(current || {}), open: true }));
        if (subs && (subs.list || subs.loading)) return;
        setSubs(current => ({ ...current, loading: true, error: '' }));
        try {
          const data = await playing.subtitles.search();
          if (!data.success) throw new Error(data.error || 'Could not look for subtitles');
          setSubs(current => ({ ...current, loading: false, list: data.subtitles }));
        } catch (err) {
          setSubs(current => ({ ...current, loading: false, error: err.message }));
        }
      };

      // A new title: no list yet, and the subtitle chosen for it before, if any
      useEffect(() => {
        setSubs(null);
        setTrack(null);
        const remembered = playing && playing.subtitles && playing.subtitles.remembered;
        if (remembered) chooseSubtitle(remembered);
      }, [playing && playing.id]);

      useEffect(() => () => { if (track) URL.revokeObjectURL(track.src); }, [track && track.src]);

      // Shown, and clear of the control bar (as in the video club)
      const placeTrack = useRef((element) => {
        if (!element) return;
        const place = () => {
          element.track.mode = 'showing';
          for (const cue of Array.from(element.track.cues || [])) {
            cue.snapToLines = false;
            cue.line = 84;
            cue.lineAlign = 'end';
          }
        };
        element.addEventListener('load', place);
        place();
      }).current;

      const startPosition = (item) => (item.startAt !== undefined ? item.startAt : savedRecordingPosition(item.id));

      // closing: the last position, sent even if one was sent a moment ago
      const reportPosition = (position, duration, closing = false) => {
        if (playing && playing.onPosition && position > 0) playing.onPosition(position, duration, closing);
      };

      const closePlayer = () => {
        const video = videoRef.current;
        if (castApi.loaded) reportPosition(castApi.time, castApi.duration, true);
        else if (video) reportPosition(video.currentTime, video.duration, true);
        if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
        if (document.fullscreenElement) document.exitFullscreen();
        if (castApi.loaded) castApi.stop();
        resumeAt.current = 0;
        setPlaying(null);
      };

      // Continue where the viewer left off (or where the Chromecast was)
      const handleLoadedMetadata = (e) => {
        const video = e.currentTarget;
        const at = resumeAt.current || startPosition(playing);
        resumeAt.current = 0;
        if (at > 0 && (!isFinite(video.duration) || at < video.duration - 60)) video.currentTime = at;
      };

      const handleTimeUpdate = (e) => {
        const video = e.currentTarget;
        if (Math.abs(video.currentTime - lastSaved.current) < 5) return;
        lastSaved.current = video.currentTime;
        saveRecordingPosition(playing.id, video.currentTime, video.duration);
        reportPosition(video.currentTime, video.duration);
      };

      const view = (
        <React.Fragment>
          {castApi.loaded && (
            <div className="vod-player cast-remote">
              <button className="cast-close" title="Stop and close" onClick={closePlayer}><Icon name="x" size={22} /></button>
              {playing && playing.image && <img className="cast-poster" src={playing.image} alt="" />}
              <div className="cast-device"><Icon name="cast" size={16} /> Playing on {castApi.device}</div>
              <div className="cast-title">{playing ? playing.title : castApi.title}</div>
              {playing && <div className="cast-subtitle">{playing.subtitle}</div>}
              <input
                className="cast-seek"
                type="range"
                min="0"
                max={Math.max(1, Math.floor(castApi.duration))}
                value={Math.floor(castApi.time)}
                onChange={(e) => castApi.seek(Number(e.target.value))}
              />
              <div className="cast-time">{formatLength(castApi.time)} / {formatLength(castApi.duration)}</div>
              <div className="cast-buttons">
                <button className="pc-pill" onClick={() => castApi.seek(castApi.time - 10)}>−10 s</button>
                <button className="cast-play" title={castApi.paused ? 'Play' : 'Pause'} onClick={castApi.toggle}>
                  <Icon name={castApi.paused ? 'play' : 'pause'} size={26} filled />
                </button>
                <button className="pc-pill" onClick={() => castApi.seek(castApi.time + 30)}>+30 s</button>
              </div>
              {playing && <button className="vod-secondary cast-here" onClick={castApi.stop}>Play here instead</button>}
            </div>
          )}

          {playing && playing.casting && !castApi.loaded && (
            <div className="vod-player cast-remote">
              <button className="cast-close" title="Close" onClick={closePlayer}><Icon name="x" size={22} /></button>
              <div className="cast-device"><Icon name="cast" size={16} /> Connecting to the Chromecast…</div>
              <div className="cast-title">{playing.title}</div>
            </div>
          )}

          {playing && !playing.casting && !castApi.loaded && (
            <div className="vod-player">
              <video
                key={`video:${playing.url}`}
                ref={videoRef}
                src={playing.hls ? undefined : playing.url}
                autoPlay
                playsInline
                onLoadedMetadata={handleLoadedMetadata}
                onTimeUpdate={handleTimeUpdate}
                onError={() => { if (playing.alternate && playing.alternate.onError) switchVersion(); }}
              >
                {track && <track key={track.src} ref={placeTrack} kind="subtitles" src={track.src} srcLang={track.language} label={track.name} default />}
              </video>
              {subs && subs.open && (
                <div className="subs-menu" onClick={e => e.stopPropagation()}>
                  <div className="subs-head">
                    <span>Subtitles</span>
                    <button className="pc-icon" title="Close" onClick={() => setSubs({ ...subs, open: false })}><Icon name="x" size={18} /></button>
                  </div>
                  <button className={`subs-item ${!track ? 'on' : ''}`} onClick={() => chooseSubtitle(null)}>
                    <span className="subs-lang">Off</span>
                  </button>
                  {subs.loading && <div className="subs-note"><span className="discover-spinner"></span>Looking for subtitles...</div>}
                  {subs.error && <div className="error-msg">{subs.error}</div>}
                  {subs.list && subs.list.length === 0 && <div className="subs-note">No subtitles found for this title.</div>}
                  {(subs.list || []).map(entry => (
                    <button
                      key={entry.id}
                      className={`subs-item ${subs.chosen === entry.id ? 'on' : ''}`}
                      disabled={!!subs.busy}
                      onClick={() => chooseSubtitle(entry)}
                    >
                      <span className="subs-lang">
                        {SUBTITLE_LANGUAGES[entry.language] || entry.language}
                        {subs.busy === entry.id && <span className="discover-spinner"></span>}
                      </span>
                      <span className="subs-release" title={entry.release}>{entry.release}</span>
                      <span className="subs-tags">
                        {entry.hashMatch && <span className="discover-badge ready">In sync with this file</span>}
                        {entry.hearingImpaired && <span className="discover-badge">For the deaf</span>}
                        {entry.machine && <span className="discover-badge">Machine translated</span>}
                        <span className="subs-downloads">{entry.downloads} downloads</span>
                      </span>
                    </button>
                  ))}
                </div>
              )}
              <PlayerControls
                key={playing.url}
                videoRef={videoRef}
                title={playing.title}
                subtitle={playing.subtitle}
                onClose={closePlayer}
                captions={playing.subtitles ? { on: !!track, onToggle: toggleSubtitles } : null}
              >
                {playing.alternate && (
                  <button className="pc-pill" title={playing.alternate.hint || ''} onClick={switchVersion}>{playing.alternate.label}</button>
                )}
                {castApi.available && (
                  <button className="pc-pill" title="Play on a Chromecast" onClick={castPlaying}><Icon name="cast" size={16} /> Cast</button>
                )}
              </PlayerControls>
            </div>
          )}
        </React.Fragment>
      );

      return { play, open, download, playing, view };
    }

    // Position reached in each recording (seconds): the server's (any device),
    // or this browser's for recordings played before the server kept them
    const serverPositions = new Map(); // 'rec:<id>' -> { position, finished }
    const positionsSent = {};          // id -> when it was last sent

    async function loadServerPositions() {
      try {
        const data = await api.positions();
        if (data.success) for (const [key, value] of Object.entries(data.positions)) serverPositions.set(key, value);
      } catch (_) {}
    }

    function savedRecordingPosition(id) {
      const kept = serverPositions.get(`rec:${id}`);
      if (kept) return kept.finished ? 0 : kept.position || 0;
      try { return Number(localStorage.getItem(`rec:pos:${id}`)) || 0; } catch (_) { return 0; }
    }

    // To the server at most every 15 s (at once when closing or at the end)
    function reportRecordingPosition(id, position, duration, closing) {
      const ending = isFinite(duration) && duration > 0 && position > duration - 90;
      serverPositions.set(`rec:${id}`, { position: ending || position < 30 ? 0 : Math.floor(position), finished: ending, at: new Date().toISOString() });
      if (!closing && !ending && Date.now() - (positionsSent[id] || 0) < 15000) return;
      positionsSent[id] = Date.now();
      api.savePosition(`rec:${id}`, position, isFinite(duration) ? duration : 0).catch(() => {});
    }

    function saveRecordingPosition(id, position, duration) {
      try {
        const finished = isFinite(duration) && duration > 0 && position > duration - 90;
        if (finished || position < 30) localStorage.removeItem(`rec:pos:${id}`);
        else localStorage.setItem(`rec:pos:${id}`, String(Math.floor(position)));
      } catch (_) {}
    }

    // Title and second line of a recording: the film or the series and episode
    // when it is linked, otherwise the programme as recorded
    function recordingHeading(job) {
      const metadata = job.metadata;
      if (!metadata) return { title: job.title, subtitle: job.channelName };

      const text = metadataText(metadata);
      if (metadata.kind === 'episode') {
        const number = metadata.season ? `S${metadata.season} E${metadata.episode}` : '';
        return {
          title: text.showTitle || text.title || job.title,
          subtitle: [number, text.showTitle ? text.title : ''].filter(Boolean).join(' · ') || job.channelName
        };
      }
      return { title: text.title || job.title, subtitle: [metadata.year, job.channelName].filter(Boolean).join(' · ') };
    }

    // Name of the programme a recording came from, without the date and time
    // added when it was saved ("Dinoster 2026-10-01 18.30" -> "Dinoster")
    function programmeName(job) {
      return job.title.replace(/\s*\d{4}-\d{2}-\d{2}\s+\d{1,2}\.\d{2}(-\d{1,2}\.\d{2})?$/, '').trim() || job.title;
    }

    // Finished recordings as a gallery: one entry per film or programme, and a
    // single entry per series holding its episodes
    function groupRecordings(jobs) {
      const groups = new Map();

      for (const job of jobs) {
        const metadata = job.metadata;
        const text = metadata ? metadataText(metadata) : null;
        let key, name;

        if (metadata && metadata.kind === 'movie') {
          key = `movie:${metadata.imdbId || metadata.tmdbId || job.id}`;
          name = text.title || job.title;
        } else {
          // Episodes join their series by name, so a linked episode and one not
          // linked yet from the same programme land together
          name = (text && text.showTitle) || programmeName(job);
          key = `name:${name.toLowerCase()}`;
        }

        if (!groups.has(key)) groups.set(key, { key, name, items: [] });
        groups.get(key).items.push(job);
      }

      return [...groups.values()].map(group => {
        const items = group.items.sort((a, b) =>
          ((a.metadata && a.metadata.season) || 999) - ((b.metadata && b.metadata.season) || 999) ||
          ((a.metadata && a.metadata.episode) || 999) - ((b.metadata && b.metadata.episode) || 999) ||
          a.createdAt - b.createdAt
        );
        const linked = items.find(job => job.metadata);
        const text = linked ? metadataText(linked.metadata) : null;
        const isSeries = items.length > 1 || items.some(job => job.metadata && job.metadata.kind === 'episode');

        return {
          ...group,
          items,
          isSeries,
          poster: text ? text.poster : '',
          logo: items[0].channelLogo,
          year: linked ? linked.metadata.year : '',
          genres: text ? text.genres : [],
          overview: !isSeries && text ? text.overview : '',
          newest: Math.max(...items.map(job => job.createdAt))
        };
      }).sort((a, b) => b.newest - a.newest);
    }

    function RecordedCard({ entry, onOpen }) {
      const count = entry.items.length;
      return (
        <div className="vod-card rec-card" onClick={() => onOpen(entry)} title={entry.name}>
          {entry.poster ? (
            <img
              src={entry.poster}
              alt=""
              loading="lazy"
              onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }}
            />
          ) : (
            <div className="rec-card-blank">
              <img src={entry.logo || CHANNEL_LOGO_FALLBACK} alt="" onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }} />
              <span>{entry.name}</span>
            </div>
          )}
          {entry.isSeries && <span className="rec-card-badge">{count} {count === 1 ? 'episode' : 'episodes'}</span>}
          <div className="vod-card-info">
            <div className="vod-card-name">{entry.name}</div>
            {entry.year && <div className="vod-card-meta">{entry.year}</div>}
          </div>
        </div>
      );
    }

    // Everything finished in the Library, to watch: films and programmes once,
    // series once with the episodes that were recorded
    function RecordedBrowser() {
      const [data, setData] = useState(null);
      const [error, setError] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [openKey, setOpenKey] = useState(null);
      const [seasonIndex, setSeasonIndex] = useState(0);
      const [busy, setBusy] = useState(false);
      const player = useRecordingPlayer();

      const load = async () => {
        try {
          const [result] = await Promise.all([api.recordings(), loadServerPositions()]);
          if (!result.success) throw new Error(result.error || 'Could not load the recordings');
          setData(result);
          setError('');
        } catch (err) {
          setError(err.message);
        }
      };

      useEffect(() => { load(); }, []);

      const run = async (action) => {
        setBusy(true);
        try {
          await action();
        } catch (err) {
          setError(err.message || 'Action failed');
        } finally {
          setBusy(false);
        }
      };

      const play = (job) => run(() => player.play(job, data.castBase));
      const download = (job) => run(() => player.download(job));

      const entries = useMemo(
        () => groupRecordings(data ? data.recordings.filter(job => job.state === 'done') : []),
        [data]
      );
      const term = searchTerm.trim().toLowerCase();
      const shown = term ? entries.filter(entry => entry.name.toLowerCase().includes(term)) : entries;
      const open = openKey && entries.find(entry => entry.key === openKey);

      // Episodes by season; those without a known season go together at the end
      const seasons = useMemo(() => {
        if (!open || !open.isSeries) return [];
        const bySeason = new Map();
        for (const job of open.items) {
          const season = (job.metadata && job.metadata.season) || null;
          if (!bySeason.has(season)) bySeason.set(season, []);
          bySeason.get(season).push(job);
        }
        return [...bySeason.entries()].map(([season, jobs]) => ({
          name: season ? `Season ${season}` : (bySeason.size > 1 ? 'Other' : 'Episodes'),
          jobs
        }));
      }, [open]);
      const season = seasons[Math.min(seasonIndex, Math.max(0, seasons.length - 1))];

      const openEntry = (entry) => { setOpenKey(entry.key); setSeasonIndex(0); };

      // Escape closes the details
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape' && !player.playing && openKey) setOpenKey(null);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [openKey, !!player.playing]);

      const progress = (job) => {
        const at = savedRecordingPosition(job.id);
        return at > 0 && job.outputDuration ? Math.min(100, (at / job.outputDuration) * 100) : 0;
      };

      const single = open && !open.isSeries ? open.items[0] : null;

      return (

              <input
                type="text"
                className="search-input"
                placeholder="Search recordings by name..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>
          </div>

          <div className="vod-scroll with-topbar">
            {error && <div className="vod-message"><div className="error-msg">{error}</div></div>}
            {!data && !error && <div className="vod-message">Loading...</div>}
            {data && entries.length === 0 && (
              <div className="vod-message">
                Nothing here yet. Recordings appear here once they are finished in the Library.
              </div>
            )}
            {data && entries.length > 0 && shown.length === 0 && (
              <div className="vod-message">No recordings match "{searchTerm}".</div>
            )}
            {shown.length > 0 && (
              <React.Fragment>
                <div className="vod-grid-count">{shown.length} {shown.length === 1 ? 'title' : 'titles'}</div>
                <div className="vod-grid">
                  {shown.map(entry => <RecordedCard key={entry.key} entry={entry} onOpen={openEntry} />)}
                </div>
              </React.Fragment>
            )}
          </div>

          {open && !player.playing && (
            <div className="modal-overlay" onClick={() => setOpenKey(null)}>
              <div className="modal vod-detail" onClick={e => e.stopPropagation()}>
                {open.poster && <div className="vod-detail-backdrop" style={{ backgroundImage: `url("${open.poster}")` }}></div>}
                <button className="vod-close" onClick={() => setOpenKey(null)} title="Close"><Icon name="x" size={18} /></button>
                <div className="vod-detail-top">
                  <img
                    src={open.poster || open.logo || POSTER_FALLBACK}
                    className={open.poster ? '' : 'guide-detail-logo'}
                    alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }}
                  />
                  <div className="vod-detail-text">
                    <h2>{open.name}</h2>
                    <div className="vod-meta">
                      {[
                        open.year,
                        open.isSeries ? `${open.items.length} ${open.items.length === 1 ? 'episode' : 'episodes'} recorded` : '',
                        single && single.outputDuration ? formatLength(single.outputDuration) : '',
                        single ? single.channelName : ''
                      ].filter(Boolean).map(m => <span key={m}>{m}</span>)}
                    </div>
                    {open.genres.length > 0 && <div className="vod-genres">{open.genres.slice(0, 3).join(' • ')}</div>}
                    {open.overview && <p>{open.overview}</p>}

                    {single && (
                      <div className="vod-actions">
                        <button className="vod-play" disabled={busy} onClick={() => play(single)}>
                          <Icon name="play" size={16} filled /> {savedRecordingPosition(single.id) > 30 ? 'Resume' : 'Play'}
                        </button>
                        <button className="vod-secondary" disabled={busy} onClick={() => download(single)}>
                          <Icon name="download" size={16} /> Download
                        </button>

                </div>

                {open.isSeries && (
                  <div className="vod-episodes">
                    {seasons.length > 1 && (
                      <div className="vod-seasons">
                        {seasons.map((s, i) => (
                          <button
                            key={s.name}
                            className={`theme-option ${s === season ? 'active' : ''}`}

                          >
                            {s.name}
                          </button>
                        ))}
                      </div>
                    )}
                    <div className="rec-episodes">
                      {season && season.jobs.map(job => {
                        const metadata = job.metadata;
                        const text = metadata ? metadataText(metadata) : null;
                        const number = metadata && metadata.season ? `S${metadata.season} E${metadata.episode}` : '';
                        const done = progress(job);
                        return (
                          <div key={job.id} className="rec-episode" onClick={() => !busy && play(job)}>
                            <div className="rec-episode-thumb">
                              {metadata && metadata.image
                                ? <img src={metadata.image} alt="" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />
                                : <img className="logo" src={job.channelLogo || CHANNEL_LOGO_FALLBACK} alt="" onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }} />}
                              <span className="rec-episode-play"><Icon name="play" size={18} filled /></span>
                              {done > 0 && <div className="rec-episode-progress"><span style={{ width: `${done}%` }}></span></div>}
                            </div>
                            <div className="rec-episode-text">
                              <div className="rec-episode-title">
                                {number && <span className="rec-episode-number">{number}</span>}
                                {(text && text.title) || job.title}
                              </div>
                              <div className="rec-episode-sub">
                                {[job.channelName, job.outputDuration ? formatLength(job.outputDuration) : ''].filter(Boolean).join(' · ')}
                              </div>
                              {text && text.overview && <div className="rec-episode-overview">{text.overview}</div>}
                            </div>
                            <button
                              className="library-icon"
                              title="Download the MP4"
                              disabled={busy}
                              onClick={(e) => { e.stopPropagation(); download(job); }}
                            >
                              <Icon name="download" size={16} />
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {player.view}
        </div>
      );
    }

    function LibraryBrowser() {
      const [data, setData] = useState(null);       // { recordings, ffmpeg, freeBytes }
      const [error, setError] = useState('');
      const [editing, setEditing] = useState(null);
      const [expanded, setExpanded] = useState(() => new Set()); // recordings showing their details

      const toggle = (id) => setExpanded(prev => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });

      const refresh = async () => {
        try {
          const result = await api.recordings();
          if (!result.success) throw new Error(result.error || 'Could not load the library');
          setData(result);
          setError('');
        } catch (err) {
          setError(err.message);
        }
      };

      // Progress is followed while the library is open
      useEffect(() => {
        refresh();
        const timer = setInterval(refresh, 3000);
        return () => clearInterval(timer);
      }, []);

      const act = async (action, confirmText) => {
        if (confirmText && !confirm(confirmText)) return;
        try {
          const result = await action();
          if (result && result.success === false) throw new Error(result.error);
        } catch (err) {
          setError(err.message || 'Action failed');
        }
        refresh();
      };

      const player = useRecordingPlayer();
      const play = (job) => act(() => player.play(job, data.castBase));
      const download = (job) => act(() => player.download(job));

      const recordings = data ? data.recordings : [];
      const groups = [
        { title: 'Downloading to the server', states: ['downloading', 'queued'] },
        { title: 'Waiting for you to mark start and end', states: ['ready'] },
        { title: 'Converting to MP4', states: ['converting', 'waiting'] },
        { title: 'Finished', states: ['done'] },
        { title: 'Failed', states: ['failed'] }
      ].map(group => ({
        ...group,
        // The one being worked on first, then the ones waiting their turn
        items: recordings
          .filter(job => group.states.includes(job.state))
          .sort((a, b) => group.states.indexOf(a.state) - group.states.indexOf(b.state))
      })).filter(group => group.items.length);

      const describe = (job) => {
        switch (job.state) {
          case 'queued': return 'Waiting for its turn to download';
          case 'downloading': return `Downloading ${job.progress}%${job.sourceBytes ? ` of ${formatBytes(job.sourceBytes)}` : ''}`;
          case 'ready': return `${formatLength(job.duration)} downloaded${job.sourceBytes ? ` · ${formatBytes(job.sourceBytes)}` : ''}`;
          case 'waiting': return `Waiting for its turn to convert · ${formatLength(job.cutEnd - job.cutStart)}`;
          case 'converting': return `Converting ${job.progress}% · ${formatLength(job.cutEnd - job.cutStart)}`;
          case 'done': return `${formatLength(job.outputDuration)} · ${formatBytes(job.outputBytes)} · MP4`;
          default: return job.error || 'Failed';
        }
      };

      return (
        <div className="vod-browser guide">
          <div className="vod-topbar">
            <h2>Library</h2>
            {data && data.freeBytes !== null && (
              <span className="library-free">{formatBytes(data.freeBytes)} free on the server</span>
            )}
          </div>

          <div className="library-scroll">
            {error && <div className="vod-message"><div className="error-msg">{error}</div></div>}
            {data && data.storageError && (
              <div className="vod-message"><div className="error-msg">
                The storage folder is not available: {data.storageError}
              </div></div>
            )}
            {data && !data.ffmpeg && (
              <div className="vod-message"><div className="error-msg">
                ffmpeg is not installed on the server, so recordings cannot be previewed or converted.
              </div></div>
            )}

            {data && recordings.length === 0 && (
              <div className="vod-message">
                Nothing here yet. In Recordings, open a programme and choose "Save to library" to keep it as an MP4.
              </div>
            )}

            {groups.map(group => (
              <div key={group.title} className="library-group">
                <h3>{group.title}</h3>
                {group.items.map(job => {
                  const open = expanded.has(job.id);
                  const poster = job.metadata && metadataText(job.metadata).poster;
                  return (
                  <div key={job.id} className={`library-item ${job.state} ${open ? 'open' : ''}`}>
                    <div className="library-row" onClick={() => toggle(job.id)}>
                      <img
                        className={poster ? 'poster' : ''}
                        src={poster || job.channelLogo || CHANNEL_LOGO_FALLBACK}
                        alt=""
                        onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }}
                      />
                      <div className="library-text">
                        <div className="library-title">{job.title}</div>
                        {job.metadata && <div className="library-linked"><Icon name="link" size={12} /> {metadataLine(job.metadata)}</div>}
                        <div className="library-sub">{job.channelName} · {describe(job)}</div>
                        {job.state === 'ready' && job.error && <div className="library-error">{job.error}</div>}
                        {(job.state === 'downloading' || job.state === 'converting') && (
                          <div className="library-progress"><span style={{ width: `${job.progress}%` }}></span></div>
                        )}
                      </div>
                      <div className="library-actions" onClick={(e) => e.stopPropagation()}>
                        {job.state === 'ready' && (
                          <button className="vod-play" onClick={() => setEditing(job)}><Icon name="scissors" size={15} /> Mark start and end</button>
                        )}
                        {job.state === 'done' && (
                          <React.Fragment>
                            <button className="vod-play" onClick={() => play(job)}><Icon name="play" size={15} filled /> Play</button>
                            <button className="library-icon" title="Download the MP4" onClick={() => download(job)}><Icon name="download" size={16} /></button>
                          </React.Fragment>
                        )}
                        {job.state === 'failed' && (
                          <button className="vod-secondary" onClick={() => act(() => api.recordingRetry(job.id))}>Try again</button>
                        )}
                        {(job.state === 'converting' || job.state === 'waiting') && (
                          <button className="vod-secondary" onClick={() => act(() => api.recordingCancel(job.id))}>Stop</button>
                        )}
                        <button
                          className="library-icon"
                          title={job.state === 'downloading' || job.state === 'queued' ? 'Cancel' : 'Delete'}
                          onClick={() => act(() => api.recordingRemove(job.id), `Delete "${job.title}" from the library?`)}
                        >
                          <Icon name="trash" size={16} />
                        </button>
                      </div>
                      <span className="library-chevron" title={open ? 'Hide details' : 'Show details'}><Icon name="down" size={18} /></span>
                    </div>
                    {open && <LibraryDetails job={job} onChanged={refresh} />}
                  </div>
                  );
                })}
              </div>
            ))}
          </div>

          {editing && (
            <CutEditor
              job={editing}
              onClose={() => setEditing(null)}
              onQueued={() => { setEditing(null); refresh(); }}
            />
          )}

          {player.view}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // DISCOVER (films and series from TMDB)
    // ═══════════════════════════════════════════════════════════════════════

    // TMDB entries in the shape the video club cards use
    const discoverCard = (entry) => ({ ...entry, id: `${entry.kind}:${entry.id}`, tmdbId: entry.id, name: entry.title });

    const SOURCE_RESOLUTIONS = ['4K', '1080p', '720p', 'SD'];
    const SOURCE_SORTS = [['quality', 'Best quality'], ['seeders', 'Most seeders'], ['size', 'Smallest']];

    const sourceAge = (date) => {
      const days = date ? Math.floor((Date.now() - new Date(date).getTime()) / 86400000) : NaN;
      if (!(days >= 0)) return '';
      if (days < 1) return 'today';
      if (days < 31) return `${days}d`;
      if (days < 365) return `${Math.floor(days / 30)}mo`;
      return `${Math.floor(days / 365)}y`;
    };

    const SUBTITLE_LANGUAGES = { 'pt-PT': 'Português', 'pt-BR': 'Português (Brasil)', en: 'English' };

    // Subtitles listed Portuguese first whatever the app language: the films
    // are mostly in English, and the household reads Portuguese
    const SUBTITLE_PREFERENCE = 'pt';

    // Audio most browsers cannot play
    const BROWSER_SILENT_AUDIO = ['AC3', 'DD+', 'DTS', 'TrueHD', 'Atmos'];

    // Can the browser play Real-Debrid's file as it is, or should it start with
    // Real-Debrid's converted version?
    function browserPlaysFile(filename, quality) {
      if (TV_APP) return true; // with the converted version if the TV cannot
      const ext = (String(filename).match(/\.(\w+)$/) || [])[1] || '';
      if (quality.codec === 'HEVC' || quality.codec === 'AV1') return false;
      if (/^(mp4|m4v|webm)$/i.test(ext)) return true;
      return /^mkv$/i.test(ext) && !BROWSER_SILENT_AUDIO.includes(quality.audio);
    }

    // Player item for a source Real-Debrid has ready: the file itself and the
    // converted version, the second one offered as the other choice
    function debridItem(request, source, ready) {
      const base = { id: `discover:${request.key}`, title: request.title, subtitle: request.subtitle, image: request.image, torrent: ready.torrent };

      // Through this server (admin Settings): its address here, and on the home
      // network for a Chromecast when one is set
      const address = (path) => (ready.proxied ? `${BACKEND_ORIGIN}${path}` : path);
      const castAddress = (path) => (ready.proxied && ready.castBase ? `${ready.castBase}${path}` : address(path));

      const original = { ...base, url: address(ready.url), castUrl: castAddress(ready.url), castType: 'video/mp4' };
      if (!ready.hls) return original;
      const converted = { ...base, url: address(ready.hls), castUrl: castAddress(ready.hls), hls: true, castType: 'application/x-mpegurl' };

      return browserPlaysFile(ready.filename, source.quality)
        ? { ...original, alternate: { label: 'No sound? Compatible', back: 'Original', hint: 'Real-Debrid\'s converted version, which every browser plays', onError: true, item: converted } }
        : { ...converted, alternate: { label: 'Original quality', back: 'Compatible', hint: 'The file itself (may play without sound in this browser)', item: original } };
    }

    // Hands a torrent to Real-Debrid (start() resolves to { torrent }) and waits
    // until it is ready, telling onState how it goes. run.cancelled stops it.
    async function waitForDebrid(start, request, run, onState) {
      const started = await start();
      if (!started.success) throw new Error(started.error || 'Could not start this source');

      while (!run.cancelled) {
        const data = await api.discoverPlayState(started.torrent, request);
        if (run.cancelled) return null;
        if (!data.success) throw new Error(data.error || 'Real-Debrid did not answer');
        if (data.state === 'ready') return { ...data, torrent: started.torrent };
        onState(data);
        await new Promise(resolve => setTimeout(resolve, data.state === 'downloading' ? 4000 : 2000));
      }
      return null;
    }

    const debridStatus = (state) => (state.state === 'downloading'
      ? `Downloading on Real-Debrid ${state.progress || 0}%${state.speed ? ` · ${formatSpeed(state.speed)}` : ''}`
      : state.state === 'converting' ? 'Reading the torrent...' : 'Sending to Real-Debrid...');

    const formatSpeed = (bytes) => (bytes >= 1e6 ? `${(bytes / 1e6).toFixed(1)} MB/s` : bytes > 0 ? `${Math.round(bytes / 1e3)} KB/s` : '');

    // A ready Real-Debrid item made ready for the player: where to start, the
    // position sent to the server (at most every 15 s, and on closing) and the
    // subtitles. Used by Discover and by the dashboard.
    const discoverPositionSent = { at: 0 };

    function discoverPlayerItem(request, item, startAt) {
      const onPosition = (position, duration, now = false) => {
        const ending = isFinite(duration) && position > duration - 90;
        if (!now && !ending && Date.now() - discoverPositionSent.at < 15000) return;
        discoverPositionSent.at = Date.now();
        api.discoverPosition(request, position, isFinite(duration) ? duration : 0).catch(() => {});
      };
      const rememberKey = `discover:sub:${request.key}`;
      const subtitles = {
