        search: () => api.discoverSubtitles(request, item.torrent, SUBTITLE_PREFERENCE),
        fetch: async (id) => {
          const data = await api.discoverSubtitle(id);
          if (!data.success) throw new Error(data.error || 'Could not get this subtitle');
          return `${BACKEND_ORIGIN}${data.url}`;
        },
        remembered: (() => { try { return JSON.parse(localStorage.getItem(rememberKey)); } catch (_) { return null; } })(),
        remember: (entry) => {
          try { entry ? localStorage.setItem(rememberKey, JSON.stringify(entry)) : localStorage.removeItem(rememberKey); } catch (_) {}
        }
      };
      const extras = (one) => one && { ...one, onPosition, subtitles };
      return {
        ...extras(item),
        startAt: startAt || 0,
        alternate: item.alternate && { ...item.alternate, item: extras(item.alternate.item) }
      };
    }

    // Torrents of a film or episode, from the Prowlarr set up in the admin Settings
    function DiscoverSources({ request, onClose, onReady }) {
      const [state, setState] = useState({ loading: true, items: [], error: '' });
      const [preparing, setPreparing] = useState(null); // { id, state, progress, speed, error }
      const polling = useRef(null);

      const stopPolling = () => {
        if (polling.current) polling.current.cancelled = true;
        polling.current = null;
      };
      useEffect(() => stopPolling, []);

      // Real-Debrid takes it (at once when it already has it, or after downloading it)
      const play = async (item) => {
        stopPolling();
        const run = { cancelled: false };
        polling.current = run;
        setPreparing({ id: item.id, state: 'starting' });

        try {
          const ready = await waitForDebrid(() => api.discoverPlay(item.id, request), request, run, (data) => setPreparing({ id: item.id, ...data }));
          if (!ready) return;
          setPreparing(null);
          polling.current = null;
          onReady(debridItem(request, item, ready));
        } catch (err) {
          if (!run.cancelled) setPreparing({ id: item.id, error: err.message });
        }
      };

      const cancel = () => { stopPolling(); setPreparing(null); };
      const [resolution, setResolution] = useState('');
      const [portuguese, setPortuguese] = useState(false);
      const [sort, setSort] = useState('quality');

      useEffect(() => {
        let cancelled = false;
        api.discoverSources(request.kind, request.tmdbId, request.season, request.episode)
          .then(data => {
            if (cancelled) return;
            if (!data.success) throw new Error(data.error || 'Could not find sources');
            setState({ loading: false, items: data.sources, error: '' });
          })
          .catch(err => !cancelled && setState({ loading: false, items: [], error: err.message }));
        return () => { cancelled = true; };
      }, [request.key]);

      const isPortuguese = (item) => item.quality.languages.some(l => l === 'PT' || l === 'PT-BR');
      const resolutions = SOURCE_RESOLUTIONS.filter(r => state.items.some(item => item.quality.resolution === r));
      const hasPortuguese = state.items.some(isPortuguese);

      // The server sends them best quality first
      const shown = state.items
        .filter(item => !resolution || item.quality.resolution === resolution)
        .filter(item => !portuguese || isPortuguese(item));
      if (sort === 'seeders') shown.sort((a, b) => (b.seeders || 0) - (a.seeders || 0));
      if (sort === 'size') shown.sort((a, b) => (a.size || Infinity) - (b.size || Infinity));

      const badges = (item) => [
        item.quality.resolution,
        item.quality.source,
        item.quality.hdr,
        item.quality.codec,
        item.quality.audio,
        ...item.quality.languages,
        item.pack ? (request.kind === 'tv' ? 'Season pack' : 'Pack') : ''
      ].filter(Boolean);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal vod-detail discover-sources" onClick={e => e.stopPropagation()}>
            <button className="vod-close" onClick={onClose} title="Close"><Icon name="x" size={18} /></button>
            <h2>Sources</h2>
            <div className="discover-sources-for">{request.label}</div>

            {!state.loading && state.items.length > 0 && (
              <div className="discover-sources-filters">
                <button className={`theme-option ${resolution === '' ? 'active' : ''}`} onClick={() => setResolution('')}>All</button>
                {resolutions.map(r => (
                  <button key={r} className={`theme-option ${resolution === r ? 'active' : ''}`} onClick={() => setResolution(resolution === r ? '' : r)}>{r}</button>
                ))}
                {hasPortuguese && (
                  <button className={`theme-option ${portuguese ? 'active' : ''}`} onClick={() => setPortuguese(!portuguese)}>Portuguese</button>
                )}
                <select className="discover-sources-sort" value={sort} onChange={e => setSort(e.target.value)}>
                  {SOURCE_SORTS.map(([id, label]) => <option key={id} value={id}>{label}</option>)}
                </select>
              </div>
            )}

            {state.loading && (
              <div className="vod-message"><span className="discover-spinner"></span>Searching the indexers in Prowlarr...</div>
            )}
            {state.error && <div className="error-msg">{state.error}</div>}
            {!state.loading && !state.error && state.items.length === 0 && (
              <div className="vod-message">No sources found for this {request.kind === 'tv' ? 'episode' : 'film'}.</div>
            )}
            {!state.loading && state.items.length > 0 && shown.length === 0 && (
              <div className="vod-message">No sources with these filters.</div>
            )}

            <div className="discover-source-list">
              {shown.map(item => (
                <div key={item.id} className={`discover-source ${item.quality.cam ? 'cam' : ''}`}>
                  <div className="discover-source-text">
                    <div className="discover-source-badges">
                      {item.lastUsed && <span className="discover-badge used" title="The source you played last for this title">Last used</span>}
                      {item.onDebrid && <span className="discover-badge ready" title="Already on your Real-Debrid: starts at once">On Real-Debrid</span>}
                      {badges(item).map(b => (
                        <span key={b} className={`discover-badge ${b === item.quality.resolution ? 'strong' : b === 'CAM' ? 'warn' : ''}`} title={b === 'CAM' ? 'Filmed in a cinema' : undefined}>{b}</span>
                      ))}
                    </div>
                    <div className="discover-source-title" title={item.title}>{item.title}</div>
                    <div className="discover-source-sub">
                      {[
                        formatBytes(item.size),
                        item.seeders !== null ? `${item.seeders} seeders` : '',
                        item.indexer,
                        sourceAge(item.date)
                      ].filter(Boolean).join(' · ')}
                    </div>
                  </div>
                  {preparing && preparing.id === item.id && !preparing.error ? (
                    <div className="discover-preparing">
                      <span className="discover-spinner"></span>
                      <span>{debridStatus(preparing)}</span>
                      <button className="vod-secondary" onClick={cancel}>Cancel</button>
                    </div>
                  ) : (
                    <button className="vod-play" onClick={() => play(item)}>
                      <Icon name="play" size={16} /> Play
                    </button>
                  )}
                  {preparing && preparing.id === item.id && preparing.state === 'downloading' && (
                    <div className="discover-preparing-note">
                      <div className="discover-progress"><span style={{ width: `${preparing.progress || 0}%` }}></span></div>
                      Real-Debrid did not have this one yet. You can wait, or choose another source.
                    </div>
                  )}
                  {preparing && preparing.id === item.id && preparing.error && (
                    <div className="discover-preparing-note"><div className="error-msg">{preparing.error}</div></div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // intent: { open: card } from the dashboard, handled once (onIntentDone)
    function DiscoverBrowser({ intent, onIntentDone }) {
      const [rows, setRows] = useState(null);        // opening page
      const [grid, setGrid] = useState(null);        // { title, row?, query?, kind?, items, page, totalPages, total, loading }
      const [searchTerm, setSearchTerm] = useState('');
      const [searchKind, setSearchKind] = useState('');
      const [detail, setDetail] = useState(null);    // the film or series open
      const [seasonNumber, setSeasonNumber] = useState(null);
      const [season, setSeason] = useState(null);
      const [selectedEpisode, setSelectedEpisode] = useState(null);
      const [sources, setSources] = useState(null);  // the film or episode whose sources are open
      const player = useRecordingPlayer();
      const [history, setHistory] = useState({});      // key -> { title, quality, size, at } of the title open
      const [continuing, setContinuing] = useState(null); // { key, state, progress, speed, error }
      const continueRun = useRef(null);
      const [heroIndex, setHeroIndex] = useState(0);
      const [error, setError] = useState('');
      const [detailError, setDetailError] = useState('');

      useEffect(() => {
        api.discoverHome(APP_LANGUAGE)
          .then(data => {
            if (!data.success) throw new Error(data.error || 'Could not load Discover');
            setRows(data.rows.map(row => ({ ...row, items: row.items.map(discoverCard) })));
          })
          .catch(err => setError(err.message));
      }, []);

      // A grid: a whole row, or the results of a search; more pages on demand
      const loadGrid = async (base, page) => {
        setGrid(current => ({ ...base, items: page === 1 ? [] : (current ? current.items : []), loading: true }));
        try {
          const data = base.query
            ? await api.discoverSearch(base.query, page, APP_LANGUAGE, base.kind)
            : await api.discoverList(base.row, page, APP_LANGUAGE);
          if (!data.success) throw new Error(data.error || 'Could not load the titles');
          setGrid(current => ({
            ...base,
            items: [...(page === 1 ? [] : current.items), ...data.items.map(discoverCard)],
            page: data.page,
            totalPages: data.totalPages,
            total: data.total,
            loading: false
          }));
        } catch (err) {
          setGrid(current => ({ ...base, items: current ? current.items : [], loading: false, error: err.message }));
        }
      };

      // Searching starts a moment after typing stops
      useEffect(() => {
        const query = searchTerm.trim();
        if (!query) {
          setGrid(current => (current && current.query ? null : current));
          return;
        }
        const timer = setTimeout(() => loadGrid({ title: `Results for "${query}"`, query, kind: searchKind }, 1), 450);
        return () => clearTimeout(timer);
      }, [searchTerm, searchKind]);

      const closeGrid = () => { setGrid(null); setSearchTerm(''); };

      const openDetail = async (card) => {
        setDetail({ ...card, loading: true });
        setDetailError('');
        setSeason(null);
        setSeasonNumber(null);
        setSelectedEpisode(null);
        setHistory({});
        stopContinuing();
        api.discoverHistory(card.kind, card.tmdbId)
          .then(data => data.success && setHistory(data.history))
          .catch(() => {});
        try {
          const data = await api.discoverTitle(card.kind, card.tmdbId, APP_LANGUAGE);
          if (!data.success) throw new Error(data.error || 'Could not load this title');
          setDetail({ ...data.title, tmdbId: data.title.id, name: data.title.title });
          if (data.title.kind === 'tv' && data.title.seasons.length) {
            // The first real season (specials, season 0, go last)
            setSeasonNumber(data.title.seasons[0].number);
          }
        } catch (err) {
          setDetailError(err.message);
          setDetail(current => current && { ...current, loading: false });
        }
      };

      // Episodes of the season chosen
      useEffect(() => {
        if (!detail || detail.kind !== 'tv' || seasonNumber === null) return;
        let cancelled = false;
        setSeason(null);
        api.discoverSeason(detail.tmdbId, seasonNumber, APP_LANGUAGE)
          .then(data => {
            if (cancelled) return;
            if (!data.success) throw new Error(data.error || 'Could not load the episodes');
            setSeason(data.season);
          })
          .catch(err => !cancelled && setDetailError(err.message));
        return () => { cancelled = true; };
      }, [detail && detail.tmdbId, seasonNumber]);

      // Escape closes the innermost layer
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== 'Escape' || document.fullscreenElement) return;
          if (player.playing) return; // the player has its own close button
          if (sources) setSources(null);
          else if (detail) setDetail(null);
          else if (grid) closeGrid();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [!!detail, !!grid, !!sources, !!player.playing]);

      const titleRequest = (ep) => {
        const code = ep && `S${String(seasonNumber).padStart(2, '0')}E${String(ep.number).padStart(2, '0')}`;
        return ep
          ? {
              key: `tv:${detail.tmdbId}:${seasonNumber}:${ep.number}`,
              kind: 'tv', tmdbId: detail.tmdbId, season: seasonNumber, episode: ep.number,
              label: `${detail.name} · ${code} · ${ep.title}`,
              title: detail.name, subtitle: `${code} · ${ep.title}`, image: ep.still || detail.backdrop || detail.poster,
              display: { title: detail.name, subtitle: `${code} · ${ep.title}`, image: ep.still || detail.backdrop || detail.poster }
            }
          : {
              key: `movie:${detail.tmdbId}`, kind: 'movie', tmdbId: detail.tmdbId,
              label: [detail.name, detail.year].filter(Boolean).join(' · '),
              title: detail.name, subtitle: detail.year || '', image: detail.backdrop || detail.poster,
              display: { title: detail.name, subtitle: detail.year || '', image: detail.backdrop || detail.poster }
            };
      };

      const findSources = (ep) => setSources(titleRequest(ep));

      // Opened from the dashboard: that title's details
      useEffect(() => {
        if (!intent) return;
        if (intent.open) openDetail(intent.open);
        if (onIntentDone) onIntentDone();
      }, [intent]);

      // Played before with the same source: straight to it, without searching
      const stopContinuing = () => {
        if (continueRun.current) continueRun.current.cancelled = true;
        continueRun.current = null;
        setContinuing(null);
      };
      useEffect(() => () => { if (continueRun.current) continueRun.current.cancelled = true; }, []);

      const continueWith = async (ep) => {
        const request = titleRequest(ep);
        const entry = history[request.key];
        stopContinuing();
        const run = { cancelled: false };
        continueRun.current = run;
        setContinuing({ key: request.key, state: 'starting' });
        try {
          const ready = await waitForDebrid(() => api.discoverContinue(request), request, run, (data) => setContinuing({ key: request.key, ...data }));
          if (!ready) return;
          continueRun.current = null;
          setContinuing(null);
          playReady(request, debridItem(request, { quality: (entry && entry.quality) || {} }, ready));
        } catch (err) {
          if (!run.cancelled) setContinuing({ key: request.key, error: err.message });
        }
      };

      // Position kept on the server (the browser's own, for titles played before it was)
      const positionOf = (key) => {
        const entry = history[key];
        if (!entry || entry.finished) return 0;
        return entry.position || savedRecordingPosition(`discover:${key}`);
      };

      const playedLabel = (key) => {
        const at = positionOf(key);
        return at > 0 ? `Stopped at ${formatLength(at)}` : history[key] && history[key].finished ? 'Watched' : 'Played';
      };

      const resumeLabel = (key) => {
        const at = positionOf(key);
        return at > 0 ? `Continue from ${formatLength(at)}` : 'Play again';
      };

      // The Continue button, or how it is going, for a film or episode played before
      const continueControls = (ep) => {
        const key = titleRequest(ep).key;
        const entry = history[key];
        if (!entry) return null;
        const mine = continuing && continuing.key === key;
        const used = [entry.quality && entry.quality.resolution, entry.quality && entry.quality.source, formatBytes(entry.size)].filter(Boolean).join(' · ');
        return (
          <React.Fragment>
            {mine && !continuing.error ? (
              <div className="discover-preparing">
                <span className="discover-spinner"></span>
                <span>{debridStatus(continuing)}</span>
                <button className="vod-secondary" onClick={(e) => { e.stopPropagation(); stopContinuing(); }}>Cancel</button>
              </div>
            ) : (
              <button className="vod-play" title={entry.title} onClick={(e) => { e.stopPropagation(); continueWith(ep); }}>
                <Icon name="play" size={16} /> {resumeLabel(key)}
              </button>
            )}
            {used && <span className="discover-used" title={entry.title}>Same source as before: {used}</span>}
            {mine && continuing.error && <div className="error-msg discover-continue-error">{continuing.error}</div>}
          </React.Fragment>
        );
      };

      const playReady = (request, item) => {
        player.open(discoverPlayerItem(request, item, positionOf(request.key))).catch(err => alert(err.message));
      };

      // Back from the player: the source just played, and the new position
      // (asked a moment later, after the last position has been saved)
      useEffect(() => {
        if (player.playing || !detail || detail.loading) return;
        const timer = setTimeout(() => {
          api.discoverHistory(detail.kind, detail.tmdbId).then(data => data.success && setHistory(data.history)).catch(() => {});
        }, 600);
        return () => clearTimeout(timer);
      }, [!!player.playing]);

      // The hero rotates through the trending titles
      const heroItems = rows && rows[0] ? rows[0].items.filter(item => item.backdrop).slice(0, 6) : [];
      const hero = heroItems[heroIndex % Math.max(heroItems.length, 1)];
      useEffect(() => {
        if (heroItems.length < 2 || grid || detail) return;
        const timer = setInterval(() => setHeroIndex(i => (i + 1) % heroItems.length), 9000);
        return () => clearInterval(timer);
      }, [heroItems.length, !!grid, !!detail]);

      const meta = (item) => [
        item.year,
        item.runtime ? `${Math.floor(item.runtime / 60)}h ${String(item.runtime % 60).padStart(2, '0')}m` : '',
        item.rating ? `★ ${item.rating}` : '',
        item.kind === 'tv' ? 'Series' : 'Film'
      ].filter(Boolean);

      const episodeDate = (date) => date
        ? new Date(`${date}T12:00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
        : '';

      return (
        <div className="vod-browser">
          <div className={`vod-topbar ${grid ? 'solid' : ''}`}>
            {grid && <button className="vod-back" onClick={closeGrid} title="Back"><Icon name="back" /></button>}
            <h2>{grid ? grid.title : 'Discover'}</h2>
            <div className="search-container vod-search">
              <span className="search-icon"><Icon name="search" size={16} /></span>
              <input
                type="text"
                className="search-input"
                placeholder="Search films and series..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>
            {grid && grid.query && (
              <div className="discover-kinds">
                {[['', 'All'], ['movie', 'Films'], ['tv', 'Series']].map(([kind, label]) => (
                  <button key={kind} className={`theme-option ${searchKind === kind ? 'active' : ''}`} onClick={() => setSearchKind(kind)}>{label}</button>
                ))}
              </div>
            )}
          </div>

          {grid ? (
            <div className="vod-scroll with-topbar">
              {grid.total > 0 && <div className="vod-grid-count">{grid.total} titles</div>}
              <div className="vod-grid">
                {grid.items.map(item => <VodCard key={item.id} item={item} onOpen={openDetail} />)}
                {grid.loading && Array.from({ length: 7 }, (_, i) => <div key={`s${i}`} className="vod-card skeleton"></div>)}
              </div>
              {grid.error && <div className="vod-message"><div className="error-msg">{grid.error}</div></div>}
              {!grid.loading && grid.items.length === 0 && !grid.error && <div className="vod-message">No titles found.</div>}
              {!grid.loading && grid.page < grid.totalPages && (
                <div className="vod-more">
                  <button className="btn btn-secondary" onClick={() => loadGrid(grid, grid.page + 1)}>Load more</button>
                </div>
              )}
            </div>
          ) : (
            <div className="vod-scroll">
              {hero ? (
                <div className="vod-hero">
                  {heroItems.map(item => (
                    <div
                      key={item.id}
                      className={`vod-hero-backdrop ${item.id === hero.id ? 'active' : ''}`}
                      style={{ backgroundImage: `url("${item.backdrop}")` }}
                    ></div>
                  ))}
                  <div className="vod-hero-text">
                    <h1>{hero.name}</h1>
                    <div className="vod-hero-genres">{meta(hero).join('  •  ')}</div>
                    <p>{hero.overview}</p>
                    <div className="vod-actions">
                      <button className="vod-play" onClick={() => openDetail(hero)}>View Details</button>
                    </div>
                  </div>
                  {heroItems.length > 1 && (
                    <div className="vod-hero-dots">
                      {heroItems.map((item, i) => (
                        <button key={item.id} className={item.id === hero.id ? 'active' : ''} title={item.name} onClick={() => setHeroIndex(i)}></button>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                !error && <div className="vod-hero placeholder"></div>
              )}

              {error && <div className="vod-message"><div className="error-msg">{error}</div></div>}

              {(rows || Array.from({ length: 3 }, (_, i) => ({ id: `s${i}`, title: '' }))).map(row => (
                <VodRow
                  key={row.id}
                  title={row.title}
                  row={row.items ? { items: row.items } : null}
                  onOpen={openDetail}
                  onSeeAll={() => loadGrid({ title: row.title, row: row.id }, 1)}
                />
              ))}
            </div>
          )}

          {/* Put away while a source plays, and back when it closes */}
          <div style={{ display: player.playing ? 'none' : undefined }}>
          {detail && (
            <div className="modal-overlay" onClick={() => setDetail(null)}>
              <div className="modal vod-detail" onClick={e => e.stopPropagation()}>
                {detail.backdrop && <div className="vod-detail-backdrop" style={{ backgroundImage: `url("${detail.backdrop}")` }}></div>}
                <button className="vod-close" onClick={() => setDetail(null)} title="Close"><Icon name="x" size={18} /></button>
                <div className="vod-detail-top">
                  <img src={detail.poster || POSTER_FALLBACK} alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }} />
                  <div className="vod-detail-text">
                    <div className="vod-title-row">
                      <h2>{detail.name}</h2>
                      <FavoriteButton favorite={{
                        type: 'discover', id: `${detail.kind}:${detail.tmdbId}`, name: detail.name, image: detail.poster,
                        data: { kind: detail.kind, tmdbId: detail.tmdbId, name: detail.name, title: detail.name, poster: detail.poster, backdrop: detail.backdrop, year: detail.year }
                      }} />
                    </div>
                    <div className="vod-meta">{meta(detail).map(m => <span key={m}>{m}</span>)}</div>
                    {detail.genres && detail.genres.length > 0 && <div className="vod-genres">{detail.genres.slice(0, 3).join(' • ')}</div>}
                    {detail.loading ? <p>Loading...</p> : <p>{detail.overview}</p>}
                    {detail.director && <div className="vod-credits"><strong>Director</strong> {detail.director}</div>}
                    {detail.cast && detail.cast.length > 0 && <div className="vod-credits"><strong>Cast</strong> {detail.cast.join(', ')}</div>}

                    {detail.kind === 'movie' && !detail.loading && !detailError && (
                      <div className="vod-actions discover-actions">
                        {continueControls(null)}
                        <button className={history[titleRequest(null).key] ? 'vod-secondary' : 'vod-play'} onClick={() => findSources(null)}>
                          <Icon name="search" size={16} /> {history[titleRequest(null).key] ? 'Other sources' : 'Find sources'}
                        </button>
                      </div>
                    )}
                  </div>
                </div>

                {detailError && <div className="error-msg">{detailError}</div>}

                {detail.kind === 'tv' && detail.seasons && (
                  <div className="vod-episodes">
                    {detail.seasons.length === 0 && <div className="vod-message">No episodes listed.</div>}
                    {detail.seasons.length > 1 && (
                      <div className="vod-seasons">
                        {detail.seasons.map(s => (
                          <button
                            key={s.number}
                            className={`theme-option ${s.number === seasonNumber ? 'active' : ''}`}
                            onClick={() => { setSeasonNumber(s.number); setSelectedEpisode(null); }}
                          >
                            {s.number === 0 ? 'Specials' : `Season ${s.number}`}
                          </button>
                        ))}
                      </div>
                    )}
                    {seasonNumber !== null && !season && !detailError && <div className="vod-message">Loading episodes...</div>}
                    {season && (
                      <div className="rec-episodes">
                        {season.episodes.map(ep => {
                          const chosen = selectedEpisode === ep.number;
                          return (
                            <div
                              key={ep.number}
                              className={`rec-episode ${chosen ? 'chosen' : ''}`}
                              onClick={() => setSelectedEpisode(chosen ? null : ep.number)}
                            >
                              <div className="rec-episode-thumb">
                                {ep.still
                                  ? <img src={ep.still} alt="" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />
                                  : <Icon name="film" size={24} />}
                              </div>
                              <div className="rec-episode-text">
                                <div className="rec-episode-title">
                                  <span className="rec-episode-number">E{String(ep.number).padStart(2, '0')}</span>
                                  {ep.title}
                                </div>
                                <div className="rec-episode-sub">
                                  {[episodeDate(ep.date), ep.runtime ? `${ep.runtime} min` : '', ep.rating ? `★ ${ep.rating}` : ''].filter(Boolean).join(' · ')}
                                  {history[titleRequest(ep).key] && <span className="discover-played"> · {playedLabel(titleRequest(ep).key)}</span>}
                                </div>
                                {ep.overview && <div className="rec-episode-overview">{ep.overview}</div>}
                                {chosen && (
                                  <div className="vod-actions discover-episode-actions">
                                    {continueControls(ep)}
                                    <button className={history[titleRequest(ep).key] ? 'vod-secondary' : 'vod-play'} onClick={(e) => { e.stopPropagation(); findSources(ep); }}>
                                      <Icon name="search" size={16} /> {history[titleRequest(ep).key] ? 'Other sources' : 'Find sources'}
                                    </button>
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {sources && <DiscoverSources request={sources} onClose={() => setSources(null)} onReady={(item) => playReady(sources, item)} />}
          </div>

          {player.view}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HOME (dashboard): shortcuts, continue watching, favourites, recent channels
    // ═══════════════════════════════════════════════════════════════════════

    const greeting = () => {
      const hour = new Date().getHours();
      return hour < 6 ? 'Good night' : hour < 12 ? 'Good morning' : hour < 20 ? 'Good afternoon' : 'Good evening';
    };

    // Programme on air on some channels, asked one after the other
    function useOnAir(channelIds, enabled) {
      const [onAir, setOnAir] = useState({});
      const ids = channelIds.join(',');

      useEffect(() => {
        if (!enabled || !ids) return;
        let cancelled = false;
        (async () => {
          for (const id of ids.split(',')) {
            try {
              const data = await api.iptvGetNow(id);
              if (cancelled) return;
              const now = Date.now() / 1000;
              const programs = (data.success ? data.programs : []).filter(p => p.stop - p.start <= 12 * 3600);
              setOnAir(current => ({ ...current, [id]: programs.find(p => p.start <= now && p.stop > now) || null }));
            } catch (_) {
              if (cancelled) return;
            }
          }
        })();
        return () => { cancelled = true; };
      }, [ids, enabled]);

      return onAir;
    }

    function HomeChannel({ channel, programme, onPlay }) {
      const now = Date.now() / 1000;
      const progress = programme ? Math.min(100, Math.max(0, ((now - programme.start) / (programme.stop - programme.start)) * 100)) : 0;
      return (
        <div className="home-channel" onClick={() => onPlay(channel)} title={channel.name}>
          <div className="home-channel-logo">
            <img src={channel.logo || CHANNEL_LOGO_FALLBACK} alt="" loading="lazy"
              onError={(e) => { e.target.onerror = null; e.target.src = CHANNEL_LOGO_FALLBACK; }} />
          </div>
          <div className="home-channel-text">
            <div className="home-channel-name">{channel.name.replace(/\s*MOBILE\s*$/i, '')}</div>
            <div className="home-channel-now">{programme ? programme.name : `Ch. ${channel.number}`}</div>
            {programme && <div className="home-progress"><span style={{ width: `${progress}%` }}></span></div>}
          </div>
          <FavoriteButton size={16} favorite={{ type: 'channel', id: String(channel.id), name: channel.name, image: channel.logo || '', data: {} }} />
        </div>
      );
    }

    function HomeRow({ title, children, empty }) {
      return (
        <section className="home-section">
          <h3>{title}</h3>
          {empty ? <div className="home-empty">{empty}</div> : <div className="home-row">{children}</div>}
        </section>
      );
    }

    // onSection(id) opens a part of the app; onIntent({ section, ... }) opens a
    // title there; onPlayChannel(channel) starts a channel
    function HomeDashboard({ user, modules, channels, onSection, onPlayChannel, onIntent }) {
      const [home, setHome] = useState(null);             // { recentChannels, discover }
      const [recordings, setRecordings] = useState(null); // { recordings, castBase }
      const [trending, setTrending] = useState([]);
      const [continuing, setContinuing] = useState(null); // Discover title being prepared: { key, state, progress, error }
      const [clock, setClock] = useState(new Date());
      const { list: favorites } = useFavorites();
      const player = useRecordingPlayer();
      const run = useRef(null);
      const sections = (user && user.sections) || {};

      const load = () => {
        api.dashboard().then(data => {
          if (!data.success) return;
          setHome(data);
          setFavorites(data.favorites);
        }).catch(() => {});
        if (modules.library) {
          Promise.all([api.recordings(), loadServerPositions()])
            .then(([data]) => data.success && setRecordings(data))
            .catch(() => {});
        }
      };

      useEffect(() => {
        load();
        if (modules.discover) {
          api.discoverHome(APP_LANGUAGE)
            .then(data => data.success && data.rows[0] && setTrending(data.rows[0].items.slice(0, 15).map(discoverCard)))
            .catch(() => {});
        }
        const timer = setInterval(() => setClock(new Date()), 30000);
        return () => {
          clearInterval(timer);
          if (run.current) run.current.cancelled = true;
        };
      }, []);

      // Back from the player: positions changed
      useEffect(() => {
        if (player.playing) return;
        const timer = setTimeout(load, 600);
        return () => clearTimeout(timer);
      }, [!!player.playing]);

      const channelsById = useMemo(() => new Map(channels.map(c => [String(c.id), c])), [channels]);
      const recentChannels = ((home && home.recentChannels) || []).map(r => channelsById.get(String(r.id))).filter(Boolean).slice(0, 12);
      const favoriteChannels = favorites.filter(f => f.type === 'channel').map(f => channelsById.get(String(f.id))).filter(Boolean);
      const favoriteTitles = favorites.filter(f => f.type !== 'channel' && (f.type === 'discover' ? modules.discover : sections[f.type]));
      const onAirIds = [...new Set([...favoriteChannels, ...recentChannels].map(c => String(c.id)))].slice(0, 20);
      const onAir = useOnAir(onAirIds, !!modules.live && channels.length > 0);

      const jobs = (recordings && recordings.recordings) || [];
      const done = jobs.filter(job => job.state === 'done');
      const working = jobs.filter(job => !['done', 'failed', 'cancelled'].includes(job.state));
      const recordingImage = (job) => (job.metadata && (job.metadata.image || metadataText(job.metadata).poster)) || '';
      // Without details: the programme name, without the date it was saved with
      const heading = (job) => (job.metadata ? recordingHeading(job) : { title: programmeName(job), subtitle: job.channelName });

      // Continue Discover titles with the same source, straight from here
      const continueDiscover = async (entry) => {
        const request = {
          key: entry.key, kind: entry.kind, tmdbId: entry.tmdbId, season: entry.season, episode: entry.episode,
          title: entry.title, subtitle: entry.subtitle, image: entry.image,
          display: { title: entry.title, subtitle: entry.subtitle, image: entry.image }
        };
        if (run.current) run.current.cancelled = true;
        const job = { cancelled: false };
        run.current = job;
        setContinuing({ key: entry.key, state: 'starting' });
        try {
          const ready = await waitForDebrid(() => api.discoverContinue(request), request, job, (data) => setContinuing({ key: entry.key, ...data }));
          if (!ready) return;
          setContinuing(null);
          await player.open(discoverPlayerItem(request, debridItem(request, { quality: entry.quality || {} }, ready), entry.position));
        } catch (err) {
          if (!job.cancelled) setContinuing({ key: entry.key, error: err.message });
        }
      };

      // Everything left part-way, newest first
      const watching = [];
      readContinue().forEach(entry => {
        if (!sections[entry.type]) return;
        watching.push({
          key: `vod:${entry.key}`,
          at: entry.updatedAt || 0,
          title: entry.item.name,
          subtitle: entry.season ? `${entry.season.name} · Episode ${entry.episode}` : (entry.type === 'series' ? 'Series' : 'Video club'),
          image: largePoster(entry.item.poster),
          progress: entry.duration ? entry.position / entry.duration : null,
          note: entry.duration ? `${Math.max(1, Math.round((entry.duration - entry.position) / 60))} min left` : '',
          open: () => onIntent({ section: entry.type, play: entry })
        });
      });
      ((home && home.discover) || []).forEach(entry => {
        watching.push({
          key: `discover:${entry.key}`,
          at: Date.parse(entry.at) || 0,
          title: entry.title,
          subtitle: entry.subtitle,
          image: entry.image,
          progress: null,
          note: `Stopped at ${formatLength(entry.position)}`,
          discover: entry.key,
          open: () => continueDiscover(entry)
        });
      });
      done.forEach(job => {
        const at = savedRecordingPosition(job.id);
        if (!(at > 0)) return;
        const kept = serverPositions.get(`rec:${job.id}`);
        const { title, subtitle } = heading(job);
        watching.push({
          key: `rec:${job.id}`,
          at: (kept && Date.parse(kept.at)) || job.finishedAt || 0,
          title,
          subtitle,
          image: recordingImage(job),
          logo: job.channelLogo,
          progress: job.outputDuration ? at / job.outputDuration : null,
          note: job.outputDuration ? `${Math.max(1, Math.round((job.outputDuration - at) / 60))} min left` : '',
          open: () => player.play(job, recordings.castBase).catch(err => alert(err.message))
        });
      });
      watching.sort((a, b) => b.at - a.at);

      const latest = [...done].sort((a, b) => (b.finishedAt || b.createdAt) - (a.finishedAt || a.createdAt)).slice(0, 12);

      const tiles = [
        modules.live && { id: 'tv', label: 'Live TV', icon: 'tv', hint: channels.length ? `${channels.length} channels` : 'TV channels' },
        modules.recordings && { id: 'guide', label: 'Recordings', icon: 'calendar', hint: 'Programmes already aired' },
        modules.library && { id: 'library', label: 'Library', icon: 'box', hint: working.length ? `${working.length} in progress` : 'Kept on this server' },
        sections.vod && { id: 'vod', label: 'Video Club', icon: 'film', hint: 'Films from your provider' },
        sections.series && { id: 'series', label: 'Series', icon: 'layers', hint: 'Series from your provider' },
        modules.library && { id: 'recorded', label: 'Recorded', icon: 'grid', hint: done.length ? `${done.length} to watch` : 'Finished recordings' },
        modules.discover && { id: 'discover', label: 'Discover', icon: 'compass', hint: 'Films and series to stream' }
      ].filter(Boolean);

      const openFavorite = (favorite) => {
        if (favorite.type === 'discover') onIntent({ section: 'discover', open: favorite.data });
        else if (favorite.data && favorite.data.item) onIntent({ section: favorite.type, open: favorite.data.item });
      };

      const name = user && user.username ? user.username.charAt(0).toUpperCase() + user.username.slice(1) : '';

      return (
        <div className="vod-browser home">
          <div className="home-scroll" style={{ display: player.playing ? 'none' : undefined }}>
            <header className="home-header">
              <div>
                <h1>{greeting()}{name ? `, ${name}` : ''}</h1>
                <div className="home-date">
                  {clock.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}
                  {' · '}
                  {clock.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
            </header>

            <div className="home-tiles">
              {tiles.map(tile => (
                <button key={tile.id} className="home-tile" onClick={() => onSection(tile.id)}>
                  <span className="home-tile-icon"><Icon name={tile.icon} size={22} /></span>
                  <span className="home-tile-label">{tile.label}</span>
                  <span className="home-tile-hint">{tile.hint}</span>
                </button>
              ))}
            </div>

            {watching.length > 0 && (
              <HomeRow title="Continue watching">
                {watching.slice(0, 20).map(item => {
                  const mine = continuing && item.discover && continuing.key === item.discover;
                  return (
                    <div key={item.key} className="home-card" onClick={() => !mine && item.open()} title={item.title}>
                      <div className="home-card-image">
                        {item.image
                          ? <img src={item.image} alt="" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />
                          : item.logo ? <img className="logo" src={item.logo} alt="" loading="lazy" /> : <Icon name="film" size={28} />}
                        <span className="home-card-play"><Icon name="play" size={26} filled /></span>
                        {item.progress !== null && <div className="home-progress on-image"><span style={{ width: `${Math.min(100, item.progress * 100)}%` }}></span></div>}
                        {mine && !continuing.error && (
                          <div className="home-card-status"><span className="discover-spinner"></span>{debridStatus(continuing)}</div>
                        )}
                      </div>
                      <div className="home-card-title">{item.title}</div>
                      <div className="home-card-sub">{[item.subtitle, item.note].filter(Boolean).join(' · ')}</div>
                      {mine && continuing.error && <div className="home-card-error">{continuing.error}</div>}
                    </div>
                  );
                })}
              </HomeRow>
            )}

            <HomeRow
              title="Favourites"
              empty={favoriteChannels.length === 0 && favoriteTitles.length === 0
                ? 'Add channels, films and series with the ☆ star, in the channel list and in their details.'
                : null}
            >
              {favoriteChannels.map(channel => (
                <HomeChannel key={`c${channel.id}`} channel={channel} programme={onAir[String(channel.id)]} onPlay={onPlayChannel} />
              ))}
              {favoriteTitles.map(favorite => (
                <div key={favorite.key} className="home-poster" onClick={() => openFavorite(favorite)} title={favorite.name}>
                  <img src={largePoster(favorite.image) || POSTER_FALLBACK} alt="" loading="lazy"
                    onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }} />
                  <FavoriteButton size={16} favorite={favorite} />
                  <div className="home-poster-name">{favorite.name}</div>
                  <div className="home-poster-kind">{favorite.type === 'vod' ? 'Video club' : favorite.type === 'series' ? 'Series' : favorite.data && favorite.data.kind === 'tv' ? 'Series · Discover' : 'Film · Discover'}</div>
                </div>
              ))}
            </HomeRow>

            {modules.live && recentChannels.length > 0 && (
              <HomeRow title="Last channels watched">
                {recentChannels.map(channel => (
                  <HomeChannel key={channel.id} channel={channel} programme={onAir[String(channel.id)]} onPlay={onPlayChannel} />
                ))}
              </HomeRow>
            )}

            {latest.length > 0 && (
              <HomeRow title="Recently recorded">
                {latest.map(job => {
                  const { title, subtitle } = heading(job);
                  const image = recordingImage(job);
                  return (
                    <div key={job.id} className="home-card" onClick={() => player.play(job, recordings.castBase).catch(err => alert(err.message))} title={title}>
                      <div className="home-card-image">
                        {image
                          ? <img src={image} alt="" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />
                          : <img className="logo" src={job.channelLogo || CHANNEL_LOGO_FALLBACK} alt="" loading="lazy" />}
                        <span className="home-card-play"><Icon name="play" size={26} filled /></span>
                      </div>
                      <div className="home-card-title">{title}</div>
                      <div className="home-card-sub">{[subtitle, job.outputDuration ? `${Math.round(job.outputDuration / 60)} min` : ''].filter(Boolean).join(' · ')}</div>
                    </div>
                  );
                })}
              </HomeRow>
            )}

            {trending.length > 0 && (
              <HomeRow title="Trending this week">
                {trending.map(item => (
                  <div key={item.id} className="home-poster" onClick={() => onIntent({ section: 'discover', open: item })} title={item.name}>
                    <img src={item.poster || POSTER_FALLBACK} alt="" loading="lazy"
                      onError={(e) => { e.target.onerror = null; e.target.src = POSTER_FALLBACK; }} />
                    <div className="home-poster-name">{item.name}</div>
                    <div className="home-poster-kind">{[item.year, item.kind === 'tv' ? 'Series' : 'Film'].filter(Boolean).join(' · ')}</div>
                  </div>
                ))}
              </HomeRow>
            )}
          </div>

          {player.view}
        </div>
      );
    }

    const ALL_MODULES = { live: true, recordings: true, library: true, vod: true, series: true, discover: false };

    // First section to open: the dashboard, which leads to every other part
    function firstSection() {
      return 'home';
    }

    // How each channel had to be played (see liveConvertRef in the App), kept in this browser
    function savedLiveConvert(channelId) {
      try { return localStorage.getItem(`live:convert:${channelId}`) || null; } catch (_) { return null; }
    }

    function rememberLiveConvert(channelId, mode) {
      try {
        if (mode) localStorage.setItem(`live:convert:${channelId}`, mode);
        else localStorage.removeItem(`live:convert:${channelId}`);
      } catch (_) {}
    }

    function App() {
      // Auth state
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      
      // Parts of the app this server offers (admin Settings)
      const modules = user?.modules || ALL_MODULES;

      // UI state
      const [screen, setScreen] = useState('login');
      const [section, setSection] = useState('home'); // 'home' | 'tv' | 'guide' | 'library' | 'vod' | 'series' | 'recorded' | 'discover'
      const [intent, setIntent] = useState(null);    // a title the dashboard opens in another section
      const [guideOpened, setGuideOpened] = useState(false); // keeps the guide mounted once visited
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loadingProgress, setLoadingProgress] = useState('');
      
      // Login form
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      
      // IPTV state
      const [iptvSessionId, setIptvSessionId] = useState('');
      const [channels, setChannels] = useState([]);
      const [genres, setGenres] = useState([]);
      const [listUpdatedAt, setListUpdatedAt] = useState(null);
      const [hiddenGroups, setHiddenGroups] = useState(0);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [listError, setListError] = useState('');
      const [selectedGenre, setSelectedGenre] = useState(null);
      const [showChannels, setShowChannels] = useState(false);
      
      // Player state
      const [currentChannel, setCurrentChannel] = useState(null);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const videoRef = useRef(null);
      const playerRef = useRef(null);
      const watchdogIntervalRef = useRef(null);
      
      // Archive (catch-up) browser
      const [archiveChannel, setArchiveChannel] = useState(null);
      const [archiveDate, setArchiveDate] = useState('');
      const [archivePrograms, setArchivePrograms] = useState([]);
      const [archiveLoading, setArchiveLoading] = useState(false);
      const [archiveError, setArchiveError] = useState('');
      const [archiveInfoId, setArchiveInfoId] = useState(null); // programme whose description is open
      const [archiveNote, setArchiveNote] = useState('');
      const [intervalFrom, setIntervalFrom] = useState('20:00');
      const [intervalTo, setIntervalTo] = useState('21:00');
      
      // Archive playback: { channel, title, start, duration, streamUrl }
      const [archivePlayback, setArchivePlayback] = useState(null);
      const [archivePos, setArchivePos] = useState(0);
      const archiveBaseRef = useRef(0);
      
      // Live playback recovery
      const [playerNotice, setPlayerNotice] = useState('');
      // (in the TV app, shown over its player)
      useEffect(() => { if (TV_APP) nativePlayer.notice(playerNotice); }, [playerNotice]);
      const liveRetryRef = useRef({ count: 0, timer: null, startedAt: 0 });

      // Channels the browser cannot play may be converted on the server (admin
      // Settings): null plays the channel as it comes, 'audio' converts only the
      // sound, 'full' converts sound and picture
      const liveConversion = !!user?.features?.liveConversion;
      const liveConvertRef = useRef(null);
      const liveBufferTimer = useRef(null);
      const liveCodecTimer = useRef(null);
      const [videoLoading, setVideoLoading] = useState(false); // spinner while starting or buffering
      
      // Programme on air for the channel being watched live: { current, next }
      const [onAir, setOnAir] = useState(null);
      
      // Modals
      const [showChangePassword, setShowChangePassword] = useState(false);
      const [showPreferences, setShowPreferences] = useState(false);
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      
      // Theme
      const [currentTheme, setCurrentTheme] = useState(localStorage.getItem('theme') || 'midnight');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      // Apply theme
      useEffect(() => {
        document.body.className = `theme-${currentTheme}`;
        localStorage.setItem('theme', currentTheme);
      }, [currentTheme]);

      // Disable mpegts.js logging
      useEffect(() => {
        if (typeof mpegts !== 'undefined' && mpegts.LoggingControl) {
          mpegts.LoggingControl.applyConfig({
            enableAll: false,
            enableDebug: false,
            enableVerbose: false,
            enableInfo: false,
            enableWarn: false,
            enableError: false
          });
        }
      }, []);

      // Check auth on mount
      useEffect(() => { 
        checkAuth(); 
      }, []);

      // Cleanup on unmount
      useEffect(() => {
        return () => {
          if (playerRef.current) {
            playerRef.current.destroy?.();
          }
          if (watchdogIntervalRef.current) {
            clearInterval(watchdogIntervalRef.current);
          }
        };
      }, []);
      
      // Fullscreen detection
      useEffect(() => { 
        const handler = () => setIsFullscreen(!!document.fullscreenElement); 
        document.addEventListener('fullscreenchange', handler); 
        return () => document.removeEventListener('fullscreenchange', handler); 
      }, []);

      // ═══════════════════════════════════════════════════════════════════════
      // AUTH FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const checkAuth = async () => {
        if (!api.token) { 
          setAuthChecked(true); 
          return; 
        }
        
        try {
          const data = await api.getMe();
          
          if (data.success && data.user) { 
            setUser(data.user); 
            setIsAuthenticated(true);
            
            // 🐛 FIX: Check explicitly for true boolean
            if (data.user.hasPortalConfig === true) {
              await connectToIPTV(data.user);
            } else {
              setScreen('noconfig');
            }
          }
        } catch (error) { 
          api.setToken(null); 
        }
        setAuthChecked(true);
      };

      const handleLogin = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setIsLoggingIn(true);
        
        try {
          const data = await api.login(username, password);
          
          if (!data.success) {
            throw new Error(data.error || 'Login failed');
          }
          
          api.setToken(data.token); 
          setUser(data.user); 
          setIsAuthenticated(true);
          
          // 🐛 FIX: Check explicitly for true boolean
          if (data.user.hasPortalConfig === true) {
            await connectToIPTV(data.user);
          } else {
            setScreen('noconfig');
          }
        } catch (err) { 
          setError(err.message); 
        } finally { 
          setIsLoggingIn(false); 
        }
      };

      const handleLogout = async () => {
        try {
          // Cleanup
          if (iptvSessionId) {
            try {
              await api.iptvDisconnect();
            } catch (err) {
              // Silent fail
            }
          }
          
          if (watchdogIntervalRef.current) {
            clearInterval(watchdogIntervalRef.current);
            watchdogIntervalRef.current = null;
          }
          
          cancelLiveRetry();
          setPlayerNotice('');
          
          if (playerRef.current) {
            try {
              playerRef.current.destroy?.();
            } catch (err) {
              // Silent fail
            }
            playerRef.current = null;
          }
        } catch (error) {
          // Silent fail on cleanup
        }
        
        // Reset ALL state
        api.setToken(null); 
        setUser(null); 
        setIsAuthenticated(false); 
        setIptvSessionId(''); 
        setChannels([]); 
        setGenres([]);
        setListUpdatedAt(null);
        setHiddenGroups(0);
        setSelectedGenre(null);
        setShowChannels(false);
        setCurrentChannel(null); 
        setArchiveChannel(null);
        setArchivePlayback(null);
        setSection('home');
        setGuideOpened(false);
        setScreen('login');
        setError('');
        setSuccess('');
      };

      const handleChangePassword = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setSuccess('');
        
        if (newPassword !== confirmPassword) { 
          setError('Passwords do not match'); 
          return; 
        }
        
        try {
          const data = await api.changePassword(currentPassword, newPassword);
          if (!data.success) throw new Error(data.error);
          
          setSuccess('Password changed!'); 
          setCurrentPassword(''); 
          setNewPassword(''); 
          setConfirmPassword('');
          
          setTimeout(() => { 
            setShowChangePassword(false); 
            setSuccess(''); 
          }, 2000);
        } catch (err) { 
          setError(err.message); 
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // IPTV FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const connectToIPTV = async (account) => {
        const offered = (account && account.modules) || ALL_MODULES;
        setScreen('loading'); 
        setLoadingProgress('Connecting to IPTV...');
        
        try {
          // Connect
          const connectData = await api.iptvConnect();
          if (!connectData.success) {
            throw new Error(connectData.error || 'IPTV connection failed');
          }
          
          const sessionId = connectData.sessionId;
          setIptvSessionId(sessionId);
          
          // Load channel list (stored on the server, re-read from the portal once a day)
          if (offered.live || offered.recordings) {
            setLoadingProgress('Loading channels...');
            await loadChannelList(false);
          }
          
          // Start watchdog
          startWatchdog(sessionId);
          
          // Opens on the dashboard
          setSection(firstSection(account));
          setScreen('main');
        } catch (err) { 
          setError(err.message); 
          setScreen('noconfig'); 
        }
      };

      const loadChannelList = async (refresh) => {
        const chData = await api.iptvGetChannels(refresh);
        
        if (!chData.success) {
          throw new Error(chData.error || 'Failed to load channels');
        }
        
        setChannels(chData.channels);
        setGenres(
          chData.genres
            .map(g => ({
              id: g.id,
              name: g.title,
              icon: utils?.getIconForGenre?.(g.title) || '📁',
              number: g.number ?? Number.MAX_SAFE_INTEGER,
              count: g.count
            }))
            .sort((a, b) => {
              if (a.number !== b.number) return a.number - b.number;
              return a.name.localeCompare(b.name);
            })
        );
        setListUpdatedAt(chData.updatedAt);
        setHiddenGroups(chData.hiddenGroups || 0);
      };

      const handleRefreshChannels = async () => {
        if (isRefreshing) return;
        
        setIsRefreshing(true);
        setListError('');
        
        try {
          await loadChannelList(true);
          
          // The selected group may have been removed or hidden meanwhile
          setShowChannels(false);
        } catch (err) {
          setListError(err.message);
        } finally {
          setIsRefreshing(false);
        }
      };

      const startWatchdog = (sessionId) => {
        if (watchdogIntervalRef.current) {
          clearInterval(watchdogIntervalRef.current);
        }
        
        watchdogIntervalRef.current = setInterval(() => {
          api.iptvWatchdog().catch(() => {
            // Silent fail - watchdog is best-effort
          });
        }, 60000); // 60 seconds
      };

      const handleSelectGenre = (genreId) => { 
        setSelectedGenre(genreId); 
        setShowChannels(true); 
      };
      
      const handleBackToGenres = () => {
        setShowChannels(false);
      };

      const getGenreChannels = () => {
        if (selectedGenre === null) return [];
        return channels.filter(ch => ch.tv_genre_id === selectedGenre).sort((a, b) => a.number - b.number);
      };

      // ═══════════════════════════════════════════════════════════════════════
      // PLAYER FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const MAX_LIVE_RETRIES = 5;
      const LIVE_BUFFER_SECONDS = 4;

      const cancelLiveRetry = () => {
        clearTimeout(liveRetryRef.current.timer);
        liveRetryRef.current.timer = null;
      };

      // A live stream that drops is requested again, like a set-top box does
      const scheduleLiveRetry = (channel) => {
        const retry = liveRetryRef.current;
        cancelLiveRetry();
        
        // It had been playing fine for a while: this is a new incident
        if (retry.startedAt && Date.now() - retry.startedAt > 60000) retry.count = 0;
        retry.startedAt = 0;
        
        if (retry.count >= MAX_LIVE_RETRIES) {
          setPlayerNotice('Stream unavailable. Select the channel again to retry.');
          return;
        }
        
        retry.count++;
        setPlayerNotice(`Reconnecting... (${retry.count}/${MAX_LIVE_RETRIES})`);
        retry.timer = setTimeout(() => playChannel(channel, true), Math.min(retry.count * 1000, 5000));
      };

      const playChannel = async (channel, isRetry = false, convert) => {
        cancelLiveRetry();
        setVideoLoading(true);
        if (!isRetry) {
          liveRetryRef.current.count = 0;
          if (convert === undefined) setPlayerNotice('');
        }
        
        setCurrentChannel(channel);
        setArchivePlayback(null);
        if (!isRetry && convert === undefined) api.recentChannel(channel.id).catch(() => {});

        // A retry keeps the way the channel was being played; otherwise the
        // way that worked for this channel before is used
        const mode = !liveConversion || TV_APP ? null
          : convert !== undefined ? convert
          : isRetry ? liveConvertRef.current
          : savedLiveConvert(channel.id);
        liveConvertRef.current = mode;
        
        try {
          const data = await api.iptvGetStream(channel.id, mode);
          
          if (data.success && data.streamUrl) {
            loadStream(data.streamUrl, data.streamType, channel);
          } else {
            scheduleLiveRetry(channel);
          }
        } catch (err) { 
          scheduleLiveRetry(channel);
        }
      };

      // Plays the channel again converted on the server, if this server can and
      // it is not converted that much already. Returns whether it did.
      const convertChannel = (channel, mode) => {
        const current = liveConvertRef.current;
        if (!liveConversion || current === 'full' || current === mode) return false;
        const next = current === 'audio' ? 'full' : mode;
        rememberLiveConvert(channel.id, next);
        setPlayerNotice('');
        playChannel(channel, false, next);
        return true;
      };

      // The video tells when it is waiting for data and when it plays again
      const loadingEvents = {
        onLoadStart: () => setVideoLoading(true),
        onWaiting: (e) => { if (!e.currentTarget._userPaused) setVideoLoading(true); },
        onPlaying: () => setVideoLoading(false),
        onError: () => setVideoLoading(false)
      };

      // The browser seems unable to play the channel. Converting on the server is
      // tried first; the warning is only shown when nothing is playing and no
      // conversion can help any more (a channel being converted may take a
      // while to start, and a passing error while it plays is not a failure).
      const cannotDecode = (channel, mode, video) => {
        if (convertChannel(channel, mode)) return;
        if (video && (video.videoWidth > 0 || video.currentTime > 0)) return;
        setPlayerNotice('This channel cannot be decoded by this browser.');
      };

      // In the TV app the channel plays in the app's own player (no conversion
      // needed); Up and Down there change to the channel before or after it in
      // its group, and a stream that drops is asked for again as here
      const playLiveNatively = (url, streamType, channel) => {
        setVideoLoading(false);
        const group = channels
          .filter(ch => ch.tv_genre_id === channel.tv_genre_id)
          .sort((a, b) => a.number - b.number);
        nativePlayer.play({
          url,
          hls: streamType === 'HLS',
          live: true,
          title: `${channel.number ? `${channel.number}  ` : ''}${channel.name}`
        }, {
          onPlaying: () => {
            liveRetryRef.current.startedAt = Date.now();
            setPlayerNotice('');
          },
          onEnded: () => scheduleLiveRetry(channel),
          onZap: (step) => {
            const at = group.findIndex(ch => ch.id === channel.id);
            const next = group.length ? group[(at + step + group.length) % group.length] : null;
            if (next && next.id !== channel.id) playChannel(next);
          },
          // Back to the list, with nothing shown in the page's own player
          onClose: () => {
            cancelLiveRetry();
            setPlayerNotice('');
            setCurrentChannel(null);
          }
        });
      };

      const loadStream = (streamUrl, streamType, channel) => {
        if (TV_APP) {
          playLiveNatively(streamUrl.startsWith('/') ? `${BACKEND_ORIGIN}${streamUrl}` : streamUrl, streamType, channel);
          return;
        }

        const video = videoRef.current;
        if (!video) return;

        // Cleanup previous player
        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }

        video.removeAttribute('src');
        video.load();
        video.ontimeupdate = null;
        video.onplaying = () => {
          setPlayerNotice('');
          liveRetryRef.current.startedAt = Date.now();
        };
        video.onerror = () => {
          cancelLiveRetry();
          cannotDecode(channel, 'full', video);
        };

        const absoluteUrl = streamUrl.startsWith('/')
          ? `${BACKEND_ORIGIN}${streamUrl}`
          : streamUrl;

        video._userPaused = false;
        video.onwaiting = null;
        video.oncanplay = () => { video.play().catch(() => {}); };

        if (streamType === 'HLS') {
          // HLS stream: native on Safari, HLS.js on Chrome/Firefox
          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = absoluteUrl;
            video.play().catch(() => {});
          } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            const hls = new Hls({ liveSyncDurationCount: 3, enableWorker: false });
            hls.loadSource(absoluteUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
            playerRef.current = hls;
          }
        } else {
          // MPEG-TS, FLV, or raw HTTP stream via mpegts.js
          if (!mpegts || !mpegts.isSupported()) {
            // Fallback to native video
            video.src = absoluteUrl;
            video.play().catch(() => {});
            return;
          }

          mpegts.LoggingControl.applyConfig({ enableAll: false });

          const player = mpegts.createPlayer({
            type: 'mpegts',
            isLive: true,
            url: absoluteUrl
          }, {
            enableWorker: false,
            enableStashBuffer: true,
            stashInitialSize: 384 * 1024,
            isLive: true,
            lazyLoad: false,
            autoCleanupSourceBuffer: true,
            enableLogging: false
          });

          // Upstream closed or failed: ask for the stream again
          const onDrop = () => {
            if (playerRef.current !== player) return;
            scheduleLiveRetry(channel);
          };
          player.on(mpegts.Events.LOADING_COMPLETE, onDrop);
          player.on(mpegts.Events.ERROR, (type, detail, info) => {
            if (type === mpegts.ErrorTypes.NETWORK_ERROR) return onDrop();
            if (playerRef.current !== player) return;
            // The browser refused a codec: only the sound, or the picture too
            const message = String((info && info.msg) || '');
            const mode = /audio\//.test(message) ? 'audio' : 'full';
            cannotDecode(channel, mode, video);
          });

          // Some codecs (MPEG-2 video, MP2 sound alone) are not even recognised:
          // nothing is described and no picture appears
          let described = false;
          player.on(mpegts.Events.MEDIA_INFO, () => { described = true; });
          clearTimeout(liveCodecTimer.current);
          // A channel already converted on the server gets longer to show a picture
          const converted = liveConvertRef.current === 'full';
          liveCodecTimer.current = setTimeout(() => {
            if (playerRef.current !== player || described || video.videoWidth > 0) return;
            cannotDecode(channel, 'full', video);
          }, converted ? 30000 : 8000);

          player.attachMediaElement(video);
          player.load();

          playerRef.current = player;

          // A live stream arrives in real time, so the only way to have a buffer
          // is to wait for one: hold playback until a few seconds are queued, and
          // do the same again whenever playback catches up with the buffer.
          const bufferedAhead = () => video.buffered.length
            ? video.buffered.end(video.buffered.length - 1) - video.currentTime
            : 0;

          const playWhenBuffered = () => {
            clearInterval(liveBufferTimer.current);
            const began = Date.now();
            liveBufferTimer.current = setInterval(() => {
              if (playerRef.current !== player) { clearInterval(liveBufferTimer.current); return; }
              if (bufferedAhead() >= LIVE_BUFFER_SECONDS || Date.now() - began > 12000) {
                clearInterval(liveBufferTimer.current);
                if (!video._userPaused) video.play().catch(() => {});
              }
            }, 200);
          };

          video.oncanplay = null;
          video.onwaiting = () => {
            if (playerRef.current !== player || video._userPaused || video.seeking) return;
            video.pause();
            playWhenBuffered();
          };
          playWhenBuffered();
        }
      };

      // ═══════════════════════════════════════════════════════════════════════
      // ARCHIVE (CATCH-UP) FUNCTIONS
      // ═══════════════════════════════════════════════════════════════════════
      
      const pad2 = (n) => String(n).padStart(2, '0');
      const localDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const clockTime = (ts) => { const d = new Date(ts * 1000); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const formatPosition = (seconds) => {
        const s = Math.max(0, Math.floor(seconds));
        const h = Math.floor(s / 3600);
        return `${h > 0 ? h + ':' : ''}${h > 0 ? pad2(Math.floor((s % 3600) / 60)) : Math.floor(s / 60)}:${pad2(s % 60)}`;
      };

      // Days the channel keeps in its archive, newest first
      const getArchiveDays = (channel) => {
        const count = Math.max(1, Math.ceil((channel.archiveHours || 24) / 24)) + 1;
        return Array.from({ length: count }, (_, i) => {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const label = i === 0 ? 'Today' : i === 1 ? 'Yesterday'
            : d.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit' });
          return { date: localDate(d), label };
        });
      };

      const loadArchiveDay = async (channel, date) => {
        setArchiveDate(date);
        setArchiveInfoId(null);
        setArchiveNote('');
        setArchivePrograms([]);
        setArchiveError('');
        setArchiveLoading(true);
        
        try {
          const data = await api.iptvGetEpg(channel.id, date);
          if (!data.success) throw new Error(data.error || 'Failed to load programme guide');
          setArchivePrograms(data.programs);
        } catch (err) {
          setArchiveError(err.message);
        } finally {
          setArchiveLoading(false);
        }
      };

      const openArchive = (channel) => {
        setArchiveChannel(channel);
        loadArchiveDay(channel, localDate(new Date()));
      };

      const requestArchive = async (channel, window) => {
        const data = await api.iptvGetArchiveStream(channel.id, { date: archiveDate, ...window });
        if (!data.success) throw new Error(data.error || 'Archive not available');
        return data;
      };

      const programWindow = (program) => ({
        programId: program.id,
        title: `${program.name} ${archiveDate} ${clockTime(program.start).replace(':', '.')}`
      });

      const startDownload = (streamUrl) => {
        const link = document.createElement('a');
        link.href = `${BACKEND_ORIGIN}${streamUrl}?download=1`;
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      const playArchiveProgram = async (program) => {
        const channel = archiveChannel;
        setArchiveError('');
        setCurrentChannel(channel);
        
        try {
          const data = await requestArchive(channel, programWindow(program));
          setArchivePlayback({
            channel,
            title: `${program.name} · ${clockTime(program.start)}`,
            start: data.start,
            duration: data.duration,
            streamUrl: data.streamUrl
          });
          setArchiveChannel(null);
          loadArchiveStream(data.streamUrl, 0);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      const saveArchiveProgram = async (program) => {
        setArchiveError('');
        setArchiveNote('');
        try {
          const data = await api.recordingAdd(archiveChannel.id, {
            date: archiveDate,
            ...programWindow(program),
            ...withDownloadMargin(program)
          });
          if (!data.success) throw new Error(data.error || 'Could not save to the library');
          setArchiveNote(`"${program.name}" added to the library.`);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      const downloadArchiveProgram = async (program) => {
        setArchiveError('');
        try {
          const data = await requestArchive(archiveChannel, { ...programWindow(program), ...withDownloadMargin(program) });
          startDownload(data.streamUrl);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      // Download any time interval of the selected day (may run past midnight)
      const downloadArchiveInterval = async () => {
        setArchiveError('');
        
        const from = new Date(`${archiveDate}T${intervalFrom}:00`);
        const to = new Date(`${archiveDate}T${intervalTo}:00`);
        if (isNaN(from) || isNaN(to)) { setArchiveError('Choose a start and end time'); return; }
        if (to <= from) to.setDate(to.getDate() + 1);
        
        const start = Math.floor(from.getTime() / 1000);
        const duration = Math.floor(to.getTime() / 1000) - start;
        
        // The server needs one archived programme of this day to issue the link
        const seed = archivePrograms.find(p => p.archive && p.start <= start && p.stop > start)
          || archivePrograms.find(p => p.archive);
        if (!seed) { setArchiveError('No archived programmes on this day'); return; }
        
        try {
          const data = await requestArchive(archiveChannel, {
            programId: seed.id,
            start,
            duration,
            title: `${archiveDate} ${intervalFrom.replace(':', '.')}-${intervalTo.replace(':', '.')}`
          });
          startDownload(data.streamUrl);
        } catch (err) {
          setArchiveError(err.message);
        }
      };

      // Archive files are finite: load lazily and seek by reopening at a position
      const loadArchiveStream = (streamUrl, position) => {
        const video = videoRef.current;
        if (!video) return;

        if (playerRef.current) {
          playerRef.current.destroy?.();
          playerRef.current = null;
        }

        video.removeAttribute('src');
        video.load();

        cancelLiveRetry();
        clearInterval(liveBufferTimer.current);
        setPlayerNotice('');
        video._userPaused = false;
        video.onwaiting = null;
        video.onplaying = () => setPlayerNotice('');
        video.onerror = () => setPlayerNotice('This recording cannot be decoded by this browser. You can still download it.');

        archiveBaseRef.current = position;
        setArchivePos(position);

        const url = `${BACKEND_ORIGIN}${streamUrl}?start=${Math.floor(position)}`;

        video.oncanplay = () => { video.play().catch(() => {}); };
        video.ontimeupdate = () => {
          const current = Math.floor(archiveBaseRef.current + video.currentTime);
          setArchivePos(prev => (prev === current ? prev : current));
        };

        if (!mpegts || !mpegts.isSupported()) {
          video.src = url;
          video.play().catch(() => {});
          return;
        }

        const player = mpegts.createPlayer({
          type: 'mpegts',
          isLive: false,
          url
        }, {
          enableWorker: false,
          lazyLoad: true,
          lazyLoadMaxDuration: 120,
          lazyLoadRecoverDuration: 30,
          seekType: 'range',
          autoCleanupSourceBuffer: true,
          enableLogging: false
        });

        player.on(mpegts.Events.ERROR, (type) => {
          if (playerRef.current !== player) return;
          if (type === mpegts.ErrorTypes.NETWORK_ERROR) {
            setPlayerNotice('Archive stream interrupted. Move the position to continue.');
          }
        });

        player.attachMediaElement(video);
        player.load();
        video.play().catch(() => {});

        playerRef.current = player;
      };

      const seekArchive = (position) => {
        if (!archivePlayback) return;
        const target = Math.min(Math.max(0, position), Math.max(0, archivePlayback.duration - 5));
        loadArchiveStream(archivePlayback.streamUrl, target);
      };

      // Show what is on air under the channel name, and follow programme changes
