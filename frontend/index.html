<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stalker IPTV Player</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; height: 100vh; overflow: hidden; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .login-card { background: #1e1e2e; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .login-card h1 { text-align: center; margin-bottom: 10px; font-size: 1.8rem; color: #667eea; }
    .login-card .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #888; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 12px 16px; background: #2a2a3e; border: 2px solid #3a3a4e; border-radius: 8px; color: #fff; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #3a3a4e; margin-top: 10px; }
    .btn-secondary:hover { background: #4a4a5e; box-shadow: none; }
    .error-msg { background: rgba(255,100,100,0.2); border: 1px solid #ff6464; color: #ff6464; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
    .success-msg { background: rgba(72, 187, 120, 0.2); border: 1px solid #48bb78; color: #48bb78; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .spinner { width: 60px; height: 60px; border: 4px solid #333; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 20px; font-size: 1.2rem; color: #888; }
    .loading-progress { margin-top: 10px; font-size: 0.9rem; color: #667eea; }
    .app-layout { display: flex; height: 100vh; }
    .sidebar { width: 320px; background: #1a1a2e; border-right: 1px solid #2a2a3e; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; position: relative; }
    .sidebar-header { padding: 15px 20px; border-bottom: 1px solid #2a2a3e; background: #1a1a2e; z-index: 10; }
    .sidebar-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .sidebar-header h2 { font-size: 1.1rem; color: #667eea; display: flex; align-items: center; gap: 8px; }
    .user-menu { position: relative; }
    .user-btn { background: #2a2a3e; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .user-btn:hover { background: #3a3a4e; }
    .user-dropdown { position: absolute; top: 100%; right: 0; margin-top: 5px; background: #2a2a3e; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); min-width: 180px; z-index: 100; overflow: hidden; }
    .user-dropdown-item { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; transition: background 0.2s; }
    .user-dropdown-item:hover { background: #3a3a4e; }
    .user-dropdown-item.danger { color: #ff6464; }
    .user-dropdown-divider { height: 1px; background: #3a3a4e; }
    .search-input { width: 100%; padding: 10px 14px; background: #2a2a3e; border: 1px solid #3a3a4e; border-radius: 8px; color: #fff; font-size: 0.9rem; }
    .search-input:focus { outline: none; border-color: #667eea; }
    .slide-container { flex: 1; position: relative; overflow: hidden; }
    .slide-wrapper { display: flex; width: 200%; height: 100%; transition: transform 0.3s ease-in-out; }
    .slide-wrapper.show-channels { transform: translateX(-50%); }
    .slide-panel { width: 50%; height: 100%; overflow-y: auto; }
    .back-button { display: flex; align-items: center; gap: 10px; padding: 15px 20px; background: #2a2a3e; border: none; color: #667eea; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.2s; width: 100%; text-align: left; border-bottom: 1px solid #3a3a4e; }
    .back-button:hover { background: #3a3a4e; }
    .back-button svg { width: 20px; height: 20px; }
    .groups-panel { padding: 10px; }
    .group-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; margin-bottom: 6px; background: #252538; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .group-item:hover { background: #2f2f48; transform: translateX(4px); }
    .group-item .group-info { display: flex; align-items: center; gap: 12px; flex: 1; }
    .group-item .group-icon { width: 40px; height: 40px; background: rgba(102, 126, 234, 0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .group-item .name { font-size: 0.95rem; font-weight: 500; }
    .group-item .count { font-size: 0.8rem; color: #888; background: #1a1a2e; padding: 4px 10px; border-radius: 12px; }
    .group-item .arrow { color: #555; font-size: 1.2rem; margin-left: 10px; }
    .channels-panel { display: flex; flex-direction: column; height: 100%; }
    .channels-panel-header { padding: 15px 20px; background: #252538; border-bottom: 1px solid #3a3a4e; }
    .channels-panel-header h3 { font-size: 1rem; color: #667eea; margin-bottom: 4px; }
    .channels-panel-header span { font-size: 0.85rem; color: #888; }
    .channels-list { flex: 1; overflow-y: auto; padding: 10px; }
    .channel-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 6px; background: #252538; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .channel-item:hover { background: #2f2f48; }
    .channel-item.playing { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .channel-item .channel-logo { width: 45px; height: 45px; border-radius: 8px; object-fit: contain; background: #1a1a2e; flex-shrink: 0; }
    .channel-item .channel-info { flex: 1; min-width: 0; }
    .channel-item .channel-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-item .channel-number { font-size: 0.8rem; color: #888; margin-top: 2px; }
    .channel-item.playing .channel-number { color: rgba(255,255,255,0.7); }
    .channel-item .playing-indicator { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
    .main-content { flex: 1; display: flex; flex-direction: column; background: #0a0a12; position: relative; }
    .player-section { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
    .player-section.fullscreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1000; }
    .video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .no-channel-message { text-align: center; color: #555; }
    .no-channel-message .icon { font-size: 4rem; margin-bottom: 20px; }
    .no-channel-message h3 { font-size: 1.3rem; margin-bottom: 10px; color: #667eea; }
    .no-channel-message p { font-size: 0.95rem; }
    .now-playing-bar { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 25px; background: linear-gradient(transparent, rgba(0,0,0,0.95)); display: flex; align-items: center; justify-content: space-between; opacity: 0; transition: opacity 0.3s; }
    .player-section:hover .now-playing-bar { opacity: 1; }
    .now-playing-info { display: flex; align-items: center; gap: 15px; }
    .now-playing-info .channel-logo { width: 50px; height: 50px; border-radius: 8px; object-fit: contain; background: #1a1a2e; }
    .now-playing-info h3 { font-size: 1.1rem; margin-bottom: 4px; }
    .now-playing-info span { font-size: 0.85rem; color: #888; }
    .player-controls button { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 10px 18px; margin-left: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    .player-controls button:hover { background: rgba(255,255,255,0.2); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #1e1e2e; border-radius: 16px; padding: 30px; width: 400px; max-width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .modal h2 { color: #667eea; margin-bottom: 20px; font-size: 1.3rem; }
    .debug-panel { position: fixed; bottom: 0; right: 0; width: 400px; max-height: 300px; background: #1a1a2e; border-top-left-radius: 10px; border: 1px solid #2a2a3e; z-index: 100; }
    .debug-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #2a2a3e; border-top-left-radius: 10px; cursor: pointer; }
    .debug-header h4 { font-size: 0.85rem; color: #888; }
    .debug-content { max-height: 250px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 11px; color: #0f0; }
    .debug-controls { display: flex; gap: 8px; padding: 8px 10px; background: #2a2a3e; }
    .debug-controls button { padding: 4px 10px; background: #3a3a4e; border: none; border-radius: 4px; color: #888; font-size: 0.75rem; cursor: pointer; }
    .debug-controls button:hover { background: #4a4a5e; color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #3a3a4e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a5e; }
    .no-config-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .no-config-card { background: #1e1e2e; border-radius: 16px; padding: 40px; width: 450px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .no-config-card .icon { font-size: 4rem; margin-bottom: 20px; }
    .no-config-card h2 { color: #667eea; margin-bottom: 15px; }
    .no-config-card p { color: #888; margin-bottom: 25px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_URL = '/api';
    const GROUP_INFO = { 4: { name: 'Generalistas', icon: '📺' }, 6: { name: 'Infantil', icon: '🧒' }, 8: { name: 'Documentários', icon: '🎬' }, 9: { name: 'Filmes', icon: '🎥' }, 11: { name: 'Séries', icon: '📽️' }, 13: { name: 'Desporto', icon: '⚽' }, 14: { name: 'Notícias', icon: '📰' }, 15: { name: 'Música', icon: '🎵' }, 18: { name: 'Entretenimento', icon: '🎭' }, 19: { name: 'Internacionais', icon: '🌍' }, 20: { name: 'Adultos', icon: '🔞' }, 42: { name: 'Religiosos', icon: '⛪' }, 43: { name: 'Regionais', icon: '🏘️' }, 59: { name: 'Brasil', icon: '🇧🇷' }, 67: { name: 'Espanha', icon: '🇪🇸' }, 69: { name: 'França', icon: '🇫🇷' }, 70: { name: 'UK', icon: '🇬🇧' }, 71: { name: 'Outros', icon: '📡' } };
    
    const api = {
      token: localStorage.getItem('authToken'),
      setToken(token) { this.token = token; token ? localStorage.setItem('authToken', token) : localStorage.removeItem('authToken'); },
      async fetch(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
        const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
        const data = await response.json();
        if (response.status === 401) { this.setToken(null); window.location.reload(); }
        return data;
      }
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [screen, setScreen] = useState('login');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loadingProgress, setLoadingProgress] = useState('');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [showChangePassword, setShowChangePassword] = useState(false);
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [iptvSessionId, setIptvSessionId] = useState('');
      const [channels, setChannels] = useState([]);
      const [groups, setGroups] = useState([]);
      const [selectedGroup, setSelectedGroup] = useState(null);
      const [showChannels, setShowChannels] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [currentChannel, setCurrentChannel] = useState(null);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const videoRef = useRef(null);
      const playerRef = useRef(null);
      const [debugLog, setDebugLog] = useState([]);
      const [debugVisible, setDebugVisible] = useState(false);

      const addLog = (msg) => { const time = new Date().toLocaleTimeString(); setDebugLog(prev => [...prev.slice(-50), `[${time}] ${msg}`]); console.log(msg); };

      useEffect(() => { checkAuth(); }, []);

      const checkAuth = async () => {
        if (!api.token) { setAuthChecked(true); return; }
        try {
          const data = await api.fetch('/auth/me');
          if (data.success) { setUser(data.user); setIsAuthenticated(true); data.user.hasPortalConfig ? connectToIPTV() : setScreen('noconfig'); }
        } catch (error) { api.setToken(null); }
        setAuthChecked(true);
      };

      const handleLogin = async (e) => {
        e.preventDefault(); setError(''); setIsLoggingIn(true);
        try {
          const data = await api.fetch('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
          if (!data.success) throw new Error(data.error || 'Login failed');
          api.setToken(data.token); setUser(data.user); setIsAuthenticated(true); addLog(`✅ Logged in as ${data.user.username}`);
          data.user.hasPortalConfig ? connectToIPTV() : setScreen('noconfig');
        } catch (err) { setError(err.message); } finally { setIsLoggingIn(false); }
      };

      const handleLogout = () => { api.setToken(null); setUser(null); setIsAuthenticated(false); setIptvSessionId(''); setChannels([]); setGroups([]); setCurrentChannel(null); setScreen('login'); setShowUserMenu(false); addLog('👋 Logged out'); };

      const handleChangePassword = async (e) => {
        e.preventDefault(); setError(''); setSuccess('');
        if (newPassword !== confirmPassword) { setError('Passwords do not match'); return; }
        try {
          const data = await api.fetch('/auth/change-password', { method: 'POST', body: JSON.stringify({ currentPassword, newPassword }) });
          if (!data.success) throw new Error(data.error);
          setSuccess('Password changed!'); setCurrentPassword(''); setNewPassword(''); setConfirmPassword('');
          setTimeout(() => { setShowChangePassword(false); setSuccess(''); }, 2000);
        } catch (err) { setError(err.message); }
      };

      const connectToIPTV = async () => {
        setScreen('loading'); setLoadingProgress('Connecting to IPTV...');
        try {
          addLog('🔄 Connecting to IPTV portal...');
          const connectData = await api.fetch('/iptv/connect', { method: 'POST' });
          if (!connectData.success) throw new Error(connectData.error || 'IPTV connection failed');
          setIptvSessionId(connectData.sessionId); addLog('✅ Connected to IPTV!'); setLoadingProgress('Loading channels...');
          const chData = await api.fetch('/iptv/channels', { method: 'POST', body: JSON.stringify({ sessionId: connectData.sessionId }) });
          if (!chData.success) throw new Error(chData.error || 'Failed to load channels');
          addLog(`✅ Loaded ${chData.channels.length} channels`); setChannels(chData.channels);
          const groupMap = {};
          chData.channels.forEach(ch => { const gid = ch.tv_genre_id || 0; if (!groupMap[gid]) { const info = GROUP_INFO[gid] || { name: `Group ${gid}`, icon: '📁' }; groupMap[gid] = { id: gid, name: info.name, icon: info.icon, count: 0 }; } groupMap[gid].count++; });
          setGroups(Object.values(groupMap).sort((a, b) => b.count - a.count)); setScreen('main');
        } catch (err) { addLog(`❌ Error: ${err.message}`); setError(err.message); setScreen('noconfig'); }
      };

      const handleSelectGroup = (groupId) => { setSelectedGroup(groupId); setShowChannels(true); setSearchTerm(''); };
      const handleBackToGroups = () => setShowChannels(false);

      const getGroupChannels = () => {
        if (selectedGroup === null) return [];
        let filtered = channels.filter(ch => ch.tv_genre_id === selectedGroup);
        if (searchTerm) { const term = searchTerm.toLowerCase(); filtered = filtered.filter(ch => ch.name.toLowerCase().includes(term) || ch.number.toString().includes(term)); }
        return filtered.sort((a, b) => a.number - b.number);
      };

      const getFilteredGroups = () => { if (!searchTerm) return groups; const term = searchTerm.toLowerCase(); return groups.filter(g => g.name.toLowerCase().includes(term)); };

      const playChannel = async (channel) => {
        addLog(`🔄 Playing: ${channel.name}`); setCurrentChannel(channel);
        try {
          const data = await api.fetch('/iptv/stream', { method: 'POST', body: JSON.stringify({ sessionId: iptvSessionId, channelId: channel.id, cmd: channel.cmd }) });
          if (data.success && data.streamUrl) { addLog(`✅ Stream URL received`); loadStream(data.streamUrl); } else { addLog(`❌ Failed to get stream`); }
        } catch (err) { addLog(`❌ Error: ${err.message}`); }
      };

      const loadStream = (streamUrl) => {
        const video = videoRef.current; if (!video) return;
        if (playerRef.current) { playerRef.current.destroy?.(); playerRef.current = null; }
        if (typeof mpegts !== 'undefined' && mpegts.isSupported()) {
          const player = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: streamUrl }, { enableWorker: false, enableStashBuffer: true, stashInitialSize: 128 * 1024, autoCleanupSourceBuffer: true, fixAudioTimestampGap: true });
          player.attachMediaElement(video); player.load();
          player.on(mpegts.Events.ERROR, (type, detail) => addLog(`❌ mpegts ERROR: ${type} - ${detail}`));
          player.on(mpegts.Events.MEDIA_INFO, (info) => addLog(`📊 ${info.videoCodec}, ${info.width}x${info.height}`));
          let hasPlayed = false; video.muted = false; video.volume = 1.0;
          video.oncanplay = () => { if (!hasPlayed) { video.play().then(() => hasPlayed = true).catch(() => { video.muted = true; video.play().then(() => { hasPlayed = true; setTimeout(() => video.muted = false, 2000); }); }); } };
          video.onplaying = () => addLog('▶️ Playing!');
          playerRef.current = player;
        }
      };

      const toggleFullscreen = () => { isFullscreen ? document.exitFullscreen() : document.querySelector('.player-section')?.requestFullscreen(); setIsFullscreen(!isFullscreen); };
      useEffect(() => () => playerRef.current?.destroy?.(), []);
      useEffect(() => { const handler = () => setIsFullscreen(!!document.fullscreenElement); document.addEventListener('fullscreenchange', handler); return () => document.removeEventListener('fullscreenchange', handler); }, []);
      useEffect(() => { const handler = (e) => { if (!e.target.closest('.user-menu')) setShowUserMenu(false); }; document.addEventListener('click', handler); return () => document.removeEventListener('click', handler); }, []);

      if (!authChecked) return <div className="loading-screen"><div className="spinner"></div><div className="loading-text">Loading...</div></div>;

      if (!isAuthenticated) return (
        <div className="login-screen"><div className="login-card"><h1>📺 IPTV Player</h1><p className="subtitle">Sign in to continue</p>
          {error && <div className="error-msg">{error}</div>}
          <form onSubmit={handleLogin}>
            <div className="form-group"><label>Username</label><input type="text" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Enter username" required autoFocus /></div>
            <div className="form-group"><label>Password</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Enter password" required /></div>
            <button type="submit" className="btn" disabled={isLoggingIn}>{isLoggingIn ? 'Signing in...' : 'Sign In'}</button>
          </form>
        </div></div>
      );

      if (screen === 'noconfig') return (
        <div className="no-config-screen"><div className="no-config-card"><div className="icon">⚙️</div><h2>Configuration Required</h2><p>Your account is not yet configured for IPTV access.<br/>Contact the administrator to set up your portal URL and MAC address.</p><button className="btn btn-secondary" onClick={handleLogout}>Sign Out</button></div></div>
      );

      if (screen === 'loading') return <div className="loading-screen"><div className="spinner"></div><div className="loading-text">Loading IPTV</div><div className="loading-progress">{loadingProgress}</div></div>;

      const groupChannels = getGroupChannels();
      const filteredGroups = getFilteredGroups();
      const selectedGroupInfo = groups.find(g => g.id === selectedGroup);

      return (
        <div className="app-layout">
          <div className="sidebar">
            <div className="sidebar-header">
              <div className="sidebar-header-top">
                <h2>📺 IPTV Player</h2>
                <div className="user-menu">
                  <button className="user-btn" onClick={() => setShowUserMenu(!showUserMenu)}>👤 {user?.username} <span>▼</span></button>
                  {showUserMenu && (
                    <div className="user-dropdown">
                      <div className="user-dropdown-item" onClick={() => { setShowChangePassword(true); setShowUserMenu(false); }}>🔐 Change Password</div>
                      {user?.role === 'admin' && <div className="user-dropdown-item" onClick={() => window.open('/admin.html', '_blank')}>⚙️ Admin Panel</div>}
                      <div className="user-dropdown-divider"></div>
                      <div className="user-dropdown-item danger" onClick={handleLogout}>🚪 Sign Out</div>
                    </div>
                  )}
                </div>
              </div>
              <input type="text" className="search-input" placeholder={showChannels ? "🔍 Search channels..." : "🔍 Search groups..."} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
            </div>
            <div className="slide-container">
              <div className={`slide-wrapper ${showChannels ? 'show-channels' : ''}`}>
                <div className="slide-panel">
                  <div className="groups-panel">
                    {filteredGroups.map(group => (
                      <div key={group.id} className="group-item" onClick={() => handleSelectGroup(group.id)}>
                        <div className="group-info"><div className="group-icon">{group.icon}</div><span className="name">{group.name}</span></div>
                        <span className="count">{group.count}</span><span className="arrow">›</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="slide-panel">
                  <div className="channels-panel">
                    <button className="back-button" onClick={handleBackToGroups}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>Back to Groups</button>
                    {selectedGroupInfo && <div className="channels-panel-header"><h3>{selectedGroupInfo.icon} {selectedGroupInfo.name}</h3><span>{groupChannels.length} channels</span></div>}
                    <div className="channels-list">
                      {groupChannels.map(channel => (
                        <div key={channel.id} className={`channel-item ${currentChannel?.id === channel.id ? 'playing' : ''}`} onClick={() => playChannel(channel)}>
                          <img src={channel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'} alt="" className="channel-logo" onError={(e) => e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'} />
                          <div className="channel-info"><div className="channel-name">{channel.name}</div><div className="channel-number">Ch. {channel.number}</div></div>
                          {currentChannel?.id === channel.id && <div className="playing-indicator"></div>}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div className="main-content">
            <div className={`player-section ${isFullscreen ? 'fullscreen' : ''}`}>
              {currentChannel ? (
                <>
                  <div className="video-container"><video ref={videoRef} controls /></div>
                  <div className="now-playing-bar">
                    <div className="now-playing-info"><img src={currentChannel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%231a1a2e" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23667eea" font-size="30">TV</text></svg>'} alt="" className="channel-logo" /><div><h3>{currentChannel.name}</h3><span>Channel {currentChannel.number}</span></div></div>
                    <div className="player-controls"><button onClick={toggleFullscreen}>{isFullscreen ? '⬜ Exit' : '⬜ Fullscreen'}</button></div>
                  </div>
                </>
              ) : <div className="no-channel-message"><div className="icon">📺</div><h3>Select a Channel</h3><p>Choose a group and channel from the menu</p></div>}
            </div>
          </div>
          {showChangePassword && (
            <div className="modal-overlay" onClick={() => setShowChangePassword(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2>🔐 Change Password</h2>
                {error && <div className="error-msg">{error}</div>}
                {success && <div className="success-msg">{success}</div>}
                <form onSubmit={handleChangePassword}>
                  <div className="form-group"><label>Current Password</label><input type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} required /></div>
                  <div className="form-group"><label>New Password</label><input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} required minLength={6} /></div>
                  <div className="form-group"><label>Confirm New Password</label><input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} required /></div>
                  <button type="submit" className="btn">Change Password</button>
                  <button type="button" className="btn btn-secondary" onClick={() => setShowChangePassword(false)}>Cancel</button>
                </form>
              </div>
            </div>
          )}
          <div className="debug-panel">
            <div className="debug-header" onClick={() => setDebugVisible(!debugVisible)}><h4>🔧 Debug ({debugLog.length})</h4><span>{debugVisible ? '▼' : '▲'}</span></div>
            {debugVisible && (<><div className="debug-controls"><button onClick={() => navigator.clipboard.writeText(debugLog.join('\n'))}>📋 Copy</button><button onClick={() => setDebugLog([])}>🗑️ Clear</button></div><div className="debug-content">{debugLog.map((log, i) => <div key={i}>{log}</div>)}</div></>)}
          </div>
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
