# ═══════════════════════════════════════════════════════════════════════════════
# 🚀 GitHub Actions - Self-Hosted Deployment Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow uses a runner installed directly on the Raspberry Pi
# No external SSH needed - the runner is already on the target machine!

name: 🍓 Deploy to Raspberry Pi (Self-Hosted)

on:
  push:
    branches:
      - deploy  # Change to 'main' when ready for production
  
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  APP_DIR: /opt/iptv-player

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Tests (runs in GitHub cloud)
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Check syntax
        working-directory: ./backend
        run: node --check server.js

      - name: ✅ Tests passed
        run: echo "✅ All tests passed successfully!"

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Deploy (runs on self-hosted Raspberry Pi)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Self-Hosted Runner
    runs-on: self-hosted  # ← This runs the job on the Raspberry Pi!
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 System information
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║        Self-Hosted Runner System Information              ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo "🖥️  Hostname: $(hostname)"
          echo "📍 IP Address: $(hostname -I | awk '{print $1}')"
          echo "🐧 OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'"' -f2)"
          echo "📦 Node.js: $(node --version)"
          echo "📦 NPM: $(npm --version)"
          echo "🔧 PM2: $(pm2 --version 2>/dev/null || echo 'Not installed')"
          echo ""

      - name: 📁 Prepare directories
        run: |
          echo "📁 Creating application directories..."
          sudo mkdir -p ${{ env.APP_DIR }}/{backend,frontend,logs,data}
          sudo chown -R iptv:iptv ${{ env.APP_DIR }}
          echo "✅ Directories ready"

      - name: 📤 Deploy backend
        run: |
          echo "📦 Deploying backend code..."
          
          # Create data directory before rsync
          sudo mkdir -p ${{ env.APP_DIR }}/backend/data
          
          # Preserve .env and data if they exist
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            echo "💾 Backing up .env file..."
            sudo cp ${{ env.APP_DIR }}/.env /tmp/.env.backup
          fi
          
          if [ -d "${{ env.APP_DIR }}/backend/data" ] && [ "$(ls -A ${{ env.APP_DIR }}/backend/data)" ]; then
            echo "💾 Backing up user data..."
            sudo cp -r ${{ env.APP_DIR }}/backend/data /tmp/data.backup
          fi
          
          # Copy new files (excluding data directory from deletion)
          echo "🔄 Syncing backend files..."
          sudo rsync -av \
            --exclude 'node_modules' \
            --exclude 'data' \
            --delete \
            ./backend/ ${{ env.APP_DIR }}/backend/
          
          # Restore preserved files
          if [ -f "/tmp/.env.backup" ]; then
            echo "♻️  Restoring .env file..."
            sudo cp /tmp/.env.backup ${{ env.APP_DIR }}/.env
          fi
          
          if [ -d "/tmp/data.backup" ]; then
            echo "♻️  Restoring user data..."
            sudo mkdir -p ${{ env.APP_DIR }}/backend/data
            sudo cp -r /tmp/data.backup/* ${{ env.APP_DIR }}/backend/data/ 2>/dev/null || true
          fi
          
          # Fix permissions
          sudo chown -R iptv:iptv ${{ env.APP_DIR }}
          echo "✅ Backend deployed successfully"

      - name: 📤 Deploy frontend
        run: |
          echo "📦 Deploying frontend code..."
          sudo rsync -av --delete ./frontend/ ${{ env.APP_DIR }}/frontend/
          echo "✅ Frontend deployed successfully"

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing production dependencies..."
          cd ${{ env.APP_DIR }}/backend
          sudo -u iptv npm ci --production
          echo "✅ Dependencies installed"

      - name: 🔐 Verify environment file
        run: |
          if [ ! -f "${{ env.APP_DIR }}/.env" ]; then
            echo "⚠️  No .env file found, creating with default values..."
            cat > /tmp/.env.new << 'EOF'
          NODE_ENV=production
          PORT=3001
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 64)
          EOF
            sudo mv /tmp/.env.new ${{ env.APP_DIR }}/.env
            sudo chown iptv:iptv ${{ env.APP_DIR }}/.env
            sudo chmod 600 ${{ env.APP_DIR }}/.env
            echo "✅ Environment file created"
          else
            echo "✅ Environment file exists"
          fi

      - name: 🔄 Restart application
        run: |
          echo "🔄 Managing application process..."
          cd ${{ env.APP_DIR }}
          
          # Check if PM2 is installed
          if ! command -v pm2 &> /dev/null; then
            echo "📦 Installing PM2 globally..."
            sudo npm install -g pm2
          fi
          
          # Restart or start application
          if sudo -u iptv pm2 describe iptv-backend > /dev/null 2>&1; then
            echo "🔄 Restarting existing application..."
            sudo -u iptv pm2 restart iptv-backend --update-env
          else
            echo "🚀 Starting application for the first time..."
            cd ${{ env.APP_DIR }}/backend
            sudo -u iptv pm2 start server.js --name iptv-backend
          fi
          
          # Save PM2 configuration
          sudo -u iptv pm2 save
          echo "✅ Application process managed"

      - name: ⏳ Wait for initialization
        run: |
          echo "⏳ Waiting for application to initialize..."
          sleep 5

      - name: ✅ Health check
        run: |
          echo "🔍 Checking application health..."
          
          for i in {1..5}; do
            response=$(curl -s http://localhost:3001/api/health || echo "FAILED")
            
            if echo "$response" | grep -q "ok"; then
              echo "✅ Application is online and healthy!"
              echo "$response" | jq . 2>/dev/null || echo "$response"
              exit 0
            fi
            
            echo "⏳ Attempt $i/5 - Waiting..."
            sleep 3
          done
          
          echo "❌ Health check failed after 5 attempts"
          echo "📋 Application logs:"
          sudo -u iptv pm2 logs iptv-backend --lines 50
          exit 1

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║              📊 DEPLOYMENT SUMMARY (Self-Hosted)              ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔧 PM2 Process Status:"
          sudo -u iptv pm2 status
          echo ""
          echo "🌐 Application URL: http://$(hostname -I | awk '{print $1}')"
          echo "📍 Deployed to: Self-Hosted Raspberry Pi Runner"
          echo ""

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3: Cleanup (runs on self-hosted Raspberry Pi)
  # ═══════════════════════════════════════════════════════════════════════════
  cleanup:
    name: 🧹 Cleanup
    runs-on: self-hosted
    needs: deploy
    if: always()
    
    steps:
      - name: 🧹 Clean temporary files
        run: |
          echo "🧹 Cleaning up temporary files..."
          
          # Remove backup files
          sudo rm -f /tmp/.env.backup
          sudo rm -rf /tmp/data.backup
          
          # Clean npm cache if it gets too large
          npm cache clean --force 2>/dev/null || true
          
          echo "✅ Cleanup completed successfully"