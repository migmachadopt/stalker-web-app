name: 🍓 Deploy to Raspberry Pi

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  APP_DIR: /opt/iptv-player

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📋 Info do sistema
        run: |
          echo "🖥️  Hostname: $(hostname)"
          echo "📍 IP: $(hostname -I | awk '{print $1}')"
          echo "📦 Node: $(node --version)"

      - name: 🔒 Garantir que data/ é um symlink
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "🔒 VERIFICAÇÃO DE SEGURANÇA"
          echo "═══════════════════════════════════════════════════════"
          
          # Se data/ não existir OU for pasta normal, criar symlink
          if [ ! -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "⚠️  data/ não é symlink - a corrigir..."
            
            # Criar localização permanente
            sudo mkdir -p /var/lib/iptv-player/data
            
            # Se for pasta normal, mover conteúdo
            if [ -d "${{ env.APP_DIR }}/backend/data" ]; then
              echo "📦 Movendo dados existentes..."
              sudo cp -r ${{ env.APP_DIR }}/backend/data/* /var/lib/iptv-player/data/ 2>/dev/null || true
              sudo rm -rf ${{ env.APP_DIR }}/backend/data
            fi
            
            # Criar symlink
            sudo ln -sf /var/lib/iptv-player/data ${{ env.APP_DIR }}/backend/data
            sudo chown -h iptv:iptv ${{ env.APP_DIR }}/backend/data
            echo "✅ Symlink criado"
          else
            echo "✅ data/ já é um symlink"
          fi
          
          # Verificar
          ls -la ${{ env.APP_DIR }}/backend/ | grep data

      - name: 💾 Backup de segurança de .env
        run: |
          # APENAS .env - NÃO fazer backup de data/
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            sudo cp "${{ env.APP_DIR }}/.env" /tmp/.env.backup
            echo "✅ .env backed up"
          fi

      - name: 📤 Deploy Backend
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "📤 SINCRONIZANDO BACKEND"
          echo "═══════════════════════════════════════════════════════"
          
          # Rsync EXCLUINDO data/ (que é o symlink)
          sudo rsync -av \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            --exclude 'logs' \
            --delete \
            ./backend/ ${{ env.APP_DIR }}/backend/
          
          echo "✅ Backend sincronizado"

      - name: 🔗 Recriar symlink (garantia)
        run: |
          # Se o rsync removeu o symlink, recriar
          if [ ! -e "${{ env.APP_DIR }}/backend/data" ]; then
            echo "⚠️  Symlink foi removido - a recriar..."
            sudo ln -sf /var/lib/iptv-player/data ${{ env.APP_DIR }}/backend/data
            sudo chown -h iptv:iptv ${{ env.APP_DIR }}/backend/data
          fi
          
          # Verificar tipo
          if [ -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "✅ data/ é um symlink"
            ls -la ${{ env.APP_DIR }}/backend/ | grep data
          else
            echo "❌ ERRO: data/ NÃO é um symlink!"
            exit 1
          fi

      - name: ✅ Restaurar .env
        run: |
          if [ -f "/tmp/.env.backup" ]; then
            sudo cp /tmp/.env.backup ${{ env.APP_DIR }}/.env
            sudo rm /tmp/.env.backup
            echo "✅ .env restored"
          fi

      - name: 📤 Deploy Frontend
        run: |
          sudo rsync -av --delete ./frontend/ ${{ env.APP_DIR }}/frontend/
          echo "✅ Frontend sincronizado"

      - name: 📦 Instalar dependências
        run: |
          cd ${{ env.APP_DIR }}/backend
          sudo -u iptv npm ci --production

      - name: 🔐 Corrigir permissões
        run: |
          # App
          sudo chown -R iptv:iptv ${{ env.APP_DIR }}
          
          # Dados permanentes
          sudo chown -R iptv:iptv /var/lib/iptv-player
          sudo chmod 700 /var/lib/iptv-player/data
          
          # Symlink
          sudo chown -h iptv:iptv ${{ env.APP_DIR }}/backend/data
          
          # .env
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            sudo chmod 600 ${{ env.APP_DIR }}/.env
          fi
          
          echo "✅ Permissões corrigidas"

      - name: 🔄 Reiniciar Backend
        run: |
          cd ${{ env.APP_DIR }}
          
          if sudo -u iptv pm2 describe iptv-backend > /dev/null 2>&1; then
            echo "🔄 Reiniciando..."
            sudo -u iptv pm2 restart iptv-backend --update-env
          else
            echo "🚀 Iniciando..."
            cd backend
            sudo -u iptv pm2 start server.js --name iptv-backend
          fi
          
          sudo -u iptv pm2 save
          echo "✅ Backend reiniciado"

      - name: ⏳ Aguardar
        run: sleep 5

      - name: ✅ Verificação final
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "📊 VERIFICAÇÃO FINAL"
          echo "═══════════════════════════════════════════════════════"
          
          echo ""
          echo "🔗 Tipo de data/:"
          if [ -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "✅ É um SYMLINK"
            TARGET=$(readlink -f ${{ env.APP_DIR }}/backend/data)
            echo "   → $TARGET"
          else
            echo "❌ NÃO é symlink!"
          fi
          
          echo ""
          echo "📂 Conteúdo de /var/lib/iptv-player/data/:"
          ls -lah /var/lib/iptv-player/data/
          
          echo ""
          if [ -f "/var/lib/iptv-player/data/users.enc" ]; then
            SIZE=$(stat -c%s /var/lib/iptv-player/data/users.enc)
            echo "✅ users.enc: ${SIZE} bytes"
          else
            echo "⚠️  users.enc não encontrado"
          fi

      - name: 🏥 Health Check
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "🏥 HEALTH CHECK"
          echo "═══════════════════════════════════════════════════════"
          
          for i in {1..5}; do
            if curl -s http://localhost:3001/api/health | grep -q "ok"; then
              echo "✅ Backend ONLINE!"
              curl -s http://localhost:3001/api/health | jq . 2>/dev/null || echo ""
              exit 0
            fi
            echo "⏳ Tentativa $i/5..."
            sleep 3
          done
          
          echo "❌ Health check falhou"
          sudo -u iptv pm2 logs iptv-backend --lines 50
          exit 1

      - name: 📊 Resumo
        if: always()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║              📊 DEPLOY FINALIZADO                     ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""
          sudo -u iptv pm2 status
          echo ""
          echo "🌐 http://$(hostname -I | awk '{print $1}')"
          echo ""