name: 🍓 Deploy to Raspberry Pi

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  APP_DIR: /opt/iptv-player

jobs:
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Check backend syntax
        working-directory: ./backend
        run: |
          node --check server.js
          node --check config/constants.js
          node --check services/iptvService.js

      - name: ✅ Tests passed
        run: echo "✅ All tests passed!"

  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 System information
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📊 SYSTEM INFORMATION                       ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo "🖥️  Hostname: $(hostname)"
          echo "📍 IP: $(hostname -I | awk '{print $1}')"
          echo "📦 Node: $(node --version)"
          echo "👤 User: $(whoami)"
          echo ""

      - name: 🔒 Ensure data/ is a symlink
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           🔒 DATA PROTECTION                          ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          # Create permanent location
          sudo mkdir -p /var/lib/iptv-player/data
          
          # Convert to symlink if needed
          if [ ! -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "⚠️  data/ is not a symlink - converting..."
            
            # If it's a directory, move contents
            if [ -d "${{ env.APP_DIR }}/backend/data" ]; then
              echo "📦 Moving existing data..."
              sudo cp -rv "${{ env.APP_DIR }}/backend/data/"* /var/lib/iptv-player/data/ 2>/dev/null || true
              sudo rm -rf "${{ env.APP_DIR }}/backend/data"
            fi
            
            # Create symlink
            sudo ln -sf /var/lib/iptv-player/data "${{ env.APP_DIR }}/backend/data"
            echo "✅ Symlink created"
          else
            echo "✅ data/ is already a symlink"
          fi

      - name: 💾 Backup .env file
        run: |
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            sudo cp "${{ env.APP_DIR }}/.env" /tmp/.env.backup
            echo "✅ .env backed up"
          fi

      - name: 📤 Deploy backend
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📤 BACKEND DEPLOYMENT                       ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          # Rsync EXCLUDING data/ and .env
          sudo rsync -av \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            --exclude 'logs' \
            --delete \
            ./backend/ ${{ env.APP_DIR }}/backend/
          
          echo "✅ Backend synchronized (including new modular structure)"

      - name: 🔗 Recreate symlink (safety net)
        run: |
          # Recreate if rsync removed it
          if [ ! -e "${{ env.APP_DIR }}/backend/data" ]; then
            echo "⚠️  Symlink removed - recreating..."
            sudo ln -sf /var/lib/iptv-player/data "${{ env.APP_DIR }}/backend/data"
          fi
          
          # Verify
          if [ -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "✅ Symlink OK"
            ls -la "${{ env.APP_DIR }}/backend/" | grep data
          else
            echo "❌ ERROR: data/ is NOT a symlink!"
            exit 1
          fi

      - name: ✅ Restore .env file
        run: |
          if [ -f "/tmp/.env.backup" ]; then
            sudo cp /tmp/.env.backup "${{ env.APP_DIR }}/.env"
            sudo rm /tmp/.env.backup
            echo "✅ .env restored"
          fi

      - name: 📤 Deploy frontend
        run: |
          sudo rsync -av --delete ./frontend/ ${{ env.APP_DIR }}/frontend/
          echo "✅ Frontend synchronized (including new JS modules)"

      - name: 📦 Install dependencies
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📦 INSTALLING DEPENDENCIES                  ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          cd ${{ env.APP_DIR }}/backend
          sudo -u iptv npm ci --production
          echo "✅ Dependencies installed"

      - name: 🔐 Fix permissions
        run: |
          # Application files
          sudo chown -R iptv:iptv ${{ env.APP_DIR }}
          
          # Permanent data location - CRITICAL!
          sudo chown -R iptv:iptv /var/lib/iptv-player
          sudo chmod 755 /var/lib/iptv-player/data
          
          # Files in data/
          if sudo test -f /var/lib/iptv-player/data/users.enc; then
            sudo chmod 644 /var/lib/iptv-player/data/users.enc
          fi
          
          # Symlink ownership
          sudo chown -h iptv:iptv "${{ env.APP_DIR }}/backend/data"
          
          # .env file
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            sudo chmod 600 "${{ env.APP_DIR }}/.env"
          fi
          
          echo "✅ Permissions fixed"

      - name: 🔐 Verify .env file
        run: |
          if [ ! -f "${{ env.APP_DIR }}/.env" ]; then
            echo "⚠️  Creating .env with default values..."
            cat > /tmp/.env.new << 'EOF'
          NODE_ENV=production
          PORT=3001
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 64)
          EOF
            sudo mv /tmp/.env.new "${{ env.APP_DIR }}/.env"
            sudo chown iptv:iptv "${{ env.APP_DIR }}/.env"
            sudo chmod 600 "${{ env.APP_DIR }}/.env"
          fi

      - name: 🔄 Restart backend
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           🔄 RESTARTING APPLICATION                   ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          cd ${{ env.APP_DIR }}
          
          if ! command -v pm2 &> /dev/null; then
            echo "📦 Installing PM2..."
            sudo npm install -g pm2
          fi
          
          if sudo -u iptv pm2 describe iptv-backend > /dev/null 2>&1; then
            echo "🔄 Restarting application..."
            sudo -u iptv pm2 restart iptv-backend --update-env
          else
            echo "🚀 Starting application for first time..."
            cd backend
            sudo -u iptv pm2 start server.js --name iptv-backend
          fi
          
          sudo -u iptv pm2 save
          echo "✅ Backend restarted with new modular architecture"

      - name: ⏳ Wait for initialization
        run: sleep 5

      - name: ✅ Verify modular structure
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📊 STRUCTURE VERIFICATION                   ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          echo "🔍 Checking backend modules..."
          
          MODULES=(
            "${{ env.APP_DIR }}/backend/config/constants.js"
            "${{ env.APP_DIR }}/backend/middleware/auth.js"
            "${{ env.APP_DIR }}/backend/services/iptvService.js"
            "${{ env.APP_DIR }}/backend/services/streamService.js"
            "${{ env.APP_DIR }}/backend/utils/logger.js"
          )
          
          ERROR=0
          for module in "${MODULES[@]}"; do
            if [ -f "$module" ]; then
              echo "✅ $(basename $module)"
            else
              echo "❌ $(basename $module) NOT FOUND"
              ERROR=1
            fi
          done
          
          if [ $ERROR -eq 1 ]; then
            echo "❌ Some modules missing!"
            exit 1
          fi
          
          echo ""
          echo "🔍 Checking frontend modules..."
          
          if [ -f "${{ env.APP_DIR }}/frontend/js/api.js" ]; then
            echo "✅ api.js"
          else
            echo "❌ api.js NOT FOUND"
            ERROR=1
          fi
          
          if [ -f "${{ env.APP_DIR }}/frontend/js/utils.js" ]; then
            echo "✅ utils.js"
          else
            echo "❌ utils.js NOT FOUND"
            ERROR=1
          fi
          
          if [ $ERROR -eq 1 ]; then
            echo "❌ Some frontend modules missing!"
            exit 1
          fi
          
          echo ""
          echo "✅ All modules deployed successfully!"

      - name: ✅ Final verification
        if: always()
        run: |
          echo ""
          echo "🔗 Symlink status:"
          ls -la ${{ env.APP_DIR }}/backend/ | grep data || echo "  data/ not found"
          
          echo ""
          echo "📂 Verify users.enc as iptv user:"
          if sudo -u iptv test -f /var/lib/iptv-player/data/users.enc 2>/dev/null; then
            SIZE=$(sudo -u iptv stat -c%s /var/lib/iptv-player/data/users.enc 2>/dev/null || echo "?")
            echo "✅ users.enc exists and iptv can access it (${SIZE} bytes)"
          else
            echo "⚠️  users.enc not found (will be created on first login)"
          fi

      - name: 🏥 Health check
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           🏥 HEALTH CHECK                             ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          for i in {1..10}; do
            if curl -s http://localhost:3001/api/health | grep -q "ok"; then
              echo "✅ Backend is ONLINE!"
              curl -s http://localhost:3001/api/health | jq . 2>/dev/null || echo ""
              
              echo ""
              echo "🎉 NEW FEATURES DEPLOYED:"
              echo "  • Custom portal paths support"
              echo "  • Dynamic genres loading"
              echo "  • Watchdog keep-alive (60s)"
              echo "  • Modular architecture"
              
              exit 0
            fi
            echo "⏳ Attempt $i/10..."
            sleep 3
          done
          
          echo "❌ Health check failed"
          sudo -u iptv pm2 logs iptv-backend --lines 50
          exit 1

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📊 DEPLOYMENT COMPLETE                      ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""
          sudo -u iptv pm2 status
          echo ""
          echo "🌐 http://$(hostname -I | awk '{print $1}')"
          echo ""

  cleanup:
    name: 🧹 Cleanup
    runs-on: self-hosted
    needs: deploy
    if: always()
    
    steps:
      - name: 🧹 Clean temporary files
        run: |
          sudo rm -f /tmp/.env.backup 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          echo "✅ Cleanup complete"
