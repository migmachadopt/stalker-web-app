name: 🍓 Deploy to Raspberry Pi

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  APP_DIR: /opt/iptv-player

jobs:
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Check syntax
        working-directory: ./backend
        run: node --check server.js

      - name: ✅ Tests passed
        run: echo "✅ All tests passed!"

  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📋 System Info
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📊 SYSTEM INFORMATION                       ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo "🖥️  Hostname: $(hostname)"
          echo "📍 IP: $(hostname -I | awk '{print $1}')"
          echo "📦 Node: $(node --version)"
          echo "👤 User: $(whoami)"
          echo "🔑 Groups: $(groups)"
          echo ""

      - name: 🔒 Garantir symlink de data/
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           🔒 PROTEÇÃO DE DADOS                        ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          # Criar localização permanente
          sudo mkdir -p /var/lib/iptv-player/data
          
          # Se data/ não for symlink, converter
          if [ ! -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "⚠️  data/ não é symlink - a converter..."
            
            # Se for pasta, mover conteúdo
            if [ -d "${{ env.APP_DIR }}/backend/data" ]; then
              echo "📦 Movendo dados existentes..."
              sudo cp -rv "${{ env.APP_DIR }}/backend/data/"* /var/lib/iptv-player/data/ 2>/dev/null || true
              sudo rm -rf "${{ env.APP_DIR }}/backend/data"
            fi
            
            # Criar symlink
            sudo ln -sf /var/lib/iptv-player/data "${{ env.APP_DIR }}/backend/data"
            echo "✅ Symlink criado"
          else
            echo "✅ data/ já é symlink"
          fi
          
          # Verificar
          echo ""
          echo "🔗 Status:"
          ls -la "${{ env.APP_DIR }}/backend/" | grep data || echo "  Symlink não existe!"

      - name: 💾 Backup de .env
        run: |
          # APENAS .env - NUNCA fazer backup de data/
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            sudo cp "${{ env.APP_DIR }}/.env" /tmp/.env.backup
            echo "✅ .env backed up"
          fi

      - name: 📤 Deploy Backend
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📤 DEPLOY DO BACKEND                        ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          # Rsync EXCLUINDO data/ e .env
          sudo rsync -av \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            --exclude 'logs' \
            --delete \
            ./backend/ ${{ env.APP_DIR }}/backend/
          
          echo "✅ Backend sincronizado"

      - name: 🔗 Recriar symlink (garantia)
        run: |
          # Se rsync removeu, recriar
          if [ ! -e "${{ env.APP_DIR }}/backend/data" ]; then
            echo "⚠️  Symlink removido - a recriar..."
            sudo ln -sf /var/lib/iptv-player/data "${{ env.APP_DIR }}/backend/data"
          fi
          
          # Verificar
          if [ -L "${{ env.APP_DIR }}/backend/data" ]; then
            echo "✅ Symlink OK"
            ls -la "${{ env.APP_DIR }}/backend/" | grep data
          else
            echo "❌ ERRO: data/ NÃO é symlink!"
            exit 1
          fi

      - name: ✅ Restaurar .env
        run: |
          if [ -f "/tmp/.env.backup" ]; then
            sudo cp /tmp/.env.backup "${{ env.APP_DIR }}/.env"
            sudo rm /tmp/.env.backup
            echo "✅ .env restored"
          fi

      - name: 📤 Deploy Frontend
        run: |
          sudo rsync -av --delete ./frontend/ ${{ env.APP_DIR }}/frontend/
          echo "✅ Frontend sincronizado"

      - name: 📦 Instalar dependências
        run: |
          cd ${{ env.APP_DIR }}/backend
          sudo -u iptv npm ci --production
          echo "✅ Dependências instaladas"

      - name: 🔐 Corrigir permissões
        run: |
          # App
          sudo chown -R iptv:iptv ${{ env.APP_DIR }}
          
          # Dados permanentes - CRÍTICO!
          sudo chown -R iptv:iptv /var/lib/iptv-player
          sudo chmod 755 /var/lib/iptv-player/data
          
          # Ficheiros em data/
          if sudo test -f /var/lib/iptv-player/data/users.enc; then
            sudo chmod 644 /var/lib/iptv-player/data/users.enc
          fi
          
          # Symlink
          sudo chown -h iptv:iptv "${{ env.APP_DIR }}/backend/data"
          
          # .env
          if [ -f "${{ env.APP_DIR }}/.env" ]; then
            sudo chmod 600 "${{ env.APP_DIR }}/.env"
          fi
          
          echo "✅ Permissões corrigidas"
          
          # Testar acesso
          echo ""
          echo "🧪 Teste de acesso como iptv:"
          if sudo -u iptv test -r /var/lib/iptv-player/data/users.enc 2>/dev/null; then
            echo "✅ iptv consegue ler users.enc"
          else
            echo "⚠️  users.enc não existe (será criado no primeiro login)"
          fi

      - name: 🔐 Verificar .env
        run: |
          if [ ! -f "${{ env.APP_DIR }}/.env" ]; then
            echo "⚠️  Criando .env com valores default..."
            cat > /tmp/.env.new << 'EOF'
          NODE_ENV=production
          PORT=3001
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 64)
          EOF
            sudo mv /tmp/.env.new "${{ env.APP_DIR }}/.env"
            sudo chown iptv:iptv "${{ env.APP_DIR }}/.env"
            sudo chmod 600 "${{ env.APP_DIR }}/.env"
          fi

      - name: 🔄 Reiniciar Backend
        run: |
          cd ${{ env.APP_DIR }}
          
          if ! command -v pm2 &> /dev/null; then
            echo "📦 Instalando PM2..."
            sudo npm install -g pm2
          fi
          
          if sudo -u iptv pm2 describe iptv-backend > /dev/null 2>&1; then
            echo "🔄 Reiniciando..."
            sudo -u iptv pm2 restart iptv-backend --update-env
          else
            echo "🚀 Iniciando..."
            cd backend
            sudo -u iptv pm2 start server.js --name iptv-backend
          fi
          
          sudo -u iptv pm2 save
          echo "✅ Backend reiniciado"

      - name: ⏳ Aguardar
        run: sleep 5

      - name: ✅ Verificação Final
        if: always()
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📊 VERIFICAÇÃO FINAL                        ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          echo ""
          echo "🔗 Symlink status:"
          ls -la ${{ env.APP_DIR }}/backend/ | grep data || echo "  data/ não encontrado"
          
          echo ""
          echo "📂 Verificar users.enc como iptv:"
          if sudo -u iptv test -f /var/lib/iptv-player/data/users.enc 2>/dev/null; then
            SIZE=$(sudo -u iptv stat -c%s /var/lib/iptv-player/data/users.enc 2>/dev/null || echo "?")
            echo "✅ users.enc existe e iptv consegue aceder (${SIZE} bytes)"
          else
            echo "⚠️  users.enc não encontrado (será criado no primeiro login)"
          fi

      - name: 🏥 Health Check
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           🏥 HEALTH CHECK                             ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          
          for i in {1..5}; do
            if curl -s http://localhost:3001/api/health | grep -q "ok"; then
              echo "✅ Backend ONLINE!"
              curl -s http://localhost:3001/api/health | jq . 2>/dev/null || echo ""
              exit 0
            fi
            echo "⏳ Tentativa $i/5..."
            sleep 3
          done
          
          echo "❌ Health check falhou"
          sudo -u iptv pm2 logs iptv-backend --lines 50
          exit 1

      - name: 📊 Resumo
        if: always()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║           📊 DEPLOY FINALIZADO                        ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""
          sudo -u iptv pm2 status
          echo ""
          echo "🌐 http://$(hostname -I | awk '{print $1}')"
          echo ""

  cleanup:
    name: 🧹 Cleanup
    runs-on: self-hosted
    needs: deploy
    if: always()
    
    steps:
      - name: 🧹 Limpar
        run: |
          sudo rm -f /tmp/.env.backup 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          echo "✅ Cleanup concluído"