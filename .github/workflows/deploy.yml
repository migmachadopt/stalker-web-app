# ═══════════════════════════════════════════════════════════════════════════════
# 🚀 GitHub Actions - Deploy Automático para Raspberry Pi
# ═══════════════════════════════════════════════════════════════════════════════
# Este workflow é acionado quando há push para o branch 'deploy'

name: 🚀 Deploy to Raspberry Pi

on:
  push:
    branches:
      - deploy  # Muda para 'main' quando estiveres pronto
  
  # Permite executar manualmente
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Testes e Build
  # ═══════════════════════════════════════════════════════════════════════════
  test-and-build:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependências do backend
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Verificar sintaxe (lint básico)
        working-directory: ./backend
        run: node --check server.js

      - name: ✅ Testes passaram
        run: echo "Todos os testes passaram!"

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Deploy para Raspberry Pi
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🍓 Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test-and-build
    
    # Só faz deploy se os testes passarem
    if: success()
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Adicionar host conhecido (evita prompt de confirmação)
          ssh-keyscan -H ${{ secrets.RASPBERRY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📤 Sincronizar Backend
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'data/*.enc' \
            --exclude 'logs' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./backend/ \
            ${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}:/opt/iptv-player/backend/

      - name: 📤 Sincronizar Frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./frontend/ \
            ${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}:/opt/iptv-player/frontend/

      - name: 🚀 Executar script de deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }} \
            'cd /opt/iptv-player && ./deploy.sh'

      - name: ✅ Verificar health check
        run: |
          echo "⏳ Aguardando aplicação iniciar..."
          sleep 10
          
          # Verificar se a aplicação está a responder
          response=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }} \
            'curl -s http://localhost:3001/api/health || echo "FAILED"')
          
          if [[ "$response" == *"ok"* ]]; then
            echo "✅ Aplicação está online!"
            echo "$response"
          else
            echo "❌ Health check falhou!"
            echo "$response"
            exit 1
          fi

      - name: 🧹 Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3: Notificação (opcional)
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: 📢 Status do Deploy
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deploy bem sucedido!"
            echo "🌐 Aplicação disponível em: http://${{ secrets.RASPBERRY_HOST }}"
          else
            echo "❌ Deploy falhou!"
          fi
